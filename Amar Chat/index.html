<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Amar Chat</title>
<style>
  :root{
    --g:#0f766e;
    --gd:#115e59;
    --gl:#14b8a6;
    --bg:#efeae2;
    --me:#d9fdd3;
    --bd:#e2e8f0;
    --page:#ffffff;
    --text:#0f172a;
    --sub:#64748b;
    --card:#ffffff;
    --bar:#f8fafc;
    --inbg:#f1f5f9;
    --rowact:#f1f5f9;
    --chip:#ccfbf1;
    --chipt:#115e59
  }
  body.dark{
    --g:#0d9488;
    --gd:#0f172a;
    --gl:#2dd4bf;
    --bg:#0b141a;
    --me:#005c4b;
    --bd:#1e293b;
    --page:#111b21;
    --text:#e9edef;
    --sub:#8696a0;
    --card:#182229;
    --bar:#1f2c34;
    --inbg:#2a3942;
    --rowact:#1f2c34;
    --chip:#134e4a;
    --chipt:#99f6e4
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--page);color:var(--text)}
  #app{height:100%;display:flex;flex-direction:column;max-width:640px;margin:0 auto;background:var(--page);position:relative;box-shadow:0 0 32px #0001}
  header{background:linear-gradient(135deg,var(--g),var(--gd));color:#fff;padding:12px 14px;display:flex;align-items:center;gap:8px;font-size:17px;font-weight:600;position:relative;z-index:10}
  header.selhdr{background:#1e293b}
  .hinfo{display:flex;flex-direction:column;line-height:1.25;min-width:0;flex:1}
  .hinfo span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .hsub{font-size:12px;font-weight:400;opacity:.9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  header .sp{flex:1}
  header .un{font-size:12px;font-weight:500;opacity:.9;white-space:nowrap;background:#ffffff1c;padding:3px 8px;border-radius:999px}
  header button{background:none;border:0;color:#fff;font-size:15px;cursor:pointer;padding:6px;border-radius:50%;flex:none;transition:background .15s}
  header button:active{background:#ffffff24}
  .tabs{display:flex;background:var(--bar);color:var(--sub);font-size:13.5px;font-weight:600;border-bottom:1px solid var(--bd)}
  .tabs button{flex:1;background:none;border:0;color:inherit;padding:11px 6px;cursor:pointer;border-bottom:3px solid transparent;transition:all .15s}
  .tabs button.on{color:var(--g);border-bottom-color:var(--g);background:var(--page)}
  .hav{width:36px;height:36px;border-radius:50%;background:#ffffff28;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;flex:none;overflow:hidden}
  .hav img,.av img,.pav img{width:100%;height:100%;object-fit:cover;display:block}
  .searchbox{padding:8px 12px;background:var(--bar);border-bottom:1px solid var(--bd);display:flex;gap:8px;align-items:center}
  .searchbox input{flex:1;padding:9px 14px;border:1px solid var(--bd);border-radius:20px;font-size:14px;background:var(--inbg);color:var(--text);margin:0;outline:none}
  .searchbox input:focus{border-color:var(--g)}
  .archbar{padding:10px 14px;background:var(--bar);border-bottom:1px solid var(--bd);font-size:13.5px;font-weight:600;color:var(--text);display:flex;justify-content:space-between;align-items:center;cursor:pointer}
  .pinbar{padding:8px 12px;background:#fef9c3;color:#1e293b;border-bottom:1px solid #fde047;font-size:12.5px;display:flex;align-items:center;gap:8px;cursor:pointer}
  body.dark .pinbar{background:#2a2515;color:#fef08a;border-color:#52461a}
  .pinbar .ptxt{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .list{flex:1;overflow:auto}
  .row{display:flex;gap:12px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--bd);cursor:pointer;transition:background .15s}
  .row:hover{background:var(--rowact)}
  .row:active{background:var(--rowact)}
  .av{width:46px;height:46px;border-radius:50%;background:linear-gradient(135deg,var(--g),var(--gl));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;flex:none;position:relative;overflow:hidden}
  .av.botav{background:linear-gradient(135deg,#6366f1,#8b5cf6)}
  .av.ring{box-shadow:0 0 0 2.5px #22c55e}
  .row .mid{flex:1;min-width:0}
  .row .t{font-weight:600;display:flex;align-items:center;gap:6px}
  .row .s{color:var(--sub);font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
  .draftlbl{color:#ea580c;font-weight:700}
  .aibadge{background:#ede9fe;color:#5b21b6;font-size:10.5px;font-weight:700;padding:1px 7px;border-radius:999px}
  body.dark .aibadge{background:#312e81;color:#c7d2fe}
  .empty{padding:44px 20px;text-align:center;color:var(--sub);font-size:14px}
  .fab{position:absolute;right:18px;bottom:18px;width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,var(--g),var(--gl));color:#fff;border:0;font-size:28px;box-shadow:0 6px 18px #0003;cursor:pointer;z-index:12;transition:transform .15s}
  .fab:active{transform:scale(.95)}
  .menu{position:absolute;right:16px;bottom:86px;background:var(--card);color:var(--text);border-radius:14px;box-shadow:0 10px 28px #0003;border:1px solid var(--bd);overflow:hidden;z-index:30;min-width:225px}
  .menu.top{bottom:auto;top:54px;right:10px}
  .menu div{padding:12px 16px;cursor:pointer;font-size:14px;border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:8px}
  .menu div:last-child{border-bottom:0}
  .menu div:hover{background:var(--rowact)}
  .auth{padding:28px 22px;margin:auto 0;overflow:auto}
  .auth h1{color:var(--g);text-align:center;margin:0 0 18px;font-size:26px}
  input[type=text],input[type=email],input[type=password],select{width:100%;padding:12px 14px;border:1px solid var(--bd);border-radius:10px;font-size:15px;margin-bottom:12px;background:var(--inbg);color:var(--text);outline:none}
  input:focus,select:focus{border-color:var(--g)}
  .btn{width:100%;padding:13px;background:linear-gradient(135deg,var(--g),var(--gl));color:#fff;border:0;border-radius:10px;font-size:15.5px;font-weight:600;cursor:pointer;transition:opacity .15s}
  .btn.danger{background:#dc2626}
  .btn.sec{background:#475569}
  .btn:disabled{opacity:.6}
  .btn.sm{width:auto;padding:10px 15px;font-size:13.5px}
  .link{background:none;border:0;color:var(--g);width:100%;padding:10px;font-size:14.5px;cursor:pointer;font-weight:500}
  .err{color:#ef4444;margin:0 0 12px;font-size:13.5px}
  .ok{color:#22c55e;margin:0 0 12px;font-size:13.5px}
  .hint{color:var(--sub);font-size:13px;margin:0 0 10px}
  .toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);background:#1e293b;color:#fff;padding:9px 16px;border-radius:999px;font-size:13px;z-index:170;box-shadow:0 6px 18px #0004;max-width:90%;text-align:center}

  .msgs{flex:1;overflow:auto;background-color:var(--bg);background-size:cover;background-position:center;background-repeat:no-repeat;padding:12px;display:flex;flex-direction:column;gap:7px}
  .b{display:inline-flex;flex-wrap:wrap;align-items:baseline;gap:6px;width:fit-content;max-width:84%;padding:7px 11px;border-radius:12px;background:var(--card);color:var(--text);align-self:flex-start;overflow-wrap:anywhere;word-break:break-word;box-shadow:0 1px 2px #0002;font-size:14.5px;line-height:1.35;position:relative;cursor:pointer;transition:background .18s,outline .18s,transform .18s}
  .b.me{background:var(--me);align-self:flex-end;border-top-right-radius:3px}
  .b:not(.me){border-top-left-radius:3px}
  .b.botmsg{border:1px solid #8b5cf640}
  .b.hi{outline:2.5px solid #f59e0b;background:#fef3c7;color:#111}
  body.dark .b.hi{background:#3b2f0b;color:#fff}
  .b.selected{outline:2.5px solid #22c55e;background:#14b8a626}
  .b .n{flex-basis:100%;font-size:11px;font-weight:700;color:var(--g);margin-bottom:1px}
  .b .fwd{flex-basis:100%;font-size:11px;font-style:italic;color:var(--sub)}
  .b .qbox{flex-basis:100%;background:#00000010;border-left:3px solid var(--g);padding:5px 8px;border-radius:6px;font-size:12px;color:var(--sub);margin-bottom:2px}
  body.dark .b .qbox{background:#ffffff10}
  .b .qbox b{display:block;color:var(--g);font-size:11px}
  .b .del{font-style:italic;color:var(--sub);font-size:13px}
  .b .ed{font-size:10.5px;color:var(--sub)}
  .b .tm{font-size:10.5px;color:var(--sub);line-height:1;margin-left:auto;white-space:nowrap}
  .b .lnk{color:#0284c7;text-decoration:underline;word-break:break-all}
  body.dark .b .lnk{color:#38bdf8}
  .b .lprev{flex-basis:100%;margin-top:4px;padding:6px 8px;border-left:3px solid #0284c7;background:#8882;border-radius:6px;font-size:12px}
  .b .lprev b{display:block;font-size:11.5px;color:var(--g)}
  .b .reacts{flex-basis:100%;display:flex;flex-wrap:wrap;gap:4px;margin-top:3px}
  .b .rpill{background:var(--inbg);border:1px solid var(--bd);border-radius:12px;padding:1px 7px;font-size:12px}
  .b .act{display:none;flex-basis:100%;flex-wrap:wrap;gap:8px;align-items:center;justify-content:flex-end;margin-top:5px;padding-top:5px;border-top:1px dashed #8884;font-size:11.5px;line-height:1.25}
  .b:hover .act,.b.open .act{display:flex}
  .b .act span{cursor:pointer;color:var(--g);font-weight:600}
  .b .act span:hover{text-decoration:underline}
  .b .act .rx{font-size:15px;padding:0 2px;text-decoration:none}
  .b img.zoomimg{flex-basis:100%;max-width:100%;max-height:220px;border-radius:8px;display:block}
  .b audio{flex-basis:100%;max-width:220px;display:block}
  .b .spdbtn{background:#8883;border:0;border-radius:10px;padding:2px 7px;font-size:11px;font-weight:700;color:var(--text);cursor:pointer}

  .quickchips{display:flex;gap:6px;padding:6px 10px;overflow-x:auto;background:var(--bar);border-top:1px solid var(--bd);scrollbar-width:none}
  .quickchips::-webkit-scrollbar{display:none}
  .qchip{background:var(--chip);color:var(--chipt);border:0;border-radius:999px;padding:6px 12px;font-size:12px;font-weight:600;white-space:nowrap;cursor:pointer;flex:none}

  .replybar{display:none;align-items:center;gap:8px;padding:8px 12px;background:var(--bar);border-top:1px solid var(--bd);border-left:4px solid var(--g);font-size:13px}
  .replybar.on{display:flex}
  .replybar .rtxt{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--sub)}
  .replybar button{background:none;border:0;font-size:16px;cursor:pointer;color:var(--sub)}

  .recbar{display:none;align-items:center;gap:10px;padding:8px 12px;background:#fee2e2;color:#b91c1c;font-size:14px;font-weight:600}
  .recbar.on{display:flex}
  .recbar button{border:0;border-radius:16px;padding:6px 12px;font-size:13px;font-weight:600;cursor:pointer}
  .recbar .stop{background:#dc2626;color:#fff}
  .recbar .cncl{background:#fff;color:#333;border:1px solid #ccc}
  .emojipanel{display:none;flex-wrap:wrap;gap:6px;padding:8px 10px;background:var(--card);border-top:1px solid var(--bd);max-height:130px;overflow:auto}
  .emojipanel.on{display:flex}
  .emojipanel button{background:none;border:0;font-size:22px;cursor:pointer;padding:4px;border-radius:6px}
  .emojipanel button:hover{background:var(--rowact)}
  .bar{display:flex;gap:6px;padding:8px 10px;background:var(--bar);align-items:flex-end;border-top:1px solid var(--bd)}
  .bar textarea{flex:1;border:1px solid var(--bd);border-radius:20px;padding:9px 13px;font-size:15.5px;resize:none;max-height:110px;font-family:inherit;min-width:0;background:var(--inbg);color:var(--text);outline:none}
  .bar textarea:focus{border-color:var(--g)}
  .bar button{width:38px;height:38px;border-radius:50%;border:0;background:linear-gradient(135deg,var(--g),var(--gl));color:#fff;font-size:16px;cursor:pointer;flex:none}
  .bar button.ph{background:var(--inbg);color:var(--text);border:1px solid var(--bd)}
  .blockedbar{padding:12px;background:#fef3c7;color:#92400e;text-align:center;font-size:13.5px;border-top:1px solid #fde68a}
  .pad{padding:14px;overflow:auto;flex:1}
  .addrow{display:flex;gap:8px;align-items:flex-start}
  .addrow input{margin-bottom:0}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
  .chip{background:var(--chip);color:var(--chipt);border-radius:16px;padding:6px 12px;font-size:13.5px;font-weight:500;cursor:pointer}
  .pav{width:96px;height:96px;border-radius:50%;background:linear-gradient(135deg,var(--g),var(--gl));color:#fff;font-size:36px;font-weight:700;display:flex;align-items:center;justify-content:center;margin:8px auto 14px;overflow:hidden;position:relative;cursor:pointer}
  .card{border:1px solid var(--bd);background:var(--card);border-radius:12px;padding:13px;margin-bottom:12px}
  .mrow{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--bd);gap:8px}
  .mrow:last-child{border-bottom:0}
  .togrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0}
  .togrow input[type=checkbox]{width:18px;height:18px;accent-color:var(--g)}
  .swatches{display:flex;flex-wrap:wrap;gap:10px;margin:8px 0 12px}
  .swatch{width:34px;height:34px;border-radius:50%;border:2px solid #8886;cursor:pointer}
  .swatch.on{outline:3px solid var(--g)}

  .modal{position:fixed;inset:0;background:#0008;z-index:120;display:flex;align-items:center;justify-content:center;padding:16px}
  .mbox{background:var(--card);color:var(--text);border-radius:14px;width:100%;max-width:430px;max-height:84vh;display:flex;flex-direction:column;overflow:hidden}
  .mhead{padding:12px 16px;background:var(--g);color:#fff;font-weight:600;display:flex;justify-content:space-between;align-items:center}
  .mhead button{background:none;border:0;color:#fff;font-size:18px;cursor:pointer}
  .mbody{padding:14px;overflow:auto}
  .cambox{background:#000;border-radius:10px;overflow:hidden;position:relative;aspect-ratio:4/3;display:flex;align-items:center;justify-content:center}
  .cambox video{width:100%;height:100%;object-fit:cover}
  .lbox{position:fixed;inset:0;background:#000e;z-index:150;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px}
  .lbox img{max-width:100%;max-height:65vh;border-radius:8px;object-fit:contain}
  .lbox .sttxt{color:#fff;font-size:24px;font-weight:700;padding:24px;text-align:center;max-width:520px}
  .lbox .lcap{color:#fff;margin-top:10px;font-size:14px;text-align:center}
  .lbox .viewers{margin-top:12px;background:#ffffff1a;color:#fff;padding:10px 14px;border-radius:10px;font-size:13px;max-width:420px;width:100%}
  .lbox .streply{margin-top:12px;display:flex;gap:8px;max-width:420px;width:100%}
  .lbox .streply input{margin:0;flex:1;padding:10px 12px;border-radius:20px;border:0;background:#fff;color:#111;font-size:14px}
  .lbox .streply button{border:0;border-radius:20px;padding:0 16px;background:#22c55e;color:#fff;font-weight:700;cursor:pointer}
  .lbox .lclose{position:fixed;top:14px;right:16px;background:#ffffff24;color:#fff;border:0;border-radius:50%;width:38px;height:38px;font-size:20px;cursor:pointer}

  .callscreen{position:fixed;inset:0;background:#111b21;color:#fff;z-index:135;display:none;flex-direction:column;align-items:center;justify-content:space-between;padding:28px 20px}
  .callscreen.on{display:flex}
  .calltop{text-align:center;z-index:2}
  .callname{font-size:22px;font-weight:700}
  .callst{font-size:14px;opacity:.85;margin-top:4px}
  .vwrap{position:relative;flex:1;width:100%;max-width:600px;margin:16px 0;display:flex;align-items:center;justify-content:center;overflow:hidden;border-radius:14px;background:#0b141a}
  .vwrap video#remV{width:100%;height:100%;object-fit:cover;border-radius:14px;background:#000;z-index:1}
  .callscreen #remA{position:fixed;left:-9999px;width:1px;height:1px;opacity:0;pointer-events:none}
  .vwrap video#locV{position:absolute;right:12px;bottom:12px;width:108px;height:148px;object-fit:cover;border-radius:10px;border:2px solid #fff6;background:#182229;z-index:2}
  .callav{width:96px;height:96px;border-radius:50%;background:var(--g);color:#fff;font-size:38px;font-weight:700;display:flex;align-items:center;justify-content:center;z-index:2}
  .callacts{display:flex;gap:14px;align-items:center;z-index:2;flex-wrap:wrap;justify-content:center}
  .cbtn{width:54px;height:54px;border-radius:50%;border:0;font-size:20px;cursor:pointer;color:#fff;background:#2a3942;display:flex;align-items:center;justify-content:center}
  .cbtn.acc{background:#22c55e}
  .cbtn.end{background:#ef4444}
  .cbtn.off{background:#fff;color:#111}

  .row .rmeta{display:flex;flex-direction:column;align-items:flex-end;gap:5px;flex:none;min-width:44px}
  .row .rtm{font-size:11.5px;color:var(--sub)}
  .row .rtm.un{color:#22c55e;font-weight:700}
  .row.unrd .t{font-weight:800}
  .row.unrd .s{color:var(--text);font-weight:600}
  .badge{background:#22c55e;color:#fff;border-radius:12px;min-width:22px;height:22px;padding:0 7px;font-size:12px;font-weight:700;display:inline-flex;align-items:center;justify-content:center}
  .badge.mute{background:#8696a0}
  .typlbl,.typlbl2{color:#22c55e;font-weight:600}
  .youlbl{color:var(--sub)}
  .tick{font-size:11px;color:var(--sub);letter-spacing:-2px;margin-left:2px}
  .tick.seen{color:#38bdf8}
  .daysep{align-self:center;margin:8px 0 4px}
  .daysep span{background:#0000001a;color:var(--text);font-size:11.5px;padding:3px 11px;border-radius:12px}
  body.dark .daysep span{background:#ffffff1a}
  .tobot{position:absolute;right:14px;bottom:84px;width:40px;height:40px;border-radius:50%;border:1px solid var(--bd);background:var(--card);color:var(--text);box-shadow:0 4px 12px #0003;font-size:18px;cursor:pointer;z-index:15;display:flex;align-items:center;justify-content:center}
  .bar textarea{overflow-y:auto}
  .msgs{scroll-behavior:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
  .list{-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
  button,.row,.b{-webkit-tap-highlight-color:transparent}
</style>
</head>
<body>
<div id="app"></div>

<div class="callscreen" id="callscreen">
  <div class="calltop">
    <div class="callname" id="cname">Call</div>
    <div class="callst" id="cst">Connecting...</div>
  </div>
  <div class="vwrap" id="vwrap">
    <div class="callav" id="cav">?</div>
    <video id="remV" autoplay playsinline></video>
    <video id="locV" autoplay playsinline muted></video>
    <audio id="remA" autoplay playsinline></audio>
  </div>
  <div class="callacts" id="cacts"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyCeiAsogvltOOYjde5uNL8NDStRT2ddfz4",
  authDomain: "amar-chat-f9870.firebaseapp.com",
  projectId: "amar-chat-f9870",
  storageBucket: "amar-chat-f9870.firebasestorage.app",
  messagingSenderId: "125656305932",
  appId: "1:125656305932:web:c3fabc5da8929a7874f929"

if (!window.firebase) {
  document.getElementById('app').innerHTML = '<div class="auth"><h1>Amar Chat</h1><p class="err">Firebase SDK load hoyni. Internet check korun.</p></div>';
  throw new Error('Firebase SDK unavailable');
}
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

const MAX_FREE_MEDIA_CHARS = 240000;
const MAX_FREE_VOICE_SEC = 12;
const AI_BOT_ID = 'amar_ai_bot';
const AI_BOT_NAME = 'Amar AI';

const $app = document.getElementById('app');

let me = null, profile = null, unsubs = [], callWatchUnsub = null, chatAlertUnsub = null;
let signingUp = false, presenceTimer = null, presenceCleanup = null, ringingCallId = null, ringTimer = null, pendingCands = [];
let currentOpenChatId = null, currentScreenName = 'home', appUnlocked = false;
let customBackHandler = null;
const mutedChatIds = new Set();

const METERED_APP = '';
const METERED_API_KEY = '';
const TURN_SERVERS = [];
const STUN_SERVERS = [
  { urls: 'stun:stun.l.google.com:19302' },
  { urls: 'stun:stun1.l.google.com:19302' },
  { urls: 'stun:stun2.l.google.com:19302' }
];
let rtcCfgCache = null, rtcCfgAt = 0;
async function getRtcCfg() {
  if (rtcCfgCache && Date.now() - rtcCfgAt < 25 * 60 * 1000) return rtcCfgCache;
  let ice = [...STUN_SERVERS, ...TURN_SERVERS];
  if (METERED_APP && METERED_API_KEY) {
    try {
      const ctl = new AbortController();
      const tm = setTimeout(() => ctl.abort(), 4000);
      const r = await fetch(`https://${METERED_APP}.metered.live/api/v1/turn/credentials?apiKey=${encodeURIComponent(METERED_API_KEY)}`, { signal: ctl.signal });
      clearTimeout(tm);
      if (r.ok) {
        const list = await r.json();
        if (Array.isArray(list) && list.length) ice = [...STUN_SERVERS, ...TURN_SERVERS, ...list];
      }
    } catch (e) {}
  }
  rtcCfgCache = { iceServers: ice, iceCandidatePoolSize: 4 };
  rtcCfgAt = Date.now();
  return rtcCfgCache;
}

function fmtListTime(ms) {
  if (!ms) return '';
  const d = new Date(ms), n = new Date();
  const p = x => String(x).padStart(2, '0');
  if (d.toDateString() === n.toDateString()) return `${p(d.getHours())}:${p(d.getMinutes())}`;
  const y = new Date(n); y.setDate(n.getDate() - 1);
  if (d.toDateString() === y.toDateString()) return 'Yesterday';
  return `${p(d.getDate())}/${p(d.getMonth() + 1)}`;
}
function dayLabel(ms) {
  const d = new Date(ms), n = new Date();
  if (d.toDateString() === n.toDateString()) return 'Today';
  const y = new Date(n); y.setDate(n.getDate() - 1);
  if (d.toDateString() === y.toDateString()) return 'Yesterday';
  return d.toLocaleDateString(undefined, { day: 'numeric', month: 'short', year: d.getFullYear() === n.getFullYear() ? undefined : 'numeric' });
}

function generateFreeAiReply(userText, userName) {
  const raw = String(userText || '').trim();
  const q = raw.toLowerCase();
  const firstName = (userName || 'Friend').split(' ')[0];

  // Safe math evaluation if user types pure math expression
  const mathMatch = raw.replace(/×/g, '*').replace(/÷/g, '/').match(/^[\d\s+\-*/().%^]+$/);
  if (mathMatch && /\d/.test(raw) && /[+\-*/%^]/.test(raw)) {
    try {
      const sanitized = raw.replace(/×/g, '*').replace(/÷/g, '/').replace(/\^/g, '**');
      const val = Function(`"use strict"; return (${sanitized});`)();
      if (typeof val === 'number' && Number.isFinite(val)) {
        return `🧮 Hisab er uttor holo: **${val}**`;
      }
    } catch (e) {}
  }

  // Time / Date
  if (/\b(time|somoy|koyta baje|clock)\b/.test(q)) {
    return `🕒 Ekhon somoy: **${new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}**.`;
  }
  if (/\b(date|aj koto tarikh|bar|day|aj ki bar)\b/.test(q)) {
    return `📅 Ajke: **${new Date().toLocaleDateString(undefined, { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' })}**.`;
  }

  // Greetings
  if (/^(hi|hello|hey|salam|assalamu|aoa|yo|oi|kemon acho|ki obosta|hlw)/i.test(q)) {
    return `👋 Hello ${firstName}! Ami **Amar AI** (100% free & unlimited). Kemon acho? Ami tomake likha, idea, math, caption, ba general help diye sahajjo korte pari!`;
  }

  // Who are you / capabilities
  if (/(who are you|tumi ke|tomar nam|ki korte paro|help|features|ai)/i.test(q)) {
    return `🤖 Ami **Amar AI**, Amar Chat er built-in free assistant!\n• Math calculation (e.g. \`245 * 18 + 90\`)\n• Caption, message, story ba bio idea\n• Study, coding ba daily productivity tips\n• Bangla, Banglish ba English—je kono vashay kotha bolte paro!`;
  }

  // Caption / Post / Bio / Message writing helper
  if (/(caption|post|status|bio|likhe dao|write|message likh|promo|offer|shop)/i.test(q)) {
    return `✍️ **Idea for you:**\n1. "Fresh vibe, clean look — ✨"\n2. "Fast & reliable service every single day! 💯"\n3. "Notun kichu shuru korar sera somoy ekhoni 🚀"\n\nAr specific topic bolle ami aro customized likhe dibo!`;
  }

  // Advice / Motivation / Study / Tips
  if (/(tip|tips|advice|motivation|porashona|study|focus|bored|ekgheye)/i.test(q)) {
    return `💡 **Quick Tip:** Ekta boro kajke chhoto chhoto 15-20 minute er step e vag kore nao. Age ektu shuru koro—shuru korlei momentum chole asbe!`;
  }

  // Joke / Fun
  if (/(joke|hasir|koutuk|funny|bore)/i.test(q)) {
    return `😄 Ek bondhu arek bondhuke bolche: "Bhai, amar phone ta boro smart!"\nArekjon: "Keno?"\nBondhu: "Ami 'chhuti' likhte giye 'chhobi' likhsi, ta-o bujhe nise!"`;
  }

  // Thanks / Bye
  if (/(thank|thanks|dhonnobad|shukria|bye|allah hafiz|tata)/i.test(q)) {
    return `😊 Welcome ${firstName}! Jekono somoy dorkar hole message dio, ami ekhanei achi.`;
  }

  // Smart conversational response for general questions
  return `🤖 Tumi bolle: *"${raw.slice(0, 140)}"*\n\nAmar AI ektu aro detail dile ami aro bhalo uttor dite parbo—jemon kono topic niye explanation, likha/caption, ba kono calculation lagbe?`;
}

const URL_RE = /(https?:\/\/[^\s<>"']+)/gi;
function extractFirstUrl(str) {
  const m = String(str || '').match(URL_RE);
  return m ? m[0] : '';
}
function formatTextWithLinks(str) {
  const parts = String(str || '').split(URL_RE);
  return parts.map(part => {
    if (/^https?:\/\/[^\s<>"']+$/i.test(part)) {
      return `<a class="lnk" href="${esc(part)}" target="_blank" rel="noopener noreferrer">${esc(part)}</a>`;
    }
    return esc(part);
  }).join('');
}
function buildLinkPreviewHtml(rawText) {
  const url = extractFirstUrl(rawText);
  if (!url) return '';
  let host = url;
  try { host = new URL(url).hostname; } catch (e) {}
  return `<div class="lprev"><b>🔗 ${esc(host)}</b><span>${esc(url)}</span></div>`;
}

/* ---------- RINGTONE & NOTIFICATION SOUND ---------- */
let ringtoneInterval = null;
function playAlertBeep(freq = 740, duration = 0.16) {
  if (!isSoundEnabled()) return;
  try {
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    if (!AudioCtx) return;
    const ctx = new AudioCtx();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.07, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + duration);
    setTimeout(() => ctx.close().catch(() => {}), (duration + 0.1) * 1000);
  } catch (e) {}
}
function startRingtone() {
  stopRingtone();
  if (!isSoundEnabled()) return;
  const pulse = () => {
    if (!isSoundEnabled()) return;
    playAlertBeep(880, 0.2);
    setTimeout(() => playAlertBeep(1046, 0.2), 250);
  };
  pulse();
  ringtoneInterval = setInterval(pulse, 1500);
}
function stopRingtone() {
  if (ringtoneInterval) { clearInterval(ringtoneInterval); ringtoneInterval = null; }
}

let swReg = null;
async function initNotifications() {
  try { if ('serviceWorker' in navigator) swReg = await navigator.serviceWorker.register('sw.js'); } catch (e) {}
  const ask = () => {
    try { if ('Notification' in window && Notification.permission === 'default') Notification.requestPermission(); } catch (e) {}
    document.removeEventListener('click', ask);
  };
  document.addEventListener('click', ask);
}
function showSystemNotification(title, body, tag, urgent) {
  try {
    if (!('Notification' in window) || Notification.permission !== 'granted' || !document.hidden) return;
    if (!isSoundEnabled()) return;
    const opts = { body, tag: tag || 'amar', icon: 'icon-192.png', badge: 'icon-192.png', renotify: true, vibrate: urgent ? [300, 150, 300, 150, 300] : [120] };
    if (swReg && swReg.showNotification) swReg.showNotification(title, opts);
    else { const n = new Notification(title, opts); n.onclick = () => { window.focus(); n.close(); }; }
  } catch (e) {}
}
setTimeout(initNotifications, 400);

function triggerNotification(title, body, isCall = false) {
  if (!isCall) playAlertBeep(660, 0.15);
  if (!document.hidden || isCall) toast(`${title}: ${body}`);
  showSystemNotification(title, body, isCall ? 'call' : 'msg', isCall);
}

function watchChatNotifications() {
  if (chatAlertUnsub) { chatAlertUnsub(); chatAlertUnsub = null; }
  if (!me) return;
  let initial = true;
  chatAlertUnsub = db.collection('chats').where('members', 'array-contains', me.uid).limit(60).onSnapshot(snap => {
    mutedChatIds.clear();
    snap.docs.forEach(d => {
      const c = d.data();
      if (c.mutedBy?.[me.uid]) mutedChatIds.add(d.id);
    });
    if (initial) {
      initial = false;
      snap.docs.forEach(d => { lastAlertByChat[d.id] = tsMs(d.data().updatedAt); });
      return;
    }
    snap.docChanges().forEach(ch => {
      if (ch.type !== 'added' && ch.type !== 'modified') return;
      const cid = ch.doc.id;
      const c = ch.doc.data();
      const upd = tsMs(c.updatedAt);
      if (!upd || upd <= (lastAlertByChat[cid] || 0)) return;
      lastAlertByChat[cid] = upd;
      if (c.lastSender && c.lastSender !== me.uid && !document.hidden) {
        db.collection('chats').doc(cid).set({ deliveredBy: { [me.uid]: Date.now() } }, { merge: true }).catch(() => {});
      }
      if (mutedChatIds.has(cid)) return;
      if (currentOpenChatId === cid && !document.hidden) return;
      if (!c.lastMessage || c.lastSender === me.uid) return;
      const title = c.isGroup ? (c.name || 'Group') : (c.memberNames ? Object.entries(c.memberNames).find(([k]) => k !== me.uid)?.[1] : tr('appName'));
      triggerNotification(title || tr('appName'), c.lastMessage, false);
    });
  }, () => {});
}

/* ---------- WEBRTC AUDIO + VIDEO CALL ENGINE ---------- */
let pc = null, localStream = null, remoteStream = null, activeCallId = null, callUnsubs = [], micMuted = false, camOff = false, speakerOn = true;
let currentCallMeta = null, isSettingRemote = false, currentFacingMode = 'user', callIsVideo = false, callTimerInt = null, callElapsedSec = 0;

const $cs = document.getElementById('callscreen');
const $cname = document.getElementById('cname');
const $cst = document.getElementById('cst');
const $cav = document.getElementById('cav');
const $remV = document.getElementById('remV');
const $remA = document.getElementById('remA');
const $locV = document.getElementById('locV');
const $cacts = document.getElementById('cacts');

function syncMediaElements() {
  if (remoteStream) {
    if ($remA.srcObject !== remoteStream) $remA.srcObject = remoteStream;
    $remA.muted = false;
    $remA.volume = 1.0;
    $remA.play().catch(() => {});
    const hasVideo = remoteStream.getVideoTracks().length > 0 || callIsVideo;
    if (hasVideo) {
      callIsVideo = true;
      $cav.style.display = 'none';
      $remV.style.display = 'block';
      $locV.style.display = 'block';
      if ($remV.srcObject !== remoteStream) $remV.srcObject = remoteStream;
      $remV.muted = true;
      $remV.volume = 1.0;
      $remV.play().catch(() => {});
    }
  }
  if (localStream && callIsVideo) {
    $locV.style.display = 'block';
    if ($locV.srcObject !== localStream) $locV.srcObject = localStream;
    $locV.muted = true;
    $locV.play().catch(() => {});
  }
}

$cs.addEventListener('click', e => {
  if (!e.target.closest('button')) syncMediaElements();
});

async function logCallHistory(peerUid, peerName, isVideo, direction, outcome) {
  if (!me || !peerUid) return;
  try {
    await db.collection('users').doc(me.uid).collection('callLogs').add({
      peerUid, peerName: peerName || 'User', isVideo: !!isVideo, direction, outcome,
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });
  } catch (e) {}
}

function clearCallSubs() {
  callUnsubs.forEach(fn => { try { fn(); } catch (e) {} });
  callUnsubs = [];
}

async function switchCallCamera() {
  if (!pc || !localStream || !callIsVideo) return;
  const nextMode = currentFacingMode === 'user' ? 'environment' : 'user';
  try {
    const newVidStream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: nextMode }, width: { ideal: 480 }, height: { ideal: 360 } },
      audio: false
    });
    const newTrack = newVidStream.getVideoTracks()[0];
    if (!newTrack) return;
    const oldTrack = localStream.getVideoTracks()[0];
    const sender = pc.getSenders().find(s => s.track && s.track.kind === 'video');
    if (sender) await sender.replaceTrack(newTrack);
    if (oldTrack) { oldTrack.stop(); localStream.removeTrack(oldTrack); }
    localStream.addTrack(newTrack);
    currentFacingMode = nextMode;
    camOff = false;
    syncMediaElements();
  } catch (e) { toast('Camera switch error'); }
}

function showCallUI(peerName, statusText, isVideo, mode) {
  callIsVideo = !!isVideo;
  $cname.textContent = peerName || 'User';
  $cst.textContent = statusText;
  $cav.textContent = (peerName || '?')[0]?.toUpperCase() || '?';
  $cav.style.display = callIsVideo ? 'none' : 'flex';
  $remV.style.display = callIsVideo ? 'block' : 'none';
  $locV.style.display = callIsVideo ? 'block' : 'none';
  $cs.classList.add('on');

  if (mode === 'incoming') {
    startRingtone();
    $cacts.innerHTML = `
      <button class="cbtn end" id="cdec" title="Decline">✕</button>
      <button class="cbtn acc" id="cacc" title="Accept">📞</button>`;
  } else {
    stopRingtone();
    speakerOn = true;
    $cacts.innerHTML = `
      <button class="cbtn" id="cmute" title="Mute">🎤</button>
      <button class="cbtn" id="cspk" title="Speaker">🔊</button>
      ${callIsVideo ? '<button class="cbtn" id="ccam" title="Camera">📹</button><button class="cbtn" id="cflip" title="Switch Camera">🔄</button>' : ''}
      <button class="cbtn end" id="chang" title="End Call">📞✕</button>`;
    const cspk = document.getElementById('cspk');
    if (cspk) {
      cspk.onclick = () => {
        speakerOn = !speakerOn;
        if ($remA) {
          $remA.muted = !speakerOn;
          $remA.volume = speakerOn ? 1.0 : 0.15;
          if (speakerOn) $remA.play().catch(() => {});
        }
        if ($remV && callIsVideo) $remV.volume = speakerOn ? 1.0 : 0.15;
        cspk.classList.toggle('off', !speakerOn);
        cspk.textContent = speakerOn ? '🔊' : '🔈';
      };
    }
    document.getElementById('cmute').onclick = () => {
      if (!localStream) return;
      micMuted = !micMuted;
      localStream.getAudioTracks().forEach(t => t.enabled = !micMuted);
      const b = document.getElementById('cmute');
      b.classList.toggle('off', micMuted);
      b.textContent = micMuted ? '🔇' : '🎤';
    };
    const ccam = document.getElementById('ccam');
    if (ccam) {
      ccam.onclick = () => {
        if (!localStream) return;
        camOff = !camOff;
        localStream.getVideoTracks().forEach(t => t.enabled = !camOff);
        ccam.classList.toggle('off', camOff);
        ccam.textContent = camOff ? '📷✕' : '📹';
      };
    }
    const cflip = document.getElementById('cflip');
    if (cflip) cflip.onclick = switchCallCamera;
    document.getElementById('chang').onclick = () => endCall(true);
    syncMediaElements();
  }
}

function hideCallUI() {
  stopRingtone();
  callIsVideo = false;
  $cs.classList.remove('on');
  $cacts.innerHTML = '';
  $remV.srcObject = null;
  $remA.srcObject = null;
  $locV.srcObject = null;
}

function startCallTimer() {
  stopCallTimer();
  callElapsedSec = 0;
  const fmt = s => `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`;
  $cst.textContent = '00:00';
  callTimerInt = setInterval(() => {
    callElapsedSec += 1;
    if ($cs.classList.contains('on') && activeCallId) $cst.textContent = fmt(callElapsedSec);
  }, 1000);
}
function stopCallTimer() {
  if (callTimerInt) { clearInterval(callTimerInt); callTimerInt = null; }
  callElapsedSec = 0;
}

async function endCall(updateRemote = true) {
  stopRingtone();
  stopCallTimer();
  const cid = activeCallId;
  const meta = currentCallMeta;
  activeCallId = null;
  currentCallMeta = null;
  ringingCallId = null;
  isSettingRemote = false;
  currentFacingMode = 'user';
  callIsVideo = false;
  clearTimeout(ringTimer); ringTimer = null;
  micMuted = false; camOff = false; speakerOn = true;
  pendingCands = [];
  clearCallSubs();
  if (pc) { try { pc.close(); } catch (e) {} pc = null; }
  if (localStream) { localStream.getTracks().forEach(t => t.stop()); localStream = null; }
  remoteStream = null;
  hideCallUI();
  if (meta) await logCallHistory(meta.peerUid, meta.peerName, meta.isVideo, meta.direction, meta.outcome || 'completed');
  if (updateRemote && cid && me) {
    try {
      await db.collection('calls').doc(cid).set({
        status: 'ended', endedBy: me.uid, endedAt: firebase.firestore.FieldValue.serverTimestamp()
      }, { merge: true });
    } catch (e) {}
  }
}

async function flushCands() {
  if (!pc || !pc.remoteDescription || !pc.remoteDescription.type) return;
  const list = pendingCands.splice(0, pendingCands.length);
  for (const c of list) {
    try { await pc.addIceCandidate(new RTCIceCandidate(c)); } catch (e) {}
  }
}

function attachRemoteTrack(track, stream) {
  if (!remoteStream) remoteStream = new MediaStream();
  if (stream && stream.getTracks) {
    stream.getTracks().forEach(t => {
      if (!remoteStream.getTracks().some(rt => rt.id === t.id)) remoteStream.addTrack(t);
    });
  } else if (track && !remoteStream.getTracks().some(rt => rt.id === track.id)) {
    remoteStream.addTrack(track);
  }
  if (track && track.kind === 'video') {
    callIsVideo = true;
    $cav.style.display = 'none';
    $remV.style.display = 'block';
    $locV.style.display = 'block';
  }
  syncMediaElements();
}

async function setupPeer(callDocRef, isCaller, isVideo) {
  pendingCands = [];
  isSettingRemote = false;
  currentFacingMode = 'user';
  callIsVideo = !!isVideo;
  pc = new RTCPeerConnection(await getRtcCfg());
  remoteStream = new MediaStream();
  $remA.srcObject = remoteStream;
  $remA.muted = false;
  $remV.srcObject = remoteStream;
  $remV.muted = true;

  const audioConstraints = { echoCancellation: true, noiseSuppression: true };
  try {
    localStream = await navigator.mediaDevices.getUserMedia({
      audio: audioConstraints,
      video: isVideo ? { facingMode: { ideal: 'user' }, width: { ideal: 480 }, height: { ideal: 360 } } : false
    });
  } catch (err) {
    if (isVideo) {
      localStream = await navigator.mediaDevices.getUserMedia({ audio: audioConstraints, video: false });
      isVideo = false; callIsVideo = false;
      $cav.style.display = 'flex'; $remV.style.display = 'none'; $locV.style.display = 'none';
    } else throw err;
  }

  localStream.getTracks().forEach(track => pc.addTrack(track, localStream));
  if (isVideo) {
    $locV.srcObject = localStream; $locV.muted = true; $locV.play().catch(() => {});
  }

  pc.ontrack = e => {
    attachRemoteTrack(e.track, e.streams && e.streams[0]);
    if (!callTimerInt) startCallTimer();
  };

  pc.oniceconnectionstatechange = () => {
    if (!pc) return;
    if (pc.iceConnectionState === 'connected' || pc.iceConnectionState === 'completed') {
      syncMediaElements();
      if (!callTimerInt) startCallTimer();
    } else if (pc.iceConnectionState === 'checking' && !callTimerInt) {
      $cst.textContent = tr('callConnecting');
    } else if (pc.iceConnectionState === 'failed') {
      toast('Call connection failed');
      endCall(true);
    }
  };

  const candCol = callDocRef.collection(isCaller ? 'callerCandidates' : 'calleeCandidates');
  const remoteCandCol = callDocRef.collection(isCaller ? 'calleeCandidates' : 'callerCandidates');

  pc.onicecandidate = e => {
    if (e.candidate) candCol.add(e.candidate.toJSON()).catch(() => {});
  };

  callUnsubs.push(remoteCandCol.onSnapshot(snap => {
    snap.docChanges().forEach(ch => { if (ch.type === 'added') pendingCands.push(ch.doc.data()); });
    flushCands();
  }, () => {}));

  let seen = false;
  callUnsubs.push(callDocRef.onSnapshot(snap => {
    if (!snap.exists) { if (seen) endCall(false); return; }
    seen = true;
    const d = snap.data();
    if (d.status === 'ended' || d.status === 'declined') {
      if (currentCallMeta) currentCallMeta.outcome = d.status === 'declined' ? 'declined' : 'completed';
      toast(d.status === 'declined' ? tr('callDeclined') : tr('callEnded'));
      endCall(false);
    }
  }, () => {}));
}

async function startCall(peerUid, peerName, isVideo) {
  if (!me || !peerUid) return;
  if (peerUid === AI_BOT_ID) { toast('Amar AI text chat er jonno ready 😊'); return; }
  if (myBlocked().includes(peerUid)) { toast('User is blocked'); return; }
  if (activeCallId) { toast('Call already active'); return; }
  if (!navigator.mediaDevices?.getUserMedia || !window.RTCPeerConnection) {
    toast('Calls not supported in this browser'); return;
  }
  const callDoc = db.collection('calls').doc();
  activeCallId = callDoc.id;
  currentCallMeta = { peerUid, peerName, isVideo: !!isVideo, direction: 'outgoing', outcome: 'outgoing' };
  showCallUI(peerName, isVideo ? tr('videoCalling') : tr('audioCalling'), isVideo, 'active');

  try {
    await setupPeer(callDoc, true, isVideo);
    const offer = await pc.createOffer({ offerToReceiveAudio: true, offerToReceiveVideo: !!isVideo });
    await pc.setLocalDescription(offer);
    await callDoc.set({
      callerId: me.uid, callerName: myName(),
      calleeId: peerUid, calleeName: peerName,
      isVideo: !!isVideo, status: 'ringing',
      offer: { type: offer.type, sdp: offer.sdp },
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });

    callUnsubs.push(callDoc.onSnapshot(async snap => {
      if (!snap.exists || !pc || isSettingRemote) return;
      const d = snap.data();
      if (d.status === 'declined') {
        if (currentCallMeta) currentCallMeta.outcome = 'declined';
        toast(tr('callDeclined'));
        endCall(false);
        return;
      }
      if (d.answer && d.answer.sdp && !pc.remoteDescription) {
        isSettingRemote = true;
        if (currentCallMeta) currentCallMeta.outcome = 'connected';
        try {
          await pc.setRemoteDescription(new RTCSessionDescription(d.answer));
          $cst.textContent = tr('callConnecting');
          syncMediaElements();
          await flushCands();
        } catch (e) { toast('Answer error'); }
        finally { isSettingRemote = false; }
      }
    }, () => {}));

    const myCallId = callDoc.id;
    ringTimer = setTimeout(() => {
      if (activeCallId === myCallId && pc && !pc.remoteDescription) {
        if (currentCallMeta) currentCallMeta.outcome = 'missed';
        endCall(true);
      }
    }, 40000);
  } catch (e) {
    toast('Call error: ' + (e.message || 'Check mic/camera permission'));
    endCall(true);
  }
}

async function acceptCall(callData, callDoc) {
  stopRingtone();
  if (activeCallId || !callData?.offer?.sdp) { ringingCallId = null; hideCallUI(); return; }
  const isVideo = !!callData.isVideo;
  ringingCallId = null;
  activeCallId = callDoc.id;
  currentCallMeta = { peerUid: callData.callerId, peerName: callData.callerName || 'User', isVideo, direction: 'incoming', outcome: 'answered' };
  showCallUI(callData.callerName || 'User', tr('callConnecting'), isVideo, 'active');

  try {
    await setupPeer(callDoc, false, isVideo);
    isSettingRemote = true;
    await pc.setRemoteDescription(new RTCSessionDescription(callData.offer));
    isSettingRemote = false;
    await flushCands();
    const answer = await pc.createAnswer();
    await pc.setLocalDescription(answer);
    syncMediaElements();
    await callDoc.update({ status: 'accepted', answer: { type: answer.type, sdp: answer.sdp } });
  } catch (e) {
    toast('Accept call error');
    endCall(true);
  }
}

function listenIncomingCalls() {
  if (callWatchUnsub) { callWatchUnsub(); callWatchUnsub = null; }
  if (!me) return;
  let initialLoadDone = false;

  callWatchUnsub = db.collection('calls')
    .where('calleeId', '==', me.uid)
    .where('status', '==', 'ringing')
    .limit(10)
    .onSnapshot(snap => {
      if (!initialLoadDone) {
        initialLoadDone = true;
        snap.docs.forEach(docSnap => {
          const d = docSnap.data() || {};
          if (d.status === 'ringing' && (Date.now() - tsMs(d.createdAt)) < 60000 && !activeCallId && !ringingCallId) {
            presentIncoming(docSnap.id, d, docSnap.ref);
          }
        });
        return;
      }
      snap.docChanges().forEach(ch => {
        const id = ch.doc.id;
        const d = ch.doc.data() || {};
        if (ch.type === 'removed' || (d.status && d.status !== 'ringing')) {
          if (ringingCallId === id) {
            ringingCallId = null; stopRingtone();
            if (!activeCallId) hideCallUI();
            if (d.status === 'ended') logCallHistory(d.callerId, d.callerName || 'User', !!d.isVideo, 'incoming', 'missed');
          }
          return;
        }
        if (ch.type === 'added' && d.status === 'ringing' && !activeCallId && !ringingCallId) {
          presentIncoming(id, d, ch.doc.ref);
        }
      });
    }, () => {});

  function presentIncoming(id, d, docRef) {
    if (myBlocked().includes(d.callerId)) {
      docRef.update({ status: 'declined' }).catch(() => {});
      return;
    }
    ringingCallId = id;
    triggerNotification(d.callerName || tr('appName'), d.isVideo ? tr('inVideoCall') : tr('inAudioCall'), true);
    showCallUI(d.callerName || 'User', d.isVideo ? tr('inVideoCall') : tr('inAudioCall'), !!d.isVideo, 'incoming');
    const decBtn = document.getElementById('cdec');
    const accBtn = document.getElementById('cacc');
    if (decBtn) {
      decBtn.onclick = async () => {
        ringingCallId = null; stopRingtone();
        await logCallHistory(d.callerId, d.callerName || 'User', !!d.isVideo, 'incoming', 'declined');
        try { await docRef.update({ status: 'declined' }); } catch (e) {}
        hideCallUI();
      };
    }
    if (accBtn) accBtn.onclick = () => acceptCall(d, docRef);
  }
}

/* ---------- LIGHTWEIGHT PRESENCE ---------- */
async function setOnline(online) {
  if (!me || !profile) return;
  try {
    await db.collection('presence').doc(me.uid).set({
      online: !!online, lastSeen: firebase.firestore.FieldValue.serverTimestamp()
    }, { merge: true });
  } catch (e) {}
}
function startPresence() {
  stopPresence();
  const visible = () => document.visibilityState === 'visible';
  setOnline(visible());
  presenceTimer = setInterval(() => { if (visible()) setOnline(true); }, 180000);
  const onVis = () => setOnline(visible());
  const onOff = () => setOnline(false);
  document.addEventListener('visibilitychange', onVis);
  window.addEventListener('pagehide', onOff);
  presenceCleanup = () => {
    document.removeEventListener('visibilitychange', onVis);
    window.removeEventListener('pagehide', onOff);
  };
}
function stopPresence() {
  if (presenceTimer) { clearInterval(presenceTimer); presenceTimer = null; }
  if (presenceCleanup) { presenceCleanup(); presenceCleanup = null; }
}
function fmtStatus(p, canSee = true) {
  if (!canSee || !p) return '';
  if (isOnline(p)) return tr('online');
  const d = p.lastSeen?.toDate?.();
  if (!d) return '';
  return `${tr('lastSeen')} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
}

window.addEventListener('offline', () => toast('You are offline. Messages will send when you are back online.'));
window.addEventListener('online', () => toast('Back online'));

auth.onAuthStateChanged(async u => {
  me = u; stop(); stopPresence(); appUnlocked = false;
  if (callWatchUnsub) { callWatchUnsub(); callWatchUnsub = null; }
  if (chatAlertUnsub) { chatAlertUnsub(); chatAlertUnsub = null; }
  await endCall(false);

  if (signingUp) return;
  gate();
});

function gate() {
  if (!me.emailVerified) verifyView(); else route();
}

function verifyView(msg = '', good = false) {
  stop();
  currentScreenName = 'verify';
  applyTheme();
  $app.innerHTML = `
    <div class="auth">
      <h1>📧 Verify Email</h1>
      <p class="hint">Verification link sent to <b>${esc(me.email)}</b>. Check Inbox/Spam, click the link, then press below.</p>
      ${msg ? `<p class="${good ? 'ok' : 'err'}">${esc(msg)}</p>` : ''}
      <button class="btn" id="ok">I have verified</button>
      <button class="link" id="rs">Resend verification email</button>
      <button class="link" id="lo">${esc(tr('logout'))}</button>
    </div>`;
  document.getElementById('lo').onclick = () => auth.signOut();
  document.getElementById('rs').onclick = async () => {
    try { await me.sendEmailVerification(); verifyView('Verification email sent.', true); }
    catch (ex) { verifyView(ex.message); }
  };
  document.getElementById('ok').onclick = async () => {

      await me.reload();

async function route() {
  try {
    const d = await db.collection('users').doc(me.uid).get();
    if (d.exists && d.data().username) {
      profile = d.data();
      if (!profile.lang) profile.lang = currentLang();
      localStorage.setItem('amar_chat_lang', profile.lang);
      applyTheme();
      startPresence();
      listenIncomingCalls();
      watchChatNotifications();
      const afterUnlock = () => home('chats', false);
      profile.pinCode = localStorage.getItem('amar_chat_pin') || '';
      if (profile.pinCode && !appUnlocked) pinLockView(afterUnlock);
      else afterUnlock();
    } else {
      usernameSetup();
    }
  } catch (e) {
    $app.innerHTML = `<div class="empty">Error: ${esc(e.message)}</div>`;
  }
}

function authView(isLogin, err = '', okMsg = '', prefEmail = '') {
  currentScreenName = 'auth';
  $app.innerHTML = `
    <div class="auth">
      <h1>💬 ${esc(tr('appName'))}</h1>
      ${isLogin ? '' : `<input type="text" id="nm" placeholder="Your Name">`}
      <input type="email" id="em" placeholder="Email" value="${esc(prefEmail)}" autocomplete="email">
      <input type="password" id="pw" placeholder="Password (min 6 chars)" autocomplete="${isLogin ? 'current-password' : 'new-password'}">
      ${err ? `<p class="err">${esc(err)}</p>` : ''}
      ${okMsg ? `<p class="ok">${esc(okMsg)}</p>` : ''}
      <button class="btn" id="go">${isLogin ? 'Login' : 'Create Account'}</button>
      ${isLogin ? '<button class="link" id="rst">Forgot Password?</button>' : ''}
      <button class="link" id="sw">${isLogin ? 'New here? Create Account' : 'Already have an account? Login'}</button>
    </div>`;

  document.getElementById('sw').onclick = () => authView(!isLogin, '', '', document.getElementById('em').value.trim());
  const rstBtn = document.getElementById('rst');
  if (rstBtn) {
    rstBtn.onclick = async () => {
      const email = document.getElementById('em').value.trim();
      if (!email) return authView(true, 'Enter your email first');
      rstBtn.disabled = true;
      try {
        await auth.sendPasswordResetEmail(email);
        authView(true, '', 'Password reset link sent.', email);
      } catch (ex) { authView(true, ex.message, '', email); }
    };
  }
  document.getElementById('go').onclick = async e => {
    const btn = e.target;
    btn.disabled = true;
    const email = document.getElementById('em').value.trim();
    const pw = document.getElementById('pw').value;
    if (!email || !pw) return authView(isLogin, 'Enter email and password', '', email);
    if (isLogin) {
      try { await auth.signInWithEmailAndPassword(email, pw); }
      catch (ex) { authView(true, ex.message, '', email); }
      return;
    }
    const name = document.getElementById('nm').value.trim();
    if (!name) return authView(false, 'Enter your name', '', email);
    signingUp = true;
    try {
      const c = await auth.createUserWithEmailAndPassword(email, pw);
      me = c.user;
      await c.user.updateProfile({ displayName: name });
      await c.user.sendEmailVerification();
      verifyView('Verification email sent.', true);
    } catch (ex) { authView(false, ex.message, '', email); }
    finally { signingUp = false; }
  };

    if (show && !contactsLoaded) {
      contactsLoaded = true;
      try {
        const cSnap = await db.collection('chats').where('members', 'array-contains', me.uid).limit(60).get();
        const peers = {};
        cSnap.docs.forEach(d => {
          const cd = d.data();
          (cd.members || []).forEach(uid => { if (uid !== me.uid && uid !== AI_BOT_ID) peers[uid] = cd.memberNames?.[uid] || 'User'; });
        });
        const entries = Object.entries(peers);
        pickBox.innerHTML = entries.length
          ? entries.map(([uid, nm]) => `<label class="togrow" style="padding:4px 0"><span>${esc(nm)}</span><input type="checkbox" class="stchk" value="${esc(uid)}"></label>`).join('')
          : '<div class="hint" style="margin:0">No contacts</div>';
      } catch (e) {}
    }
  };

  modal.querySelector('#stpost').onclick = async () => {
    const clean = modal.querySelector('#stinp').value.trim();
    if (!clean) return;
    const privacy = privSel.value;
    const allowedUids = privacy === 'selected' ? [...modal.querySelectorAll('.stchk:checked')].map(x => x.value) : [];
    if (privacy === 'selected' && !allowedUids.length) return toast('Select at least 1 friend');
    const now = Date.now();
    try {
      await db.collection('statuses').add({
        uid: me.uid, userName: myName(), photo: '', text: clean,
        privacy, allowedUids, viewedBy: [], createdAt: now, expiresAt: now + 24 * 60 * 60 * 1000
      });
      modal.remove();
      home('status', false);
    } catch (e) { toast(e.message); }
  };
}

async function sendStatusReply(statusObj, replyText) {
  const clean = String(replyText || '').trim();
  if (!clean || !statusObj?.uid || statusObj.uid === me.uid) return;
  const ids = [me.uid, statusObj.uid].sort();
  const cid = ids.join('_');
  const FV = firebase.firestore.FieldValue;
  await db.collection('chats').doc(cid).set({
    isGroup: false, members: ids,
    memberNames: { [me.uid]: myName(), [statusObj.uid]: statusObj.userName || 'User' },
    lastMessage: `Status reply: ${clean}`,
    lastSender: me.uid,
    unread: { [statusObj.uid]: FV.increment(1) },
    updatedAt: FV.serverTimestamp()
  }, { merge: true });
  await db.collection('chats').doc(cid).collection('messages').add({
    senderId: me.uid, senderName: myName(), text: clean,
    replyTo: { id: statusObj.id, senderName: statusObj.userName || 'Status', preview: `Status: ${statusObj.text}` },
    reactions: {}, hiddenFor: [], edited: false, deleted: false,
    deliveredTo: [me.uid], seenBy: [me.uid], createdAt: FV.serverTimestamp()
  });
  toast('Reply sent');
}

function chatTitle(c) {
  if (c.isBot || c.id === `ai_${me?.uid}`) return AI_BOT_NAME;
  if (c.isGroup) return c.name || 'Group';
  const oid = otherUid(c);
  if (oid && userProfilesCache[oid]?.name) return userProfilesCache[oid].name;
  const names = c.memberNames || {};
  for (const k in names) if (k !== me.uid) return names[k];
  return 'Chat';
}
function otherUid(c) {
  if (c.isBot || c.id === `ai_${me?.uid}`) return AI_BOT_ID;
  if (c.isGroup) return null;
  return (c.members || []).find(id => id !== me.uid) || null;
}

function home(activeTab = 'chats', showArchived = false) {
  stop();
  currentScreenName = 'home';
  ensureRootHistoryAnchor();
  applyTheme();
  let allChats = [];
  let statusDocs = [];
  let callLogs = [];
  let searchTerm = '';

  const aiHist = getAiHistory(me?.uid);
  const lastAi = aiHist[aiHist.length - 1];
  const aiSyntheticChat = {
    id: `ai_${me?.uid}`,
    isBot: true,
    name: AI_BOT_NAME,
    lastMessage: lastAi ? lastAi.text : 'Ask me anything for free! 🤖',
    lastSender: lastAi?.senderId || AI_BOT_ID,
    updatedAtMs: lastAi?.createdAtMs || 1,
    unread: {}
  };

  $app.innerHTML = `
    <header>
      <div class="hav" id="myav" title="${esc(tr('settingsTitle'))}" style="cursor:pointer">${avHtml(profile.photo, myName())}</div>
      <span>${esc(tr('appName'))}</span>
      <span class="sp"></span>
      <span class="un">@${esc(profile.username)}</span>
      <button id="darkquick" title="Dark Mode">${isDarkMode() ? '☀️' : '🌙'}</button>
      <button id="lo" title="${esc(tr('logout'))}">${esc(tr('logout'))}</button>
    </header>
    <div class="tabs">
      <button id="t_chats" class="${activeTab === 'chats' ? 'on' : ''}">${esc(tr('chatsTab'))}</button>
      <button id="t_status" class="${activeTab === 'status' ? 'on' : ''}">${esc(tr('statusTab'))}</button>
      <button id="t_calls" class="${activeTab === 'calls' ? 'on' : ''}">${esc(tr('callsTab'))}</button>
    </div>
    <div id="topslot"></div>
    <div class="list" id="ls"><div class="empty">Loading...</div></div>
    <button class="fab" id="fab">+</button>
    <div class="menu" id="mn" style="display:none">
      <div id="m1">${esc(tr('newChat'))}</div>
      <div id="mai">${esc(tr('aiBotMenu'))}</div>
      <div id="m2">${esc(tr('newGroup'))}</div>
      <div id="m5">${esc(tr('postStatusMenu'))}</div>
      <div id="m4">${esc(tr('starredMenu'))}</div>
      <div id="m3">${esc(tr('settingsTitle'))}</div>
    </div>`;

  document.getElementById('myav').onclick = profileView;
  document.getElementById('darkquick').onclick = async () => {
    const nextDark = !isDarkMode();
    profile.darkMode = nextDark;
    applyTheme();
    try { await db.collection('users').doc(me.uid).set({ darkMode: nextDark }, { merge: true }); } catch (e) {}
    home(activeTab, showArchived);
  };
  document.getElementById('lo').onclick = async () => { await setOnline(false); auth.signOut(); };
  document.getElementById('t_chats').onclick = () => home('chats', false);
  document.getElementById('t_status').onclick = () => home('status', false);
  document.getElementById('t_calls').onclick = () => home('calls', false);

  const mn = document.getElementById('mn');
  document.getElementById('fab').onclick = e => { e.stopPropagation(); mn.style.display = mn.style.display === 'none' ? 'block' : 'none'; };
  document.addEventListener('click', () => { if (mn) mn.style.display = 'none'; });
  document.getElementById('m1').onclick = newChat;
  document.getElementById('mai').onclick = () => chatView(aiSyntheticChat.id, AI_BOT_NAME, AI_BOT_ID);
  document.getElementById('m2').onclick = newGroup;
  document.getElementById('m5').onclick = () => { mn.style.display = 'none'; openStatusModal(); };
  document.getElementById('m4').onclick = starredView;
  document.getElementById('m3').onclick = profileView;

  const renderBody = () => {
    const ls = document.getElementById('ls');
    const topslot = document.getElementById('topslot');
    if (!ls || !topslot) return;

    if (activeTab === 'status') {
      topslot.innerHTML = `<div class="archbar" id="newstbar"><span>${esc(tr('newStatusBar'))}</span><span>24h</span></div>`;
      document.getElementById('newstbar').onclick = openStatusModal;
      const now = Date.now();
      const valid = statusDocs.filter(s => {
        if ((s.expiresAt || 0) <= now) return false;
        if (s.uid === me.uid) return true;
        if (s.privacy === 'selected') return Array.isArray(s.allowedUids) && s.allowedUids.includes(me.uid);
        return true;
      });
      if (!valid.length) { ls.innerHTML = `<div class="empty">${esc(tr('noStatus'))}</div>`; return; }
      ls.innerHTML = valid.map(s => {
        const viewers = Array.isArray(s.viewedBy) ? s.viewedBy : [];
        return `<div class="row strow" data-id="${s.id}">
          <div class="av ring">${avHtml(s.photo, s.userName)}</div>
          <div class="mid"><div class="t">${esc(s.userName || 'User')}</div><div class="s">${esc(s.text || '')}</div></div>
          ${s.uid === me.uid ? `<span class="hint" style="margin:0">👁 ${viewers.length}</span>` : ''}
        </div>`;
      }).join('');
      ls.querySelectorAll('.strow').forEach(r => {
        const st = valid.find(x => x.id === r.dataset.id);
        if (!st) return;
        r.onclick = async () => {
          const viewers = Array.isArray(st.viewedBy) ? [...st.viewedBy] : [];
          if (st.uid !== me.uid && !viewers.some(v => v.uid === me.uid)) {
            const entry = { uid: me.uid, name: myName() };
            viewers.push(entry);
            try {
              await db.collection('statuses').doc(st.id).update({ viewedBy: firebase.firestore.FieldValue.arrayUnion(entry) });
              st.viewedBy = viewers;
            } catch (e) {}
          }
          const viewerHtml = st.uid === me.uid
            ? `<div class="viewers"><b>👁 ${esc(tr('seenBy'))} (${viewers.length}):</b><br>${viewers.length ? viewers.map(v => esc(v.name || 'User')).join(', ') : '-'}</div>`
            : `<div class="streply" onclick="event.stopPropagation()">
                <input type="text" id="strinp" placeholder="${esc(tr('replyBtn'))}...">
                <button type="button" id="strbtn">➤</button>
              </div>`;
          openLightbox(st.text, `${st.userName} • Status`, true, viewerHtml);
          const strbtn = document.getElementById('strbtn');
          const strinp = document.getElementById('strinp');
          if (strbtn && strinp) {
            const doRep = async () => {
              const v = strinp.value.trim();
              if (!v) return;
              await sendStatusReply(st, v);
              const lb = document.querySelector('.lbox');
              if (lb) lb.remove();
            };
            strbtn.onclick = doRep;
            strinp.onkeydown = e => { if (e.key === 'Enter') doRep(); };
          }
        };
      });
      return;
    }

    if (activeTab === 'calls') {
      topslot.innerHTML = '';
      if (!callLogs.length) { ls.innerHTML = `<div class="empty">${esc(tr('noCalls'))}</div>`; return; }
      ls.innerHTML = callLogs.map(c => {
        const dt = c.createdAt?.toDate?.();
        const tm = dt ? `${String(dt.getHours()).padStart(2, '0')}:${String(dt.getMinutes()).padStart(2, '0')}` : '';
        const icon = c.direction === 'incoming' ? '↙' : '↗';
        const mode = c.isVideo ? '📹 Video' : '📞 Audio';
        const isMissed = c.outcome === 'missed';
        return `<div class="row callrow" data-uid="${esc(c.peerUid)}" data-name="${esc(c.peerName)}" data-vid="${c.isVideo ? '1' : '0'}">
          <div class="av">${esc((c.peerName || '?')[0]?.toUpperCase() || '?')}</div>
          <div class="mid">
            <div class="t" style="color:${isMissed ? '#ef4444' : 'inherit'}">${esc(c.peerName || 'User')}</div>
            <div class="s" style="color:${isMissed ? '#ef4444' : 'var(--sub)'}">${icon} ${mode} • ${esc(c.outcome || '')} ${tm ? '• ' + tm : ''}</div>
          </div>
          <span class="hint" style="margin:0">Call</span>
        </div>`;
      }).join('');
      ls.querySelectorAll('.callrow').forEach(r => {
        r.onclick = () => startCall(r.dataset.uid, r.dataset.name, r.dataset.vid === '1');
      });
      return;
    }

    topslot.innerHTML = `<div class="searchbox"><input type="text" id="srch" placeholder="${esc(tr('searchChats'))}" value="${esc(searchTerm)}"></div><div id="archslot"></div>`;
    const srchEl = document.getElementById('srch');
    srchEl.addEventListener('input', e => { searchTerm = e.target.value; renderBody(); });

    const visibleChats = [aiSyntheticChat, ...allChats].filter(c => {
      if (c.isBot) return true;
      const delTs = tsMs(c.deletedAt?.[me.uid]);
      const updTs = tsMs(c.updatedAt);
      return !(delTs && updTs && updTs <= delTs);
    });

    const totalUnread = visibleChats.reduce((n, c) => n + ((!c.archivedBy?.[me.uid] && !c.mutedBy?.[me.uid]) ? (c.unread?.[me.uid] || 0) : 0), 0);
    document.title = totalUnread ? `(${totalUnread}) Amar Chat` : 'Amar Chat';
    const tcb = document.getElementById('t_chats');
    if (tcb) tcb.textContent = tr('chatsTab') + (totalUnread ? ` (${totalUnread > 99 ? '99+' : totalUnread})` : '');
    const archivedCount = visibleChats.filter(c => !!c.archivedBy?.[me.uid]).length;
    const archslot = document.getElementById('archslot');
    if (archslot) {
      if (showArchived) archslot.innerHTML = `<div class="archbar" id="archtog"><span>${esc(tr('backAllChats'))}</span><span>${archivedCount}</span></div>`;
      else if (archivedCount > 0) archslot.innerHTML = `<div class="archbar" id="archtog"><span>${esc(tr('archChats'))}</span><span>${archivedCount}</span></div>`;
      else archslot.innerHTML = '';
      const tog = document.getElementById('archtog');
      if (tog) tog.onclick = () => home('chats', !showArchived);
    }

    const q = searchTerm.trim().toLowerCase();
    const filtered = visibleChats.filter(c => {
      const isArch = !!c.archivedBy?.[me.uid];
      if (showArchived !== isArch) return false;
      if (!q) return true;
      const t = chatTitle(c).toLowerCase();
      const lm = (c.lastMessage || '').toLowerCase();
      const oid = otherUid(c);
      const un = (oid && c.memberUsernames?.[oid]) ? c.memberUsernames[oid].toLowerCase() : '';
      return t.includes(q) || lm.includes(q) || un.includes(q);
    });

    if (!filtered.length) {
      ls.innerHTML = q ? `<div class="empty">${esc(tr('noSearch'))}</div>` : showArchived ? `<div class="empty">${esc(tr('noArch'))}</div>` : `<div class="empty">${esc(tr('noChats'))}</div>`;
      return;
    }

    ls.innerHTML = filtered.map(c => {
      const t = chatTitle(c);
      const oid = otherUid(c);
      const isBot = !!c.isBot;
      const photo = isBot ? '' : (c.isGroup ? (c.groupIcon || '') : (userProfilesCache[oid]?.photo || ''));
      const isMuted = !!c.mutedBy?.[me.uid];
      const draftTxt = getDraft(c.id).trim();
      const un = c.unread?.[me.uid] || 0;
      const typers = Object.entries(c.typing || {}).filter(([u, v]) => u !== me.uid && isTyping(v));
      const lastTs = tsMs(c.updatedAt) || c.updatedAtMs || 0;
      const mineLast = !isBot && c.lastSender === me.uid && c.lastMessage ? `<span class="youlbl">You: </span>` : '';
      const subHtml = typers.length ? '<span class="typlbl">✍️ typing…</span>'
        : draftTxt ? `<span class="draftlbl">Draft:</span> ${esc(draftTxt)}`
        : mineLast + esc(c.lastMessage || '');
      return `<div class="row ${un ? 'unrd' : ''}" data-id="${c.id}" data-t="${esc(t)}" data-oid="${oid || ''}">
        <div class="av ${isBot ? 'botav' : ''}">${avHtml(photo, t, c.isGroup, isBot)}</div>
        <div class="mid">
          <div class="t">${esc(t)} ${isBot ? '<span class="aibadge">FREE AI</span>' : ''}${isMuted ? '<span title="Muted" style="font-size:12px">🔇</span>' : ''}${c.disappearHours ? ' <span title="Disappearing messages" style="font-size:12px">⏱</span>' : ''}</div>
          <div class="s">${subHtml}</div>
        </div>
        <div class="rmeta"><span class="rtm ${un && !isMuted ? 'un' : ''}">${fmtListTime(lastTs)}</span>${un ? `<span class="badge ${isMuted ? 'mute' : ''}">${un > 99 ? '99+' : un}</span>` : ''}</div>
      </div>`;
    }).join('');

    ls.querySelectorAll('.row').forEach(r => {
      r.onclick = () => chatView(r.dataset.id, r.dataset.t, r.dataset.oid || null);
    });
  };

  if (activeTab === 'status') {
    const stMap = { a: [], b: [], c: [] };
    const stMerge = () => {
      const seen = new Map();
      [...stMap.a, ...stMap.b, ...stMap.c].forEach(x => seen.set(x.id, x));
      statusDocs = [...seen.values()].filter(x => (x.expiresAt || 0) > Date.now()).sort((x, y) => (y.createdAt || 0) - (x.createdAt || 0));
      renderBody();
    };
    const stSub = (k, q) => addSub(q.onSnapshot(snap => { stMap[k] = snap.docs.map(d => ({ id: d.id, ...d.data() })); stMerge(); }, () => stMerge()));
    stSub('a', db.collection('statuses').where('privacy', '==', 'all').limit(30));
    stSub('b', db.collection('statuses').where('uid', '==', me.uid).limit(20));
    stSub('c', db.collection('statuses').where('allowedUids', 'array-contains', me.uid).limit(20));
    return;
  }

  if (activeTab === 'calls') {
    addSub(db.collection('users').doc(me.uid).collection('callLogs').orderBy('createdAt', 'desc').limit(20).onSnapshot(snap => {
      callLogs = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      renderBody();
    }, () => renderBody()));
    return;
  }

  const typTick = setInterval(() => { if (allChats.some(c => Object.entries(c.typing || {}).some(([u, v]) => u !== me.uid && v))) renderBody(); }, 3000);
  addSub(() => clearInterval(typTick));
  addSub(db.collection('chats').where('members', 'array-contains', me.uid).limit(60).onSnapshot(snap => {
    allChats = snap.docs.map(d => ({ id: d.id, ...d.data() }))
      .sort((a, b) => (b.updatedAt?.seconds || 9e12) - (a.updatedAt?.seconds || 9e12));
    renderBody();
  }, err => {
    const l = document.getElementById('ls');
    if (l) l.innerHTML = `<div class="empty">Error: ${esc(err.message)}</div>`;
  }));
}

async function openOneToOne(u) {
  const ids = [me.uid, u.uid].sort();
  const id = ids.join('_');
  await db.collection('chats').doc(id).set({
    isGroup: false, members: ids,
    memberNames: { [me.uid]: myName(), [u.uid]: u.name },
    memberUsernames: { [me.uid]: profile.username, [u.uid]: u.username }
  }, { merge: true });
  chatView(id, u.name, u.uid);
}

function newGroup() {
  stop();
  currentScreenName = 'newgroup';
  pushSubScreenHistory('newgroup');
  const added = {};
  let groupIcon = '';

  $app.innerHTML = `
    <header><button id="bk">←</button>${esc(tr('newGroup'))}</header>
    <div class="pad">
      <div class="pav" id="gpav">${avHtml('', 'G', true)}</div>
      <input type="file" id="gfi" accept="image/jpeg,image/png,image/webp" hidden>
      <input type="text" id="gn" placeholder="Group Name">
      <input type="text" id="gd" placeholder="Description (optional)">
      <div class="addrow">
        <input type="text" id="q" placeholder="username" autocapitalize="off" autocomplete="off">
        <button class="btn sm" id="ad">+</button>
      </div>
      <p class="err" id="er" style="margin-top:10px"></p>
      <div class="chips" id="ch"></div>
      <button class="btn" id="mk">${esc(tr('newGroup'))}</button>
    </div>`;

  document.getElementById('bk').onclick = () => home('chats', false);
  document.getElementById('gpav').onclick = () => document.getElementById('gfi').click();
  document.getElementById('gfi').onchange = async e => {
    const f = e.target.files[0]; if (!f) return;
    try {
      const small = await shrink(f, 200, 0.4);
      groupIcon = small.dataUrl;
      document.getElementById('gpav').innerHTML = avHtml(groupIcon, 'G', true);
    } catch (ex) {}
    e.target.value = '';
  };

  const draw = () => {
    const ch = document.getElementById('ch');
    ch.innerHTML = Object.entries(added).map(([uid, u]) => `<span class="chip" data-u="${uid}">${esc(u.name)} (@${esc(u.username)}) ✕</span>`).join('');
    ch.querySelectorAll('.chip').forEach(c => c.onclick = () => { delete added[c.dataset.u]; draw(); });
  };
  const add = async () => {
    const er = document.getElementById('er'), q = document.getElementById('q');
    er.textContent = '';
    try {
      const u = await lookup(q.value);
      if (u.isBot) throw new Error('AI bot cannot be added to a group');
      added[u.uid] = { name: u.name, username: u.username };
      q.value = ''; draw();
    } catch (ex) { er.textContent = ex.message; }
  };
  document.getElementById('ad').onclick = add;
  document.getElementById('q').addEventListener('keydown', e => { if (e.key === 'Enter') add(); });
  document.getElementById('mk').onclick = async () => {
    const name = document.getElementById('gn').value.trim();
    const description = document.getElementById('gd').value.trim();
    if (!name || Object.keys(added).length < 2) return toast('Enter group name and add at least 2 members');
    const memberNames = { [me.uid]: myName() };
    const memberUsernames = { [me.uid]: profile.username };
    Object.entries(added).forEach(([uid, u]) => { memberNames[uid] = u.name; memberUsernames[uid] = u.username; });
    const ref = await db.collection('chats').add({
      isGroup: true, name, description, groupIcon, admins: [me.uid],
      members: Object.keys(memberNames), memberNames, memberUsernames,
      lastMessage: '', updatedAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    chatView(ref.id, name, null);
  };
}

function groupInfoView(chatId) {
  stop();
  currentScreenName = 'groupinfo';
  pushSubScreenHistory('groupinfo');
  const FV = firebase.firestore.FieldValue;
  const cref = db.collection('chats').doc(chatId);
  $app.innerHTML = `<header><button id="bk">←</button>Group Info</header><div class="list"><div class="pad" id="gbody"><div class="empty">Loading...</div></div></div>`;
  let curName = 'Group', lastSig = '';
  document.getElementById('bk').onclick = () => chatView(chatId, curName, null);

  addSub(cref.onSnapshot(snap => {
    if (!snap.exists) { home('chats', false); return; }
    const c = snap.data();
    const members = c.members || [];
    if (!members.includes(me.uid)) { home('chats', false); return; }
    const admins = c.admins || [];
    const isAdmin = admins.includes(me.uid);
    curName = c.name || 'Group';
    const sig = JSON.stringify([c.name, c.description, members, admins, c.memberNames, c.memberUsernames]);
    if (sig === lastSig) return;
    lastSig = sig;
    const gbody = document.getElementById('gbody');
    if (!gbody) return;
    gbody.innerHTML = `
      <div class="card">
        ${isAdmin ? `
          <input type="text" id="gname" value="${esc(c.name || '')}" placeholder="Group name" maxlength="40">
          <input type="text" id="gdesc" value="${esc(c.description || '')}" placeholder="Description (optional)" maxlength="150">
          <button class="btn sm" id="gsave">Save</button>`
        : `<div style="font-size:17px;font-weight:700">${esc(c.name || 'Group')}</div>
           ${c.description ? `<p class="hint" style="margin-top:4px">${esc(c.description)}</p>` : ''}`}
      </div>
      <div class="card">
        <div class="hint"><b>${members.length} members</b></div>
        ${members.map(uid => `<div class="mrow">
          <span>${esc(c.memberNames?.[uid] || 'User')}${c.memberUsernames?.[uid] ? ` <span class="hint" style="margin:0">@${esc(c.memberUsernames[uid])}</span>` : ''} ${admins.includes(uid) ? '<b style="color:var(--g);font-size:12px">[Admin]</b>' : ''}${uid === me.uid ? ' <span class="hint" style="margin:0">(You)</span>' : ''}</span>
          ${isAdmin && uid !== me.uid ? `<span><button class="btn sm gadm" data-u="${uid}" style="padding:4px 9px;font-size:11px">${admins.includes(uid) ? 'Remove admin' : 'Make admin'}</button> <button class="btn sm danger grm" data-u="${uid}" style="padding:4px 9px;font-size:11px">Remove</button></span>` : ''}
        </div>`).join('')}
      </div>
      ${isAdmin ? `<div class="card">
        <div class="hint"><b>Add a member</b></div>
        <div class="addrow"><input type="text" id="gq" placeholder="username" autocapitalize="off" autocomplete="off"><button class="btn sm" id="gad">Add</button></div>
        <p class="err" id="ger" style="margin-top:8px"></p>
      </div>` : '<p class="hint">Only admins can change the group or add/remove members.</p>'}
      <button class="btn danger" id="gleave">Leave Group</button>`;

    const gs = document.getElementById('gsave');
    if (gs) gs.onclick = async () => {
      const name = document.getElementById('gname').value.trim();
      if (!name) return toast('Group name cannot be empty');
      try { await cref.update({ name, description: document.getElementById('gdesc').value.trim() }); toast('Group updated'); }
      catch (e) { toast('Could not update group'); }
    };
    const gad = document.getElementById('gad');

async function openCameraModal(onCaptured) {
  let stream = null;
  let facing = 'user';
  const modal = document.createElement('div');
  modal.className = 'modal';
  modal.innerHTML = `
    <div class="mbox">
      <div class="mhead"><span>📸 Camera</span><button id="camcl">✕</button></div>
      <div class="mbody">
        <div class="cambox"><video id="camvid" autoplay playsinline muted></video></div>
        <div style="display:flex;gap:8px;margin-top:12px">
          <button class="btn sm sec" id="camflip">🔄</button>
          <button class="btn" id="camsnap" style="flex:1">📷 Capture</button>
        </div>
      </div>
    </div>`;
  document.body.appendChild(modal);
  const stopCam = () => { if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; } };
  const closeCam = () => { stopCam(); modal.remove(); };
  modal.querySelector('#camcl').onclick = closeCam;
  modal.onclick = e => { if (e.target === modal) closeCam(); };

  const startCam = async () => {
    stopCam();
    try {
      stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: facing }, width: { ideal: 320 }, height: { ideal: 240 } }, audio: false });
      const v = modal.querySelector('#camvid');
      v.srcObject = stream;
      v.play().catch(() => {});
    } catch (e) { toast('Camera error'); closeCam(); }
  };
  modal.querySelector('#camflip').onclick = () => { facing = facing === 'user' ? 'environment' : 'user'; startCam(); };
  modal.querySelector('#camsnap').onclick = async () => {
    const v = modal.querySelector('#camvid');
    if (!v || !v.videoWidth) return;
    const c = document.createElement('canvas');
    const s = Math.min(1, 300 / Math.max(v.videoWidth, v.videoHeight));
    c.width = Math.round(v.videoWidth * s);
    c.height = Math.round(v.videoHeight * s);
    c.getContext('2d').drawImage(v, 0, 0, c.width, c.height);
    const dataUrl = c.toDataURL('image/jpeg', 0.4);
    closeCam();
    await onCaptured(dataUrl);
  };
  await startCam();
}

function blobToDataURL(blob) {
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onload = () => res(fr.result);
    fr.onerror = () => rej(new Error('File read failed'));
    fr.readAsDataURL(blob);
  });
}

async function prepareFreeMedia(blobOrDataUrl, kind) {
  const dataUrl = typeof blobOrDataUrl === 'string' ? blobOrDataUrl : await blobToDataURL(blobOrDataUrl);
  if (!dataUrl || dataUrl.length > MAX_FREE_MEDIA_CHARS) {
    throw new Error(kind === 'voice'
      ? `Voice clip beshi boro (max ${MAX_FREE_VOICE_SEC}s rakhun).`
      : 'Chobi beshi boro. Chhoto chobi din.');
  }
  return dataUrl;
}
