        toast(tr('copied'));
        selectedIds.clear(); renderHeaderState(); renderMessages();
      };
      const selfwd = document.getElementById('selfwd');
      if (selfwd) selfwd.onclick = () => openForwardModal(selMsgs.map(x => x.m));
      document.getElementById('selstar').onclick = async () => {
        const FV = firebase.firestore.FieldValue;
        for (const { id, m } of selMsgs) {
          if (m.deleted) continue;
          const preview = m.text || (m.audio ? '🎤 Voice message' : m.image ? '📷 Photo' : 'Message');
          if (!myStarred().some(x => x.id === id)) {
            const entry = { id, chatId, chatTitle: curTitle, senderName: m.senderName || 'User', preview };
            await db.collection('users').doc(me.uid).set({ starred: FV.arrayUnion(entry) }, { merge: true });
            profile.starred = [...myStarred(), entry];
          }
        }
        toast('Starred');
        selectedIds.clear(); renderHeaderState(); renderMessages();
      };
      const selpin = document.getElementById('selpin');
      if (selpin) selpin.onclick = async () => {
        const { id, m } = selMsgs[0];
        if (chatMeta.pinnedMessage?.id === id) {
          await chat.set({ pinnedMessage: null }, { merge: true });
          toast('Unpinned');
        } else {
          await chat.set({ pinnedMessage: { id, senderName: m.senderName || 'User', preview: m.text || (m.audio ? '🎤 Voice message' : '📷 Photo') } }, { merge: true });
          toast('Pinned');
        }
        selectedIds.clear(); renderHeaderState(); renderMessages();
      };
      document.getElementById('seldel').onclick = async () => {
        const ids = [...selectedIds];
        if (isAiChat) {
          aiMessages = aiMessages.filter(x => !ids.includes(x.id));
          saveAiHistory(me?.uid, aiMessages);
        } else {
          for (const id of ids) {
            await chat.collection('messages').doc(id).update({ hiddenFor: firebase.firestore.FieldValue.arrayUnion(me.uid) }).catch(() => {});
          }
        }
        selectedIds.clear(); renderHeaderState(); renderMessages();
      };
      const seldelall = document.getElementById('seldelall');
      if (seldelall) seldelall.onclick = async () => {
        if (!confirm('Delete for everyone?')) return;
        const ids = [...selectedIds];
        for (const id of ids) {
          await chat.collection('messages').doc(id).update({ text: null, image: null, audio: null, deleted: true }).catch(() => {});
        }
        selectedIds.clear(); renderHeaderState(); renderMessages();
      };
      return;
    }

    chdr.classList.remove('selhdr');
    chdr.innerHTML = `
      <button id="bk">←</button>
      <div class="hav ${isAiChat ? 'botav' : ''}" id="chav">${avHtml(peerUser?.photo, curTitle, !peerUid && !isAiChat, isAiChat)}</div>
      <div class="hinfo" id="hinfo" style="cursor:${!peerUid && !isAiChat ? 'pointer' : 'default'}">
        <span id="htitle">${esc(curTitle)}</span>
        <span class="hsub" id="hsub"></span>
      </div>
      <button id="csbtn">🔍</button>
      ${(!peerUid || isAiChat) ? '' : '<button id="acall">📞</button><button id="vcall">📹</button>'}
      <button id="cmore">⋮</button>
      <div class="menu top" id="cmenu" style="display:none"></div>`;
    bindChatHeaderEvents();
    updateHeaderSub();
  }

  function setReply(id, senderName, preview) {
    replyTarget = { id, senderName, preview };
    rtxt.innerHTML = `<b>↩ ${esc(senderName)}:</b> ${esc(preview)}`;
    rbar.classList.add('on');
    tx.focus();
  }
  function clearReply() { replyTarget = null; rbar.classList.remove('on'); }
  document.getElementById('rcl').onclick = clearReply;
  document.getElementById('cscls').onclick = () => {
    document.getElementById('csbox').style.display = 'none';
    inChatQuery = ''; document.getElementById('csinp').value = ''; csresults.innerHTML = ''; renderMessages();
  };
  document.getElementById('csinp').addEventListener('input', e => { inChatQuery = e.target.value; renderMessages(); });

  const closeMenu = () => { const m = document.getElementById('cmenu'); if (m) m.style.display = 'none'; };
  document.addEventListener('click', closeMenu);
  addSub(() => document.removeEventListener('click', closeMenu));

  function updateBlockedUI() {
    const slot = document.getElementById('inputslot');
    if (!slot || !peerUid || isAiChat) return;
    if (myBlocked().includes(peerUid)) {
      slot.innerHTML = `<div class="blockedbar">🚫 Blocked <button class="btn sm" id="unblkbtn" style="margin-left:8px;padding:4px 10px">${esc(tr('unblkBtn'))}</button></div>`;
      document.getElementById('unblkbtn').onclick = async () => {
        await db.collection('users').doc(me.uid).set({ blocked: firebase.firestore.FieldValue.arrayRemove(peerUid) }, { merge: true });
        profile.blocked = myBlocked().filter(id => id !== peerUid);
        chatView(chatId, document.getElementById('htitle')?.textContent || title, peerUid);
      };
    }
  }

  ep.innerHTML = EMOJIS.map(em => `<button type="button">${em}</button>`).join('');
  ep.querySelectorAll('button').forEach(b => {
    b.onclick = () => {
      const start = tx.selectionStart ?? tx.value.length;
      const end = tx.selectionEnd ?? tx.value.length;
      tx.value = tx.value.slice(0, start) + b.textContent + tx.value.slice(end);
      setDraft(chatId, tx.value);
      tx.focus();
    };
  });
  document.getElementById('ebtn').onclick = () => ep.classList.toggle('on');

  const setTyping = async val => {
    if (isAiChat || !chat) return;
    const now = Date.now();
    if (val) { if (isTypingNow && now - lastTypingWrite < 3000) return; }
    else if (!isTypingNow) return;
    isTypingNow = val;
    lastTypingWrite = now;
    try { await chat.set({ typing: { [me.uid]: val ? now : 0 } }, { merge: true }); } catch (e) {}
  };

  tx.addEventListener('input', () => {
    setDraft(chatId, tx.value);
    autosize();
    if (!isAiChat) {
      if (tx.value.trim()) {
        setTyping(true);
        clearTimeout(typingTimeout);
        typingTimeout = setTimeout(() => setTyping(false), 2000);
      } else setTyping(false);
    }
  });

  function applyChatWallpaper() {
    if (isAiChat) {
      try {
        const localWp = JSON.parse(localStorage.getItem(`amar_wp_${chatId}`) || 'null');
        if (localWp?.color) { ms.style.backgroundImage = 'none'; ms.style.backgroundColor = localWp.color; return; }
      } catch (e) {}
      ms.style.backgroundImage = 'none';
      ms.style.backgroundColor = isDarkMode() ? '#0b141a' : '#efeae2';
      return;
    }
    const wp = chatMeta.wallpaperBy?.[me.uid];
    if (wp?.color) { ms.style.backgroundImage = 'none'; ms.style.backgroundColor = wp.color; }
    else { ms.style.backgroundImage = 'none'; ms.style.backgroundColor = isDarkMode() ? '#0b141a' : '#efeae2'; }
  }
  applyChatWallpaper();

  function renderMessages() {
    const atBottom = ms.scrollHeight - ms.scrollTop - ms.clientHeight < 120;
    const q = inChatQuery.trim().toLowerCase();
    const starredIds = new Set(myStarred().map(x => x.id));
    msgCache = {};

    let items = [];
    if (isAiChat) {
      items = aiMessages.map(m => ({ id: m.id, data: () => m }));
    } else {
      const delTs = tsMs(chatMeta.deletedAt?.[me.uid]);
      items = lastDocs.filter(d => {
        const m = d.data();
        if (m.expiresAt && Date.now() > m.expiresAt) {
          if (m.senderId === me.uid && !purged.has(d.id)) { purged.add(d.id); d.ref.delete().catch(() => {}); }
          return false;
        }
        if (Array.isArray(m.hiddenFor) && m.hiddenFor.includes(me.uid)) return false;
        const mTs = tsMs(m.createdAt);
        return !(delTs && mTs && mTs <= delTs);
      });
    }

    if (q) {
      const matches = items.filter(d => {
        const m = d.data();
        return !m.deleted && ((m.text || '').toLowerCase().includes(q) || (m.senderName || '').toLowerCase().includes(q));
      });
      csresults.innerHTML = matches.length
        ? `<div style="max-height:130px;overflow:auto;background:var(--card);border-bottom:1px solid var(--bd)">` +
          matches.slice(0, 10).map(d => {
            const m = d.data();
            return `<div class="row jhit" data-mid="${d.id}" style="padding:8px 12px"><div class="mid"><div class="t" style="font-size:12.5px">${esc(m.senderName || 'User')}</div><div class="s" style="font-size:12.5px">${esc(m.text || 'Message')}</div></div><span class="hint" style="margin:0">Jump</span></div>`;
          }).join('') + `</div>`
        : `<div class="pinbar"><span>${esc(tr('noSearch'))}</span></div>`;
      csresults.querySelectorAll('.jhit').forEach(row => { row.onclick = () => jumpAndHighlightMsg(row.dataset.mid); });
    } else {
      csresults.innerHTML = '';
    }

    let lastDay = '';
    ms.innerHTML = items.map(d => {
      const m = d.data();
      msgCache[d.id] = m;
      const mts = tsMs(m.createdAt) || m.createdAtMs || Date.now();
      const dl = dayLabel(mts);
      const sep = dl !== lastDay ? `<div class="daysep"><span>${esc(dl)}</span></div>` : '';
      lastDay = dl;
      const mine = m.senderId === me.uid;
      const isBotMsg = m.senderId === AI_BOT_ID;
      const dt = m.createdAt?.toDate ? m.createdAt.toDate() : (m.createdAtMs ? new Date(m.createdAtMs) : null);
      const tm = dt ? String(dt.getHours()).padStart(2, '0') + ':' + String(dt.getMinutes()).padStart(2, '0') : '';
      const isSel = selectedIds.has(d.id);

      if (m.deleted) {
        return `${sep}<div class="b ${mine ? 'me' : ''} ${isSel ? 'selected' : ''}" data-id="${d.id}">
          ${mine ? '' : `<div class="n">${esc(m.senderName)}</div>`}
          <span class="del">🚫 Deleted</span><span class="tm">${tm}</span></div>`;
      }

      const rxMap = m.reactions || {};
      const counts = {};
      Object.values(rxMap).forEach(em => { if (em) counts[em] = (counts[em] || 0) + 1; });
      const rxHtml = Object.keys(counts).length
        ? `<div class="reacts">${Object.entries(counts).map(([em, cnt]) => `<span class="rpill">${esc(em)}${cnt > 1 ? ' ' + cnt : ''}</span>`).join('')}</div>`
        : '';

      const safeImg = safeMedia(m.image);
      const safeAud = safeMedia(m.audio);

      let tick = '';
      let statusText = '';
      if (mine && !isAiChat) {
        const others = (a) => Array.isArray(a) && a.some(u => u !== me.uid);
        const hasOtherSeenArr = others(m.seenBy);
        const hasOtherDelivArr = others(m.deliveredTo);
        const peerSeenTs = peerUid ? tsMs(chatMeta.seenBy?.[peerUid]) : 0;
        const peerDelivTs = peerUid ? tsMs(chatMeta.deliveredBy?.[peerUid]) : 0;
        const anyOtherSeen = Object.entries(chatMeta.seenBy || {}).some(([u, t]) => u !== me.uid && tsMs(t) > 0 && tsMs(t) >= mts - 15000);
        const anyOtherDeliv = Object.entries(chatMeta.deliveredBy || {}).some(([u, t]) => u !== me.uid && tsMs(t) > 0 && tsMs(t) >= mts - 15000);
        const peerIsOnline = !!(peerUid && isOnline(peerPres));
        const isSeen = !!(hasOtherSeenArr || (peerSeenTs > 0 && peerSeenTs >= mts - 15000) || anyOtherSeen);
        const isDelivered = !!(isSeen || hasOtherDelivArr || (peerDelivTs > 0 && peerDelivTs >= mts - 15000) || anyOtherDeliv || peerIsOnline);
        statusText = isSeen ? 'Seen' : isDelivered ? 'Delivered' : 'Sent';
        tick = isSeen
          ? '<span class="tick seen" title="Seen">✓✓</span>'
          : isDelivered
            ? '<span class="tick" title="Delivered">✓✓</span>'
            : '<span class="tick" title="Sent">✓</span>';
      } else if (mine && isAiChat) {
        tick = '<span class="tick seen" title="Seen">✓✓</span>';
      }

      return `${sep}<div class="b ${mine ? 'me' : ''} ${isBotMsg ? 'botmsg' : ''} ${isSel ? 'selected' : ''} ${openId === d.id ? 'open' : ''}" data-id="${d.id}">
        ${mine ? '' : `<div class="n">${esc(m.senderName)}</div>`}
        ${m.forwarded ? '<div class="fwd">↪ Forwarded</div>' : ''}
        ${m.replyTo ? `<div class="qbox"><b>${esc(m.replyTo.senderName || 'User')}</b>${esc(m.replyTo.preview || '')}</div>` : ''}
        ${safeImg ? `<img class="zoomimg" loading="lazy" src="${esc(safeImg)}" data-cap="${esc(m.text || '')}">` : ''}
        ${safeAud ? `<audio controls preload="metadata" src="${esc(safeAud)}"></audio><button type="button" class="spdbtn" data-spd="1">1x</button>` : ''}
        ${m.text ? `<span class="txt">${formatTextWithLinks(m.text)}</span>${buildLinkPreviewHtml(m.text)}` : ''}${m.edited ? '<span class="ed">(edited)</span>' : ''}
        <span class="tm">${m.expiresAt ? '⏱ ' : ''}${tm} ${tick}</span>
        ${rxHtml}
        <div class="act">
          ${!isAiChat ? REACTIONS.map(em => `<span class="rx" data-em="${em}">${em}</span>`).join('') : ''}
          ${m.text ? `<span class="mcopy">📋 ${esc(tr('copyBtn'))}</span>` : ''}
          <span class="mrep">↩ ${esc(tr('replyBtn'))}</span>
          <span class="mstar">⭐ ${starredIds.has(d.id) ? esc(tr('unstarBtn')) : esc(tr('starBtn'))}</span>
          ${!isAiChat ? `<span class="mfwd">↪ ${esc(tr('forwardBtn'))}</span>` : ''}
          ${!isAiChat && mine && m.text ? `<span class="medit">✎ ${esc(tr('editBtn'))}</span>` : ''}
          <span class="mdel">🗑 ${esc(tr('deleteBtn'))}</span>
          ${!isAiChat && mine ? `<span class="mdela" style="color:#ef4444">All</span>` : ''}
          ${statusText ? `<span style="color:var(--sub);cursor:default">• ${statusText}</span>` : ''}
        </div>
      </div>`;
    }).join('');

    ms.querySelectorAll('.spdbtn').forEach(btn => {
      btn.onclick = e => {
        e.stopPropagation();
        const aud = btn.previousElementSibling;
        const cur = parseFloat(btn.dataset.spd || '1');
        const next = cur === 1 ? 1.5 : cur === 1.5 ? 2 : 1;
        btn.dataset.spd = String(next);
        btn.textContent = `${next}x`;
        if (aud && aud.tagName === 'AUDIO') aud.playbackRate = next;
      };
    });

    ms.querySelectorAll('.zoomimg').forEach(img => {
      img.onclick = e => { e.stopPropagation(); openLightbox(img.src, img.dataset.cap || '', false); };
    });

    const toggleSelect = id => {
      if (selectedIds.has(id)) selectedIds.delete(id);
      else selectedIds.add(id);
      renderHeaderState();
      renderMessages();
    };

    ms.querySelectorAll('.b[data-id]').forEach(b => {
      let lpTimer = null;
      let longPressed = false;
      let startX = 0, startY = 0, swipedReply = false;
      b.style.touchAction = 'pan-y';

      const onDown = e => {
        if (e.target.closest('.act') || e.target.closest('audio') || e.target.closest('a') || e.target.closest('.zoomimg') || e.target.closest('.spdbtn')) return;
        longPressed = false; swipedReply = false;
        startX = e.clientX ?? (e.touches?.[0]?.clientX || 0);
        startY = e.clientY ?? (e.touches?.[0]?.clientY || 0);
        b.style.transition = 'none';
        clearTimeout(lpTimer);
        lpTimer = setTimeout(() => {
          if (!swipedReply) {
            longPressed = true; openId = null; toggleSelect(b.dataset.id);
          }
        }, 420);
      };

      const onMove = e => {
        if (swipedReply || longPressed) return;
        const x = e.clientX ?? (e.touches?.[0]?.clientX || startX);
        const y = e.clientY ?? (e.touches?.[0]?.clientY || startY);
        const dx = x - startX; const dy = y - startY;
        if (Math.abs(dy) > 18) { clearTimeout(lpTimer); return; }
        if (Math.abs(dx) > 10) {
          clearTimeout(lpTimer);
          const clamped = Math.max(-65, Math.min(65, dx));
          b.style.transform = `translateX(${clamped}px)`;
          if (Math.abs(dx) >= 48) {
            swipedReply = true;
            b.style.transition = 'transform .18s ease';
            b.style.transform = '';
            const m = msgCache[b.dataset.id];
            if (m && !m.deleted) setReply(b.dataset.id, m.senderName || 'User', m.text || (m.audio ? '🎤 Voice message' : m.image ? '📷 Photo' : 'Message'));
          }
        }
      };

      const onEnd = () => {
        clearTimeout(lpTimer);
        b.style.transition = 'transform .18s ease';
        b.style.transform = '';
      };

      b.addEventListener('pointerdown', onDown);
      b.addEventListener('pointermove', onMove);
      b.addEventListener('pointerup', onEnd);
      b.addEventListener('pointercancel', onEnd);

      b.onclick = e => {
        if (longPressed || swipedReply) { longPressed = false; swipedReply = false; return; }
        if (e.target.closest('.act') || e.target.closest('audio') || e.target.closest('a') || e.target.closest('.zoomimg') || e.target.closest('.spdbtn')) return;
        if (selectedIds.size > 0) { toggleSelect(b.dataset.id); return; }
        b.classList.toggle('open');
        openId = b.classList.contains('open') ? b.dataset.id : null;
      };
    });

    ms.querySelectorAll('.mcopy').forEach(btn => {
      btn.onclick = async e => {
        e.stopPropagation();
        const txt = msgCache[btn.closest('.b').dataset.id]?.text || '';
        if (!txt) return;
        try { if (navigator.clipboard?.writeText) await navigator.clipboard.writeText(txt); } catch (err) {}
        toast(tr('copied'));
      };
    });
    ms.querySelectorAll('.rx').forEach(btn => {
      btn.onclick = async e => {
        e.stopPropagation();
        if (isAiChat) return;
        const id = btn.closest('.b').dataset.id;
        const em = btn.dataset.em;
        const cur = msgCache[id]?.reactions?.[me.uid];
        try { await chat.collection('messages').doc(id).update({ [`reactions.${me.uid}`]: cur === em ? firebase.firestore.FieldValue.delete() : em }); } catch (err) { toast('Action failed'); }
      };
    });
    ms.querySelectorAll('.mrep').forEach(btn => {
      btn.onclick = e => {
        e.stopPropagation();
        const id = btn.closest('.b').dataset.id;
        const m = msgCache[id];
        if (!m) return;
        setReply(id, m.senderName || 'User', m.text || (m.audio ? '🎤 Voice message' : m.image ? '📷 Photo' : 'Message'));
      };
    });
    ms.querySelectorAll('.mstar').forEach(btn => {
      btn.onclick = async e => {
        e.stopPropagation();
        const id = btn.closest('.b').dataset.id;
        const m = msgCache[id];
        if (!m) return;
        const preview = m.text || (m.audio ? '🎤 Voice message' : m.image ? '📷 Photo' : 'Message');
        const existing = myStarred().find(x => x.id === id);
        if (existing) {
          await db.collection('users').doc(me.uid).set({ starred: firebase.firestore.FieldValue.arrayRemove(existing) }, { merge: true });
          profile.starred = myStarred().filter(x => x.id !== id);
        } else {
          const entry = { id, chatId, chatTitle: document.getElementById('htitle')?.textContent || title, senderName: m.senderName || 'User', preview };
          await db.collection('users').doc(me.uid).set({ starred: firebase.firestore.FieldValue.arrayUnion(entry) }, { merge: true });
          profile.starred = [...myStarred(), entry];
        }
        renderMessages();
      };
    });
    ms.querySelectorAll('.mfwd').forEach(btn => {
      btn.onclick = e => { e.stopPropagation(); const m = msgCache[btn.closest('.b').dataset.id]; if (m) openForwardModal(m); };
    });
    ms.querySelectorAll('.medit').forEach(btn => {
      btn.onclick = async e => {
        e.stopPropagation();
        if (isAiChat) return;
        const id = btn.closest('.b').dataset.id;
        const cur = msgCache[id]?.text || '';
        const next = prompt('Edit message:', cur);
        if (next === null) return;
        const trimmed = next.trim();
        if (!trimmed || trimmed === cur) return;
        try { await chat.collection('messages').doc(id).update({ text: trimmed, edited: true }); } catch (err) { toast('Could not edit'); }
      };
    });
    ms.querySelectorAll('.mdel').forEach(btn => {
      btn.onclick = async e => {
        e.stopPropagation();
        const id = btn.closest('.b').dataset.id;
        if (isAiChat) {
          aiMessages = aiMessages.filter(x => x.id !== id);
          saveAiHistory(me?.uid, aiMessages);
          renderMessages();
          return;
        }
        try { await chat.collection('messages').doc(id).update({ hiddenFor: firebase.firestore.FieldValue.arrayUnion(me.uid) }); } catch (err) {}
      };
    });
    ms.querySelectorAll('.mdela').forEach(btn => {
      btn.onclick = async e => {
        e.stopPropagation();
        if (!confirm('Delete this message for everyone?')) return;
        const id = btn.closest('.b').dataset.id;
        try { await chat.collection('messages').doc(id).update({ text: null, image: null, audio: null, deleted: true }); } catch (err) { toast('Could not delete'); }
      };
    });

    if (atBottom || ms.dataset.init !== '1') {
      ms.scrollTop = ms.scrollHeight;
      ms.dataset.init = '1';
    }
  }

  if (isAiChat) {
    renderMessages();
  } else {
    const markRead = () => {
      if (document.hidden) return;
      const seenOk = profile?.privacy?.readReceipts !== false;
      const FVr = firebase.firestore.FieldValue;
      const nowMs = Date.now();
      lastDocs.forEach(ds => {
        const m = ds.data();
        if (m.senderId === me.uid || m.deleted) return;
        const u = {};
        if (!(m.deliveredTo || []).includes(me.uid)) u.deliveredTo = FVr.arrayUnion(me.uid);
        if (seenOk && !(m.seenBy || []).includes(me.uid)) u.seenBy = FVr.arrayUnion(me.uid);
        if (Object.keys(u).length) ds.ref.set(u, { merge: true }).catch(() => {});
      });
      const chatStatusPatch = { deliveredBy: { [me.uid]: nowMs }, unread: { [me.uid]: 0 } };
      if (seenOk) chatStatusPatch.seenBy = { [me.uid]: nowMs };
      chat.set(chatStatusPatch, { merge: true }).catch(() => {});
    };
    const onVis = () => {
      if (document.hidden) return;
      markRead();
      if ((chatMeta.unread?.[me.uid] || 0) > 0) chat.set({ unread: { [me.uid]: 0 } }, { merge: true }).catch(() => {});
    };
    document.addEventListener('visibilitychange', onVis);
    addSub(() => document.removeEventListener('visibilitychange', onVis));

    if (peerUid) {
      addSub(db.collection('users').doc(peerUid).onSnapshot(d => {
        if (d.exists) {
          peerUser = d.data();
          userProfilesCache[peerUid] = peerUser;
          const chav = document.getElementById('chav');
          const curTitle = document.getElementById('htitle')?.textContent || title;
          if (chav && peerUser.photo) chav.innerHTML = avHtml(peerUser.photo, curTitle, false);
          updateHeaderSub();
          renderMessages();
        }
      }, () => {}));
      addSub(db.collection('presence').doc(peerUid).onSnapshot(d => {
        peerPres = d.exists ? d.data() : null;
        updateHeaderSub();
        renderMessages();
      }, () => {}));
    }

    addSub(chat.onSnapshot(d => {
      if (!d.exists) return;
      chatMeta = d.data();
      const tEl = document.getElementById('htitle');
      if (!peerUid && chatMeta.name && tEl) tEl.textContent = chatMeta.name;
      typingNames = Object.entries(chatMeta.typing || {})
        .filter(([u, v]) => u !== me.uid && isTyping(v))
        .map(([u]) => chatMeta.memberNames?.[u] || 'Someone');
      clearTimeout(typingClear);
      if (typingNames.length) typingClear = setTimeout(() => { typingNames = []; updateHeaderSub(); }, 6500);
      updateHeaderSub();
      if (!document.hidden) {
        if ((chatMeta.unread?.[me.uid] || 0) > 0) chat.set({ unread: { [me.uid]: 0 } }, { merge: true }).catch(() => {});
        if (lastDocs.length) markRead();
      }
      const sig = JSON.stringify([tsMs(chatMeta.deletedAt?.[me.uid]), chatMeta.wallpaperBy?.[me.uid] || null, chatMeta.pinnedMessage || null, chatMeta.name || '', chatMeta.disappearHours || 0, chatMeta.members || [], !!chatMeta.mutedBy?.[me.uid], !!chatMeta.archivedBy?.[me.uid], chatMeta.unread || {}, chatMeta.seenBy || {}, chatMeta.deliveredBy || {}]);
      if (sig === lastSig) return;
      lastSig = sig;
      applyChatWallpaper();
      if (pinslot) {
        const pin = chatMeta.pinnedMessage;
        pinslot.innerHTML = (!pin || !pin.id) ? '' : `<div class="pinbar" id="pinjump">
          <span>📌</span><span class="ptxt"><b>${esc(pin.senderName || 'User')}:</b> ${esc(pin.preview || '')}</span>
          <button class="btn sm" id="pinun" style="padding:3px 8px;font-size:11px">${esc(tr('unpinBtn'))}</button>
        </div>`;
        const pj = document.getElementById('pinjump');
        if (pj) pj.onclick = e => { if (e.target.id !== 'pinun') jumpAndHighlightMsg(pin.id); };
        const pu = document.getElementById('pinun');
        if (pu) pu.onclick = async e => { e.stopPropagation(); await chat.set({ pinnedMessage: null }, { merge: true }); };
      }
      renderMessages();
    }, () => { toast('You no longer have access to this chat'); home('chats', false); }));

    addSub(chat.collection('messages').orderBy('createdAt').limitToLast(40).onSnapshot(snap => {
      lastDocs = snap.docs;
      renderMessages();
      markRead();
    }));
    const expTimer = setInterval(() => { if (lastDocs.some(d => { const x = d.data().expiresAt; return x && Date.now() > x; })) renderMessages(); }, 20000);
    addSub(() => clearInterval(expTimer));
  }

  async function send(text, image, audio, audioMime) {
    if (isAiChat) {
      const rep = replyTarget ? { ...replyTarget } : null;
      clearReply();
      const userMsg = {
        id: 'u_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
        senderId: me.uid,
        senderName: myName(),
        text,
        replyTo: rep,
        createdAtMs: Date.now()
      };
      aiMessages.push(userMsg);
      saveAiHistory(me?.uid, aiMessages);
      renderMessages();

      typingNames = [AI_BOT_NAME];
      updateHeaderSub();
      setTimeout(() => {
        const botMsg = {
          id: 'b_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
          senderId: AI_BOT_ID,
          senderName: AI_BOT_NAME,
          text: generateFreeAiReply(text, myName()),
          createdAtMs: Date.now()
        };
        aiMessages.push(botMsg);
        saveAiHistory(me?.uid, aiMessages);
        typingNames = [];
        updateHeaderSub();
        renderMessages();
        if (currentOpenChatId === chatId) playAlertBeep(780, 0.1);
      }, 450);
      return;
    }

    if (peerUid && myBlocked().includes(peerUid)) throw new Error('User is blocked');
    const FV = firebase.firestore.FieldValue;
    const rep = replyTarget ? { ...replyTarget } : null;
    clearReply();
    await chat.collection('messages').add({
      senderId: me.uid, senderName: myName(),
      text: text || null, image: image || null,
      audio: audio || null, audioMime: audioMime || null,
      replyTo: rep, reactions: {}, hiddenFor: [],
      expiresAt: (chatMeta.disappearHours || 0) > 0 ? Date.now() + chatMeta.disappearHours * 3600000 : null,
      edited: false, deleted: false,
      deliveredTo: [me.uid], seenBy: [me.uid],
      createdAtMs: Date.now(),
      createdAt: FV.serverTimestamp()
    });
    const last = audio ? '🎤 Voice message' : image ? '📷 Photo' : text;
    const unread = {};
    (chatMeta.members || []).forEach(u => { if (u !== me.uid) unread[u] = FV.increment(1); });
    isTypingNow = false;
    const nowSendMs = Date.now();
    await chat.set({
      lastMessage: last, lastSender: me.uid, updatedAt: FV.serverTimestamp(),
      typing: { [me.uid]: 0 }, unread, deliveredBy: { [me.uid]: nowSendMs },
      archivedBy: { [me.uid]: false }
    }, { merge: true });
  }

  document.querySelectorAll('#qchips .qchip').forEach(qc => {
    qc.onclick = async () => {
      try { await send(qc.dataset.q); } catch (e) { toast(e.message); }
    };
  });

  document.getElementById('reccncl').onclick = cancelRec;
  document.getElementById('recstop').onclick = () => { if (rec && rec.state !== 'inactive') { try { rec.stop(); } catch (e) {} } };
  bindChatHeaderEvents();

  function createRecorder(stream) {
    const candidates = ['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4', 'audio/ogg;codecs=opus'];
    const supported = candidates.find(t => typeof MediaRecorder.isTypeSupported === 'function' && MediaRecorder.isTypeSupported(t));
    try {
      return supported ? { recorder: new MediaRecorder(stream, { mimeType: supported }), mime: supported } : { recorder: new MediaRecorder(stream), mime: 'audio/webm' };
    } catch (e) { return { recorder: new MediaRecorder(stream), mime: 'audio/webm' }; }
  }

  const micBtn = document.getElementById('mic');
  if (micBtn) {
    micBtn.onclick = async () => {
      if (rec && rec.state !== 'inactive') {
        try { rec.stop(); } catch (e) { cleanupRec(); }
        return;
      }
      try {
        discardRec = false;
        if (!navigator.mediaDevices?.getUserMedia || typeof MediaRecorder === 'undefined') {
          throw new Error('Voice recording unavailable in this browser.');
        }
        recStream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } });
        const built = createRecorder(recStream);
        rec = built.recorder;
        activeAudioMime = built.mime || rec.mimeType || 'audio/webm';
        recChunks = [];

        rec.ondataavailable = e => { if (e.data && e.data.size > 0) recChunks.push(e.data); };
        rec.onerror = () => { toast('Recording error'); cancelRec(); };
        rec.onstop = async () => {
          const finalMime = rec?.mimeType || activeAudioMime || 'audio/webm';
          const blob = new Blob(recChunks, { type: finalMime });
          const wasDiscarded = discardRec;
          cleanupRec();
          if (wasDiscarded) return;
          if (!blob.size || blob.size < 200) { toast('Voice clip too short'); return; }
          try {
            const dataUrl = await prepareFreeMedia(blob, 'voice');
            await send(null, null, dataUrl, finalMime);
            toast(tr('voiceSent'));
          } catch (ex) { toast(ex.message || 'Voice send failed'); }
        };

        rec.start(250);
        recbar.classList.add('on');
        secCounter = 0;
        rectm.textContent = '00:00';
        recTimer = setInterval(() => {
          secCounter += 1;
          rectm.textContent = fmtSec(secCounter);
          if (secCounter >= MAX_FREE_VOICE_SEC && rec && rec.state !== 'inactive') {
            try { rec.stop(); } catch (e) {}
          }
        }, 1000);
      } catch (ex) {
        cancelRec();
        toast(ex?.name === 'NotAllowedError' ? 'Microphone permission blocked.' : (ex?.message || 'Mic error'));
      }
    };
  }

  const sendText = async () => {
    const t = tx.value.trim(); if (!t) return;
    tx.value = '';
    autosize();
    setDraft(chatId, '');
    ep.classList.remove('on');
    try { await send(t); } catch (e) { toast(e.message); }
  };
  document.getElementById('sd').onclick = sendText;
  tx.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendText(); } });

  const phBtn = document.getElementById('ph');
  const fiEl = document.getElementById('fi');
  if (phBtn && fiEl) {
    phBtn.onclick = () => fiEl.click();
    fiEl.onchange = async e => {
      const f = e.target.files[0]; if (!f) return;
      try {
        if (!f.type.startsWith('image/')) throw new Error('Select a valid image');
        const small = await shrink(f, 300, 0.4);
        const dataUrl = await prepareFreeMedia(small.dataUrl, 'image');
        await send(null, dataUrl, null, null);
        toast(tr('photoSent'));
      } catch (ex) { toast(ex.message || 'Photo send failed'); }
      e.target.value = '';
    };
  }

  const camBtn = document.getElementById('cambtn');
  if (camBtn) {
    camBtn.onclick = () => {
      openCameraModal(async dataUrl => {
        try {
          const cleanUrl = await prepareFreeMedia(dataUrl, 'image');
          await send(null, cleanUrl, null, null);
          toast(tr('photoSent'));
        } catch (ex) { toast(ex.message || 'Camera send failed'); }
      });
    };
  }
}

function shrink(file, max = 300, quality = 0.4) {
  return new Promise((res, rej) => {
    const img = new Image();
    const objUrl = URL.createObjectURL(file);
    img.onload = () => {
      URL.revokeObjectURL(objUrl);
      const s = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * s);
      c.height = Math.round(img.height * s);
      const ctx = c.getContext('2d');
      if (!ctx) return rej(new Error('Image process failed'));
      ctx.drawImage(img, 0, 0, c.width, c.height);
      res({ dataUrl: c.toDataURL('image/jpeg', quality) });
    };
    img.onerror = () => { URL.revokeObjectURL(objUrl); rej(new Error('Image load failed')); };
    img.src = objUrl;
  });
}
</script>
