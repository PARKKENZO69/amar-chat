<script>
/* ======= APNAR FIREBASE CONFIG ======= */
const firebaseConfig = {
  apiKey: "AIzaSyCeiAsogvltOOYjde5uNL8NDStRT2ddfz4",
  authDomain: "amar-chat-f9870.firebaseapp.com",
  projectId: "amar-chat-f9870",
  storageBucket: "amar-chat-f9870.firebasestorage.app",
  messagingSenderId: "125656305932",
  appId: "1:125656305932:web:c3fabc5da8929a7874f929"
};
/* ===================================== */

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();
const storage = firebase.storage();
const USE_STORAGE = false;
const $app = document.getElementById('app');

let me = null, profile = null, unsubs = [], callWatchUnsub = null, msgAlertUnsub = null;
let signingUp = false, presenceTimer = null, presenceCleanup = null, ringingCallId = null, ringTimer = null, pendingCands = [];
let currentOpenChatId = null, appUnlocked = false;
const notifiedMsgIds = new Set();
const mutedChatIds = new Set();
const userProfilesCache = {};

const EMOJIS = ['😊','😂','❤️','👍','🙏','🔥','😍','😢','😮','🎉','👏','😎','💯','🤔','🥳','💔','🌹','☀️','✨','🙌'];
const REACTIONS = ['👍','❤️','😂','😮','😢','🙏'];
const RTC_CFG = {
  iceServers: [
    { urls: 'stun:stun.l.google.com:19302' },
    { urls: 'stun:stun1.l.google.com:19302' },
    { urls: 'stun:stun2.l.google.com:19302' }
  ],
  iceCandidatePoolSize: 10
};

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const addSub = fn => { if (typeof fn === 'function') unsubs.push(fn); };
const stop = () => {
  currentOpenChatId = null;
  unsubs.forEach(fn => { try { fn(); } catch (e) {} });
  unsubs = [];
};
const myName = () => (profile && profile.name) || me?.displayName || 'User';
const myBlocked = () => Array.isArray(profile?.blocked) ? profile.blocked : [];
const myStarred = () => Array.isArray(profile?.starred) ? profile.starred : [];
const showLastSeenPref = () => profile?.privacy?.lastSeen !== false;
const sendReceiptsPref = () => profile?.privacy?.readReceipts !== false;
const UN_RE = /^[a-z0-9_]{3,20}$/;
const normUn = s => String(s || '').trim().toLowerCase().replace(/^@/, '');
const UN_HELP = 'Username e shudhu english okkhor, songkha ar _ hote pare (3 theke 20 ta). Phone number o dite paren (shudhu songkha).';
const MEDIA_OK = /^(data:(image|audio)\/[a-z0-9.+-]+(;[^;,]+)*;base64,|https:\/\/firebasestorage\.googleapis\.com\/)/i;
const DOC_OK = /^(data:[a-z0-9.+-]+\/[a-z0-9.+-]+(;[^;,]+)*;base64,|https:\/\/firebasestorage\.googleapis\.com\/)/i;
const safeMedia = u => (typeof u === 'string' && MEDIA_OK.test(u)) ? u : '';
const safeDoc = u => (typeof u === 'string' && DOC_OK.test(u)) ? u : '';
const isOnline = p => !!(p && p.online && p.lastSeen && p.lastSeen.toMillis && (Date.now() - p.lastSeen.toMillis() < 120000));
const isTyping = v => typeof v === 'number' && v > 0 && (Date.now() - v) < 6000;
const tsMs = ts => ts && ts.toMillis ? ts.toMillis() : (typeof ts === 'number' ? ts : 0);

function avHtml(photo, fallbackChar, isGroup = false) {
  const safe = safeMedia(photo);
  if (safe) return `<img src="${esc(safe)}" alt="">`;
  return isGroup ? '👥' : esc((fallbackChar || '?')[0]?.toUpperCase() || '?');
}

function toast(msg) {
  const old = document.querySelector('.toast');
  if (old) old.remove();
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 2600);
}

function openLightbox(src, caption = '', textOnly = false) {
  const lb = document.createElement('div');
  lb.className = 'lbox';
  if (textOnly) {
    lb.innerHTML = `
      <button class="lclose" title="Close">✕</button>
      <div class="sttxt">${esc(src)}</div>
      ${caption ? `<div class="lcap">${esc(caption)}</div>` : ''}`;
  } else {
    const safe = safeMedia(src);
    if (!safe) return;
    lb.innerHTML = `
      <button class="lclose" title="Close">✕</button>
      <img src="${esc(safe)}" alt="">
      ${caption ? `<div class="lcap">${esc(caption)}</div>` : ''}`;
  }
  document.body.appendChild(lb);
  const close = () => lb.remove();
  lb.querySelector('.lclose').onclick = close;
  lb.onclick = e => { if (e.target === lb) close(); };
}

/* ---------- PIN LOCK SCREEN ---------- */
function pinLockView(onSuccess) {
  stop();
  $app.innerHTML = `
    <div class="auth">
      <h1>🔐 Chat Lock</h1>
      <p class="hint" style="text-align:center">App khulte apnar 4-6 digit PIN din.</p>
      <input type="password" id="pinin" placeholder="PIN din" maxlength="6" inputmode="numeric">
      <p class="err" id="pinerr"></p>
      <button class="btn" id="pinok">Unlock</button>
      <button class="link" id="pinlo">Logout</button>
    </div>`;
  document.getElementById('pinlo').onclick = () => auth.signOut();
  const check = () => {
    const val = document.getElementById('pinin').value.trim();
    if (val === String(profile?.pinCode || '')) {
      appUnlocked = true;
      onSuccess();
    } else {
      document.getElementById('pinerr').textContent = 'Vul PIN! Abar chesta korun.';
    }
  };
  document.getElementById('pinok').onclick = check;
  document.getElementById('pinin').addEventListener('keydown', e => { if (e.key === 'Enter') check(); });
}

/* ---------- NOTIFICATION & ALERT SOUND ---------- */
function playAlertBeep(freq = 740, duration = 0.18) {
  try {
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    if (!AudioCtx) return;
    const ctx = new AudioCtx();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.08, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + duration);
    setTimeout(() => ctx.close().catch(() => {}), (duration + 0.1) * 1000);
  } catch (e) {}
}

async function ensureNotifPermission() {
  try {
    if ('Notification' in window && Notification.permission === 'default') {
      await Notification.requestPermission();
    }
  } catch (e) {}
}

function triggerNotification(title, body, isCall = false) {
  playAlertBeep(isCall ? 880 : 660, isCall ? 0.3 : 0.16);
  toast(`${title}: ${body}`);
  try {
    if ('Notification' in window && Notification.permission === 'granted' && (document.hidden || isCall)) {
      const n = new Notification(title, { body });
      n.onclick = () => { window.focus(); n.close(); };
    }
  } catch (e) {}
}

function watchChatNotifications() {
  if (msgAlertUnsub) { msgAlertUnsub(); msgAlertUnsub = null; }
  if (!me) return;
  const perChatUnsubs = {};

  msgAlertUnsub = db.collection('chats').where('members', 'array-contains', me.uid).onSnapshot(snap => {
    const activeIds = new Set();
    mutedChatIds.clear();
    snap.docs.forEach(d => {
      const cid = d.id;
      const cdata = d.data();
      if (cdata.mutedBy?.[me.uid]) mutedChatIds.add(cid);
      activeIds.add(cid);
      if (!perChatUnsubs[cid]) {
        let firstSnap = true;
        perChatUnsubs[cid] = d.ref.collection('messages').orderBy('createdAt', 'desc').limit(5).onSnapshot(mSnap => {
          if (firstSnap) {
            firstSnap = false;
            mSnap.docs.forEach(md => notifiedMsgIds.add(md.id));
            return;
          }
          mSnap.docChanges().forEach(ch => {
            if (ch.type !== 'added') return;
            const mid = ch.doc.id;
            if (notifiedMsgIds.has(mid)) return;
            notifiedMsgIds.add(mid);
            const m = ch.doc.data();
            if (!m || m.senderId === me.uid || m.deleted) return;
            if (myBlocked().includes(m.senderId)) return;
            if (mutedChatIds.has(cid)) return;
            if (currentOpenChatId === cid && !document.hidden) return;
            const preview = m.text || (m.docName ? `📄 ${m.docName}` : m.audio ? '🎤 Voice message' : m.image ? '📷 Photo' : 'Notun message');
            triggerNotification(m.senderName || 'Amar Chat', preview, false);
          });
        }, () => {});
      }
    });
    Object.keys(perChatUnsubs).forEach(cid => {
      if (!activeIds.has(cid)) {
        try { perChatUnsubs[cid](); } catch (e) {}
        delete perChatUnsubs[cid];
      }
    });
  }, () => {});
}

/* ---------- WEBRTC AUDIO + VIDEO CALL ENGINE + CALL LOG ---------- */
let pc = null, localStream = null, remoteStream = null, activeCallId = null, callUnsubs = [], micMuted = false, camOff = false;
let currentCallMeta = null, isSettingRemote = false;

const $cs = document.getElementById('callscreen');
const $cname = document.getElementById('cname');
const $cst = document.getElementById('cst');
const $cav = document.getElementById('cav');
const $remV = document.getElementById('remV');
const $remA = document.getElementById('remA');
const $locV = document.getElementById('locV');
const $cacts = document.getElementById('cacts');

async function logCallHistory(peerUid, peerName, isVideo, direction, outcome) {
  if (!me || !peerUid) return;
  try {
    await db.collection('users').doc(me.uid).collection('callLogs').add({
      peerUid,
      peerName: peerName || 'User',
      isVideo: !!isVideo,
      direction,
      outcome,
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });
  } catch (e) {}
}

function clearCallSubs() {
  callUnsubs.forEach(fn => { try { fn(); } catch (e) {} });
  callUnsubs = [];
}

function showCallUI(peerName, statusText, isVideo, mode) {
  $cname.textContent = peerName || 'User';
  $cst.textContent = statusText;
  $cav.textContent = (peerName || '?')[0]?.toUpperCase() || '?';
  $cav.style.display = isVideo ? 'none' : 'flex';
  $remV.style.display = isVideo ? 'block' : 'none';
  $locV.style.display = isVideo ? 'block' : 'none';
  $cs.classList.add('on');

  if (mode === 'incoming') {
    $cacts.innerHTML = `
      <button class="cbtn end" id="cdec" title="Decline">✕</button>
      <button class="cbtn acc" id="cacc" title="Accept">📞</button>`;
  } else {
    $cacts.innerHTML = `
      <button class="cbtn" id="cmute" title="Mute">🎤</button>
      ${isVideo ? '<button class="cbtn" id="ccam" title="Camera">📹</button>' : ''}
      <button class="cbtn end" id="chang" title="End Call">📞✕</button>`;
    document.getElementById('cmute').onclick = () => {
      if (!localStream) return;
      micMuted = !micMuted;
      localStream.getAudioTracks().forEach(t => t.enabled = !micMuted);
      const b = document.getElementById('cmute');
      b.classList.toggle('off', micMuted);
      b.textContent = micMuted ? '🔇' : '🎤';
    };
    const ccam = document.getElementById('ccam');
    if (ccam) {
      ccam.onclick = () => {
        if (!localStream) return;
        camOff = !camOff;
        localStream.getVideoTracks().forEach(t => t.enabled = !camOff);
        ccam.classList.toggle('off', camOff);
        ccam.textContent = camOff ? '📷✕' : '📹';
      };
    }
    document.getElementById('chang').onclick = () => endCall(true);
  }
}

function hideCallUI() {
  $cs.classList.remove('on');
  $cacts.innerHTML = '';
  $remV.srcObject = null;
  $remA.srcObject = null;
  $locV.srcObject = null;
}

async function endCall(updateRemote = true) {
  const cid = activeCallId;
  const meta = currentCallMeta;
  activeCallId = null;
  currentCallMeta = null;
  ringingCallId = null;
  isSettingRemote = false;
  clearTimeout(ringTimer); ringTimer = null;
  micMuted = false;
  camOff = false;
  pendingCands = [];
  clearCallSubs();
  if (pc) { try { pc.close(); } catch (e) {} pc = null; }
  if (localStream) { localStream.getTracks().forEach(t => t.stop()); localStream = null; }
  remoteStream = null;
  hideCallUI();
  if (meta) {
    await logCallHistory(meta.peerUid, meta.peerName, meta.isVideo, meta.direction, meta.outcome || 'completed');
  }
  if (updateRemote && cid && me) {
    try {
      await db.collection('calls').doc(cid).update({
        status: 'ended',
        endedBy: me.uid,
        endedAt: firebase.firestore.FieldValue.serverTimestamp()
      });
    } catch (e) {}
  }
}

async function flushCands() {
  if (!pc || !pc.remoteDescription || !pc.remoteDescription.type) return;
  const list = pendingCands.splice(0, pendingCands.length);
  for (const c of list) {
    try { await pc.addIceCandidate(new RTCIceCandidate(c)); } catch (e) {}
  }
}

function attachRemoteTrack(track, stream) {
  if (!remoteStream) remoteStream = new MediaStream();
  if (stream && stream.getTracks) {
    stream.getTracks().forEach(t => {
      if (!remoteStream.getTracks().some(rt => rt.id === t.id)) remoteStream.addTrack(t);
    });
  } else if (track && !remoteStream.getTracks().some(rt => rt.id === track.id)) {
    remoteStream.addTrack(track);
  }
  $remA.srcObject = remoteStream;
  $remA.muted = false;
  $remA.volume = 1.0;
  $remA.play().catch(() => {});

  const hasVid = (track && track.kind === 'video') || remoteStream.getVideoTracks().length > 0;
  if (hasVid) {
    $cav.style.display = 'none';
    $remV.style.display = 'block';
    $remV.srcObject = remoteStream;
    $remV.muted = false;
    $remV.volume = 1.0;
    $remV.play().catch(() => {});
  }
}

async function setupPeer(callDocRef, isCaller, isVideo) {
  pendingCands = [];
  isSettingRemote = false;
  pc = new RTCPeerConnection(RTC_CFG);
  remoteStream = new MediaStream();
  $remA.srcObject = remoteStream;
  $remA.muted = false;
  $remV.srcObject = remoteStream;
  $remV.muted = false;

  try {
    localStream = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true },
      video: isVideo ? { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } } : false
    });
  } catch (err) {
    if (isVideo) {
      toast('Camera payni, audio call-e chesta korchi...');
      localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
      isVideo = false;
      $cav.style.display = 'flex';
      $remV.style.display = 'none';
      $locV.style.display = 'none';
    } else {
      throw err;
    }
  }

  localStream.getTracks().forEach(track => pc.addTrack(track, localStream));
  if (isVideo) {
    $locV.srcObject = localStream;
    $locV.muted = true;
    $locV.play().catch(() => {});
  }

  pc.ontrack = e => {
    attachRemoteTrack(e.track, e.streams && e.streams[0]);
    const hasVid = remoteStream.getVideoTracks().length > 0;
    $cst.textContent = hasVid ? '📹 Video call connected' : '🔊 Audio call connected';
  };

  pc.oniceconnectionstatechange = () => {
    if (!pc) return;
    if (pc.iceConnectionState === 'connected' || pc.iceConnectionState === 'completed') {
      $remA.play().catch(() => {});
      if ($remV.srcObject && remoteStream.getVideoTracks().length) $remV.play().catch(() => {});
      $cst.textContent = remoteStream.getVideoTracks().length ? '📹 Video call connected' : '🔊 Audio call connected';
    } else if (pc.iceConnectionState === 'failed') {
      toast('Network / ICE connection fail koreche');
      endCall(true);
    }
  };

  pc.onconnectionstatechange = () => {
    if (!pc) return;
    if (pc.connectionState === 'connected') {
      $remA.play().catch(() => {});
      if ($remV.srcObject && remoteStream.getVideoTracks().length) $remV.play().catch(() => {});
      $cst.textContent = remoteStream.getVideoTracks().length ? '📹 Video call connected' : '🔊 Audio call connected';
    } else if (pc.connectionState === 'disconnected') {
      $cst.textContent = 'Connection interrupted...';
    } else if (pc.connectionState === 'failed') {
      toast('Call connect hoyni (network shomossha)');
      endCall(true);
    }
  };

  const candCol = callDocRef.collection(isCaller ? 'callerCandidates' : 'calleeCandidates');
  const remoteCandCol = callDocRef.collection(isCaller ? 'calleeCandidates' : 'callerCandidates');

  pc.onicecandidate = e => {
    if (e.candidate) candCol.add(e.candidate.toJSON()).catch(() => {});
  };

  const unsubCands = remoteCandCol.onSnapshot(snap => {
    snap.docChanges().forEach(ch => {
      if (ch.type === 'added') pendingCands.push(ch.doc.data());
    });
    flushCands();
  }, () => {});
  callUnsubs.push(unsubCands);

  let seen = false;
  const unsubDoc = callDocRef.onSnapshot(snap => {
    if (!snap.exists) { if (seen) endCall(false); return; }
    seen = true;
    const d = snap.data();
    if (d.status === 'ended' || d.status === 'declined') {
      if (currentCallMeta) currentCallMeta.outcome = d.status === 'declined' ? 'declined' : 'completed';
      toast(d.status === 'declined' ? 'Call decline kora hoyeche' : 'Call sesh hoyeche');
      endCall(false);
    }
  }, () => {});
  callUnsubs.push(unsubDoc);
}

async function startCall(peerUid, peerName, isVideo) {
  if (!me || !peerUid) return;
  if (myBlocked().includes(peerUid)) { toast('Apni ei user-ke block kore rekhechen'); return; }
  if (activeCallId || ringingCallId) { toast('Agei ekta call cholche'); return; }
  if (!navigator.mediaDevices?.getUserMedia || !window.RTCPeerConnection) {
    toast('Ei browser-e call supported noy'); return;
  }
  await ensureNotifPermission();
  const callDoc = db.collection('calls').doc();
  activeCallId = callDoc.id;
  currentCallMeta = { peerUid, peerName, isVideo: !!isVideo, direction: 'outgoing', outcome: 'outgoing' };
  showCallUI(peerName, isVideo ? '📹 Video call korchi...' : '📞 Audio call korchi...', isVideo, 'active');

  try {
    await setupPeer(callDoc, true, isVideo);
    const offer = await pc.createOffer({ offerToReceiveAudio: true, offerToReceiveVideo: !!isVideo });
    await pc.setLocalDescription(offer);
    await callDoc.set({
      callerId: me.uid,
      callerName: myName(),
      calleeId: peerUid,
      calleeName: peerName,
      participants: [me.uid, peerUid],
      isVideo: !!isVideo,
      status: 'ringing',
      offer: { type: offer.type, sdp: offer.sdp },
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });

    const unsubAns = callDoc.onSnapshot(async snap => {
      if (!snap.exists || !pc || isSettingRemote) return;
      const d = snap.data();
      if (d.answer && d.answer.sdp && !pc.remoteDescription) {
        isSettingRemote = true;
        if (currentCallMeta) currentCallMeta.outcome = 'connected';
        try {
          await pc.setRemoteDescription(new RTCSessionDescription(d.answer));
          $cst.textContent = 'Connecting...';
          await flushCands();
        } catch (e) {
          console.warn('setRemoteDescription answer err:', e);
        } finally {
          isSettingRemote = false;
        }
      }
    }, () => {});
    callUnsubs.push(unsubAns);

    const myCallId = callDoc.id;
    ringTimer = setTimeout(() => {
      if (activeCallId === myCallId && pc && !pc.remoteDescription) {
        if (currentCallMeta) currentCallMeta.outcome = 'no_answer';
        toast('Keu call dhorenni');
        endCall(true);
      }
    }, 45000);
  } catch (e) {
    toast('Call shuru kora jayni: ' + (e.message || 'Permission / Device error'));
    endCall(true);
  }
}

async function acceptCall(callData, callDoc) {
  if (activeCallId) return;
  if (!callData?.offer?.sdp) {
    toast('Call offer pawa jayni');
    ringingCallId = null;
    hideCallUI();
    return;
  }
  const isVideo = !!callData.isVideo;
  ringingCallId = null;
  activeCallId = callDoc.id;
  currentCallMeta = {
    peerUid: callData.callerId,
    peerName: callData.callerName || 'User',
    isVideo,
    direction: 'incoming',
    outcome: 'answered'
  };
  showCallUI(callData.callerName || 'User', 'Connecting...', isVideo, 'active');

  try {
    await setupPeer(callDoc, false, isVideo);
    isSettingRemote = true;
    await pc.setRemoteDescription(new RTCSessionDescription(callData.offer));
    isSettingRemote = false;
    await flushCands();
    const answer = await pc.createAnswer();
    await pc.setLocalDescription(answer);
    await callDoc.update({
      status: 'accepted',
      answer: { type: answer.type, sdp: answer.sdp }
    });
  } catch (e) {
    toast('Call receive kora jayni: ' + (e.message || 'Permission / Device error'));
    endCall(true);
  }
}

function listenIncomingCalls() {
  if (callWatchUnsub) { callWatchUnsub(); callWatchUnsub = null; }
  if (!me) return;
  callWatchUnsub = db.collection('calls')
    .where('calleeId', '==', me.uid)
    .onSnapshot(snap => {
      snap.docChanges().forEach(ch => {
        const id = ch.doc.id;
        const d = ch.doc.data() || {};

        if (ch.type === 'removed' || (d.status && d.status !== 'ringing')) {
          if (ringingCallId === id) {
            ringingCallId = null;
            if (!activeCallId) hideCallUI();
          }
          return;
        }

        if (d.status !== 'ringing' || activeCallId || ringingCallId) return;
        if (myBlocked().includes(d.callerId)) return;

        const t = d.createdAt && d.createdAt.toMillis ? d.createdAt.toMillis() : Date.now();
        if (Date.now() - t > 120000) return;

        const docRef = ch.doc.ref;
        ringingCallId = id;
        triggerNotification(
          d.callerName || 'Amar Chat',
          d.isVideo ? '📹 Incoming Video Call...' : '📞 Incoming Audio Call...',
          true
        );
        showCallUI(
          d.callerName || 'User',
          d.isVideo ? '📹 Incoming Video Call...' : '📞 Incoming Audio Call...',
          !!d.isVideo,
          'incoming'
        );

        const decBtn = document.getElementById('cdec');
        const accBtn = document.getElementById('cacc');
        if (decBtn) {
          decBtn.onclick = async () => {
            ringingCallId = null;
            await logCallHistory(d.callerId, d.callerName || 'User', !!d.isVideo, 'incoming', 'missed');
            try { await docRef.update({ status: 'declined' }); } catch (e) {}
            hideCallUI();
          };
        }
        if (accBtn) {
          accBtn.onclick = () => acceptCall(d, docRef);
        }
      });
    }, err => {
      console.warn('Call listen error:', err);
      toast('Incoming call listener error: ' + (err.message || err.code));
    });
}

/* ---------- ONLINE STATUS (presence) ---------- */
async function setOnline(online) {
  if (!me || !profile) return;
  try {
    await db.collection('presence').doc(me.uid).set({
      online: !!online,
      lastSeen: firebase.firestore.FieldValue.serverTimestamp()
    }, { merge: true });
  } catch (e) {}
}

function startPresence() {
  stopPresence();
  const visible = () => document.visibilityState === 'visible';
  setOnline(visible());
  presenceTimer = setInterval(() => { if (visible()) setOnline(true); }, 45000);
  const onVis = () => setOnline(visible());
  const onOff = () => setOnline(false);
  document.addEventListener('visibilitychange', onVis);
  window.addEventListener('pagehide', onOff);
  presenceCleanup = () => {
    document.removeEventListener('visibilitychange', onVis);
    window.removeEventListener('pagehide', onOff);
  };
}

function stopPresence() {
  if (presenceTimer) { clearInterval(presenceTimer); presenceTimer = null; }
  if (presenceCleanup) { presenceCleanup(); presenceCleanup = null; }
}

function fmtStatus(p, canSee = true) {
  if (!canSee || !p) return '';
  if (isOnline(p)) return '🟢 Online';
  const d = p.lastSeen?.toDate?.();
  if (!d) return '';
  const hh = String(d.getHours()).padStart(2, '0');
  const mm = String(d.getMinutes()).padStart(2, '0');
  return `Last seen ${hh}:${mm}`;
}

auth.onAuthStateChanged(async u => {
  me = u; stop(); stopPresence(); appUnlocked = false;
  if (callWatchUnsub) { callWatchUnsub(); callWatchUnsub = null; }
  if (msgAlertUnsub) { msgAlertUnsub(); msgAlertUnsub = null; }
  await endCall(false);
  if (!u) { profile = null; authView(true); return; }
  if (signingUp) return;
  gate();
});

function gate() {
  if (!me.emailVerified) verifyView(); else route();
}

/* ---------- EMAIL VERIFY ---------- */
function verifyView(msg = '', good = false) {
  stop();
  $app.innerHTML = `
    <div class="auth">
      <h1>📧 Email verify korun</h1>
      <p class="hint">Apnar email <b>${esc(me.email)}</b> e ekta link pathano hoyeche. Email kholun (Spam folder o dekhun), link e chapun. Tarpor niche button chapun.</p>
      ${msg ? `<p class="${good ? 'ok' : 'err'}">${esc(msg)}</p>` : ''}
      <button class="btn" id="ok">Ami verify korechi</button>
      <button class="link" id="rs">Abar email pathan</button>
      <button class="link" id="lo">Logout</button>
    </div>`;
  document.getElementById('lo').onclick = () => auth.signOut();
  document.getElementById('rs').onclick = async () => {
    try { await me.sendEmailVerification(); verifyView('Notun email pathano hoyeche.', true); }
    catch (ex) { verifyView(ex.message); }
  };
  document.getElementById('ok').onclick = async () => {
    try {
      await me.reload();
      if (me.emailVerified) { await me.getIdToken(true); route(); }
      else verifyView('Ekhono verify hoyni. Email er link e chapun, tarpor abar chesta korun.');
    } catch (ex) { verifyView(ex.message); }
  };
}

async function route() {
  try {
    const d = await db.collection('users').doc(me.uid).get();
    if (d.exists && d.data().username) {
      profile = d.data();
      ensureNotifPermission();
      startPresence();
      listenIncomingCalls();
      watchChatNotifications();
      const afterUnlock = () => home('chats', false);
      if (profile.pinCode && !appUnlocked) pinLockView(afterUnlock);
      else afterUnlock();
    } else {
      usernameSetup();
    }
  } catch (e) {
    $app.innerHTML = `<div class="empty">Error: ${esc(e.message)}</div>`;
  }
}

async function claimUsername(username, name) {
  const baseDoc = {
    uid: me.uid, name, username,
    about: 'Hey there! I am using Amar Chat.',
    photo: '', blocked: [], starred: [], pinCode: '',
    privacy: { lastSeen: true, readReceipts: true }
  };
  const batch = db.batch();
  batch.set(db.collection('usernames').doc(username), { uid: me.uid, name });
  batch.set(db.collection('users').doc(me.uid), baseDoc, { merge: true });
  await batch.commit();
  profile = baseDoc;
}

/* ---------- LOGIN / SIGNUP + PASSWORD RESET ---------- */
function authView(isLogin, err = '', okMsg = '', prefEmail = '') {
  let friendlyErr = err;
  if (err && (err.includes('INVALID_LOGIN_CREDENTIALS') || err.includes('invalid-credential') || err.includes('wrong-password'))) {
    friendlyErr = 'Email ba Password vul ache. Abar check korun ba "Password bhule gechen?" chapun.';
  } else if (err && err.includes('user-not-found')) {
    friendlyErr = 'Ei email-e kono account nei. Age "Notun? Account kholun" diye account toiri korun.';
  } else if (err && err.includes('too-many-requests')) {
    friendlyErr = 'Onekbar vul chesta kora hoyeche. Kichu somoy por abar chesta korun.';
  }

  $app.innerHTML = `
    <div class="auth">
      <h1>💬 Amar Chat</h1>
      ${isLogin ? '' : `
        <input type="text" id="nm" placeholder="Apnar naam">
        <p class="hint">Email verify korar por apni nijer username ba phone number thik korben.</p>`}
      <input type="email" id="em" placeholder="Email" value="${esc(prefEmail)}" autocomplete="email">
      <input type="password" id="pw" placeholder="Password (kompokkhe 6 okkhor)" autocomplete="${isLogin ? 'current-password' : 'new-password'}">
      ${friendlyErr ? `<p class="err">${esc(friendlyErr)}</p>` : ''}
      ${okMsg ? `<p class="ok">${esc(okMsg)}</p>` : ''}
      <button class="btn" id="go">${isLogin ? 'Login' : 'Account kholun'}</button>
      ${isLogin ? '<button class="link" id="rst">Password bhule gechen? (Email-e reset link)</button>' : ''}
      <button class="link" id="sw">${isLogin ? 'Notun? Account kholun' : 'Account ache? Login korun'}</button>
    </div>`;

  document.getElementById('sw').onclick = () => authView(!isLogin, '', '', document.getElementById('em').value.trim());

  const rstBtn = document.getElementById('rst');
  if (rstBtn) {
    rstBtn.onclick = async () => {
      const email = document.getElementById('em').value.trim();
      if (!email) return authView(true, 'Age upore apnar Email likhun, tarpor Reset chapun');
      rstBtn.disabled = true;
      try {
        await auth.sendPasswordResetEmail(email);
        authView(true, '', 'Password reset link apnar email-e pathano hoyeche (Spam folder-o dekhun).', email);
      } catch (ex) {
        authView(true, ex.message, '', email);
      }
    };
  }

  document.getElementById('go').onclick = async (e) => {
    const btn = e.target;
    btn.disabled = true;
    const email = document.getElementById('em').value.trim();
    const pw = document.getElementById('pw').value;
    if (!email || !pw) {
      authView(isLogin, 'Email ar Password dutoi likhun', '', email);
      return;
    }
    if (isLogin) {
      try {
        await auth.signInWithEmailAndPassword(email, pw);
      } catch (ex) {
        authView(true, ex.message, '', email);
      }
      return;
    }
    const name = document.getElementById('nm').value.trim();
    if (!name) {
      authView(false, 'Apnar naam likhun', '', email);
      return;
    }
    signingUp = true;
    try {
      const c = await auth.createUserWithEmailAndPassword(email, pw);
      me = c.user;
      await c.user.updateProfile({ displayName: name });
      await c.user.sendEmailVerification();
      verifyView('Verify email pathano hoyeche.', true);
    } catch (ex) {
      authView(false, ex.message, '', email);
    } finally {
      signingUp = false;
    }
  };
}

/* ---------- USERNAME SETUP ---------- */
function usernameSetup(err = '') {
  stop();
  $app.innerHTML = `
    <div class="auth">
      <h1>Username thik korun</h1>
      <p class="hint">Bondhura apnake ei username diye khujbe. ${UN_HELP}</p>
      <input type="text" id="nm" placeholder="Apnar naam" value="${esc(me.displayName || '')}">
      <input type="text" id="un" placeholder="Username ba phone number" autocapitalize="off" autocomplete="off">
      ${err ? `<p class="err">${esc(err)}</p>` : ''}
      <button class="btn" id="go">Save korun</button>
      <button class="link" id="lo">Logout</button>
    </div>`;

/* ---------- USERNAME DIYE KHOJA ---------- */
async function lookup(raw) {
  const u = normUn(raw);
  if (!UN_RE.test(u)) throw new Error(UN_HELP);
  const d = await db.collection('usernames').doc(u).get();
  if (!d.exists) throw new Error('Ei username e kew nei');
  const x = d.data();
  if (x.uid === me.uid) throw new Error('Eta apnar nijer username');
  return { uid: x.uid, name: x.name, username: u };
}

/* ---------- CHAT LIST + STATUS + CALLS ---------- */
function chatTitle(c) {
  if (c.isGroup) return c.name || 'Group';
  const oid = otherUid(c);
  if (oid && userProfilesCache[oid]?.name) return userProfilesCache[oid].name;
  const names = c.memberNames || {};
  for (const k in names) if (k !== me.uid) return names[k];
  return 'Chat';
}

function otherUid(c) {
  if (c.isGroup) return null;
  return (c.members || []).find(id => id !== me.uid) || null;
}

function home(activeTab = 'chats', showArchived = false) {
  stop();
  let allChats = [];
  let presMap = {};
  let unreadMap = {};
  let statusDocs = [];
  let callLogs = [];
  let searchTerm = '';

  $app.innerHTML = `
    <header>
      <div class="hav" id="myav" title="Profile" style="cursor:pointer">${avHtml(profile.photo, myName())}</div>
      <span>Amar Chat</span>
      <span class="sp"></span>
      <span class="un">@${esc(profile.username)}</span>
      <button id="lo" title="Logout">Logout</button>
    </header>
    <div class="tabs">
      <button id="t_chats" class="${activeTab === 'chats' ? 'on' : ''}">💬 Chats</button>
      <button id="t_status" class="${activeTab === 'status' ? 'on' : ''}">🟢 Status</button>
      <button id="t_calls" class="${activeTab === 'calls' ? 'on' : ''}">📞 Calls</button>
    </div>
    <div id="topslot"></div>
    <div class="list" id="ls"><div class="empty">Loading...</div></div>
    <button class="fab" id="fab">+</button>
    <div class="menu" id="mn" style="display:none">
      <div id="m1">👤 Notun chat</div>
      <div id="m2">👥 Notun group</div>
      <div id="m5">🟢 Status post korun</div>
      <div id="m4">⭐ Starred Messages</div>
      <div id="m3">⚙️ Profile & Settings</div>
    </div>`;

  document.getElementById('myav').onclick = profileView;
  document.getElementById('lo').onclick = async () => { await setOnline(false); auth.signOut(); };
  document.getElementById('t_chats').onclick = () => home('chats', false);
  document.getElementById('t_status').onclick = () => home('status', false);
  document.getElementById('t_calls').onclick = () => home('calls', false);

  const mn = document.getElementById('mn');
  document.getElementById('fab').onclick = () => mn.style.display = mn.style.display === 'none' ? 'block' : 'none';
  document.getElementById('m1').onclick = newChat;
  document.getElementById('m2').onclick = newGroup;
  document.getElementById('m5').onclick = () => postStatusModal();
  document.getElementById('m4').onclick = starredView;
  document.getElementById('m3').onclick = profileView;

  function postStatusModal() {
    mn.style.display = 'none';
    const txt = prompt('Apnar Status / Update likhun (24 ghonta thakbe):', '');
    if (txt === null) return;
    const clean = txt.trim();
    if (!clean) return toast('Status khali rakha jabe na');
    const now = Date.now();
    db.collection('statuses').add({
      uid: me.uid,
      userName: myName(),
      photo: profile.photo || '',
      text: clean,
      createdAt: now,
      expiresAt: now + 24 * 60 * 60 * 1000
    }).then(() => {
      toast('Status post hoyeche');
      home('status', false);
    }).catch(e => toast('Status post kora jayni: ' + e.message));
  }

  const renderBody = () => {
    const ls = document.getElementById('ls');
    const topslot = document.getElementById('topslot');
    if (!ls || !topslot) return;

    if (activeTab === 'status') {
      topslot.innerHTML = `<div class="archbar" id="newstbar"><span>+ Notun Status Post Korun</span><span>24h</span></div>`;
      document.getElementById('newstbar').onclick = postStatusModal;
      const now = Date.now();
      const valid = statusDocs.filter(s => (s.expiresAt || 0) > now);
      if (!valid.length) {
        ls.innerHTML = '<div class="empty">Ekhon kono active status nei. Upore chap diye status din.</div>';
        return;
      }
      ls.innerHTML = valid.map(s => `
        <div class="row strow" data-id="${s.id}">
          <div class="av ring">${avHtml(s.photo, s.userName)}</div>
          <div class="mid">
            <div class="t">${esc(s.userName || 'User')}</div>
            <div class="s">${esc(s.text || '')}</div>
          </div>
        </div>`).join('');
      ls.querySelectorAll('.strow').forEach(r => {
        const st = valid.find(x => x.id === r.dataset.id);
        if (st) r.onclick = () => openLightbox(st.text, `${st.userName} • Status`, true);
      });
      return;
    }

    if (activeTab === 'calls') {
      topslot.innerHTML = '';
      if (!callLogs.length) {
        ls.innerHTML = '<div class="empty">Kono call history nei.</div>';
        return;
      }
      ls.innerHTML = callLogs.map(c => {
        const dt = c.createdAt?.toDate?.();
        const tm = dt ? `${String(dt.getHours()).padStart(2, '0')}:${String(dt.getMinutes()).padStart(2, '0')}` : '';
        const icon = c.direction === 'incoming' ? '↙' : '↗';
        const mode = c.isVideo ? '📹 Video' : '📞 Audio';
        return `<div class="row callrow" data-uid="${esc(c.peerUid)}" data-name="${esc(c.peerName)}" data-vid="${c.isVideo ? '1' : '0'}">
          <div class="av">${esc((c.peerName || '?')[0]?.toUpperCase() || '?')}</div>
          <div class="mid">
            <div class="t">${esc(c.peerName || 'User')}</div>
            <div class="s">${icon} ${mode} • ${esc(c.outcome || '')} ${tm ? '• ' + tm : ''}</div>
          </div>
          <span class="hint" style="margin:0">Call</span>
        </div>`;
      }).join('');
      ls.querySelectorAll('.callrow').forEach(r => {
        r.onclick = () => startCall(r.dataset.uid, r.dataset.name, r.dataset.vid === '1');
      });
      return;
    }

    topslot.innerHTML = `<div class="searchbox"><input type="text" id="srch" placeholder="🔍 Chat ba bondhu khujun..." value="${esc(searchTerm)}"></div><div id="archslot"></div>`;
    const srchEl = document.getElementById('srch');
    srchEl.addEventListener('input', e => {
      searchTerm = e.target.value;
      renderBody();
    });

    const visibleChats = allChats.filter(c => {
      const delTs = tsMs(c.deletedAt?.[me.uid]);
      const updTs = tsMs(c.updatedAt);
      if (delTs && updTs && updTs <= delTs) return false;
      return true;
    });

    const archivedCount = visibleChats.filter(c => !!c.archivedBy?.[me.uid]).length;
    const archslot = document.getElementById('archslot');
    if (archslot) {
      if (showArchived) {
        archslot.innerHTML = `<div class="archbar" id="archtog"><span>← Sob Chat-e fire jan</span><span>${archivedCount}</span></div>`;
      } else if (archivedCount > 0) {
        archslot.innerHTML = `<div class="archbar" id="archtog"><span>📦 Archived Chats</span><span>${archivedCount}</span></div>`;
      } else {
        archslot.innerHTML = '';
      }
      const tog = document.getElementById('archtog');
      if (tog) tog.onclick = () => home('chats', !showArchived);
    }

    const q = searchTerm.trim().toLowerCase();
    const filtered = visibleChats.filter(c => {
      const isArch = !!c.archivedBy?.[me.uid];
      if (showArchived !== isArch) return false;
      if (!q) return true;
      const t = chatTitle(c).toLowerCase();
      const lm = (c.lastMessage || '').toLowerCase();
      const oid = otherUid(c);
      const un = (oid && c.memberUsernames?.[oid]) ? c.memberUsernames[oid].toLowerCase() : '';
      return t.includes(q) || lm.includes(q) || un.includes(q);
    });

    if (!filtered.length) {
      ls.innerHTML = q
        ? '<div class="empty">Kono chat khuje pawa jayni.</div>'
        : showArchived
          ? '<div class="empty">Kono archived chat nei.</div>'
          : '<div class="empty">Kono chat nei.<br>Niche + chap diye bondhur username khuje shuru korun.</div>';
      return;
    }

    ls.innerHTML = filtered.map(c => {
      const t = chatTitle(c);
      const oid = otherUid(c);
      const peerProf = oid ? userProfilesCache[oid] : null;
      const canSeePeerStatus = peerProf?.privacy?.lastSeen !== false;
      const isOn = canSeePeerStatus && isOnline(oid && presMap[oid]);
      const photo = oid ? peerProf?.photo : '';
      const isMuted = !!c.mutedBy?.[me.uid];
      const uCount = unreadMap[c.id] || 0;
      const typers = Object.entries(c.typing || {}).filter(([uid, val]) => uid !== me.uid && isTyping(val)).map(([uid]) => c.memberNames?.[uid] || 'Keu');
      const sub = typers.length ? `✍️ ${typers.join(', ')} likhche...` : (c.lastMessage || '');
      return `<div class="row" data-id="${c.id}" data-t="${esc(t)}" data-oid="${oid || ''}">
        <div class="av">${avHtml(photo, t, c.isGroup)}${isOn ? '<span class="dot"></span>' : ''}</div>
        <div class="mid">
          <div class="t">${esc(t)} ${isMuted ? '<span title="Muted" style="font-size:12px">🔇</span>' : ''}</div>
          <div class="s">${esc(sub)}</div>
        </div>
        <div class="meta">
          ${uCount > 0 ? `<span class="badge">${uCount > 99 ? '99+' : uCount}</span>` : ''}
        </div>
      </div>`;
    }).join('');

    ls.querySelectorAll('.row').forEach(r => {
      r.onclick = () => chatView(r.dataset.id, r.dataset.t, r.dataset.oid || null);
    });
  };

  const presSubs = {};
  const userSubs = {};
  const unreadSubs = {};
  addSub(() => {
    Object.values(presSubs).forEach(f => { try { f(); } catch (e) {} });
    Object.values(userSubs).forEach(f => { try { f(); } catch (e) {} });
    Object.values(unreadSubs).forEach(f => { try { f(); } catch (e) {} });
  });

  if (activeTab === 'status') {
    addSub(db.collection('statuses').orderBy('createdAt', 'desc').limit(30).onSnapshot(snap => {
      statusDocs = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      renderBody();
    }, () => renderBody()));
    return;
  }

  if (activeTab === 'calls') {
    addSub(db.collection('users').doc(me.uid).collection('callLogs').orderBy('createdAt', 'desc').limit(30).onSnapshot(snap => {
      callLogs = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      renderBody();
    }, () => renderBody()));
    return;
  }

  addSub(db.collection('chats').where('members', 'array-contains', me.uid).onSnapshot(snap => {
    allChats = snap.docs.map(d => ({ id: d.id, ...d.data() }))
      .sort((a, b) => (b.updatedAt?.seconds || 9e12) - (a.updatedAt?.seconds || 9e12));
    allChats.forEach(c => {
      const oid = otherUid(c);
      if (oid && !presSubs[oid]) {
        presSubs[oid] = db.collection('presence').doc(oid).onSnapshot(d => {
          presMap[oid] = d.exists ? d.data() : null;
          renderBody();
        }, () => {});
      }
      if (oid && !userSubs[oid]) {
        userSubs[oid] = db.collection('users').doc(oid).onSnapshot(d => {
          userProfilesCache[oid] = d.exists ? d.data() : null;
          renderBody();
        }, () => {});
      }
      if (!unreadSubs[c.id]) {
        unreadSubs[c.id] = db.collection('chats').doc(c.id).collection('messages')
          .orderBy('createdAt', 'desc').limit(50)
          .onSnapshot(mSnap => {
            const delTs = tsMs(c.deletedAt?.[me.uid]);
            let cnt = 0;
            mSnap.docs.forEach(md => {
              const m = md.data();
              if (m.senderId !== me.uid && !m.deleted && !(m.seenBy || []).includes(me.uid)) {
                if (!delTs || tsMs(m.createdAt) > delTs) cnt++;
              }
            });
            unreadMap[c.id] = cnt;
            renderBody();
          }, () => {});
      }
    });
    renderBody();
  }, err => {
    const l = document.getElementById('ls');
    if (l) l.innerHTML = `<div class="empty">Error: ${esc(err.message)}</div>`;
  }));
}

async function openOneToOne(u) {
  const ids = [me.uid, u.uid].sort();
  const id = ids.join('_');
  await db.collection('chats').doc(id).set({
    isGroup: false, members: ids,
    memberNames: { [me.uid]: myName(), [u.uid]: u.name },
    memberUsernames: { [me.uid]: profile.username, [u.uid]: u.username }
  }, { merge: true });
  chatView(id, u.name, u.uid);
}

    const description = document.getElementById('gd').value.trim();
    if (!name) return toast('Group er naam likhun');
    if (Object.keys(added).length < 2) return toast('Kompokkhe 2 jon sodosso add korun');
    const memberNames = { [me.uid]: myName() };
    const memberUsernames = { [me.uid]: profile.username };
    Object.entries(added).forEach(([uid, u]) => { memberNames[uid] = u.name; memberUsernames[uid] = u.username; });
    const ref = await db.collection('chats').add({
      isGroup: true,
      name,
      description,
      admins: [me.uid],
      members: Object.keys(memberNames),
      memberNames,
      memberUsernames,
      lastMessage: '',
      updatedAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    chatView(ref.id, name, null);
  };
}

/* ---------- GROUP ADMIN, CO-ADMIN & DESCRIPTION ---------- */

    gbody.innerHTML = `

          ${latestData.description ? `<p class="hint" style="margin-top:4px">${esc(latestData.description)}</p>` : ''}

      </div>
      ${isAdmin ? `
      <div class="card">
        <label class="hint"><b>Notun Sodosso Add Korun</b></label>
        <div class="addrow">
          <input type="text" id="gq" placeholder="username ba number" autocapitalize="off" autocomplete="off">
          <button class="btn sm" id="gadd">Add</button>
        </div>
        <p class="err" id="ger" style="margin:6px 0 0"></p>
      </div>` : ''}
      <div class="card">
        <label class="hint"><b>Sodosso (${members.length} jon)</b></label>
        ${members.map(uid => {
          const nm = latestData.memberNames?.[uid] || 'User';
          const un = latestData.memberUsernames?.[uid] || '';
          const adm = admins.includes(uid);
          return `<div class="mrow">
            <div style="min-width:0"><b>${esc(nm)}</b> ${un ? `<span class="hint">@${esc(un)}</span>` : ''} ${adm ? '<span style="color:var(--g);font-size:12px;font-weight:700">[Admin]</span>' : ''}</div>
            <div style="display:flex;gap:6px;flex:none">
              ${isAdmin && uid !== me.uid ? `<button class="btn sm sec gtogadm" data-u="${uid}" style="padding:5px 8px;font-size:11.5px">${adm ? 'Demote' : 'Make Admin'}</button>` : ''}
              ${isAdmin && uid !== me.uid ? `<button class="btn sm danger grm" data-u="${uid}" style="padding:5px 8px;font-size:11.5px">Remove</button>` : ''}
            </div>
          </div>`;
        }).join('')}
      </div>
      <button class="btn danger" id="gleave">Group chhere din</button>`;

    document.getElementById('bk').onclick = () => chatView(chatId, latestData.name || 'Group', null);

    if (isAdmin) {
      document.getElementById('gsave').onclick = async () => {
        const nm = document.getElementById('gname').value.trim();
        const desc = document.getElementById('gdesc').value.trim();
        if (!nm) return toast('Group er naam likhun');
        await db.collection('chats').doc(chatId).update({ name: nm, description: desc });
        toast('Group info update hoyeche');
      };
      document.getElementById('gadd').onclick = async () => {
        const er = document.getElementById('ger');
        const q = document.getElementById('gq');
        er.textContent = '';
        try {
          const u = await lookup(q.value);
          if (members.includes(u.uid)) throw new Error('Ini agei group-e achen');
          await db.collection('chats').doc(chatId).update({
            members: firebase.firestore.FieldValue.arrayUnion(u.uid),
            [`memberNames.${u.uid}`]: u.name,
            [`memberUsernames.${u.uid}`]: u.username
          });
          q.value = '';
          toast(`${u.name}-ke add kora hoyeche`);
        } catch (ex) { er.textContent = ex.message; }
      };
      gbody.querySelectorAll('.gtogadm').forEach(btn => {
        btn.onclick = async () => {
          const uid = btn.dataset.u;
          const isNowAdm = admins.includes(uid);
          await db.collection('chats').doc(chatId).update({
            admins: isNowAdm
              ? firebase.firestore.FieldValue.arrayRemove(uid)
              : firebase.firestore.FieldValue.arrayUnion(uid)
          });
          toast(isNowAdm ? 'Admin bad dewa hoyeche' : 'Admin banano hoyeche');
        };
      });
      gbody.querySelectorAll('.grm').forEach(btn => {
        btn.onclick = async () => {
          const uid = btn.dataset.u;
          if (!confirm('Ei sodosso-ke group theke remove korben?')) return;
          await db.collection('chats').doc(chatId).update({
            members: firebase.firestore.FieldValue.arrayRemove(uid),
            admins: firebase.firestore.FieldValue.arrayRemove(uid)
          });
          toast('Remove kora hoyeche');
        };
      });
    }

    document.getElementById('gleave').onclick = async () => {
      if (!confirm('Apni ki group chhere dite chan?')) return;
      await db.collection('chats').doc(chatId).update({
        members: firebase.firestore.FieldValue.arrayRemove(me.uid),
        admins: firebase.firestore.FieldValue.arrayRemove(me.uid)
      });
      home('chats', false);
    };
  }));
}

/* ---------- FORWARD MODAL ---------- */
async function openForwardModal(msgObj) {
  const modal = document.createElement('div');
  modal.className = 'modal';
  modal.innerHTML = `
    <div class="mbox">
      <div class="mhead"><span>↪ Forward Message</span><button id="mcl">✕</button></div>
      <div class="list" id="fls"><div class="empty">Loading chats...</div></div>
    </div>`;
  document.body.appendChild(modal);
  modal.querySelector('#mcl').onclick = () => modal.remove();
  modal.onclick = e => { if (e.target === modal) modal.remove(); };

  try {
    const snap = await db.collection('chats').where('members', 'array-contains', me.uid).get();
    const chats = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    const fls = modal.querySelector('#fls');
    if (!chats.length) { fls.innerHTML = '<div class="empty">Kono chat nei</div>'; return; }
    fls.innerHTML = chats.map(c => {
      const t = chatTitle(c);
      return `<div class="row" data-id="${c.id}" data-t="${esc(t)}" data-oid="${otherUid(c) || ''}">
        <div class="av">${avHtml('', t, c.isGroup)}</div>
        <div class="mid"><div class="t">${esc(t)}</div></div>
      </div>`;
    }).join('');

    fls.querySelectorAll('.row').forEach(r => {
      r.onclick = async () => {
        const targetId = r.dataset.id;
        const FV = firebase.firestore.FieldValue;
        await db.collection('chats').doc(targetId).collection('messages').add({
          senderId: me.uid,
          senderName: myName(),
          text: msgObj.text || null,
          image: msgObj.image || null,
          audio: msgObj.audio || null,
          audioMime: msgObj.audioMime || null,
          docUrl: msgObj.docUrl || null,
          docName: msgObj.docName || null,
          forwarded: true,
          edited: false,
          deleted: false,
          deliveredTo: [me.uid],
          seenBy: [me.uid],
          createdAt: FV.serverTimestamp()
        });
        const last = msgObj.docName ? `📄 ${msgObj.docName}` : msgObj.audio ? '🎤 Voice message' : msgObj.image ? '📷 Photo' : msgObj.text;
        await db.collection('chats').doc(targetId).set({
          lastMessage: '↪ ' + last,
          updatedAt: FV.serverTimestamp()
        }, { merge: true });
        modal.remove();
        toast('Message forward hoyeche');
        chatView(targetId, r.dataset.t, r.dataset.oid || null);
      };
    });
  } catch (e) {
    modal.remove();
    toast('Forward kora jayni: ' + e.message);
  }
}

/* ---------- MEDIA & DOC UPLOAD ---------- */
async function uploadMedia(chatId, blobOrFile, ext, fallbackDataUrl, isDoc = false) {
  if (!USE_STORAGE) {
    if (fallbackDataUrl && fallbackDataUrl.length <= 900000) return fallbackDataUrl;
    throw new Error('File size beshi boro (ba USE_STORAGE = true kore Storage rules din).');
  }
  try {
    const folder = isDoc ? 'docs' : 'media';
    const path = `chats/${chatId}/${folder}/${me.uid}_${Date.now()}.${ext}`;
    const ref = storage.ref().child(path);
    const contentType = blobOrFile.type || (ext === 'jpg' ? 'image/jpeg' : 'application/octet-stream');
    const snap = await ref.put(blobOrFile, { contentType });
    return await snap.ref.getDownloadURL();
  } catch (e) {
    if (fallbackDataUrl && fallbackDataUrl.length <= 900000) return fallbackDataUrl;
    throw new Error('File upload kora jayni (Storage rules ba size check korun).');
  }
}

    renderPinBanner();
    clearTimeout(typingClear);
    if (typingNames.length) typingClear = setTimeout(() => { typingNames = []; updateHeaderSub(); }, 6500);
    renderMessages();
  }));

  let rec = null, recStream = null, recChunks = [], recTimer = null, secCounter = 0, discardRec = false;
  const fmtSec = s => `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`;
  const cleanupRec = () => {
    clearInterval(recTimer);
    recTimer = null;

    if (recStream) { recStream.getTracks().forEach(t => t.stop()); recStream = null; }
    rec = null;
  };
  const cancelRec = () => {
    discardRec = true;
    if (rec && rec.state !== 'inactive') { try { rec.stop(); } catch (e) {} }
    cleanupRec();
  };

  document.getElementById('reccncl').onclick = cancelRec;
  document.getElementById('recstop').onclick = () => { if (rec && rec.state !== 'inactive') rec.stop(); };

  document.getElementById('bk').onclick = () => {
    clearTimeout(typingTimeout);
    setTyping(false);
    cancelRec();
    home('chats', false);
  };

  const markRead = () => {
    if (!sendReceiptsPref()) return;
    lastDocs.forEach(docSnap => {
      const m = docSnap.data();
      if (m.senderId !== me.uid && !m.deleted) {
        const updates = {};
        if (!(m.deliveredTo || []).includes(me.uid)) updates.deliveredTo = firebase.firestore.FieldValue.arrayUnion(me.uid);
        if (document.visibilityState === 'visible' && !(m.seenBy || []).includes(me.uid)) updates.seenBy = firebase.firestore.FieldValue.arrayUnion(me.uid);
        if (Object.keys(updates).length) docSnap.ref.update(updates).catch(() => {});
      }
    });
  };
  const onVisRead = () => { if (document.visibilityState === 'visible') markRead(); };
  document.addEventListener('visibilitychange', onVisRead);
  addSub(() => document.removeEventListener('visibilitychange', onVisRead));

  function renderMessages() {
    const atBottom = ms.scrollHeight - ms.scrollTop - ms.clientHeight < 120;
    const delTs = tsMs(chatMeta.deletedAt?.[me.uid]);
    const q = inChatQuery.trim().toLowerCase();
    const starredIds = new Set(myStarred().map(x => x.id));
    const now = Date.now();
    msgCache = {};

    const filteredDocs = lastDocs.filter(d => {
      const m = d.data();
      const mTs = tsMs(m.createdAt);
      if (m.expiresAt && now > m.expiresAt) return false;
      if (delTs && mTs && mTs <= delTs) return false;
      if (q) {
        if (m.deleted) return false;
        return (m.text || '').toLowerCase().includes(q)
          || (m.senderName || '').toLowerCase().includes(q)
          || (m.docName || '').toLowerCase().includes(q);
      }
      return true;
    });

    ms.innerHTML = filteredDocs.map(d => {
      const m = d.data();
      msgCache[d.id] = m;
      const mine = m.senderId === me.uid;
      const dt = m.createdAt?.toDate();
      const tm = dt ? String(dt.getHours()).padStart(2, '0') + ':' + String(dt.getMinutes()).padStart(2, '0') : '';
      if (m.deleted) {
        return `<div class="b ${mine ? 'me' : ''}">
          ${mine ? '' : `<div class="n">${esc(m.senderName)}</div>`}
          <span class="del">🚫 Ei message-ti delete kora hoyeche</span>
          <span class="tm">${tm}</span></div>`;
      }

      const rxMap = m.reactions || {};
      const counts = {};
      Object.values(rxMap).forEach(em => { if (em) counts[em] = (counts[em] || 0) + 1; });
      const rxHtml = Object.keys(counts).length
        ? `<div class="reacts">${Object.entries(counts).map(([em, cnt]) => `<span class="rpill">${esc(em)}${cnt > 1 ? ' ' + cnt : ''}</span>`).join('')}</div>`
        : '';

      const ext = (m.audioMime || '').includes('mp4') ? 'mp4' : (m.audioMime || '').includes('ogg') ? 'ogg' : 'webm';
      const isSt = starredIds.has(d.id);
      const isPinned = chatMeta.pinnedMessage?.id === d.id;
      const safeImg = safeMedia(m.image);
      const safeDocUrl = safeDoc(m.docUrl);

      return `<div class="b ${mine ? 'me' : ''}" data-id="${d.id}">
        ${mine ? '' : `<div class="n">${esc(m.senderName)}</div>`}
        ${m.forwarded ? '<div class="fwd">↪ Forwarded</div>' : ''}
        ${m.replyTo ? `<div class="qbox"><b>${esc(m.replyTo.senderName || 'User')}</b>${esc(m.replyTo.preview || '')}</div>` : ''}
        ${safeImg ? `<img class="zoomimg" src="${esc(safeImg)}" data-cap="${esc(m.text || '')}"><a class="dl" href="${esc(safeImg)}" target="_blank" rel="noopener" download="photo.jpg">⬇ Download</a>` : ''}
        ${safeDocUrl ? `<a class="docbox" href="${esc(safeDocUrl)}" target="_blank" rel="noopener" download="${esc(m.docName || 'document')}"><span>📄</span><span><b>${esc(m.docName || 'Document')}</b><br><small>Tap to open / download</small></span></a>` : ''}
        ${safeMedia(m.audio) ? `<audio controls preload="none" src="${esc(safeMedia(m.audio))}"></audio><button type="button" class="spdbtn" data-spd="1">1x</button><a class="dl" href="${esc(safeMedia(m.audio))}" target="_blank" rel="noopener" download="voice-message.${ext}">⬇ Download</a>` : ''}
        ${m.text ? `<span class="txt">${esc(m.text)}</span>` : ''}${m.edited ? '<span class="ed">(edited)</span>' : ''}
        <span class="tm">${tm}${mine && sendReceiptsPref() ? ` <span class="receipt">${(m.seenBy || []).some(uid => uid !== me.uid) ? '✓✓ Seen' : (m.deliveredTo || []).some(uid => uid !== me.uid) ? '✓✓ Delivered' : '✓ Sent'}</span>` : ''}</span>
        ${rxHtml}
        <div class="act">
          ${REACTIONS.map(em => `<span class="rx" data-em="${em}">${em}</span>`).join('')}
          <span class="mrep">↩ Reply</span>
          <span class="mstar">${isSt ? '★ Unstar' : '☆ Star'}</span>
          <span class="mpin">${isPinned ? 'Unpin' : '📌 Pin'}</span>
          <span class="mfwd">↪ Forward</span>
          ${mine && m.text ? '<span class="medit">✎ Edit</span>' : ''}
          ${mine ? '<span class="mdel">🗑 Delete</span>' : ''}
        </div>
      </div>`;
    }).join('');

    ms.querySelectorAll('.spdbtn').forEach(btn => {
      btn.onclick = e => {
        e.stopPropagation();
        const aud = btn.previousElementSibling;
        const cur = parseFloat(btn.dataset.spd || '1');
        const next = cur === 1 ? 1.5 : cur === 1.5 ? 2 : 1;
        btn.dataset.spd = String(next);
        btn.textContent = `${next}x`;
        if (aud && aud.tagName === 'AUDIO') aud.playbackRate = next;
      };
    });

    ms.querySelectorAll('.zoomimg').forEach(img => {
      img.onclick = e => {
        e.stopPropagation();
        openLightbox(img.src, img.dataset.cap || '', false);
      };
    });

    ms.querySelectorAll('.b[data-id]').forEach(b => {
      b.onclick = e => {
        if (e.target.closest('.act') || e.target.closest('audio') || e.target.closest('a') || e.target.closest('.zoomimg') || e.target.closest('.spdbtn')) return;
        b.classList.toggle('open');
      };
    });

    ms.querySelectorAll('.rx').forEach(btn => {
      btn.onclick = async e => {
        e.stopPropagation();
        const id = btn.closest('.b').dataset.id;
        const em = btn.dataset.em;
        const cur = msgCache[id]?.reactions?.[me.uid];
        const nextVal = cur === em ? firebase.firestore.FieldValue.delete() : em;
        try {
          await chat.collection('messages').doc(id).update({ [`reactions.${me.uid}`]: nextVal });
        } catch (err) { toast('Reaction dewa jayni'); }
      };
    });

    ms.querySelectorAll('.mrep').forEach(btn => {
      btn.onclick = e => {
        e.stopPropagation();
        const id = btn.closest('.b').dataset.id;
        const m = msgCache[id];
        if (!m) return;
        const preview = m.text || (m.docName ? `📄 ${m.docName}` : m.audio ? '🎤 Voice message' : m.image ? '📷 Photo' : 'Message');
        setReply(id, m.senderName || 'User', preview);
      };
    });

    ms.querySelectorAll('.mstar').forEach(btn => {
      btn.onclick = async e => {
        e.stopPropagation();
        const id = btn.closest('.b').dataset.id;
        const m = msgCache[id];
        if (!m) return;
        const preview = m.text || (m.docName ? `📄 ${m.docName}` : m.audio ? '🎤 Voice message' : m.image ? '📷 Photo' : 'Message');
        const existing = myStarred().find(x => x.id === id);
        if (existing) {
          await db.collection('users').doc(me.uid).set({ starred: firebase.firestore.FieldValue.arrayRemove(existing) }, { merge: true });
          profile.starred = myStarred().filter(x => x.id !== id);
          toast('Starred theke bad dewa hoyeche');
        } else {
          const entry = { id, chatId, chatTitle: htitle.textContent, senderName: m.senderName || 'User', preview };
          await db.collection('users').doc(me.uid).set({ starred: firebase.firestore.FieldValue.arrayUnion(entry) }, { merge: true });
          profile.starred = [...myStarred(), entry];
          toast('Starred message-e save hoyeche');
        }
        renderMessages();
      };
    });

    ms.querySelectorAll('.mpin').forEach(btn => {
      btn.onclick = async e => {
        e.stopPropagation();
        const id = btn.closest('.b').dataset.id;
        const m = msgCache[id];
        if (!m) return;
        if (chatMeta.pinnedMessage?.id === id) {
          await chat.set({ pinnedMessage: null }, { merge: true });
          toast('Unpin hoyeche');
        } else {
          const preview = m.text || (m.docName ? `📄 ${m.docName}` : m.audio ? '🎤 Voice message' : m.image ? '📷 Photo' : 'Message');
          await chat.set({ pinnedMessage: { id, senderName: m.senderName || 'User', preview } }, { merge: true });
          toast('Message pin hoyeche');
        }
      };
    });

    ms.querySelectorAll('.mfwd').forEach(btn => {
      btn.onclick = e => {
        e.stopPropagation();
        const id = btn.closest('.b').dataset.id;
        const m = msgCache[id];
        if (m) openForwardModal(m);
      };
    });

    ms.querySelectorAll('.medit').forEach(btn => {
      btn.onclick = async e => {
        e.stopPropagation();
        const id = btn.closest('.b').dataset.id;
        const cur = msgCache[id]?.text || '';
        const next = prompt('Notun message likhun:', cur);
        if (next === null) return;
        const trimmed = next.trim();
        if (!trimmed || trimmed === cur) return;
        try {
          await chat.collection('messages').doc(id).update({ text: trimmed, edited: true });
          toast('Message edit hoyeche');
        } catch (err) { toast('Edit kora jayni: ' + err.message); }
      };
    });

    ms.querySelectorAll('.mdel').forEach(btn => {
      btn.onclick = async e => {
        e.stopPropagation();
        const id = btn.closest('.b').dataset.id;
        if (!confirm('Ei message-ti delete korte chan?')) return;
        try {
          await chat.collection('messages').doc(id).update({ text: null, image: null, audio: null, docUrl: null, docName: null, deleted: true });
          toast('Message delete hoyeche');
        } catch (err) { toast('Delete kora jayni: ' + err.message); }
      };
    });

    if (atBottom || ms.dataset.init !== '1') {
      ms.scrollTop = ms.scrollHeight;
      ms.dataset.init = '1';
    }
  }

  addSub(chat.collection('messages').orderBy('createdAt').limitToLast(250).onSnapshot(snap => {
    lastDocs = snap.docs;
    markRead();
    renderMessages();
  }));

  async function send(text, image, audio, audioMime, docUrl, docName) {
    if (peerUid && myBlocked().includes(peerUid)) throw new Error('User blocked ache');
    const FV = firebase.firestore.FieldValue;
    const rep = replyTarget ? { ...replyTarget } : null;
    const disHours = chatMeta.disappearHours || 0;
    const expiresAt = disHours > 0 ? Date.now() + disHours * 3600 * 1000 : null;
    clearReply();
    await chat.collection('messages').add({
      senderId: me.uid,
      senderName: myName(),
      text: text || null,
      image: image || null,
      audio: audio || null,
      audioMime: audioMime || null,
      docUrl: docUrl || null,
      docName: docName || null,
      expiresAt,
      replyTo: rep,
      reactions: {},
      edited: false,
      deleted: false,
      deliveredTo: [me.uid],
      seenBy: [me.uid],
      createdAt: FV.serverTimestamp()
    });
    const last = docName ? `📄 ${docName}` : audio ? '🎤 Voice message' : image ? (text ? `📷 ${text}` : '📷 Photo') : text;
    await chat.set({
      lastMessage: last,
      updatedAt: FV.serverTimestamp(),
      typing: { [me.uid]: 0 },
      archivedBy: { [me.uid]: false }
    }, { merge: true });
    isTypingNow = false;
  }

  document.getElementById('mic').onclick = async () => {
    if (rec && rec.state !== 'inactive') { rec.stop(); return; }
    try {
      discardRec = false;
      if (!window.MediaRecorder) throw new Error('Ei browser-e voice recording supported noy');
      recStream = await navigator.mediaDevices.getUserMedia({ audio: true });
      const mime = ['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4'].find(t => window.MediaRecorder && MediaRecorder.isTypeSupported(t));
      rec = new MediaRecorder(recStream, mime ? { mimeType: mime, audioBitsPerSecond: 20000 } : {});
      recChunks = [];
      rec.ondataavailable = e => { if (e.data.size) recChunks.push(e.data); };
      rec.onstop = async () => {
        const type = (rec && rec.mimeType) || 'audio/webm';
        const blob = new Blob(recChunks, { type });
        const wasDiscarded = discardRec;
        cleanupRec();
        if (wasDiscarded || blob.size < 800) return;
        try {
          const b64 = blob.size < 650000 ? await blobToDataURL(blob) : null;
          const ext = type.includes('mp4') ? 'mp4' : 'webm';
          const url = await uploadMedia(chatId, blob, ext, b64, false);
          await send(null, null, url, type, null, null);
        } catch (ex) {
          toast('Voice pathano gelo na: ' + ex.message);
        }
      };
      rec.start();
      recbar.classList.add('on');
      secCounter = 0;
      rectm.textContent = '00:00';
      recTimer = setInterval(() => {
        secCounter += 1;
        rectm.textContent = fmtSec(secCounter);
        if (secCounter >= 120 && rec && rec.state !== 'inactive') rec.stop();
      }, 1000);
    } catch (ex) {
      cancelRec();
      toast('Microphone chalu korte parini. Permission din.');
    }
  };

  const sendText = async () => {
    const t = tx.value.trim(); if (!t) return;
    tx.value = '';
    ep.classList.remove('on');
    try { await send(t); } catch (e) { toast('Pathano gelo na: ' + e.message); }
  };
  document.getElementById('sd').onclick = sendText;
  tx.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendText(); } });

  document.getElementById('ph').onclick = () => document.getElementById('fi').click();
  document.getElementById('fi').onchange = async (e) => {
    const f = e.target.files[0]; if (!f) return;
    try {
      if (!f.type.startsWith('image/')) throw new Error('Valid image file select korun');
      const capInput = prompt('Photo caption (optional):', '');
      if (capInput === null) { e.target.value = ''; return; }
      const small = await shrink(f);
      const photoBlob = await (await fetch(small.dataUrl)).blob();
      const url = await uploadMedia(chatId, photoBlob, 'jpg', small.dataUrl, false);
      await send(capInput.trim() || null, url, null, null, null, null);
    } catch (ex) {
      toast('Photo pathano gelo na: ' + ex.message);
    }
    e.target.value = '';
  };

  document.getElementById('docbtn').onclick = () => document.getElementById('dfi').click();
  document.getElementById('dfi').onchange = async (e) => {
    const f = e.target.files[0]; if (!f) return;
    try {
      const ext = (f.name.split('.').pop() || 'file').toLowerCase();
      const b64 = f.size < 650000 ? await blobToDataURL(f) : null;
      const url = await uploadMedia(chatId, f, ext, b64, true);
      await send(null, null, null, null, url, f.name);
      toast('Document pathano hoyeche');
    } catch (ex) {
      toast('Document pathano gelo na: ' + ex.message);
    }
    e.target.value = '';
  };
}

function blobToDataURL(blob) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(r.result);
    r.onerror = () => rej(new Error('File porte parini'));
    r.readAsDataURL(blob);
  });
}

function shrink(file, max = 720) {
  return new Promise((res, rej) => {
    const img = new Image();
    const objUrl = URL.createObjectURL(file);
    img.onload = () => {
      URL.revokeObjectURL(objUrl);
      const s = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      const ctx = c.getContext('2d');
      if (!ctx) return rej(new Error('Image process kora jayni'));
      ctx.drawImage(img, 0, 0, c.width, c.height);
      res({ dataUrl: c.toDataURL('image/jpeg', 0.55) });
    };
    img.onerror = () => { URL.revokeObjectURL(objUrl); rej(new Error('Chobi khola gelo na')); };
    img.src = objUrl;
  });
}
</script>
