<style>

  .hsub{font-size:12px;font-weight:400;opacity:.9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  header .sp{flex:1}

  header button{background:none;border:0;color:#fff;font-size:14px;cursor:pointer;padding:6px;flex:none}

  .row .mid{flex:1;min-width:0}
  .row .t{font-weight:600;display:flex;align-items:center;gap:6px}
  .row .s{color:var(--sub);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  .row .meta{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex:none}

  .empty{padding:40px 20px;text-align:center;color:var(--sub)}
  .fab{position:absolute;right:16px;bottom:16px;width:56px;height:56px;border-radius:50%;background:var(--g);color:#fff;border:0;font-size:28px;box-shadow:0 2px 8px #0004;cursor:pointer}
  .menu{position:absolute;right:16px;bottom:84px;background:var(--card);color:var(--text);border-radius:10px;box-shadow:0 2px 12px #0004;overflow:hidden;z-index:30;min-width:220px}

  .menu div{padding:12px 16px;cursor:pointer;font-size:14px;border-bottom:1px solid var(--bd)}

  .menu div:active{background:var(--rowact)}

  .btn.sm{width:auto;padding:10px 16px}
  .link{background:none;border:0;color:var(--g);width:100%;padding:10px;font-size:14.5px;cursor:pointer}
  .err{color:#e04848;margin:0 0 12px;font-size:14px}
  .ok{color:#25d366;margin:0 0 12px;font-size:14px}
  .hint{color:var(--sub);font-size:13.5px;margin:0 0 10px}

  .b .del{font-style:italic;color:var(--sub);font-size:13px}

  .mbox{background:var(--card);color:var(--text);border-radius:12px;width:100%;max-width:430px;max-height:84vh;display:flex;flex-direction:column;overflow:hidden}

  .lbox{position:fixed;inset:0;background:#000e;z-index:150;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px}

  .callscreen{position:fixed;inset:0;background:#111b21;color:#fff;z-index:135;display:none;flex-direction:column;align-items:center;justify-content:space-between;padding:28px 20px}
  .callscreen.on{display:flex}
  .calltop{text-align:center;z-index:2}
  .callname{font-size:22px;font-weight:700}
  .callst{font-size:14px;opacity:.85;margin-top:4px}
  .vwrap{position:relative;flex:1;width:100%;max-width:600px;margin:16px 0;display:flex;align-items:center;justify-content:center;overflow:hidden;border-radius:14px;background:#0b141a}

  .cbtn.end{background:#e53935}
  .cbtn.off{background:#fff;color:#111}

/* ---------- RINGTONE & NOTIFICATION SOUND ---------- */
let ringtoneInterval = null;

function playAlertBeep(freq = 740, duration = 0.18) {
  if (!isSoundEnabled()) return;
  try {
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    if (!AudioCtx) return;
    const ctx = new AudioCtx();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.08, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + duration);
    setTimeout(() => ctx.close().catch(() => {}), (duration + 0.1) * 1000);
  } catch (e) {}
}

function startRingtone() {
  stopRingtone();
  if (!isSoundEnabled()) return;
  const pulse = () => {
    if (!isSoundEnabled()) return;
    playAlertBeep(880, 0.22);
    setTimeout(() => playAlertBeep(1046, 0.22), 260);
  };
  pulse();
  ringtoneInterval = setInterval(pulse, 1400);
}

function stopRingtone() {
  if (ringtoneInterval) { clearInterval(ringtoneInterval); ringtoneInterval = null; }
}

async function ensureNotifPermission() {
  try {

      await Notification.requestPermission();

}

function triggerNotification(title, body, isCall = false) {
  if (!isCall) playAlertBeep(660, 0.16);
  toast(`${title}: ${body}`);
  try {
    if ('Notification' in window && Notification.permission === 'granted' && (document.hidden || isCall)) {
      const n = new Notification(title, { body, silent: !isSoundEnabled() });
      n.onclick = () => { window.focus(); n.close(); };
    }
  } catch (e) {}
}

/* ---------- WEBRTC AUDIO + VIDEO CALL ENGINE + CAMERA SWITCH + CALL LOG ---------- */
let pc = null, localStream = null, remoteStream = null, activeCallId = null, callUnsubs = [], micMuted = false, camOff = false;
let currentCallMeta = null, isSettingRemote = false, currentFacingMode = 'user', callIsVideo = false;

const $cs = document.getElementById('callscreen');

function syncMediaElements() {
  if (remoteStream) {
    if ($remA.srcObject !== remoteStream) $remA.srcObject = remoteStream;
    $remA.muted = false;
    $remA.volume = 1.0;
    $remA.play().catch(() => {});

    const hasVideo = remoteStream.getVideoTracks().some(t => t.readyState === 'live') || remoteStream.getVideoTracks().length > 0 || callIsVideo;
    if (hasVideo) {
      callIsVideo = true;
      $cav.style.display = 'none';
      $remV.style.display = 'block';
      $locV.style.display = 'block';
      if ($remV.srcObject !== remoteStream) $remV.srcObject = remoteStream;
      $remV.muted = false;
      $remV.volume = 1.0;
      $remV.play().catch(() => {});
    }
  }
  if (localStream && callIsVideo) {
    $locV.style.display = 'block';
    if ($locV.srcObject !== localStream) $locV.srcObject = localStream;
    $locV.muted = true;
    $locV.play().catch(() => {});
  }
}

});

async function logCallHistory(peerUid, peerName, isVideo, direction, outcome) {
  if (!me || !peerUid) return;
  try {
    await db.collection('users').doc(me.uid).collection('callLogs').add({
      peerUid,
      peerName: peerName || 'User',
      isVideo: !!isVideo,
      direction,
      outcome,
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });
  } catch (e) {}
}

function clearCallSubs() {
  callUnsubs.forEach(fn => { try { fn(); } catch (e) {} });
  callUnsubs = [];
}

async function switchCallCamera() {
  if (!pc || !localStream || !callIsVideo) return;
  const nextMode = currentFacingMode === 'user' ? 'environment' : 'user';
  try {
    const newVidStream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: nextMode }, width: { ideal: 640 }, height: { ideal: 480 } },
      audio: false
    });
    const newTrack = newVidStream.getVideoTracks()[0];
    if (!newTrack) return;

    const oldTrack = localStream.getVideoTracks()[0];
    const sender = pc.getSenders().find(s => s.track && s.track.kind === 'video');
    if (sender) await sender.replaceTrack(newTrack);

    if (oldTrack) {
      oldTrack.stop();
      localStream.removeTrack(oldTrack);
    }
    localStream.addTrack(newTrack);
    currentFacingMode = nextMode;
    camOff = false;
    syncMediaElements();
    toast(nextMode === 'environment' ? 'Back camera active' : 'Front camera active');
  } catch (e) {
    toast('Camera switch kora jayni: ' + (e.message || ''));
  }
}

function showCallUI(peerName, statusText, isVideo, mode) {
  callIsVideo = !!isVideo;
  $cname.textContent = peerName || 'User';

      ccam.onclick = () => {

      };
    }
    const cflip = document.getElementById('cflip');

  }

async function endCall(updateRemote = true) {
  stopRingtone();
  const cid = activeCallId;
  const meta = currentCallMeta;
  activeCallId = null;
  currentCallMeta = null;
  ringingCallId = null;
  isSettingRemote = false;
  currentFacingMode = 'user';
  callIsVideo = false;
  clearTimeout(ringTimer); ringTimer = null;
  micMuted = false;
  camOff = false;
  pendingCands = [];
  clearCallSubs();
  if (pc) { try { pc.close(); } catch (e) {} pc = null; }
  if (localStream) { localStream.getTracks().forEach(t => t.stop()); localStream = null; }
  remoteStream = null;
  hideCallUI();
  if (meta) {
    await logCallHistory(meta.peerUid, meta.peerName, meta.isVideo, meta.direction, meta.outcome || 'completed');
  }
  if (updateRemote && cid && me) {
    try {
      await db.collection('calls').doc(cid).set({
        status: 'ended',
        endedBy: me.uid,
        endedAt: firebase.firestore.FieldValue.serverTimestamp()
      }, { merge: true });
    } catch (e) {}
  }
}

async function flushCands() {
  if (!pc || !pc.remoteDescription || !pc.remoteDescription.type) return;
  const list = pendingCands.splice(0, pendingCands.length);
  for (const c of list) {
    try { await pc.addIceCandidate(new RTCIceCandidate(c)); } catch (e) {}
  }
}

function attachRemoteTrack(track, stream) {
  if (!remoteStream) remoteStream = new MediaStream();
  if (stream && stream.getTracks) {
    stream.getTracks().forEach(t => {
      if (!remoteStream.getTracks().some(rt => rt.id === t.id)) remoteStream.addTrack(t);
    });
  } else if (track && !remoteStream.getTracks().some(rt => rt.id === track.id)) {
    remoteStream.addTrack(track);
  }
  if (track && track.kind === 'video') {
    callIsVideo = true;
    $cav.style.display = 'none';
    $remV.style.display = 'block';
    $locV.style.display = 'block';
  }
  syncMediaElements();
}

async function setupPeer(callDocRef, isCaller, isVideo) {
  pendingCands = [];
  isSettingRemote = false;
  currentFacingMode = 'user';
  callIsVideo = !!isVideo;
  pc = new RTCPeerConnection(RTC_CFG);
  remoteStream = new MediaStream();
  $remA.srcObject = remoteStream;
  $remA.muted = false;
  $remV.srcObject = remoteStream;
  $remV.muted = false;

  const audioConstraints = {
    echoCancellation: { ideal: true },
    noiseSuppression: { ideal: true },
    autoGainControl: { ideal: false },
    googEchoCancellation: true,
    googNoiseSuppression: true,
    googAutoGainControl: false,
    googHighpassFilter: true
  };

  try {
    localStream = await navigator.mediaDevices.getUserMedia({
      audio: audioConstraints,
      video: isVideo ? { facingMode: { ideal: 'user' }, width: { ideal: 640 }, height: { ideal: 480 } } : false
    });
  } catch (err) {
    if (isVideo) {
      toast('Camera payni, audio call-e chesta korchi...');
      localStream = await navigator.mediaDevices.getUserMedia({ audio: audioConstraints, video: false });
      isVideo = false;
      callIsVideo = false;
      $cav.style.display = 'flex';
      $remV.style.display = 'none';
      $locV.style.display = 'none';
    } else {
      throw err;
    }
  }

  localStream.getTracks().forEach(track => pc.addTrack(track, localStream));
  if (isVideo) {
    $locV.srcObject = localStream;
    $locV.muted = true;
    $locV.play().catch(() => {});
  }

  pc.ontrack = e => {
    attachRemoteTrack(e.track, e.streams && e.streams[0]);
    const hasVid = remoteStream.getVideoTracks().length > 0 || callIsVideo;
    $cst.textContent = hasVid ? '📹 Video call connected' : '🔊 Audio call connected';
  };

  pc.oniceconnectionstatechange = () => {
    if (!pc) return;
    if (pc.iceConnectionState === 'connected' || pc.iceConnectionState === 'completed') {
      syncMediaElements();
      const hasVid = (remoteStream && remoteStream.getVideoTracks().length > 0) || callIsVideo;
      $cst.textContent = hasVid ? '📹 Video call connected' : '🔊 Audio call connected';
    } else if (pc.iceConnectionState === 'failed') {
      toast('Network / ICE connection fail koreche');
      endCall(true);
    }
  };

  pc.onconnectionstatechange = () => {
    if (!pc) return;
    if (pc.connectionState === 'connected') {
      syncMediaElements();
      const hasVid = (remoteStream && remoteStream.getVideoTracks().length > 0) || callIsVideo;
      $cst.textContent = hasVid ? '📹 Video call connected' : '🔊 Audio call connected';
    } else if (pc.connectionState === 'disconnected') {
      $cst.textContent = 'Connection interrupted...';
    } else if (pc.connectionState === 'failed') {
      toast('Call connect hoyni (network shomossha)');
      endCall(true);
    }
  };

  const candCol = callDocRef.collection(isCaller ? 'callerCandidates' : 'calleeCandidates');
  const remoteCandCol = callDocRef.collection(isCaller ? 'calleeCandidates' : 'callerCandidates');

  pc.onicecandidate = e => {
    if (e.candidate) candCol.add(e.candidate.toJSON()).catch(() => {});
  };

  const unsubCands = remoteCandCol.onSnapshot(snap => {
    snap.docChanges().forEach(ch => {
      if (ch.type === 'added') pendingCands.push(ch.doc.data());
    });
    flushCands();
  }, () => {});
  callUnsubs.push(unsubCands);

  let seen = false;
  const unsubDoc = callDocRef.onSnapshot(snap => {
    if (!snap.exists) { if (seen) endCall(false); return; }
    seen = true;
    const d = snap.data();
    if (d.status === 'ended' || d.status === 'declined') {
      if (currentCallMeta) currentCallMeta.outcome = d.status === 'declined' ? 'declined' : 'completed';
      toast(d.status === 'declined' ? 'Call decline kora hoyeche' : 'Call sesh hoyeche');
      endCall(false);
    }
  }, () => {});
  callUnsubs.push(unsubDoc);
}

async function startCall(peerUid, peerName, isVideo) {
  if (!me || !peerUid) return;
  if (myBlocked().includes(peerUid)) { toast('Apni ei user-ke block kore rekhechen'); return; }
  if (activeCallId) { toast('Agei ekta call cholche'); return; }
  if (!navigator.mediaDevices?.getUserMedia || !window.RTCPeerConnection) {
    toast('Ei browser-e call supported noy'); return;
  }
  await ensureNotifPermission();
  const callDoc = db.collection('calls').doc();
  activeCallId = callDoc.id;
  currentCallMeta = { peerUid, peerName, isVideo: !!isVideo, direction: 'outgoing', outcome: 'outgoing' };
  showCallUI(peerName, isVideo ? '📹 Video call korchi...' : '📞 Audio call korchi...', isVideo, 'active');

  try {
    await setupPeer(callDoc, true, isVideo);
    const offer = await pc.createOffer({ offerToReceiveAudio: true, offerToReceiveVideo: !!isVideo });
    await pc.setLocalDescription(offer);
    await callDoc.set({
      callerId: me.uid,
      callerName: myName(),
      calleeId: peerUid,
      calleeName: peerName,
      participants: [me.uid, peerUid],
      isVideo: !!isVideo,
      status: 'ringing',
      offer: { type: offer.type, sdp: offer.sdp },
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });

    const unsubAns = callDoc.onSnapshot(async snap => {
      if (!snap.exists || !pc || isSettingRemote) return;
      const d = snap.data();
      if (d.status === 'declined') {
        if (currentCallMeta) currentCallMeta.outcome = 'declined';
        toast('Call decline kora hoyeche');
        endCall(false);
        return;
      }
      if (d.answer && d.answer.sdp && !pc.remoteDescription) {
        isSettingRemote = true;
        if (currentCallMeta) currentCallMeta.outcome = 'connected';
        try {
          await pc.setRemoteDescription(new RTCSessionDescription(d.answer));
          $cst.textContent = 'Connecting...';
          syncMediaElements();
          await flushCands();
        } catch (e) {
          toast('Answer error: ' + e.message);
        } finally {
          isSettingRemote = false;
        }
      }
    }, err => toast('Call sync error: ' + err.message));
    callUnsubs.push(unsubAns);

    const myCallId = callDoc.id;
    ringTimer = setTimeout(() => {
      if (activeCallId === myCallId && pc && !pc.remoteDescription) {
        if (currentCallMeta) currentCallMeta.outcome = 'missed';
        toast('Keu call dhorenni');
        endCall(true);
      }
    }, 45000);
  } catch (e) {
    toast('Call shuru kora jayni: ' + (e.message || 'Mic/Camera permission din'));
    endCall(true);
  }
}

async function acceptCall(callData, callDoc) {
  stopRingtone();
  if (activeCallId) return;
  if (!callData?.offer?.sdp) {
    toast('Call offer pawa jayni');
    ringingCallId = null;
    hideCallUI();
    return;
  }
  const isVideo = !!callData.isVideo;
  ringingCallId = null;
  activeCallId = callDoc.id;
  currentCallMeta = {
    peerUid: callData.callerId,
    peerName: callData.callerName || 'User',
    isVideo,
    direction: 'incoming',
    outcome: 'answered'
  };
  showCallUI(callData.callerName || 'User', 'Connecting...', isVideo, 'active');

  try {
    await setupPeer(callDoc, false, isVideo);
    isSettingRemote = true;
    await pc.setRemoteDescription(new RTCSessionDescription(callData.offer));
    isSettingRemote = false;
    await flushCands();
    const answer = await pc.createAnswer();
    await pc.setLocalDescription(answer);
    syncMediaElements();
    await callDoc.update({
      status: 'accepted',
      answer: { type: answer.type, sdp: answer.sdp }
    });
  } catch (e) {
    toast('Call receive kora jayni: ' + (e.message || 'Mic/Camera permission din'));
    endCall(true);
  }
}

function listenIncomingCalls() {
  if (callWatchUnsub) { callWatchUnsub(); callWatchUnsub = null; }
  if (!me) return;
  let initialLoadDone = false;

  callWatchUnsub = db.collection('calls')
    .where('calleeId', '==', me.uid)
    .onSnapshot(snap => {
      if (!initialLoadDone) {
        initialLoadDone = true;
        snap.docs.forEach(docSnap => {
          const d = docSnap.data() || {};
          const age = Date.now() - tsMs(d.createdAt);
          if (d.status === 'ringing' && age < 60000 && !activeCallId && !ringingCallId) {
            presentIncoming(docSnap.id, d, docSnap.ref);
          }
        });
        return;
      }

      snap.docChanges().forEach(ch => {
        const id = ch.doc.id;
        const d = ch.doc.data() || {};

        if (ch.type === 'removed' || (d.status && d.status !== 'ringing')) {
          if (ringingCallId === id) {
            ringingCallId = null;
            stopRingtone();
            if (!activeCallId) hideCallUI();
            if (d.status === 'ended') {
              logCallHistory(d.callerId, d.callerName || 'User', !!d.isVideo, 'incoming', 'missed');
            }
          }
          return;
        }

        if (ch.type === 'added' && d.status === 'ringing' && !activeCallId && !ringingCallId) {
          presentIncoming(id, d, ch.doc.ref);
        }
      });
    }, err => {
      toast('Incoming call listener error: ' + (err.message || err.code));
    });

  function presentIncoming(id, d, docRef) {
    if (myBlocked().includes(d.callerId)) return;
    ringingCallId = id;
    triggerNotification(
      d.callerName || tr('appName'),
      d.isVideo ? '📹 Incoming Video Call...' : '📞 Incoming Audio Call...',
      true
    );
    showCallUI(
      d.callerName || 'User',
      d.isVideo ? '📹 Incoming Video Call...' : '📞 Incoming Audio Call...',
      !!d.isVideo,
      'incoming'
    );

    const decBtn = document.getElementById('cdec');
    const accBtn = document.getElementById('cacc');
    if (decBtn) {
      decBtn.onclick = async () => {
        ringingCallId = null;
        stopRingtone();
        await logCallHistory(d.callerId, d.callerName || 'User', !!d.isVideo, 'incoming', 'missed');
        try { await docRef.update({ status: 'declined' }); } catch (e) {}
        hideCallUI();
      };
    }
    if (accBtn) {
      accBtn.onclick = () => acceptCall(d, docRef);
    }
  }
}

/* ---------- ONLINE STATUS (presence) ---------- */
async function setOnline(online) {
  if (!me || !profile) return;
  try {
    await db.collection('presence').doc(me.uid).set({
      online: !!online,
      lastSeen: firebase.firestore.FieldValue.serverTimestamp()
    }, { merge: true });
  } catch (e) {}
}

function startPresence() {
  stopPresence();
  const visible = () => document.visibilityState === 'visible';
  setOnline(visible());
  presenceTimer = setInterval(() => { if (visible()) setOnline(true); }, 45000);
  const onVis = () => setOnline(visible());
  const onOff = () => setOnline(false);
  document.addEventListener('visibilitychange', onVis);
  window.addEventListener('pagehide', onOff);
  presenceCleanup = () => {
    document.removeEventListener('visibilitychange', onVis);
    window.removeEventListener('pagehide', onOff);
  };
}

function stopPresence() {
  if (presenceTimer) { clearInterval(presenceTimer); presenceTimer = null; }
  if (presenceCleanup) { presenceCleanup(); presenceCleanup = null; }
}

function fmtStatus(p, canSee = true) {
  if (!canSee || !p) return '';
  if (isOnline(p)) return '🟢 Online';
  const d = p.lastSeen?.toDate?.();
  if (!d) return '';
  const hh = String(d.getHours()).padStart(2, '0');
  const mm = String(d.getMinutes()).padStart(2, '0');
  return `Last seen ${hh}:${mm}`;
}

auth.onAuthStateChanged(async u => {
  me = u; stop(); stopPresence(); appUnlocked = false;
  if (callWatchUnsub) { callWatchUnsub(); callWatchUnsub = null; }
  if (msgAlertUnsub) { msgAlertUnsub(); msgAlertUnsub = null; }
  await endCall(false);
  if (!u) { profile = null; applyTheme(); authView(true); return; }
  if (signingUp) return;

});

}

/* ---------- EMAIL VERIFY ---------- */
function verifyView(msg = '', good = false) {
  stop();
  currentScreenName = 'verify';
  applyTheme();
  $app.innerHTML = `
    <div class="auth">
      <h1>📧 Email verify korun</h1>
      <p class="hint">Apnar email <b>${esc(me.email)}</b> e ekta link pathano hoyeche. Email kholun (Spam folder o dekhun), link e chapun. Tarpor niche button chapun.</p>
      ${msg ? `<p class="${good ? 'ok' : 'err'}">${esc(msg)}</p>` : ''}
      <button class="btn" id="ok">Ami verify korechi</button>

      <button class="link" id="lo">${esc(tr('logout'))}</button>
    </div>`;
  document.getElementById('lo').onclick = () => auth.signOut();
  document.getElementById('rs').onclick = async () => {

    catch (ex) { verifyView(ex.message); }
  };
  document.getElementById('ok').onclick = async () => {
    try {
      await me.reload();

async function route() {
  try {
    const d = await db.collection('users').doc(me.uid).get();
    if (d.exists && d.data().username) {
      profile = d.data();
      if (!profile.lang) profile.lang = currentLang();
      localStorage.setItem('amar_chat_lang', profile.lang);
      applyTheme();
      ensureNotifPermission();
      startPresence();
      listenIncomingCalls();
      watchChatNotifications();
      const afterUnlock = () => home('chats', false);
      profile.pinCode = localStorage.getItem('amar_chat_pin') || '';
      if (profile.pinCode && !appUnlocked) pinLockView(afterUnlock);
      else afterUnlock();
    } else {
      usernameSetup();
    }
  } catch (e) {
    $app.innerHTML = `<div class="empty">Error: ${esc(e.message)}</div>`;
  }
}

async function claimUsername(username, name) {
  const baseDoc = {
    uid: me.uid, name, username,
    about: 'Hey there! I am using Amar Chat.',
    photo: '', blocked: [], starred: [], darkMode: false, soundEnabled: true,
    lang: currentLang(),
    privacy: { lastSeen: true, readReceipts: true }
  };
  const batch = db.batch();
  batch.set(db.collection('usernames').doc(username), { uid: me.uid, name });
  batch.set(db.collection('users').doc(me.uid), baseDoc, { merge: true });
  await batch.commit();
  profile = baseDoc;
}

/* ---------- LOGIN / SIGNUP + PASSWORD RESET ---------- */
function authView(isLogin, err = '', okMsg = '', prefEmail = '') {
  currentScreenName = 'auth';
  let friendlyErr = err;
  if (err && (err.includes('INVALID_LOGIN_CREDENTIALS') || err.includes('invalid-credential') || err.includes('wrong-password'))) {
    friendlyErr = 'Email ba Password vul ache. Abar check korun ba "Password bhule gechen?" chapun.';
  } else if (err && err.includes('user-not-found')) {
    friendlyErr = 'Ei email-e kono account nei. Age "Notun? Account kholun" diye account toiri korun.';
  } else if (err && err.includes('too-many-requests')) {
    friendlyErr = 'Onekbar vul chesta kora hoyeche. Kichu somoy por abar chesta korun.';
  }

  $app.innerHTML = `
    <div class="auth">
      <h1>💬 ${esc(tr('appName'))}</h1>
      ${isLogin ? '' : `
        <input type="text" id="nm" placeholder="Apnar naam">
        <p class="hint">Email verify korar por apni nijer username ba phone number thik korben.</p>`}
      <input type="email" id="em" placeholder="Email" value="${esc(prefEmail)}" autocomplete="email">
      <input type="password" id="pw" placeholder="Password (kompokkhe 6 okkhor)" autocomplete="${isLogin ? 'current-password' : 'new-password'}">
      ${friendlyErr ? `<p class="err">${esc(friendlyErr)}</p>` : ''}
      ${okMsg ? `<p class="ok">${esc(okMsg)}</p>` : ''}
      <button class="btn" id="go">${isLogin ? 'Login' : 'Account kholun'}</button>
      ${isLogin ? '<button class="link" id="rst">Password bhule gechen? (Email-e reset link)</button>' : ''}
      <button class="link" id="sw">${isLogin ? 'Notun? Account kholun' : 'Account ache? Login korun'}</button>
    </div>`;

  document.getElementById('sw').onclick = () => authView(!isLogin, '', '', document.getElementById('em').value.trim());

  const rstBtn = document.getElementById('rst');
  if (rstBtn) {
    rstBtn.onclick = async () => {
      const email = document.getElementById('em').value.trim();
      if (!email) return authView(true, 'Age upore apnar Email likhun, tarpor Reset chapun');
      rstBtn.disabled = true;
      try {
        await auth.sendPasswordResetEmail(email);
        authView(true, '', 'Password reset link apnar email-e pathano hoyeche (Spam folder-o dekhun).', email);
      } catch (ex) {
        authView(true, ex.message, '', email);
      }
    };
  }

  document.getElementById('go').onclick = async (e) => {
    const btn = e.target;
    btn.disabled = true;
    const email = document.getElementById('em').value.trim();
    const pw = document.getElementById('pw').value;
    if (!email || !pw) {
      authView(isLogin, 'Email ar Password dutoi likhun', '', email);
      return;
    }
    if (isLogin) {
      try {
        await auth.signInWithEmailAndPassword(email, pw);
      } catch (ex) {
        authView(true, ex.message, '', email);
      }
      return;
    }
    const name = document.getElementById('nm').value.trim();
    if (!name) {
      authView(false, 'Apnar naam likhun', '', email);
      return;
    }
    signingUp = true;
    try {
      const c = await auth.createUserWithEmailAndPassword(email, pw);
      me = c.user;
      await c.user.updateProfile({ displayName: name });
      await c.user.sendEmailVerification();
      verifyView('Verify email pathano hoyeche.', true);
    } catch (ex) {
      authView(false, ex.message, '', email);
    } finally {
      signingUp = false;
    }
  };
}

      batch.set(db.collection('users').doc(me.uid), { name, about, photo: newPhoto, lang, soundEnabled, privacy, pinCode: firebase.firestore.FieldValue.delete(), darkMode }, { merge: true });
      batch.set(db.collection('usernames').doc(profile.username), { name }, { merge: true });
      await batch.commit();
      profile.name = name;
      profile.about = about;
      profile.photo = newPhoto;
      profile.lang = lang;
      profile.soundEnabled = soundEnabled;
      profile.privacy = privacy;
      if (pinCode) localStorage.setItem('amar_chat_pin', pinCode);
      else localStorage.removeItem('amar_chat_pin');
      profile.pinCode = pinCode;
      profile.darkMode = darkMode;
      localStorage.setItem('amar_chat_lang', lang);
      applyTheme();
      appUnlocked = true;
      toast(tr('saveBtn'));
      home('chats', false);
    } catch (ex) {
      toast('Save kora jayni: ' + ex.message);
      e.target.disabled = false;
    }
  };

  document.getElementById('unbtn').onclick = async () => {
    const nextUn = normUn(document.getElementById('newun').value);
    if (!UN_RE.test(nextUn)) return toast(UN_HELP);
    const oldUn = profile.username;
    if (nextUn === oldUn) return toast('Eta already apnar username');
    try {
      const snap = await db.collection('usernames').doc(nextUn).get();
      if (snap.exists && snap.data().uid !== me.uid) {
        return toast('Ei username onno kew nise');
      }
      const batch = db.batch();
      batch.set(db.collection('usernames').doc(nextUn), { uid: me.uid, name: myName() });
      if (oldUn) batch.delete(db.collection('usernames').doc(oldUn));
      batch.set(db.collection('users').doc(me.uid), { username: nextUn }, { merge: true });
      await batch.commit();
      profile.username = nextUn;
      toast(`Username updated: @${nextUn}`);
      profileView();
    } catch (ex) {
      toast('Username update kora jayni: ' + ex.message);
    }
  };

  document.getElementById('embtn').onclick = async () => {
    const nextEm = document.getElementById('newem').value.trim();
    const curPw = document.getElementById('emcurpw').value;
    if (!nextEm || !nextEm.includes('@')) return toast('Valid email likhun');
    if (!curPw) return toast('Current password din');
    try {
      const cred = firebase.auth.EmailAuthProvider.credential(me.email, curPw);
      await me.reauthenticateWithCredential(cred);
      await me.verifyBeforeUpdateEmail(nextEm);
      document.getElementById('emcurpw').value = '';
      toast('Notun email-e verification link pathano hoyeche');
    } catch (ex) {
      toast('Email update kora jayni: ' + ex.message);
    }
  };

  async function renderBlockList() {
    const box = document.getElementById('blklist');
    const ids = myBlocked();
    if (!ids.length) {
      box.innerHTML = `<div class="hint" style="margin:0">${esc(tr('noBlk'))}</div>`;
      return;
    }
    const labels = {};
    for (const uid of ids) {
      try {
        const d = await db.collection('users').doc(uid).get();
        labels[uid] = d.exists ? `${d.data().name || 'User'}${d.data().username ? ' (@' + d.data().username + ')' : ''}` : uid;
      } catch (e) { labels[uid] = uid; }
    }
    box.innerHTML = ids.map(uid => `
      <div class="mrow">
        <span>${esc(labels[uid] || uid)}</span>
        <button class="btn sm sec unblkrow" data-u="${esc(uid)}" style="padding:5px 10px;font-size:12px">${esc(tr('unblkBtn'))}</button>
      </div>`).join('');
    box.querySelectorAll('.unblkrow').forEach(btn => {
      btn.onclick = async () => {
        const uid = btn.dataset.u;
        await db.collection('users').doc(me.uid).set({
          blocked: firebase.firestore.FieldValue.arrayRemove(uid)
        }, { merge: true });
        profile.blocked = myBlocked().filter(x => x !== uid);
        toast(tr('unblkBtn'));
        renderBlockList();
      };
    });
  }
  renderBlockList();

  document.getElementById('pwbtn').onclick = async () => {
    const np = document.getElementById('newpw').value;
    if (!np || np.length < 6) return toast('Kompokkhe 6 okkhor-er password din');
    try {
      await me.updatePassword(np);
      document.getElementById('newpw').value = '';
      toast('Password poriborton hoyeche');
    } catch (ex) {
      toast('Age logout kore abar login korun, tarpor password bodlan: ' + ex.message);
    }
  };

  document.getElementById('delacc').onclick = async () => {
    if (!confirm(tr('delHint'))) return;
    try {
      await db.collection('users').doc(me.uid).delete().catch(() => {});
      await db.collection('usernames').doc(profile.username).delete().catch(() => {});
      await me.delete();
      toast('Account delete hoyeche');
    } catch (ex) {
      toast('Account delete korte age logout-login korun: ' + ex.message);
    }
  };
}

/* ---------- USERNAME DIYE KHOJA ---------- */
async function lookup(raw) {
  const u = normUn(raw);
  if (!UN_RE.test(u)) throw new Error(UN_HELP);
  const d = await db.collection('usernames').doc(u).get();
  if (!d.exists) throw new Error('Ei username e kew nei');
  const x = d.data();
  if (x.uid === me.uid) throw new Error('Eta apnar nijer username');
  return { uid: x.uid, name: x.name, username: u };
}

/* ---------- STATUS POST MODAL (PRIVACY: ALL / SELECTED + VIEWERS + STATUS REPLY) ---------- */
async function openStatusModal() {
  const modal = document.createElement('div');
  modal.className = 'modal';
  modal.innerHTML = `
    <div class="mbox">
      <div class="mhead"><span>🟢 Notun Status Post</span><button id="scl">✕</button></div>
      <div class="mbody">
        <input type="text" id="stinp" placeholder="Apnar status likhun (24h thakbe)...">
        <label class="hint"><b>Status Privacy</b></label>
        <select id="stpriv">
          <option value="all">Sobar sathe share (All)</option>
          <option value="selected">Shudhu selected bondhuder sathe</option>
        </select>
        <div id="stpick" style="display:none;max-height:170px;overflow:auto;border:1px solid var(--bd);border-radius:8px;padding:8px;margin-bottom:12px">
          <div class="hint">Loading bondhu...</div>
        </div>
        <button class="btn" id="stpost">Post Status</button>
      </div>
    </div>`;
  document.body.appendChild(modal);
  modal.querySelector('#scl').onclick = () => modal.remove();
  modal.onclick = e => { if (e.target === modal) modal.remove(); };

  const privSel = modal.querySelector('#stpriv');
  const pickBox = modal.querySelector('#stpick');
  let contactsLoaded = false;

  privSel.onchange = async () => {
    const show = privSel.value === 'selected';
    pickBox.style.display = show ? 'block' : 'none';
    if (show && !contactsLoaded) {
      contactsLoaded = true;
      try {
        const cSnap = await db.collection('chats').where('members', 'array-contains', me.uid).get();
        const peers = {};
        cSnap.docs.forEach(d => {
          const cd = d.data();
          (cd.members || []).forEach(uid => {
            if (uid !== me.uid) peers[uid] = cd.memberNames?.[uid] || 'User';
          });
        });
        const entries = Object.entries(peers);
        if (!entries.length) {
          pickBox.innerHTML = '<div class="hint" style="margin:0">Kono bondhu pawa jayni</div>';
        } else {
          pickBox.innerHTML = entries.map(([uid, nm]) => `
            <label class="togrow" style="padding:4px 0">
              <span>${esc(nm)}</span>
              <input type="checkbox" class="stchk" value="${esc(uid)}">
            </label>`).join('');
        }
      } catch (e) {
        pickBox.innerHTML = '<div class="err" style="margin:0">Load kora jayni</div>';
      }
    }
  };

  modal.querySelector('#stpost').onclick = async () => {
    const clean = modal.querySelector('#stinp').value.trim();
    if (!clean) return toast('Status khali rakha jabe na');
    const privacy = privSel.value;
    const allowedUids = privacy === 'selected'
      ? [...modal.querySelectorAll('.stchk:checked')].map(x => x.value)
      : [];
    if (privacy === 'selected' && !allowedUids.length) {
      return toast('Kompokkhe 1 jon bondhu select korun');
    }
    const now = Date.now();
    try {
      await db.collection('statuses').add({
        uid: me.uid,
        userName: myName(),
        photo: profile.photo || '',
        text: clean,
        privacy,
        allowedUids,
        viewedBy: [],
        createdAt: now,
        expiresAt: now + 24 * 60 * 60 * 1000
      });
      modal.remove();
      toast('Status post hoyeche');
      home('status', false);
    } catch (e) {
      toast('Status post kora jayni: ' + e.message);
    }
  };
}

async function sendStatusReply(statusObj, replyText) {
  const clean = String(replyText || '').trim();
  if (!clean || !statusObj?.uid || statusObj.uid === me.uid) return;
  const ids = [me.uid, statusObj.uid].sort();
  const cid = ids.join('_');
  const FV = firebase.firestore.FieldValue;
  await db.collection('chats').doc(cid).set({
    isGroup: false,
    members: ids,
    memberNames: { [me.uid]: myName(), [statusObj.uid]: statusObj.userName || 'User' },
    lastMessage: `Status reply: ${clean}`,
    updatedAt: FV.serverTimestamp()
  }, { merge: true });
  await db.collection('chats').doc(cid).collection('messages').add({
    senderId: me.uid,
    senderName: myName(),
    text: clean,
    replyTo: { id: statusObj.id, senderName: statusObj.userName || 'Status', preview: `Status: ${statusObj.text}` },
    reactions: {},
    hiddenFor: [],
    edited: false,
    deleted: false,
    deliveredTo: [me.uid],
    seenBy: [me.uid],
    createdAt: FV.serverTimestamp()
  });
  toast('Status reply pathano hoyeche');
}

/* ---------- CHAT LIST + DRAFT PREVIEW + STATUS + CALLS ---------- */
function chatTitle(c) {
  if (c.isGroup) return c.name || 'Group';
  const oid = otherUid(c);
  if (oid && userProfilesCache[oid]?.name) return userProfilesCache[oid].name;
  const names = c.memberNames || {};
  for (const k in names) if (k !== me.uid) return names[k];
  return 'Chat';
}

function otherUid(c) {
  if (c.isGroup) return null;
  return (c.members || []).find(id => id !== me.uid) || null;
}

function home(activeTab = 'chats', showArchived = false) {
  stop();
  currentScreenName = 'home';
  ensureRootHistoryAnchor();
  applyTheme();
  let allChats = [];
  let presMap = {};
  let unreadMap = {};
  let statusDocs = [];
  let callLogs = [];
  let searchTerm = '';

  $app.innerHTML = `
    <header>
      <div class="hav" id="myav" title="${esc(tr('settingsTitle'))}" style="cursor:pointer">${avHtml(profile.photo, myName())}</div>
      <span>${esc(tr('appName'))}</span>
      <span class="sp"></span>
      <span class="un">@${esc(profile.username)}</span>
      <button id="darkquick" title="Dark Mode">${isDarkMode() ? '☀️' : '🌙'}</button>
      <button id="lo" title="${esc(tr('logout'))}">${esc(tr('logout'))}</button>
    </header>
    <div class="tabs">
      <button id="t_chats" class="${activeTab === 'chats' ? 'on' : ''}">${esc(tr('chatsTab'))}</button>
      <button id="t_status" class="${activeTab === 'status' ? 'on' : ''}">${esc(tr('statusTab'))}</button>
      <button id="t_calls" class="${activeTab === 'calls' ? 'on' : ''}">${esc(tr('callsTab'))}</button>
    </div>
    <div id="topslot"></div>
    <div class="list" id="ls"><div class="empty">Loading...</div></div>
    <button class="fab" id="fab">+</button>
    <div class="menu" id="mn" style="display:none">
      <div id="m1">👤 Notun chat</div>
      <div id="m2">👥 Notun group</div>
      <div id="m5">🟢 Status post korun</div>
      <div id="m4">⭐ Starred Messages</div>
      <div id="m3">${esc(tr('settingsTitle'))}</div>
    </div>`;

  document.getElementById('myav').onclick = profileView;
  document.getElementById('darkquick').onclick = async () => {
    const nextDark = !isDarkMode();
    profile.darkMode = nextDark;
    applyTheme();
    try { await db.collection('users').doc(me.uid).set({ darkMode: nextDark }, { merge: true }); } catch (e) {}
    home(activeTab, showArchived);
  };
  document.getElementById('lo').onclick = async () => { await setOnline(false); auth.signOut(); };
  document.getElementById('t_chats').onclick = () => home('chats', false);
  document.getElementById('t_status').onclick = () => home('status', false);
  document.getElementById('t_calls').onclick = () => home('calls', false);

  const mn = document.getElementById('mn');
  document.getElementById('fab').onclick = () => mn.style.display = mn.style.display === 'none' ? 'block' : 'none';
  document.getElementById('m1').onclick = newChat;
  document.getElementById('m2').onclick = newGroup;
  document.getElementById('m5').onclick = () => { mn.style.display = 'none'; openStatusModal(); };
  document.getElementById('m4').onclick = starredView;
  document.getElementById('m3').onclick = profileView;

  const renderBody = () => {
    const ls = document.getElementById('ls');
    const topslot = document.getElementById('topslot');
    if (!ls || !topslot) return;

    if (activeTab === 'status') {
      topslot.innerHTML = `<div class="archbar" id="newstbar"><span>+ Notun Status Post Korun</span><span>24h</span></div>`;
      document.getElementById('newstbar').onclick = openStatusModal;
      const now = Date.now();
      const valid = statusDocs.filter(s => {
        if ((s.expiresAt || 0) <= now) return false;
        if (s.uid === me.uid) return true;
        if (s.privacy === 'selected') return Array.isArray(s.allowedUids) && s.allowedUids.includes(me.uid);
        return true;
      });
      if (!valid.length) {
        ls.innerHTML = '<div class="empty">Ekhon kono active status nei. Upore chap diye status din.</div>';
        return;
      }
      ls.innerHTML = valid.map(s => {
        const viewers = Array.isArray(s.viewedBy) ? s.viewedBy : [];
        const isMine = s.uid === me.uid;
        return `<div class="row strow" data-id="${s.id}">
          <div class="av ring">${avHtml(s.photo, s.userName)}</div>
          <div class="mid">
            <div class="t">${esc(s.userName || 'User')} ${s.privacy === 'selected' ? '<span style="font-size:11px;color:var(--g)">🔒 Selected</span>' : ''}</div>
            <div class="s">${esc(s.text || '')}</div>
          </div>
          ${isMine ? `<span class="hint" style="margin:0">👁 ${viewers.length}</span>` : ''}
        </div>`;
      }).join('');
      ls.querySelectorAll('.strow').forEach(r => {
        const st = valid.find(x => x.id === r.dataset.id);
        if (!st) return;
        r.onclick = async () => {
          const viewers = Array.isArray(st.viewedBy) ? [...st.viewedBy] : [];
          if (st.uid !== me.uid && !viewers.some(v => v.uid === me.uid)) {
            const entry = { uid: me.uid, name: myName() };
            viewers.push(entry);
            try {
              await db.collection('statuses').doc(st.id).update({
                viewedBy: firebase.firestore.FieldValue.arrayUnion(entry)
              });
              st.viewedBy = viewers;
            } catch (e) {}
          }
          const viewerHtml = st.uid === me.uid
            ? `<div class="viewers"><b>👁 ${esc(tr('seenBy'))} (${viewers.length}):</b><br>${viewers.length ? viewers.map(v => esc(v.name || 'User')).join(', ') : 'Ekhono kew dekhenni'}</div>`
            : `<div class="streply" onclick="event.stopPropagation()">
                <input type="text" id="strinp" placeholder="${esc(st.userName || 'Status')}-ke reply likhun...">
                <button type="button" id="strbtn">➤</button>
              </div>`;
          openLightbox(st.text, `${st.userName} • Status`, true, viewerHtml);
          const strbtn = document.getElementById('strbtn');
          const strinp = document.getElementById('strinp');
          if (strbtn && strinp) {
            const doRep = async () => {
              const v = strinp.value.trim();
              if (!v) return;
              await sendStatusReply(st, v);
              const lb = document.querySelector('.lbox');
              if (lb) lb.remove();
            };
            strbtn.onclick = doRep;
            strinp.onkeydown = e => { if (e.key === 'Enter') doRep(); };
          }
        };
      });
      return;
    }

    if (activeTab === 'calls') {
      topslot.innerHTML = '';
      if (!callLogs.length) {
        ls.innerHTML = '<div class="empty">Kono call history nei.</div>';
        return;
      }
      ls.innerHTML = callLogs.map(c => {
        const dt = c.createdAt?.toDate?.();
        const tm = dt ? `${String(dt.getHours()).padStart(2, '0')}:${String(dt.getMinutes()).padStart(2, '0')}` : '';
        const icon = c.direction === 'incoming' ? '↙' : '↗';
        const mode = c.isVideo ? '📹 Video' : '📞 Audio';
        const isMissed = c.outcome === 'missed';
        return `<div class="row callrow" data-uid="${esc(c.peerUid)}" data-name="${esc(c.peerName)}" data-vid="${c.isVideo ? '1' : '0'}">
          <div class="av">${esc((c.peerName || '?')[0]?.toUpperCase() || '?')}</div>
          <div class="mid">
            <div class="t" style="color:${isMissed ? '#e53935' : 'inherit'}">${esc(c.peerName || 'User')} ${isMissed ? '• Missed' : ''}</div>
            <div class="s" style="color:${isMissed ? '#e53935' : 'var(--sub)'}">${icon} ${mode} • ${esc(c.outcome || '')} ${tm ? '• ' + tm : ''}</div>
          </div>
          <span class="hint" style="margin:0">Call</span>
        </div>`;
      }).join('');
      ls.querySelectorAll('.callrow').forEach(r => {
        r.onclick = () => startCall(r.dataset.uid, r.dataset.name, r.dataset.vid === '1');
      });
      return;
    }

    topslot.innerHTML = `<div class="searchbox"><input type="text" id="srch" placeholder="🔍 Chat ba bondhu khujun..." value="${esc(searchTerm)}"></div><div id="archslot"></div>`;
    const srchEl = document.getElementById('srch');
    srchEl.addEventListener('input', e => {
      searchTerm = e.target.value;
      renderBody();
    });

    const visibleChats = allChats.filter(c => {
      const delTs = tsMs(c.deletedAt?.[me.uid]);
      const updTs = tsMs(c.updatedAt);
      if (delTs && updTs && updTs <= delTs) return false;
      return true;
    });

    const archivedCount = visibleChats.filter(c => !!c.archivedBy?.[me.uid]).length;
    const archslot = document.getElementById('archslot');
    if (archslot) {
      if (showArchived) {
        archslot.innerHTML = `<div class="archbar" id="archtog"><span>← Sob Chat-e fire jan</span><span>${archivedCount}</span></div>`;
      } else if (archivedCount > 0) {
        archslot.innerHTML = `<div class="archbar" id="archtog"><span>📦 Archived Chats</span><span>${archivedCount}</span></div>`;
      } else {
        archslot.innerHTML = '';
      }
      const tog = document.getElementById('archtog');
      if (tog) tog.onclick = () => home('chats', !showArchived);
    }

    const q = searchTerm.trim().toLowerCase();
    const filtered = visibleChats.filter(c => {
      const isArch = !!c.archivedBy?.[me.uid];
      if (showArchived !== isArch) return false;
      if (!q) return true;
      const t = chatTitle(c).toLowerCase();
      const lm = (c.lastMessage || '').toLowerCase();
      const oid = otherUid(c);
      const un = (oid && c.memberUsernames?.[oid]) ? c.memberUsernames[oid].toLowerCase() : '';
      return t.includes(q) || lm.includes(q) || un.includes(q);
    });

    if (!filtered.length) {
      ls.innerHTML = q
        ? '<div class="empty">Kono chat khuje pawa jayni.</div>'
        : showArchived
          ? '<div class="empty">Kono archived chat nei.</div>'
          : '<div class="empty">Kono chat nei.<br>Niche + chap diye bondhur username khuje shuru korun.</div>';
      return;
    }

    ls.innerHTML = filtered.map(c => {
      const t = chatTitle(c);
      const oid = otherUid(c);
      const peerProf = oid ? userProfilesCache[oid] : null;
      const canSeePeerStatus = peerProf?.privacy?.lastSeen !== false;
      const isOn = canSeePeerStatus && isOnline(oid && presMap[oid]);
      const photo = c.isGroup ? (c.groupIcon || '') : (peerProf?.photo || '');
      const isMuted = !!c.mutedBy?.[me.uid];
      const uCount = unreadMap[c.id] || 0;
      const typers = Object.entries(c.typing || {}).filter(([uid, val]) => uid !== me.uid && isTyping(val)).map(([uid]) => c.memberNames?.[uid] || 'Keu');
      const draftTxt = getDraft(c.id).trim();
      const subHtml = typers.length
        ? `✍️ ${esc(typers.join(', '))} likhche...`
        : draftTxt
          ? `<span class="draftlbl">Draft:</span> ${esc(draftTxt)}`
          : esc(c.lastMessage || '');
      return `<div class="row" data-id="${c.id}" data-t="${esc(t)}" data-oid="${oid || ''}">
        <div class="av">${avHtml(photo, t, c.isGroup)}${isOn ? '<span class="dot"></span>' : ''}</div>
        <div class="mid">
          <div class="t">${esc(t)} ${isMuted ? '<span title="Muted" style="font-size:12px">🔇</span>' : ''}</div>
          <div class="s">${subHtml}</div>
        </div>
        <div class="meta">
          ${uCount > 0 ? `<span class="badge">${uCount > 99 ? '99+' : uCount}</span>` : ''}
        </div>
      </div>`;
    }).join('');

    ls.querySelectorAll('.row').forEach(r => {
      r.onclick = () => chatView(r.dataset.id, r.dataset.t, r.dataset.oid || null);
    });
  };

  const presSubs = {};
  const userSubs = {};
  const unreadSubs = {};
  addSub(() => {
    Object.values(presSubs).forEach(f => { try { f(); } catch (e) {} });
    Object.values(userSubs).forEach(f => { try { f(); } catch (e) {} });
    Object.values(unreadSubs).forEach(f => { try { f(); } catch (e) {} });
  });

  if (activeTab === 'status') {
    // Fetch only statuses the signed-in user is allowed to see. This makes
    // Selected Friends privacy enforceable by Firestore Rules, not just UI.
    const statusSources = [new Map(), new Map(), new Map()];
    const statusQueries = [
      db.collection('statuses').where('uid', '==', me.uid),
      db.collection('statuses').where('privacy', '==', 'all'),
      db.collection('statuses').where('allowedUids', 'array-contains', me.uid)
    ];
    const refreshStatusDocs = () => {
      const merged = new Map();
      statusSources.forEach(source => source.forEach((value, key) => merged.set(key, value)));
      statusDocs = [...merged.values()]
        .filter(s => (s.expiresAt || 0) > Date.now())
        .sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0))
        .slice(0, 60);
      renderBody();
    };
    statusQueries.forEach((query, index) => {
      addSub(query.onSnapshot(snap => {
        const source = statusSources[index];
        source.clear();
        snap.docs.forEach(d => source.set(d.id, { id: d.id, ...d.data() }));
        refreshStatusDocs();
      }, err => {
        console.error('Status load error:', err);
        renderBody();
      }));
    });
    return;
  }

  if (activeTab === 'calls') {
    addSub(db.collection('users').doc(me.uid).collection('callLogs').orderBy('createdAt', 'desc').limit(30).onSnapshot(snap => {
      callLogs = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      renderBody();
    }, () => renderBody()));
    return;
  }

  addSub(db.collection('chats').where('members', 'array-contains', me.uid).onSnapshot(snap => {
    allChats = snap.docs.map(d => ({ id: d.id, ...d.data() }))
      .sort((a, b) => (b.updatedAt?.seconds || 9e12) - (a.updatedAt?.seconds || 9e12));
    allChats.forEach(c => {
      const oid = otherUid(c);
      if (oid && !presSubs[oid]) {
        presSubs[oid] = db.collection('presence').doc(oid).onSnapshot(d => {
          presMap[oid] = d.exists ? d.data() : null;
          renderBody();
        }, () => {});
      }
      if (oid && !userSubs[oid]) {
        userSubs[oid] = db.collection('users').doc(oid).onSnapshot(d => {
          userProfilesCache[oid] = d.exists ? d.data() : null;
          renderBody();
        }, () => {});
      }
      if (!unreadSubs[c.id]) {
        unreadSubs[c.id] = db.collection('chats').doc(c.id).collection('messages')
          .orderBy('createdAt', 'desc').limit(50)
          .onSnapshot(mSnap => {
            const delTs = tsMs(c.deletedAt?.[me.uid]);
            let cnt = 0;
            mSnap.docs.forEach(md => {
              const m = md.data();
              if (m.senderId !== me.uid && !m.deleted && !(m.seenBy || []).includes(me.uid)) {
                if (!delTs || tsMs(m.createdAt) > delTs) cnt++;
              }
            });
            unreadMap[c.id] = cnt;
            renderBody();
          }, () => {});
      }
    });
    renderBody();
  }, err => {
    const l = document.getElementById('ls');
    if (l) l.innerHTML = `<div class="empty">Error: ${esc(err.message)}</div>`;
  }));
}

/* ---------- CAMERA PHOTO CAPTURE MODAL ---------- */
async function openCameraModal(onCaptured) {
  let stream = null;
  let facing = 'user';
  const modal = document.createElement('div');
  modal.className = 'modal';
  modal.innerHTML = `
    <div class="mbox">
      <div class="mhead"><span>📸 Camera</span><button id="camcl">✕</button></div>
      <div class="mbody">
        <div class="cambox"><video id="camvid" autoplay playsinline muted></video></div>
        <div style="display:flex;gap:8px;margin-top:12px">
          <button class="btn sm sec" id="camflip">🔄 Flip</button>
          <button class="btn" id="camsnap" style="flex:1">📷 Chobi Tulun</button>
        </div>
      </div>
    </div>`;
  document.body.appendChild(modal);

  const stopCam = () => {
    if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
  };
  const closeCam = () => { stopCam(); modal.remove(); };
  modal.querySelector('#camcl').onclick = closeCam;
  modal.onclick = e => { if (e.target === modal) closeCam(); };

  const startCam = async () => {
    stopCam();
    try {
      stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: { ideal: facing }, width: { ideal: 720 }, height: { ideal: 540 } },
        audio: false
      });
      const v = modal.querySelector('#camvid');
      v.srcObject = stream;
      v.play().catch(() => {});
    } catch (e) {
      toast('Camera chalu kora jayni: ' + (e.message || 'Permission din'));
      closeCam();
    }
  };

  modal.querySelector('#camflip').onclick = () => {
    facing = facing === 'user' ? 'environment' : 'user';
    startCam();
  };

  modal.querySelector('#camsnap').onclick = async () => {
    const v = modal.querySelector('#camvid');
    if (!v || !v.videoWidth) return toast('Camera ready hoyni');
    const c = document.createElement('canvas');
    c.width = v.videoWidth;
    c.height = v.videoHeight;
    c.getContext('2d').drawImage(v, 0, 0);
    const dataUrl = c.toDataURL('image/jpeg', 0.65);
    const cap = prompt('Photo caption (optional):', '');
    if (cap === null) return;
    closeCam();
    await onCaptured(dataUrl, cap.trim() || null);
  };

  await startCam();
}

async function openForwardModal(msgList) {
  const items = Array.isArray(msgList) ? msgList : [msgList];
  if (!items.length) return;
  const modal = document.createElement('div');
  modal.className = 'modal';
  modal.innerHTML = `
    <div class="mbox">
      <div class="mhead"><span>↪ Forward (${items.length})</span><button id="mcl">✕</button></div>
      <div class="list" id="fls"><div class="empty">Loading chats...</div></div>
    </div>`;
  document.body.appendChild(modal);
  modal.querySelector('#mcl').onclick = () => modal.remove();
  modal.onclick = e => { if (e.target === modal) modal.remove(); };

  try {
    const snap = await db.collection('chats').where('members', 'array-contains', me.uid).get();
    const chats = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    const fls = modal.querySelector('#fls');
    if (!chats.length) { fls.innerHTML = '<div class="empty">Kono chat nei</div>'; return; }
    fls.innerHTML = chats.map(c => {
      const t = chatTitle(c);
      return `<div class="row" data-id="${c.id}" data-t="${esc(t)}" data-oid="${otherUid(c) || ''}">
        <div class="av">${avHtml(c.groupIcon || '', t, c.isGroup)}</div>
        <div class="mid"><div class="t">${esc(t)}</div></div>
      </div>`;
    }).join('');

    fls.querySelectorAll('.row').forEach(r => {
      r.onclick = async () => {
        const targetId = r.dataset.id;
        const FV = firebase.firestore.FieldValue;
        let lastPreview = '';
        for (const msgObj of items) {
          if (msgObj.deleted) continue;
          await db.collection('chats').doc(targetId).collection('messages').add({
            senderId: me.uid,
            senderName: myName(),
            text: msgObj.text || null,
            image: msgObj.image || null,
            audio: msgObj.audio || null,
            audioMime: msgObj.audioMime || null,
            docUrl: msgObj.docUrl || null,
            docName: msgObj.docName || null,
            forwarded: true,
            edited: false,
            deleted: false,
            deliveredTo: [me.uid],
            seenBy: [me.uid],
            createdAt: FV.serverTimestamp()
          });
          lastPreview = msgObj.docName ? `📄 ${msgObj.docName}` : msgObj.audio ? '🎤 Voice message' : msgObj.image ? '📷 Photo' : (msgObj.text || 'Message');
        }
        if (lastPreview) {
          await db.collection('chats').doc(targetId).set({
            lastMessage: '↪ ' + lastPreview,
            updatedAt: FV.serverTimestamp()
          }, { merge: true });
        }
        modal.remove();
        toast('Message forward hoyeche');
        chatView(targetId, r.dataset.t, r.dataset.oid || null);
      };
    });
  } catch (e) {
    modal.remove();
    toast('Forward kora jayni: ' + e.message);
  }
}

/* ---------- MEDIA & DOC UPLOAD ---------- */
async function uploadMedia(chatId, blobOrFile, ext, fallbackDataUrl, isDoc = false) {
  if (!USE_STORAGE) {
    if (fallbackDataUrl && fallbackDataUrl.length <= 700000) return fallbackDataUrl;
    throw new Error('File size beshi boro (ba USE_STORAGE = true kore Storage rules din).');
  }
  try {
    const folder = isDoc ? 'docs' : 'media';
    const path = `chats/${chatId}/${folder}/${me.uid}_${Date.now()}.${ext}`;
    const ref = storage.ref().child(path);
    const contentType = blobOrFile.type || (ext === 'jpg' ? 'image/jpeg' : 'application/octet-stream');
    const snap = await ref.put(blobOrFile, { contentType });
    return await snap.ref.getDownloadURL();
  } catch (e) {
    if (fallbackDataUrl && fallbackDataUrl.length <= 700000) return fallbackDataUrl;
    throw new Error('File upload kora jayni (Storage rules ba size check korun).');
  }
}

/* ---------- CHAT SCREEN (DRAFT + SEARCH JUMP HIGHLIGHT + LINK PREVIEW + GROUP SEEN BY) ---------- */
