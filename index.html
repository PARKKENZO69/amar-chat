  ensureNotifPermission();

  let chatMeta = {};
  let peerUser = peerUid ? (userProfilesCache[peerUid] || null) : null;
  let inChatQuery = '';
  let replyTarget = null;
  let selectedIds = new Set();

  $app.innerHTML = `
    <header id="chdr">
      <button id="bk">←</button>
      <div class="hav" id="chav">${avHtml(peerUser?.photo, title, !peerUid)}</div>
      <div class="hinfo" id="hinfo" style="cursor:${!peerUid ? 'pointer' : 'default'}">
        <span id="htitle">${esc(title)}</span>
        <span class="hsub" id="hsub"></span>
      </div>
      <button id="csbtn" title="Message Khujun">🔍</button>
      ${peerUid ? '<button id="acall" title="Audio Call">📞</button><button id="vcall" title="Video Call">📹</button>' : ''}
      <button id="cmore" title="Menu">⋮</button>
      <div class="menu top" id="cmenu" style="display:none"></div>
    </header>
    <div class="searchbox" id="csbox" style="display:none">
      <input type="text" id="csinp" placeholder="🔍 Ei chat-e message khujun...">
      <button class="btn sm" id="cscls" style="padding:7px 11px">✕</button>
    </div>
    <div id="csresults"></div>
    <div id="pinslot"></div>
    <div class="msgs" id="ms"></div>
    <div class="replybar" id="rbar">
      <div class="rtxt" id="rtxt"></div>
      <button id="rcl" title="Cancel Reply">✕</button>
    </div>
    <div class="recbar" id="recbar">
      <span>🔴 Recording... <span id="rectm">00:00</span></span>
      <span class="sp" style="flex:1"></span>
      <button class="cncl" id="reccncl">✕ Cancel</button>
      <button class="stop" id="recstop">⏹ Pathan</button>
    </div>
    <div class="emojipanel" id="ep"></div>
    <div id="inputslot">
      <div class="bar">
        <button class="ph" id="ebtn" title="Emoji">😊</button>
        <button class="ph" id="ph" title="Photo">📷</button>
        <button class="ph" id="cambtn" title="Camera">📸</button>
        <button class="ph" id="docbtn" title="Document">📎</button>
        <button class="ph" id="mic" title="Voice">🎤</button>
        <input type="file" id="fi" accept="image/jpeg,image/png,image/webp,image/gif" hidden>
        <input type="file" id="dfi" accept=".pdf,.doc,.docx,.xls,.xlsx,.txt,.zip,.csv" hidden>
        <textarea id="tx" rows="1" placeholder="Message likhun..."></textarea>
        <button id="sd" title="Send">➤</button>
      </div>
    </div>`;

  const chat = db.collection('chats').doc(chatId);
  const chdr = document.getElementById('chdr');
  const ms = document.getElementById('ms');
  const tx = document.getElementById('tx');
  const pinslot = document.getElementById('pinslot');
  const csresults = document.getElementById('csresults');
  const ep = document.getElementById('ep');
  const recbar = document.getElementById('recbar');
  const rectm = document.getElementById('rectm');
  const rbar = document.getElementById('rbar');
  const rtxt = document.getElementById('rtxt');

  tx.value = getDraft(chatId);

  let msgCache = {};
  let lastDocs = [];
  let typingTimeout = null, isTypingNow = false, lastTypingWrite = 0;
  let peerPres = null, typingNames = [], typingClear = null;

  let rec = null, recStream = null, recChunks = [], recTimer = null, secCounter = 0, discardRec = false;
  const fmtSec = s => `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`;
  const cleanupRec = () => {
    clearInterval(recTimer);
    recTimer = null;
    secCounter = 0;
    rectm.textContent = '00:00';
    recbar.classList.remove('on');
    if (recStream) { recStream.getTracks().forEach(t => t.stop()); recStream = null; }
    rec = null;
  };
  const cancelRec = () => {
    discardRec = true;
    if (rec && rec.state !== 'inactive') { try { rec.stop(); } catch (e) {} }
    cleanupRec();
  };

  function jumpAndHighlightMsg(msgId) {
    const el = ms.querySelector(`.b[data-id="${msgId}"]`);
    if (!el) return;
    el.scrollIntoView({ behavior: 'smooth', block: 'center' });
    el.classList.add('hi');
    setTimeout(() => el.classList.remove('hi'), 2200);
  }

  customBackHandler = () => {
    if (selectedIds.size > 0) {
      selectedIds.clear();
      renderHeaderState();
      renderMessages();
      return true;
    }
    if (replyTarget) {
      clearReply();
      return true;
    }
    if (rec && rec.state !== 'inactive') {
      cancelRec();
      return true;
    }
    if (ep.classList.contains('on')) {
      ep.classList.remove('on');
      return true;
    }
    setDraft(chatId, tx.value);
    clearTimeout(typingTimeout);
    setTyping(false);
    home('chats', false);
    return true;
  };

  function setTyping(val) {
    const now = Date.now();
    if (val) { if (isTypingNow && now - lastTypingWrite < 3000) return; }
    else if (!isTypingNow) return;
    isTypingNow = val;
    lastTypingWrite = now;
    chat.set({ typing: { [me.uid]: val ? now : 0 } }, { merge: true }).catch(() => {});
  }

  function updateHeaderSub() {
    const subEl = document.getElementById('hsub');
    if (!subEl) return;
    if (typingNames.length) subEl.textContent = `✍️ ${typingNames.join(', ')} likhche...`;
    else if (peerUid && peerPres) {
      const canSee = peerUser?.privacy?.lastSeen !== false;
      const st = fmtStatus(peerPres, canSee);
      const ab = peerUser?.about ? ` • ${peerUser.about}` : '';
      subEl.textContent = (st + ab).replace(/^ • /, '');
    } else if (peerUid && peerUser?.about) {
      subEl.textContent = peerUser.about;
    } else if (!peerUid && chatMeta.members) {
      subEl.textContent = `${chatMeta.members.length} jon sodosso • Tap for info`;
    } else subEl.textContent = '';
  }

  function rebuildMenu(menuEl) {
    if (!menuEl) return;
    const isMuted = !!chatMeta.mutedBy?.[me.uid];
    const isArchived = !!chatMeta.archivedBy?.[me.uid];
    const isBlocked = peerUid ? myBlocked().includes(peerUid) : false;
    const disHours = chatMeta.disappearHours || 0;
    const curWp = chatMeta.wallpaperBy?.[me.uid] || null;

    menuEl.innerHTML = `
      ${!peerUid ? '<div id="cm_ginfo">👥 Group Info & Photo</div>' : ''}
      <div id="cm_wp">🖼 Chat Wallpaper</div>
      <div id="cm_dis">⏳ Disappearing (${disHours ? disHours + 'h' : 'Off'})</div>
      <div id="cm_mute">${isMuted ? '🔔 Unmute Chat' : '🔇 Mute Chat'}</div>
      <div id="cm_arch">${isArchived ? '📤 Unarchive Chat' : '📦 Archive Chat'}</div>
      <div id="cm_clr">🧹 Clear Chat</div>
      <div id="cm_del">🗑 Nijer dike theke chat delete</div>
      ${peerUid ? `<div id="cm_blk" style="color:#e53935">${isBlocked ? '✅ Unblock User' : '🚫 Block User'}</div>` : ''}`;

    const gi = document.getElementById('cm_ginfo');
    if (gi) gi.onclick = () => { menuEl.style.display = 'none'; groupInfoView(chatId); };

    document.getElementById('cm_wp').onclick = () => {
      menuEl.style.display = 'none';
      openWallpaperModal(chatId, chat, curWp);
    };
    document.getElementById('cm_dis').onclick = async () => {
      menuEl.style.display = 'none';
      const next = disHours === 0 ? 24 : disHours === 24 ? 168 : 0;
      await chat.set({ disappearHours: next }, { merge: true });
      toast(next ? `Disappearing messages: ${next}h` : 'Disappearing messages off');
    };
    document.getElementById('cm_mute').onclick = async () => {
      menuEl.style.display = 'none';
      await chat.set({ mutedBy: { [me.uid]: !isMuted } }, { merge: true });
      toast(!isMuted ? 'Chat mute kora hoyeche' : 'Chat unmute kora hoyeche');
    };
    document.getElementById('cm_arch').onclick = async () => {
      menuEl.style.display = 'none';
      await chat.set({ archivedBy: { [me.uid]: !isArchived } }, { merge: true });
      toast(!isArchived ? 'Chat archive kora hoyeche' : 'Unarchive kora hoyeche');
      if (!isArchived) home('chats', false);
    };
    document.getElementById('cm_clr').onclick = async () => {
      menuEl.style.display = 'none';
      if (!confirm('Ei chat-er sob message clear korte chan?')) return;
      await chat.set({
        deletedAt: { [me.uid]: firebase.firestore.FieldValue.serverTimestamp() },
        lastMessage: ''
      }, { merge: true });
      toast('Chat clear hoyeche');
      renderMessages();
    };
    document.getElementById('cm_del').onclick = async () => {
      menuEl.style.display = 'none';
      if (!confirm('Apnar dike theke ei chat delete korben?')) return;
      await chat.set({ deletedAt: { [me.uid]: firebase.firestore.FieldValue.serverTimestamp() } }, { merge: true });
      toast('Chat delete hoyeche');
      home('chats', false);
    };
    const blk = document.getElementById('cm_blk');
    if (blk) {
      blk.onclick = async () => {
        menuEl.style.display = 'none';
        const FV = firebase.firestore.FieldValue;
        await db.collection('users').doc(me.uid).set({
          blocked: isBlocked ? FV.arrayRemove(peerUid) : FV.arrayUnion(peerUid)
        }, { merge: true });
        profile.blocked = isBlocked
          ? myBlocked().filter(id => id !== peerUid)
          : [...new Set([...myBlocked(), peerUid])];
        toast(isBlocked ? 'Unblock kora hoyeche' : 'User-ke block kora hoyeche');
        updateBlockedUI();
      };
    }
  }

  function bindChatHeaderEvents() {
    const newHtitle = document.getElementById('htitle');
    const newChav = document.getElementById('chav');
    const newCmenu = document.getElementById('cmenu');

    document.getElementById('bk').onclick = () => {
      setDraft(chatId, tx.value);
      clearTimeout(typingTimeout);
      setTyping(false);
      cancelRec();
      home('chats', false);
    };
    if (!peerUid) {
      document.getElementById('hinfo').onclick = () => groupInfoView(chatId);
    }
    if (peerUid) {
      document.getElementById('acall').onclick = () => startCall(peerUid, newHtitle.textContent, false);
      document.getElementById('vcall').onclick = () => startCall(peerUid, newHtitle.textContent, true);
    }
    const csbox = document.getElementById('csbox');
    const csinp = document.getElementById('csinp');
    document.getElementById('csbtn').onclick = () => {
      const show = csbox.style.display === 'none';
      csbox.style.display = show ? 'flex' : 'none';
      if (show) { csinp.focus(); renderMessages(); }
      else { inChatQuery = ''; csinp.value = ''; csresults.innerHTML = ''; renderMessages(); }
    };
    document.getElementById('cmore').onclick = e => {
      e.stopPropagation();
      rebuildMenu(newCmenu);
      newCmenu.style.display = newCmenu.style.display === 'none' ? 'block' : 'none';
    };
    if (newChav) {
      const pic = !peerUid ? (chatMeta.groupIcon || '') : (peerUser?.photo || '');
      newChav.innerHTML = avHtml(pic, newHtitle.textContent, !peerUid);
    }
  }

  function renderHeaderState() {
    const curTitle = document.getElementById('htitle')?.textContent || title;
    if (selectedIds.size > 0) {
      chdr.classList.add('selhdr');
      chdr.innerHTML = `
        <button id="selcls" title="Cancel">✕</button>
        <span style="font-weight:700">${selectedIds.size} selected</span>
        <span class="sp"></span>
        <button id="selfwd" title="Forward">↪</button>
        <button id="selstar" title="Star">⭐</button>
        <button id="seldel" title="Delete">🗑</button>`;
      document.getElementById('selcls').onclick = () => {
        selectedIds.clear();
        renderHeaderState();
        renderMessages();
      };
      document.getElementById('selfwd').onclick = () => {
        const list = [...selectedIds].map(id => msgCache[id]).filter(Boolean);
        openForwardModal(list);
      };
      document.getElementById('selstar').onclick = async () => {
        const FV = firebase.firestore.FieldValue;
        for (const id of selectedIds) {
          const m = msgCache[id];
          if (!m || m.deleted) continue;
          const preview = m.text || (m.docName ? `📄 ${m.docName}` : m.audio ? '🎤 Voice message' : m.image ? '📷 Photo' : 'Message');
          if (!myStarred().some(x => x.id === id)) {
            const entry = { id, chatId, chatTitle: curTitle, senderName: m.senderName || 'User', preview };
            await db.collection('users').doc(me.uid).set({ starred: FV.arrayUnion(entry) }, { merge: true });
            profile.starred = [...myStarred(), entry];
          }
        }
        toast('Selected message gulo star kora hoyeche');
        selectedIds.clear();
        renderHeaderState();
        renderMessages();
      };
      document.getElementById('seldel').onclick = async () => {
        const ids = [...selectedIds];
        const allMine = ids.every(id => msgCache[id]?.senderId === me.uid);
        const forEveryone = allMine && confirm('Selected sob message sobar jonno delete korben? (Cancel chaple shudhu apnar jonno hide hobe)');
        for (const id of ids) {
          if (forEveryone) {
            await chat.collection('messages').doc(id).update({
              text: null, image: null, audio: null, docUrl: null, docName: null, deleted: true
            }).catch(() => {});
          } else {
            await chat.collection('messages').doc(id).update({
              hiddenFor: firebase.firestore.FieldValue.arrayUnion(me.uid)
            }).catch(() => {});
          }
        }
        toast('Selected message delete hoyeche');
        selectedIds.clear();
        renderHeaderState();
        renderMessages();
      };
      return;
    }

    chdr.classList.remove('selhdr');
    chdr.innerHTML = `
      <button id="bk">←</button>
      <div class="hav" id="chav">${avHtml(peerUser?.photo, curTitle, !peerUid)}</div>
      <div class="hinfo" id="hinfo" style="cursor:${!peerUid ? 'pointer' : 'default'}">
        <span id="htitle">${esc(curTitle)}</span>
        <span class="hsub" id="hsub"></span>
      </div>
      <button id="csbtn" title="Message Khujun">🔍</button>
      ${peerUid ? '<button id="acall" title="Audio Call">📞</button><button id="vcall" title="Video Call">📹</button>' : ''}
      <button id="cmore" title="Menu">⋮</button>
      <div class="menu top" id="cmenu" style="display:none"></div>`;
    bindChatHeaderEvents();
    updateHeaderSub();
  }

  function setReply(id, senderName, preview) {
    replyTarget = { id, senderName, preview };
    rtxt.innerHTML = `<b>↩ ${esc(senderName)}:</b> ${esc(preview)}`;
    rbar.classList.add('on');
    tx.focus();
  }
  function clearReply() {
    replyTarget = null;
    rbar.classList.remove('on');
  }
  document.getElementById('rcl').onclick = clearReply;
  document.getElementById('cscls').onclick = () => {
    document.getElementById('csbox').style.display = 'none';
    inChatQuery = '';
    document.getElementById('csinp').value = '';
    csresults.innerHTML = '';
    renderMessages();
  };
  document.getElementById('csinp').addEventListener('input', e => {
    inChatQuery = e.target.value;
    renderMessages();
  });

  const closeMenu = () => {
    const m = document.getElementById('cmenu');
    if (m) m.style.display = 'none';
  };
  document.addEventListener('click', closeMenu);
  addSub(() => document.removeEventListener('click', closeMenu));

  function updateBlockedUI() {
    const slot = document.getElementById('inputslot');
    if (!slot || !peerUid) return;
    const iBlocked = myBlocked().includes(peerUid);
    const theyBlocked = Array.isArray(peerUser?.blocked) && peerUser.blocked.includes(me.uid);
    if (iBlocked) {
      slot.innerHTML = `<div class="blockedbar">🚫 Apni ei user-ke block korechen. <button class="btn sm" id="unblkbtn" style="margin-left:8px;padding:4px 10px">${esc(tr('unblkBtn'))}</button></div>`;
      document.getElementById('unblkbtn').onclick = async () => {
        await db.collection('users').doc(me.uid).set({ blocked: firebase.firestore.FieldValue.arrayRemove(peerUid) }, { merge: true });
        profile.blocked = myBlocked().filter(id => id !== peerUid);
        chatView(chatId, document.getElementById('htitle')?.textContent || title, peerUid);
      };
    } else if (theyBlocked) {
      slot.innerHTML = `<div class="blockedbar">Ei user-ke message ba call pathano jabe na.</div>`;
    }
  }

  ep.innerHTML = EMOJIS.map(em => `<button type="button">${em}</button>`).join('');
  ep.querySelectorAll('button').forEach(b => {
    b.onclick = () => {
      const start = tx.selectionStart ?? tx.value.length;
      const end = tx.selectionEnd ?? tx.value.length;
      tx.value = tx.value.slice(0, start) + b.textContent + tx.value.slice(end);
      setDraft(chatId, tx.value);
      tx.focus();
      setTyping(true);
    };
  });
  document.getElementById('ebtn').onclick = () => ep.classList.toggle('on');

  tx.addEventListener('input', () => {
    setDraft(chatId, tx.value);
    setTyping(true);
    clearTimeout(typingTimeout);
    typingTimeout = setTimeout(() => setTyping(false), 2000);
  });

  function applyChatWallpaper() {
    const wp = chatMeta.wallpaperBy?.[me.uid];
    if (wp?.image && safeMedia(wp.image)) {
      ms.style.backgroundImage = `url("${wp.image}")`;
      ms.style.backgroundColor = '';
    } else if (wp?.color) {
      ms.style.backgroundImage = 'none';
      ms.style.backgroundColor = wp.color;
    } else {
      ms.style.backgroundImage = 'none';
      ms.style.backgroundColor = isDarkMode() ? '#0b141a' : '#efeae2';
    }
  }

  if (peerUid) {
    addSub(db.collection('presence').doc(peerUid).onSnapshot(d => {
      peerPres = d.exists ? d.data() : null;
      updateHeaderSub();
    }, () => {}));
    addSub(db.collection('users').doc(peerUid).onSnapshot(d => {
      peerUser = d.exists ? d.data() : null;
      userProfilesCache[peerUid] = peerUser;
      const tEl = document.getElementById('htitle');
      const avEl = document.getElementById('chav');
      if (peerUser?.name && tEl) tEl.textContent = peerUser.name;
      if (avEl) avEl.innerHTML = avHtml(peerUser?.photo, tEl?.textContent || title, false);
      updateHeaderSub();
      updateBlockedUI();
    }, () => {}));
  }

  function renderPinBanner() {
    if (!pinslot) return;
    const pin = chatMeta.pinnedMessage;
    if (!pin || !pin.id) { pinslot.innerHTML = ''; return; }
    pinslot.innerHTML = `<div class="pinbar" id="pinjump">
      <span>📌</span>
      <span class="ptxt"><b>${esc(pin.senderName || 'User')}:</b> ${esc(pin.preview || '')}</span>
      <button class="btn sm" id="pinun" style="padding:3px 8px;font-size:11px">Unpin</button>
    </div>`;
    document.getElementById('pinjump').onclick = e => {
      if (e.target.id === 'pinun') return;
      jumpAndHighlightMsg(pin.id);
    };
    document.getElementById('pinun').onclick = async e => {
      e.stopPropagation();
      await chat.set({ pinnedMessage: null }, { merge: true });
      toast('Message unpin hoyeche');
    };
  }

  addSub(chat.onSnapshot(d => {
    if (!d.exists) return;
    chatMeta = d.data();
    const tEl = document.getElementById('htitle');
    const avEl = document.getElementById('chav');
    if (!peerUid && chatMeta.name && tEl) tEl.textContent = chatMeta.name;
    if (!peerUid && avEl) avEl.innerHTML = avHtml(chatMeta.groupIcon || '', tEl?.textContent || title, true);
    applyChatWallpaper();
    typingNames = Object.entries(chatMeta.typing || {})
      .filter(([uid, v]) => uid !== me.uid && isTyping(v))
      .map(([uid]) => chatMeta.memberNames?.[uid] || 'Keu');
    updateHeaderSub();
    renderPinBanner();
    clearTimeout(typingClear);
    if (typingNames.length) typingClear = setTimeout(() => { typingNames = []; updateHeaderSub(); }, 6500);
    renderMessages();
  }));

  document.getElementById('reccncl').onclick = cancelRec;
  document.getElementById('recstop').onclick = () => { if (rec && rec.state !== 'inactive') rec.stop(); };
  bindChatHeaderEvents();

  const markRead = () => {
    if (!sendReceiptsPref()) return;
    lastDocs.forEach(docSnap => {
      const m = docSnap.data();
      if (m.senderId !== me.uid && !m.deleted) {
        const updates = {};
        if (!(m.deliveredTo || []).includes(me.uid)) updates.deliveredTo = firebase.firestore.FieldValue.arrayUnion(me.uid);
        if (document.visibilityState === 'visible' && !(m.seenBy || []).includes(me.uid)) updates.seenBy = firebase.firestore.FieldValue.arrayUnion(me.uid);
        if (Object.keys(updates).length) docSnap.ref.update(updates).catch(() => {});
      }
    });
  };
  const onVisRead = () => { if (document.visibilityState === 'visible') markRead(); };
  document.addEventListener('visibilitychange', onVisRead);
  addSub(() => document.removeEventListener('visibilitychange', onVisRead));

  function renderMessages() {
    const atBottom = ms.scrollHeight - ms.scrollTop - ms.clientHeight < 120;
    const delTs = tsMs(chatMeta.deletedAt?.[me.uid]);
    const q = inChatQuery.trim().toLowerCase();
    const starredIds = new Set(myStarred().map(x => x.id));
    const now = Date.now();
    msgCache = {};

    const visibleDocs = lastDocs.filter(d => {
      const m = d.data();
      if (Array.isArray(m.hiddenFor) && m.hiddenFor.includes(me.uid)) return false;
      const mTs = tsMs(m.createdAt);
      if (m.expiresAt && now > m.expiresAt) return false;
      if (delTs && mTs && mTs <= delTs) return false;
      return true;
    });

    if (q) {
      const matches = visibleDocs.filter(d => {
        const m = d.data();
        if (m.deleted) return false;
        return (m.text || '').toLowerCase().includes(q)
          || (m.senderName || '').toLowerCase().includes(q)
          || (m.docName || '').toLowerCase().includes(q);
      });
      if (matches.length) {
        csresults.innerHTML = `<div style="max-height:140px;overflow:auto;background:var(--card);border-bottom:1px solid var(--bd)">` +
          matches.slice(0, 12).map(d => {
            const m = d.data();
            const pv = m.text || (m.docName ? `📄 ${m.docName}` : 'Message');
            return `<div class="row jhit" data-mid="${d.id}" style="padding:8px 12px">
              <div class="mid"><div class="t" style="font-size:12.5px">${esc(m.senderName || 'User')}</div><div class="s" style="font-size:12.5px">${esc(pv)}</div></div>
              <span class="hint" style="margin:0">Jump</span>
            </div>`;
          }).join('') + `</div>`;
        csresults.querySelectorAll('.jhit').forEach(row => {
          row.onclick = () => jumpAndHighlightMsg(row.dataset.mid);
        });
      } else {
        csresults.innerHTML = `<div class="pinbar"><span>🔍 Kono message pawa jayni</span></div>`;
      }
    } else {
      csresults.innerHTML = '';
    }

    ms.innerHTML = visibleDocs.map(d => {
      const m = d.data();
      msgCache[d.id] = m;
      const mine = m.senderId === me.uid;
      const dt = m.createdAt?.toDate();
      const tm = dt ? String(dt.getHours()).padStart(2, '0') + ':' + String(dt.getMinutes()).padStart(2, '0') : '';
      const isSel = selectedIds.has(d.id);

      if (m.deleted) {
        return `<div class="b ${mine ? 'me' : ''} ${isSel ? 'selected' : ''}" data-id="${d.id}">
          ${mine ? '' : `<div class="n">${esc(m.senderName)}</div>`}
          <span class="del">🚫 Ei message-ti sobar jonno delete kora hoyeche</span>
          <span class="tm">${tm}</span></div>`;
      }

      const rxMap = m.reactions || {};
      const counts = {};
      Object.values(rxMap).forEach(em => { if (em) counts[em] = (counts[em] || 0) + 1; });
      const rxHtml = Object.keys(counts).length
        ? `<div class="reacts">${Object.entries(counts).map(([em, cnt]) => `<span class="rpill">${esc(em)}${cnt > 1 ? ' ' + cnt : ''}</span>`).join('')}</div>`
        : '';

      const ext = (m.audioMime || '').includes('mp4') ? 'mp4' : (m.audioMime || '').includes('ogg') ? 'ogg' : 'webm';
      const isSt = starredIds.has(d.id);
      const isPinned = chatMeta.pinnedMessage?.id === d.id;
      const safeImg = safeMedia(m.image);
      const safeDocUrl = safeDoc(m.docUrl);

      let seenLine = '';
      if (mine && sendReceiptsPref()) {
        const seenOtherIds = (m.seenBy || []).filter(uid => uid !== me.uid);
        if (!peerUid && seenOtherIds.length) {
          const names = seenOtherIds.map(uid => chatMeta.memberNames?.[uid] || uid);
          seenLine = `<div class="seenby">👁 ${esc(tr('seenBy'))}: ${esc(names.join(', '))}</div>`;
        } else {
          const statusLbl = seenOtherIds.length
            ? '✓✓ Seen'
            : (m.deliveredTo || []).some(uid => uid !== me.uid)
              ? '✓✓ Delivered'
              : '✓ Sent';
          seenLine = '';
          var inlineReceipt = `<span class="receipt">${statusLbl}</span>`;
        }
      }
      if (typeof inlineReceipt === 'undefined') var inlineReceipt = '';

      return `<div class="b ${mine ? 'me' : ''} ${isSel ? 'selected' : ''}" data-id="${d.id}">
        ${mine ? '' : `<div class="n">${esc(m.senderName)}</div>`}
        ${m.forwarded ? '<div class="fwd">↪ Forwarded</div>' : ''}
        ${m.replyTo ? `<div class="qbox"><b>${esc(m.replyTo.senderName || 'User')}</b>${esc(m.replyTo.preview || '')}</div>` : ''}
        ${safeImg ? `<img class="zoomimg" src="${esc(safeImg)}" data-cap="${esc(m.text || '')}"><a class="dl" href="${esc(safeImg)}" target="_blank" rel="noopener" download="photo.jpg">⬇ Download</a>` : ''}
        ${safeDocUrl ? `<a class="docbox" href="${esc(safeDocUrl)}" target="_blank" rel="noopener" download="${esc(m.docName || 'document')}"><span>📄</span><span><b>${esc(m.docName || 'Document')}</b><br><small>Tap to open / download</small></span></a>` : ''}
        ${safeMedia(m.audio) ? `<audio controls preload="none" src="${esc(safeMedia(m.audio))}"></audio><button type="button" class="spdbtn" data-spd="1">1x</button><a class="dl" href="${esc(safeMedia(m.audio))}" target="_blank" rel="noopener" download="voice-message.${ext}">⬇ Download</a>` : ''}
        ${m.text ? `<span class="txt">${formatTextWithLinks(m.text)}</span>${buildLinkPreviewHtml(m.text)}` : ''}${m.edited ? '<span class="ed">(edited)</span>' : ''}
        <span class="tm">${tm}${inlineReceipt}</span>
        ${seenLine}
        ${rxHtml}
        <div class="act">
          ${REACTIONS.map(em => `<span class="rx" data-em="${em}">${em}</span>`).join('')}
          <span class="mcopy">📋 ${esc(tr('copyBtn'))}</span>
          <span class="msel">☑ Select</span>
          <span class="mrep">↩ Reply</span>
          <span class="mstar">${isSt ? '★ Unstar' : '☆ Star'}</span>
          <span class="mpin">${isPinned ? 'Unpin' : '📌 Pin'}</span>
          <span class="mfwd">↪ Forward</span>
          ${mine && m.text ? '<span class="medit">✎ Edit</span>' : ''}
          ${mine ? '<span class="mdel">🗑 Delete</span>' : ''}
        </div>
      </div>`;
    }).join('');

    ms.querySelectorAll('.spdbtn').forEach(btn => {
      btn.onclick = e => {
        e.stopPropagation();
        const aud = btn.previousElementSibling;
        const cur = parseFloat(btn.dataset.spd || '1');
        const next = cur === 1 ? 1.5 : cur === 1.5 ? 2 : 1;
        btn.dataset.spd = String(next);
        btn.textContent = `${next}x`;
        if (aud && aud.tagName === 'AUDIO') aud.playbackRate = next;
      };
    });

    ms.querySelectorAll('.zoomimg').forEach(img => {
      img.onclick = e => {
        e.stopPropagation();
        openLightbox(img.src, img.dataset.cap || '', false);
      };
    });

    const toggleSelect = id => {
      if (selectedIds.has(id)) selectedIds.delete(id);
      else selectedIds.add(id);
      renderHeaderState();
      renderMessages();
    };

    ms.querySelectorAll('.b[data-id]').forEach(b => {
      b.onclick = e => {
        if (e.target.closest('.act') || e.target.closest('audio') || e.target.closest('a') || e.target.closest('.zoomimg') || e.target.closest('.spdbtn')) return;
        if (selectedIds.size > 0) {
          toggleSelect(b.dataset.id);
          return;
        }
        b.classList.toggle('open');
      };
    });

    ms.querySelectorAll('.mcopy').forEach(btn => {
      btn.onclick = async e => {
        e.stopPropagation();
        const id = btn.closest('.b').dataset.id;
        const m = msgCache[id];
        const copyStr = (m && (m.text || m.docName)) || '';
        if (!copyStr) return toast('Copy korar moto text nei');
        try {
          if (navigator.clipboard && navigator.clipboard.writeText) await navigator.clipboard.writeText(copyStr);
        } catch (err) {}
        toast(tr('copied'));
      };
    });

    ms.querySelectorAll('.msel').forEach(btn => {
      btn.onclick = e => {
        e.stopPropagation();
        const id = btn.closest('.b').dataset.id;
        toggleSelect(id);
      };
    });

    ms.querySelectorAll('.rx').forEach(btn => {
      btn.onclick = async e => {
        e.stopPropagation();
        const id = btn.closest('.b').dataset.id;
        const em = btn.dataset.em;
        const cur = msgCache[id]?.reactions?.[me.uid];
        const nextVal = cur === em ? firebase.firestore.FieldValue.delete() : em;
        try {
          await chat.collection('messages').doc(id).update({ [`reactions.${me.uid}`]: nextVal });
        } catch (err) { toast('Reaction dewa jayni'); }
      };
    });

    ms.querySelectorAll('.mrep').forEach(btn => {
      btn.onclick = e => {
        e.stopPropagation();
        const id = btn.closest('.b').dataset.id;
        const m = msgCache[id];
        if (!m) return;
        const preview = m.text || (m.docName ? `📄 ${m.docName}` : m.audio ? '🎤 Voice message' : m.image ? '📷 Photo' : 'Message');
        setReply(id, m.senderName || 'User', preview);
      };
    });

    ms.querySelectorAll('.mstar').forEach(btn => {
      btn.onclick = async e => {
        e.stopPropagation();
        const id = btn.closest('.b').dataset.id;
        const m = msgCache[id];
        if (!m) return;
        const preview = m.text || (m.docName ? `📄 ${m.docName}` : m.audio ? '🎤 Voice message' : m.image ? '📷 Photo' : 'Message');
        const existing = myStarred().find(x => x.id === id);
        if (existing) {
          await db.collection('users').doc(me.uid).set({ starred: firebase.firestore.FieldValue.arrayRemove(existing) }, { merge: true });
          profile.starred = myStarred().filter(x => x.id !== id);
          toast('Starred theke bad dewa hoyeche');
        } else {
          const curTitle = document.getElementById('htitle')?.textContent || title;
          const entry = { id, chatId, chatTitle: curTitle, senderName: m.senderName || 'User', preview };
          await db.collection('users').doc(me.uid).set({ starred: firebase.firestore.FieldValue.arrayUnion(entry) }, { merge: true });
          profile.starred = [...myStarred(), entry];
          toast('Starred message-e save hoyeche');
        }
        renderMessages();
      };
    });

    ms.querySelectorAll('.mpin').forEach(btn => {
      btn.onclick = async e => {
        e.stopPropagation();
        const id = btn.closest('.b').dataset.id;
        const m = msgCache[id];
        if (!m) return;
        if (chatMeta.pinnedMessage?.id === id) {
          await chat.set({ pinnedMessage: null }, { merge: true });
          toast('Unpin hoyeche');
        } else {
          const preview = m.text || (m.docName ? `📄 ${m.docName}` : m.audio ? '🎤 Voice message' : m.image ? '📷 Photo' : 'Message');
          await chat.set({ pinnedMessage: { id, senderName: m.senderName || 'User', preview } }, { merge: true });
          toast('Message pin hoyeche');
        }
      };
    });

    ms.querySelectorAll('.mfwd').forEach(btn => {
      btn.onclick = e => {
        e.stopPropagation();
        const id = btn.closest('.b').dataset.id;
        const m = msgCache[id];
        if (m) openForwardModal(m);
      };
    });

    ms.querySelectorAll('.medit').forEach(btn => {
      btn.onclick = async e => {
        e.stopPropagation();
        const id = btn.closest('.b').dataset.id;
        const cur = msgCache[id]?.text || '';
        const next = prompt('Notun message likhun:', cur);
        if (next === null) return;
        const trimmed = next.trim();
        if (!trimmed || trimmed === cur) return;
        try {
          await chat.collection('messages').doc(id).update({ text: trimmed, edited: true });
          toast('Message edit hoyeche');
        } catch (err) { toast('Edit kora jayni: ' + err.message); }
      };
    });

    ms.querySelectorAll('.mdel').forEach(btn => {
      btn.onclick = async e => {
        e.stopPropagation();
        const id = btn.closest('.b').dataset.id;
        const everyone = confirm('Sobar jonno delete korben? (OK = Sobar jonno, Cancel = Shudhu amar jonno)');
        try {
          if (everyone) {
            await chat.collection('messages').doc(id).update({
              text: null, image: null, audio: null, docUrl: null, docName: null, deleted: true
            });
            toast('Sobar jonno message delete hoyeche');
          } else {
            await chat.collection('messages').doc(id).update({
              hiddenFor: firebase.firestore.FieldValue.arrayUnion(me.uid)
            });
            toast('Message hide hoyeche');
          }
        } catch (err) { toast('Delete kora jayni: ' + err.message); }
      };
    });

    if (atBottom || ms.dataset.init !== '1') {
      ms.scrollTop = ms.scrollHeight;
      ms.dataset.init = '1';
    }
  }

  addSub(chat.collection('messages').orderBy('createdAt').limitToLast(250).onSnapshot(snap => {
    lastDocs = snap.docs;
    markRead();
    renderMessages();
  }));

  async function send(text, image, audio, audioMime, docUrl, docName) {
    if (peerUid && myBlocked().includes(peerUid)) throw new Error('User blocked ache');
    const FV = firebase.firestore.FieldValue;
    const rep = replyTarget ? { ...replyTarget } : null;
    const disHours = chatMeta.disappearHours || 0;
    const expiresAt = disHours > 0 ? Date.now() + disHours * 3600 * 1000 : null;
    clearReply();
    await chat.collection('messages').add({
      senderId: me.uid,
      senderName: myName(),
      text: text || null,
      image: image || null,
      audio: audio || null,
      audioMime: audioMime || null,
      docUrl: docUrl || null,
      docName: docName || null,
      expiresAt,
      replyTo: rep,
      reactions: {},
      hiddenFor: [],
      edited: false,
      deleted: false,
      deliveredTo: [me.uid],
      seenBy: [me.uid],
      createdAt: FV.serverTimestamp()
    });
    const last = docName ? `📄 ${docName}` : audio ? '🎤 Voice message' : image ? (text ? `📷 ${text}` : '📷 Photo') : text;
    await chat.set({
      lastMessage: last,
      updatedAt: FV.serverTimestamp(),
      typing: { [me.uid]: 0 },
      archivedBy: { [me.uid]: false }
    }, { merge: true });
    isTypingNow = false;
  }

  document.getElementById('mic').onclick = async () => {
    if (rec && rec.state !== 'inactive') { rec.stop(); return; }
    try {
      discardRec = false;
      if (!window.MediaRecorder) throw new Error('Ei browser-e voice recording supported noy');
      recStream = await navigator.mediaDevices.getUserMedia({ audio: true });
      const mime = ['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4'].find(t => window.MediaRecorder && MediaRecorder.isTypeSupported(t));
      rec = new MediaRecorder(recStream, mime ? { mimeType: mime, audioBitsPerSecond: 20000 } : {});
      recChunks = [];
      rec.ondataavailable = e => { if (e.data.size) recChunks.push(e.data); };
      rec.onstop = async () => {
        const type = (rec && rec.mimeType) || 'audio/webm';
        const blob = new Blob(recChunks, { type });
        const wasDiscarded = discardRec;
        cleanupRec();
        if (wasDiscarded || blob.size < 800) return;
        try {
          const b64 = blob.size < 650000 ? await blobToDataURL(blob) : null;
          const ext = type.includes('mp4') ? 'mp4' : 'webm';
          const url = await uploadMedia(chatId, blob, ext, b64, false);
          await send(null, null, url, type, null, null);
        } catch (ex) {
          toast('Voice pathano gelo na: ' + ex.message);
        }
      };
      rec.start();
      recbar.classList.add('on');
      secCounter = 0;
      rectm.textContent = '00:00';
      recTimer = setInterval(() => {
        secCounter += 1;
        rectm.textContent = fmtSec(secCounter);
        if (secCounter >= 120 && rec && rec.state !== 'inactive') rec.stop();
      }, 1000);
    } catch (ex) {
      cancelRec();
      toast('Microphone chalu korte parini. Permission din.');
    }
  };

  const sendText = async () => {
    const t = tx.value.trim(); if (!t) return;
    tx.value = '';
    setDraft(chatId, '');
    ep.classList.remove('on');
    try { await send(t); } catch (e) { toast('Pathano gelo na: ' + e.message); }
  };
  document.getElementById('sd').onclick = sendText;
  tx.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendText(); } });

  document.getElementById('ph').onclick = () => document.getElementById('fi').click();
  document.getElementById('fi').onchange = async (e) => {
    const f = e.target.files[0]; if (!f) return;
    try {
      if (!f.type.startsWith('image/')) throw new Error('Valid image file select korun');
      const capInput = prompt('Photo caption (optional):', '');
      if (capInput === null) { e.target.value = ''; return; }
      const small = await shrink(f);
      const photoBlob = await (await fetch(small.dataUrl)).blob();
      const url = await uploadMedia(chatId, photoBlob, 'jpg', small.dataUrl, false);
      await send(capInput.trim() || null, url, null, null, null, null);
    } catch (ex) {
      toast('Photo pathano gelo na: ' + ex.message);
    }
    e.target.value = '';
  };

  document.getElementById('cambtn').onclick = () => {
    openCameraModal(async (dataUrl, caption) => {
      try {
        const blob = await (await fetch(dataUrl)).blob();
        const url = await uploadMedia(chatId, blob, 'jpg', dataUrl, false);
        await send(caption, url, null, null, null, null);
      } catch (ex) {
        toast('Camera photo pathano jayni: ' + ex.message);
      }
    });
  };

  document.getElementById('docbtn').onclick = () => document.getElementById('dfi').click();
  document.getElementById('dfi').onchange = async (e) => {
    const f = e.target.files[0]; if (!f) return;
    try {
      const ext = (f.name.split('.').pop() || 'file').toLowerCase();
      const b64 = f.size < 650000 ? await blobToDataURL(f) : null;
      const url = await uploadMedia(chatId, f, ext, b64, true);
      await send(null, null, null, null, url, f.name);
      toast('Document pathano hoyeche');
    } catch (ex) {
      toast('Document pathano gelo na: ' + ex.message);
    }
    e.target.value = '';
  };
}

function blobToDataURL(blob) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(r.result);
    r.onerror = () => rej(new Error('File porte parini'));
    r.readAsDataURL(blob);
  });
}

function shrink(file, max = 720) {
  return new Promise((res, rej) => {
    const img = new Image();
    const objUrl = URL.createObjectURL(file);
    img.onload = () => {
      URL.revokeObjectURL(objUrl);
      const s = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      const ctx = c.getContext('2d');
      if (!ctx) return rej(new Error('Image process kora jayni'));
      ctx.drawImage(img, 0, 0, c.width, c.height);
      res({ dataUrl: c.toDataURL('image/jpeg', 0.55) });
    };
    img.onerror = () => { URL.revokeObjectURL(objUrl); rej(new Error('Chobi khola gelo na')); };
    img.src = objUrl;
  });
}
</script>
