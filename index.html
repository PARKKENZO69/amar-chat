<style>

  .hsub{font-size:12px;font-weight:400;opacity:.9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  header .sp{flex:1}

  .dot{width:10px;height:10px;border-radius:50%;background:#25d366;border:2px solid var(--page);position:absolute;right:0;bottom:0;z-index:2}
  .row .mid{flex:1;min-width:0}
  .row .t{font-weight:600;display:flex;align-items:center;gap:6px}
  .row .s{color:var(--sub);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .draftlbl{color:#e67e22;font-weight:700}
  .empty{padding:40px 20px;text-align:center;color:var(--sub)}

  .menu{position:absolute;right:16px;bottom:84px;background:var(--card);color:var(--text);border-radius:10px;box-shadow:0 2px 12px #0004;overflow:hidden;z-index:30;min-width:220px}

  .menu div{padding:12px 16px;cursor:pointer;font-size:14px;border-bottom:1px solid var(--bd)}

  .menu div:active{background:var(--rowact)}
  .auth{padding:28px 22px;margin:auto 0;overflow:auto}
  .auth h1{color:var(--g);text-align:center;margin:0 0 20px}

  .btn.sec{background:#4b5563}

  .btn.sm{width:auto;padding:10px 16px}
  .link{background:none;border:0;color:var(--g);width:100%;padding:10px;font-size:14.5px;cursor:pointer}
  .err{color:#e04848;margin:0 0 12px;font-size:14px}
  .ok{color:#25d366;margin:0 0 12px;font-size:14px}
  .hint{color:var(--sub);font-size:13.5px;margin:0 0 10px}
  .toast{position:fixed;left:50%;bottom:76px;transform:translateX(-50%);background:#222;color:#fff;padding:8px 14px;border-radius:20px;font-size:13px;z-index:170;box-shadow:0 2px 8px #0004;max-width:90%;text-align:center}

  .b.selected{outline:2.5px solid #25d366;background:#128c7e33}

  .b .fwd{flex-basis:100%;font-size:11px;font-style:italic;color:var(--sub)}

  .b .del{font-style:italic;color:var(--sub);font-size:13px}
  .b .ed{font-size:10px;color:var(--sub)}
  .b .tm{font-size:10.5px;color:var(--sub);line-height:1;margin-left:auto;white-space:nowrap}
  .b .receipt{font-size:9.5px;color:var(--g);margin-left:2px}
  .b .seenby{flex-basis:100%;font-size:10.5px;color:var(--sub);margin-top:2px}
  .b .lnk{color:#0284c7;text-decoration:underline;word-break:break-all}

  .b .reacts{flex-basis:100%;display:flex;flex-wrap:wrap;gap:4px;margin-top:2px}

  .b .act span{cursor:pointer;color:var(--g);font-weight:600}
  .b .act span:hover{text-decoration:underline}

  .recbar button{border:0;border-radius:16px;padding:6px 12px;font-size:13px;font-weight:600;cursor:pointer}

  .recbar .cncl{background:#fff;color:#333;border:1px solid #ccc}

  .pav{width:96px;height:96px;border-radius:50%;background:var(--g);color:#fff;font-size:36px;font-weight:700;display:flex;align-items:center;justify-content:center;margin:8px auto 14px;overflow:hidden;position:relative;cursor:pointer}
  .card{border:1px solid var(--bd);background:var(--card);border-radius:10px;padding:12px;margin-bottom:12px}
  .mrow{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--bd);gap:8px}
  .mrow:last-child{border-bottom:0}
  .togrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0}
  .togrow input[type=checkbox]{width:18px;height:18px;accent-color:var(--g)}
  .swatches{display:flex;flex-wrap:wrap;gap:10px;margin:8px 0 12px}
  .swatch{width:34px;height:34px;border-radius:50%;border:2px solid #8886;cursor:pointer}
  .swatch.on{outline:3px solid var(--g)}

  .modal{position:fixed;inset:0;background:#0008;z-index:120;display:flex;align-items:center;justify-content:center;padding:16px}
  .mbox{background:var(--card);color:var(--text);border-radius:12px;width:100%;max-width:430px;max-height:84vh;display:flex;flex-direction:column;overflow:hidden}
  .mhead{padding:12px 16px;background:var(--g);color:#fff;font-weight:600;display:flex;justify-content:space-between;align-items:center}
  .mhead button{background:none;border:0;color:#fff;font-size:18px;cursor:pointer}
  .mbody{padding:14px;overflow:auto}
  .cambox{background:#000;border-radius:10px;overflow:hidden;position:relative;aspect-ratio:4/3;display:flex;align-items:center;justify-content:center}
  .cambox video{width:100%;height:100%;object-fit:cover}
  .lbox{position:fixed;inset:0;background:#000e;z-index:150;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px}
  .lbox img{max-width:100%;max-height:65vh;border-radius:8px;object-fit:contain}
  .lbox .sttxt{color:#fff;font-size:24px;font-weight:700;padding:24px;text-align:center;max-width:520px}
  .lbox .lcap{color:#fff;margin-top:10px;font-size:14px;text-align:center}
  .lbox .viewers{margin-top:12px;background:#ffffff1a;color:#fff;padding:10px 14px;border-radius:10px;font-size:13px;max-width:420px;width:100%}
  .lbox .streply{margin-top:12px;display:flex;gap:8px;max-width:420px;width:100%}
  .lbox .streply input{margin:0;flex:1;padding:10px 12px;border-radius:20px;border:0;background:#fff;color:#111;font-size:14px}
  .lbox .streply button{border:0;border-radius:20px;padding:0 16px;background:#25d366;color:#fff;font-weight:700;cursor:pointer}
  .lbox .lclose{position:fixed;top:14px;right:16px;background:#ffffff24;color:#fff;border:0;border-radius:50%;width:38px;height:38px;font-size:20px;cursor:pointer}

  .callscreen{position:fixed;inset:0;background:#111b21;color:#fff;z-index:135;display:none;flex-direction:column;align-items:center;justify-content:space-between;padding:28px 20px}
  .callscreen.on{display:flex}
  .calltop{text-align:center;z-index:2}
  .callname{font-size:22px;font-weight:700}
  .callst{font-size:14px;opacity:.85;margin-top:4px}
  .vwrap{position:relative;flex:1;width:100%;max-width:600px;margin:16px 0;display:flex;align-items:center;justify-content:center;overflow:hidden;border-radius:14px;background:#0b141a}
  .vwrap video#remV{width:100%;height:100%;object-fit:cover;border-radius:14px;background:#000;z-index:1}
  .callscreen #remA{position:fixed;left:-9999px;width:1px;height:1px;opacity:0;pointer-events:none}
  .vwrap video#locV{position:absolute;right:12px;bottom:12px;width:108px;height:148px;object-fit:cover;border-radius:10px;border:2px solid #fff6;background:#182229;z-index:2}

  .cbtn.acc{background:#25d366}
  .cbtn.end{background:#e53935}
  .cbtn.off{background:#fff;color:#111}

function currentLang() {

  return I18N[l] ? l : 'banglish';
}

function tr(key) {
  const dict = I18N[currentLang()] || I18N.banglish;
  return dict[key] !== undefined ? dict[key] : (I18N.banglish[key] || key);
}

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const addSub = fn => { if (typeof fn === 'function') unsubs.push(fn); };
const stop = () => {
  currentOpenChatId = null;
  customBackHandler = null;
  unsubs.forEach(fn => { try { fn(); } catch (e) {} });
  unsubs = [];
};
const myName = () => (profile && profile.name) || me?.displayName || 'User';
const myBlocked = () => Array.isArray(profile?.blocked) ? profile.blocked : [];
const myStarred = () => Array.isArray(profile?.starred) ? profile.starred : [];
const showLastSeenPref = () => profile?.privacy?.lastSeen !== false;
const sendReceiptsPref = () => profile?.privacy?.readReceipts !== false;
const isDarkMode = () => !!profile?.darkMode;
const isSoundEnabled = () => profile?.soundEnabled !== false;
const UN_RE = /^[a-z0-9_]{3,20}$/;
const normUn = s => String(s || '').trim().toLowerCase().replace(/^@/, '');
const UN_HELP = 'Username: 3-20 chars (a-z, 0-9, _).';
const MEDIA_OK = /^(data:(image|audio)\/[a-z0-9.+-]+(;[^;,]+)*;base64,|https:\/\/firebasestorage\.googleapis\.com\/)/i;
const safeMedia = u => (typeof u === 'string' && MEDIA_OK.test(u)) ? u : '';
const isOnline = p => !!(p && p.online && p.lastSeen && p.lastSeen.toMillis && (Date.now() - p.lastSeen.toMillis() < 180000));
const tsMs = ts => ts && ts.toMillis ? ts.toMillis() : (typeof ts === 'number' ? ts : 0);

function getDraft(cid) {
  if (!cid) return '';
  return localStorage.getItem(`amar_draft_${me?.uid || 'guest'}_${cid}`) || '';
}
function setDraft(cid, txt) {
  if (!cid) return;
  const k = `amar_draft_${me?.uid || 'guest'}_${cid}`;
  const clean = String(txt || '');
  if (clean.trim()) localStorage.setItem(k, clean);
  else localStorage.removeItem(k);
}

const URL_RE = /(https?:\/\/[^\s<>"']+)/gi;
function extractFirstUrl(str) {
  const m = String(str || '').match(URL_RE);
  return m ? m[0] : '';
}
function formatTextWithLinks(str) {
  const parts = String(str || '').split(URL_RE);
  return parts.map(part => {
    if (/^https?:\/\/[^\s<>"']+$/i.test(part)) {
      return `<a class="lnk" href="${esc(part)}" target="_blank" rel="noopener noreferrer">${esc(part)}</a>`;
    }
    return esc(part);
  }).join('');
}
function buildLinkPreviewHtml(rawText) {
  const url = extractFirstUrl(rawText);
  if (!url) return '';
  let host = url;
  try { host = new URL(url).hostname; } catch (e) {}
  return `<div class="lprev"><b>🔗 ${esc(host)}</b><span>${esc(url)}</span></div>`;
}

function ensureRootHistoryAnchor() {

    if (!history.state || !history.state.amarRoot) {
      history.replaceState({ amarRoot: true }, '', location.href);

}

function pushSubScreenHistory(screenTag) {
  ensureRootHistoryAnchor();
  try {
    if (!history.state || history.state.amarScreen !== screenTag) {
      history.pushState({ amarRoot: true, amarScreen: screenTag }, '', location.href);
    }
  } catch (e) {}
}

  const lb = document.querySelector('.lbox');
  if (lb) { lb.remove(); ensureRootHistoryAnchor(); return; }
  const modal = document.querySelector('.modal');
  if (modal) {
    const cl = modal.querySelector('button[id$="cl"]');
    if (cl) cl.click();
    else modal.remove();
    ensureRootHistoryAnchor();

  if (typeof customBackHandler === 'function') {

    if (handled) { ensureRootHistoryAnchor(); return; }

  if (currentScreenName !== 'home' && me) {
    goToChatList();
    ensureRootHistoryAnchor();
  }
});

}

function avHtml(photo, fallbackChar, isGroup = false) {
  const safe = safeMedia(photo);
  if (safe) return `<img src="${esc(safe)}" alt="">`;
  return isGroup ? '👥' : esc((fallbackChar || '?')[0]?.toUpperCase() || '?');
}

function toast(msg) {
  const old = document.querySelector('.toast');
  if (old) old.remove();
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 2600);
}

function openLightbox(src, caption = '', textOnly = false, extraHtml = '') {
  const lb = document.createElement('div');
  lb.className = 'lbox';
  if (textOnly) {
    lb.innerHTML = `
      <button class="lclose" title="Close">✕</button>
      <div class="sttxt">${esc(src)}</div>
      ${caption ? `<div class="lcap">${esc(caption)}</div>` : ''}
      ${extraHtml}`;
  } else {
    const safe = safeMedia(src);
    if (!safe) return;
    lb.innerHTML = `
      <button class="lclose" title="Close">✕</button>
      <img src="${esc(safe)}" alt="">
      ${caption ? `<div class="lcap">${esc(caption)}</div>` : ''}
      ${extraHtml}`;
  }
  document.body.appendChild(lb);
  const close = () => lb.remove();
  lb.querySelector('.lclose').onclick = close;
  lb.onclick = e => { if (e.target === lb) close(); };
}

/* ---------- RINGTONE & NOTIFICATION SOUND ---------- */
let ringtoneInterval = null;

function playAlertBeep(freq = 740, duration = 0.16) {
  if (!isSoundEnabled()) return;
  try {
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    if (!AudioCtx) return;
    const ctx = new AudioCtx();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.07, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + duration);
    setTimeout(() => ctx.close().catch(() => {}), (duration + 0.1) * 1000);
  } catch (e) {}
}

function startRingtone() {
  stopRingtone();
  if (!isSoundEnabled()) return;
  const pulse = () => {
    if (!isSoundEnabled()) return;
    playAlertBeep(880, 0.2);
    setTimeout(() => playAlertBeep(1046, 0.2), 250);
  };
  pulse();
  ringtoneInterval = setInterval(pulse, 1500);
}

function stopRingtone() {
  if (ringtoneInterval) { clearInterval(ringtoneInterval); ringtoneInterval = null; }
}

function triggerNotification(title, body, isCall = false) {
  if (!isCall) playAlertBeep(660, 0.15);
  toast(`${title}: ${body}`);
}

// Low-read alert listener: watches `chats` docs only (no per-chat `messages` listeners!)
function watchChatNotifications() {
  if (chatAlertUnsub) { chatAlertUnsub(); chatAlertUnsub = null; }
  if (!me) return;
  let initial = true;

  chatAlertUnsub = db.collection('chats').where('members', 'array-contains', me.uid).limit(25).onSnapshot(snap => {
    mutedChatIds.clear();
    snap.docs.forEach(d => {
      const c = d.data();
      if (c.mutedBy?.[me.uid]) mutedChatIds.add(d.id);
    });
    if (initial) {
      initial = false;
      snap.docs.forEach(d => { lastAlertByChat[d.id] = tsMs(d.data().updatedAt); });
      return;
    }
    snap.docChanges().forEach(ch => {
      if (ch.type !== 'added' && ch.type !== 'modified') return;
      const cid = ch.doc.id;
      const c = ch.doc.data();
      const upd = tsMs(c.updatedAt);
      if (!upd || upd <= (lastAlertByChat[cid] || 0)) return;
      lastAlertByChat[cid] = upd;
      if (mutedChatIds.has(cid)) return;
      if (currentOpenChatId === cid && !document.hidden) return;
      if (!c.lastMessage) return;
      const title = c.isGroup ? (c.name || 'Group') : (c.memberNames ? Object.entries(c.memberNames).find(([k]) => k !== me.uid)?.[1] : tr('appName'));
      triggerNotification(title || tr('appName'), c.lastMessage, false);
    });
  }, () => {});
}

/* ---------- WEBRTC AUDIO + VIDEO CALL ENGINE ---------- */
let pc = null, localStream = null, remoteStream = null, activeCallId = null, callUnsubs = [], micMuted = false, camOff = false;
let currentCallMeta = null, isSettingRemote = false, currentFacingMode = 'user', callIsVideo = false;

const $cs = document.getElementById('callscreen');
const $cname = document.getElementById('cname');
const $cst = document.getElementById('cst');
const $cav = document.getElementById('cav');
const $remV = document.getElementById('remV');
const $remA = document.getElementById('remA');
const $locV = document.getElementById('locV');
const $cacts = document.getElementById('cacts');

function syncMediaElements() {
  if (remoteStream) {
    if ($remA.srcObject !== remoteStream) $remA.srcObject = remoteStream;
    $remA.muted = false;
    $remA.volume = 1.0;
    $remA.play().catch(() => {});

    const hasVideo = remoteStream.getVideoTracks().length > 0 || callIsVideo;
    if (hasVideo) {
      callIsVideo = true;
      $cav.style.display = 'none';
      $remV.style.display = 'block';
      $locV.style.display = 'block';
      if ($remV.srcObject !== remoteStream) $remV.srcObject = remoteStream;
      $remV.muted = false;
      $remV.volume = 1.0;
      $remV.play().catch(() => {});
    }
  }
  if (localStream && callIsVideo) {
    $locV.style.display = 'block';
    if ($locV.srcObject !== localStream) $locV.srcObject = localStream;
    $locV.muted = true;
    $locV.play().catch(() => {});
  }
}

$cs.addEventListener('click', e => {
  if (!e.target.closest('button')) syncMediaElements();
});

async function logCallHistory(peerUid, peerName, isVideo, direction, outcome) {
  if (!me || !peerUid) return;
  try {
    await db.collection('users').doc(me.uid).collection('callLogs').add({
      peerUid,
      peerName: peerName || 'User',
      isVideo: !!isVideo,
      direction,
      outcome,
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });
  } catch (e) {}
}

function clearCallSubs() {
  callUnsubs.forEach(fn => { try { fn(); } catch (e) {} });
  callUnsubs = [];
}

async function switchCallCamera() {
  if (!pc || !localStream || !callIsVideo) return;
  const nextMode = currentFacingMode === 'user' ? 'environment' : 'user';
  try {
    const newVidStream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: nextMode }, width: { ideal: 480 }, height: { ideal: 360 } },
      audio: false
    });
    const newTrack = newVidStream.getVideoTracks()[0];
    if (!newTrack) return;
    const oldTrack = localStream.getVideoTracks()[0];
    const sender = pc.getSenders().find(s => s.track && s.track.kind === 'video');
    if (sender) await sender.replaceTrack(newTrack);
    if (oldTrack) { oldTrack.stop(); localStream.removeTrack(oldTrack); }
    localStream.addTrack(newTrack);
    currentFacingMode = nextMode;
    camOff = false;
    syncMediaElements();
  } catch (e) {
    toast('Camera switch error');
  }
}

function showCallUI(peerName, statusText, isVideo, mode) {
  callIsVideo = !!isVideo;
  $cname.textContent = peerName || 'User';
  $cst.textContent = statusText;
  $cav.textContent = (peerName || '?')[0]?.toUpperCase() || '?';
  $cav.style.display = callIsVideo ? 'none' : 'flex';
  $remV.style.display = callIsVideo ? 'block' : 'none';
  $locV.style.display = callIsVideo ? 'block' : 'none';
  $cs.classList.add('on');

  if (mode === 'incoming') {
    startRingtone();
    $cacts.innerHTML = `
      <button class="cbtn end" id="cdec" title="Decline">✕</button>
      <button class="cbtn acc" id="cacc" title="Accept">📞</button>`;
  } else {
    stopRingtone();
    $cacts.innerHTML = `
      <button class="cbtn" id="cmute" title="Mute">🎤</button>
      ${callIsVideo ? '<button class="cbtn" id="ccam" title="Camera">📹</button><button class="cbtn" id="cflip" title="Switch Camera">🔄</button>' : ''}
      <button class="cbtn end" id="chang" title="End Call">📞✕</button>`;
    document.getElementById('cmute').onclick = () => {
      if (!localStream) return;
      micMuted = !micMuted;
      localStream.getAudioTracks().forEach(t => t.enabled = !micMuted);
      const b = document.getElementById('cmute');
      b.classList.toggle('off', micMuted);
      b.textContent = micMuted ? '🔇' : '🎤';
    };
    const ccam = document.getElementById('ccam');
    if (ccam) {
      ccam.onclick = () => {
        if (!localStream) return;
        camOff = !camOff;
        localStream.getVideoTracks().forEach(t => t.enabled = !camOff);
        ccam.classList.toggle('off', camOff);
        ccam.textContent = camOff ? '📷✕' : '📹';
      };
    }
    const cflip = document.getElementById('cflip');
    if (cflip) cflip.onclick = switchCallCamera;
    document.getElementById('chang').onclick = () => endCall(true);
    syncMediaElements();
  }
}

function hideCallUI() {
  stopRingtone();
  callIsVideo = false;
  $cs.classList.remove('on');
  $cacts.innerHTML = '';
  $remV.srcObject = null;
  $remA.srcObject = null;
  $locV.srcObject = null;
}

async function endCall(updateRemote = true) {
  stopRingtone();
  const cid = activeCallId;
  const meta = currentCallMeta;
  activeCallId = null;
  currentCallMeta = null;
  ringingCallId = null;
  isSettingRemote = false;
  currentFacingMode = 'user';
  callIsVideo = false;
  clearTimeout(ringTimer); ringTimer = null;
  micMuted = false;
  camOff = false;
  pendingCands = [];
  clearCallSubs();
  if (pc) { try { pc.close(); } catch (e) {} pc = null; }
  if (localStream) { localStream.getTracks().forEach(t => t.stop()); localStream = null; }
  remoteStream = null;
  hideCallUI();
  if (meta) {
    await logCallHistory(meta.peerUid, meta.peerName, meta.isVideo, meta.direction, meta.outcome || 'completed');
  }
  if (updateRemote && cid && me) {
    try {
      await db.collection('calls').doc(cid).set({
        status: 'ended',
        endedBy: me.uid,
        endedAt: firebase.firestore.FieldValue.serverTimestamp()
      }, { merge: true });
    } catch (e) {}
  }
}

async function flushCands() {
  if (!pc || !pc.remoteDescription || !pc.remoteDescription.type) return;
  const list = pendingCands.splice(0, pendingCands.length);
  for (const c of list) {
    try { await pc.addIceCandidate(new RTCIceCandidate(c)); } catch (e) {}
  }
}

function attachRemoteTrack(track, stream) {
  if (!remoteStream) remoteStream = new MediaStream();
  if (stream && stream.getTracks) {
    stream.getTracks().forEach(t => {
      if (!remoteStream.getTracks().some(rt => rt.id === t.id)) remoteStream.addTrack(t);
    });
  } else if (track && !remoteStream.getTracks().some(rt => rt.id === track.id)) {
    remoteStream.addTrack(track);
  }
  if (track && track.kind === 'video') {
    callIsVideo = true;
    $cav.style.display = 'none';
    $remV.style.display = 'block';
    $locV.style.display = 'block';
  }
  syncMediaElements();
}

async function setupPeer(callDocRef, isCaller, isVideo) {
  pendingCands = [];
  isSettingRemote = false;
  currentFacingMode = 'user';
  callIsVideo = !!isVideo;
  pc = new RTCPeerConnection(RTC_CFG);
  remoteStream = new MediaStream();
  $remA.srcObject = remoteStream;
  $remA.muted = false;
  $remV.srcObject = remoteStream;
  $remV.muted = false;

  const audioConstraints = { echoCancellation: true, noiseSuppression: true };
  try {
    localStream = await navigator.mediaDevices.getUserMedia({
      audio: audioConstraints,
      video: isVideo ? { facingMode: { ideal: 'user' }, width: { ideal: 480 }, height: { ideal: 360 } } : false
    });
  } catch (err) {
    if (isVideo) {
      localStream = await navigator.mediaDevices.getUserMedia({ audio: audioConstraints, video: false });
      isVideo = false;
      callIsVideo = false;
      $cav.style.display = 'flex';
      $remV.style.display = 'none';
      $locV.style.display = 'none';
    } else {
      throw err;
    }
  }

  localStream.getTracks().forEach(track => pc.addTrack(track, localStream));
  if (isVideo) {
    $locV.srcObject = localStream;
    $locV.muted = true;
    $locV.play().catch(() => {});
  }

  pc.ontrack = e => {
    attachRemoteTrack(e.track, e.streams && e.streams[0]);
    const hasVid = remoteStream.getVideoTracks().length > 0 || callIsVideo;
    $cst.textContent = hasVid ? tr('videoConnected') : tr('audioConnected');
  };

  pc.oniceconnectionstatechange = () => {
    if (!pc) return;
    if (pc.iceConnectionState === 'connected' || pc.iceConnectionState === 'completed') {
      syncMediaElements();
      const hasVid = (remoteStream && remoteStream.getVideoTracks().length > 0) || callIsVideo;
      $cst.textContent = hasVid ? tr('videoConnected') : tr('audioConnected');
    } else if (pc.iceConnectionState === 'failed') {
      const hint = TURN_SERVERS.length === 0 ? ' (Add TURN server in TURN_SERVERS for long-distance)' : '';
      toast('Call connection failed' + hint);
      endCall(true);
    }
  };

  const candCol = callDocRef.collection(isCaller ? 'callerCandidates' : 'calleeCandidates');
  const remoteCandCol = callDocRef.collection(isCaller ? 'calleeCandidates' : 'callerCandidates');

  pc.onicecandidate = e => {
    if (e.candidate) candCol.add(e.candidate.toJSON()).catch(() => {});
  };

  callUnsubs.push(remoteCandCol.onSnapshot(snap => {
    snap.docChanges().forEach(ch => { if (ch.type === 'added') pendingCands.push(ch.doc.data()); });
    flushCands();
  }, () => {}));

  let seen = false;
  callUnsubs.push(callDocRef.onSnapshot(snap => {
    if (!snap.exists) { if (seen) endCall(false); return; }
    seen = true;
    const d = snap.data();
    if (d.status === 'ended' || d.status === 'declined') {
      if (currentCallMeta) currentCallMeta.outcome = d.status === 'declined' ? 'declined' : 'completed';
      toast(d.status === 'declined' ? tr('callDeclined') : tr('callEnded'));
      endCall(false);
    }
  }, () => {}));
}

async function startCall(peerUid, peerName, isVideo) {
  if (!me || !peerUid) return;
  if (myBlocked().includes(peerUid)) { toast('User is blocked'); return; }
  if (activeCallId) { toast('Call already active'); return; }
  if (!navigator.mediaDevices?.getUserMedia || !window.RTCPeerConnection) {
    toast('Calls not supported in this browser'); return;
  }
  const callDoc = db.collection('calls').doc();
  activeCallId = callDoc.id;
  currentCallMeta = { peerUid, peerName, isVideo: !!isVideo, direction: 'outgoing', outcome: 'outgoing' };
  showCallUI(peerName, isVideo ? tr('videoCalling') : tr('audioCalling'), isVideo, 'active');

  try {
    await setupPeer(callDoc, true, isVideo);
    const offer = await pc.createOffer({ offerToReceiveAudio: true, offerToReceiveVideo: !!isVideo });
    await pc.setLocalDescription(offer);
    await callDoc.set({
      callerId: me.uid, callerName: myName(),
      calleeId: peerUid, calleeName: peerName,
      isVideo: !!isVideo, status: 'ringing',
      offer: { type: offer.type, sdp: offer.sdp },
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });

    callUnsubs.push(callDoc.onSnapshot(async snap => {
      if (!snap.exists || !pc || isSettingRemote) return;
      const d = snap.data();
      if (d.status === 'declined') {
        if (currentCallMeta) currentCallMeta.outcome = 'declined';
        toast(tr('callDeclined'));
        endCall(false);
        return;
      }
      if (d.answer && d.answer.sdp && !pc.remoteDescription) {
        isSettingRemote = true;
        if (currentCallMeta) currentCallMeta.outcome = 'connected';
        try {
          await pc.setRemoteDescription(new RTCSessionDescription(d.answer));
          $cst.textContent = tr('callConnecting');
          syncMediaElements();
          await flushCands();
        } catch (e) {
          toast('Answer error');
        } finally {
          isSettingRemote = false;
        }
      }
    }, () => {}));

    const myCallId = callDoc.id;
    ringTimer = setTimeout(() => {
      if (activeCallId === myCallId && pc && !pc.remoteDescription) {
        if (currentCallMeta) currentCallMeta.outcome = 'missed';
        endCall(true);
      }
    }, 40000);
  } catch (e) {
    toast('Call error: ' + (e.message || 'Check mic/camera permission'));
    endCall(true);
  }
}

async function acceptCall(callData, callDoc) {
  stopRingtone();
  if (activeCallId || !callData?.offer?.sdp) { ringingCallId = null; hideCallUI(); return; }
  const isVideo = !!callData.isVideo;
  ringingCallId = null;
  activeCallId = callDoc.id;
  currentCallMeta = { peerUid: callData.callerId, peerName: callData.callerName || 'User', isVideo, direction: 'incoming', outcome: 'answered' };
  showCallUI(callData.callerName || 'User', tr('callConnecting'), isVideo, 'active');

  try {
    await setupPeer(callDoc, false, isVideo);
    isSettingRemote = true;
    await pc.setRemoteDescription(new RTCSessionDescription(callData.offer));
    isSettingRemote = false;
    await flushCands();
    const answer = await pc.createAnswer();
    await pc.setLocalDescription(answer);
    syncMediaElements();
    await callDoc.update({ status: 'accepted', answer: { type: answer.type, sdp: answer.sdp } });
  } catch (e) {
    toast('Accept call error');
    endCall(true);
  }
}

function listenIncomingCalls() {
  if (callWatchUnsub) { callWatchUnsub(); callWatchUnsub = null; }
  if (!me) return;
  let initialLoadDone = false;

  callWatchUnsub = db.collection('calls')
    .where('calleeId', '==', me.uid)
    .limit(5)
    .onSnapshot(snap => {
      if (!initialLoadDone) {
        initialLoadDone = true;
        snap.docs.forEach(docSnap => {
          const d = docSnap.data() || {};
          if (d.status === 'ringing' && (Date.now() - tsMs(d.createdAt)) < 60000 && !activeCallId && !ringingCallId) {
            presentIncoming(docSnap.id, d, docSnap.ref);
          }
        });
        return;
      }
      snap.docChanges().forEach(ch => {
        const id = ch.doc.id;
        const d = ch.doc.data() || {};
        if (ch.type === 'removed' || (d.status && d.status !== 'ringing')) {
          if (ringingCallId === id) {
            ringingCallId = null;
            stopRingtone();
            if (!activeCallId) hideCallUI();
            if (d.status === 'ended') logCallHistory(d.callerId, d.callerName || 'User', !!d.isVideo, 'incoming', 'missed');
          }
          return;
        }
        if (ch.type === 'added' && d.status === 'ringing' && !activeCallId && !ringingCallId) {
          presentIncoming(id, d, ch.doc.ref);
        }
      });
    }, () => {});

  function presentIncoming(id, d, docRef) {
    if (myBlocked().includes(d.callerId)) return;
    ringingCallId = id;
    triggerNotification(d.callerName || tr('appName'), d.isVideo ? tr('inVideoCall') : tr('inAudioCall'), true);
    showCallUI(d.callerName || 'User', d.isVideo ? tr('inVideoCall') : tr('inAudioCall'), !!d.isVideo, 'incoming');
    const decBtn = document.getElementById('cdec');
    const accBtn = document.getElementById('cacc');
    if (decBtn) {
      decBtn.onclick = async () => {
        ringingCallId = null; stopRingtone();
        await logCallHistory(d.callerId, d.callerName || 'User', !!d.isVideo, 'incoming', 'missed');
        try { await docRef.update({ status: 'declined' }); } catch (e) {}
        hideCallUI();
      };
    }
    if (accBtn) accBtn.onclick = () => acceptCall(d, docRef);
  }
}

/* ---------- LIGHTWEIGHT PRESENCE (LOW WRITES) ---------- */
async function setOnline(online) {
  if (!me || !profile) return;
  try {
    await db.collection('presence').doc(me.uid).set({
      online: !!online,
      lastSeen: firebase.firestore.FieldValue.serverTimestamp()
    }, { merge: true });
  } catch (e) {}
}

function startPresence() {
  stopPresence();
  const visible = () => document.visibilityState === 'visible';
  setOnline(visible());
  presenceTimer = setInterval(() => { if (visible()) setOnline(true); }, 180000);
  const onVis = () => setOnline(visible());
  const onOff = () => setOnline(false);
  document.addEventListener('visibilitychange', onVis);
  window.addEventListener('pagehide', onOff);
  presenceCleanup = () => {
    document.removeEventListener('visibilitychange', onVis);
    window.removeEventListener('pagehide', onOff);
  };
}

function stopPresence() {
  if (presenceTimer) { clearInterval(presenceTimer); presenceTimer = null; }
  if (presenceCleanup) { presenceCleanup(); presenceCleanup = null; }
}

function fmtStatus(p, canSee = true) {
  if (!canSee || !p) return '';
  if (isOnline(p)) return tr('online');
  const d = p.lastSeen?.toDate?.();
  if (!d) return '';
  return `${tr('lastSeen')} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
}

auth.onAuthStateChanged(async u => {
  me = u; stop(); stopPresence(); appUnlocked = false;
  if (callWatchUnsub) { callWatchUnsub(); callWatchUnsub = null; }
  if (chatAlertUnsub) { chatAlertUnsub(); chatAlertUnsub = null; }
  await endCall(false);
  if (!u) { profile = null; applyTheme(); authView(true); return; }
  if (signingUp) return;
  gate();
});

function gate() {
  if (!me.emailVerified) verifyView(); else route();
}

function verifyView(msg = '', good = false) {
  stop();
  currentScreenName = 'verify';
  applyTheme();
  $app.innerHTML = `
    <div class="auth">
      <h1>📧 Verify Email</h1>
      <p class="hint">Verification link sent to <b>${esc(me.email)}</b>. Check Inbox/Spam, click the link, then press below.</p>
      ${msg ? `<p class="${good ? 'ok' : 'err'}">${esc(msg)}</p>` : ''}
      <button class="btn" id="ok">I have verified</button>
      <button class="link" id="rs">Resend verification email</button>
      <button class="link" id="lo">${esc(tr('logout'))}</button>
    </div>`;
  document.getElementById('lo').onclick = () => auth.signOut();
  document.getElementById('rs').onclick = async () => {
    try { await me.sendEmailVerification(); verifyView('Verification email sent.', true); }
    catch (ex) { verifyView(ex.message); }
  };
  document.getElementById('ok').onclick = async () => {
    try {
      await me.reload();
      if (me.emailVerified) { await me.getIdToken(true); route(); }
      else verifyView('Not verified yet.');
    } catch (ex) { verifyView(ex.message); }
  };
}

async function route() {
  try {
    const d = await db.collection('users').doc(me.uid).get();
    if (d.exists && d.data().username) {
      profile = d.data();
      if (!profile.lang) profile.lang = currentLang();
      localStorage.setItem('amar_chat_lang', profile.lang);
      applyTheme();
      startPresence();
      listenIncomingCalls();
      watchChatNotifications();
      const afterUnlock = () => home('chats', false);
      profile.pinCode = localStorage.getItem('amar_chat_pin') || '';
      if (profile.pinCode && !appUnlocked) pinLockView(afterUnlock);
      else afterUnlock();
    } else {
      usernameSetup();
    }
  } catch (e) {
    $app.innerHTML = `<div class="empty">Error: ${esc(e.message)}</div>`;
  }
}

async function claimUsername(username, name) {
  const baseDoc = {
    uid: me.uid, name, username,
    about: 'Hey there! I am using Amar Chat.',
    photo: '', blocked: [], starred: [], darkMode: false, soundEnabled: true,
    lang: currentLang(),
    privacy: { lastSeen: true, readReceipts: true }
  };
  const batch = db.batch();
  batch.set(db.collection('usernames').doc(username), { uid: me.uid, name });
  batch.set(db.collection('users').doc(me.uid), baseDoc, { merge: true });
  await batch.commit();
  profile = baseDoc;
}

function authView(isLogin, err = '', okMsg = '', prefEmail = '') {
  currentScreenName = 'auth';
  $app.innerHTML = `
    <div class="auth">
      <h1>💬 ${esc(tr('appName'))}</h1>
      ${isLogin ? '' : `<input type="text" id="nm" placeholder="Your Name">`}

      <input type="password" id="pw" placeholder="Password (min 6 chars)" autocomplete="${isLogin ? 'current-password' : 'new-password'}">

      ${okMsg ? `<p class="ok">${esc(okMsg)}</p>` : ''}

      ${isLogin ? '<button class="link" id="rst">Forgot Password?</button>' : ''}
      <button class="link" id="sw">${isLogin ? 'New here? Create Account' : 'Already have an account? Login'}</button>
    </div>`;

  document.getElementById('sw').onclick = () => authView(!isLogin, '', '', document.getElementById('em').value.trim());
  const rstBtn = document.getElementById('rst');
  if (rstBtn) {
    rstBtn.onclick = async () => {
      const email = document.getElementById('em').value.trim();
      if (!email) return authView(true, 'Enter your email first');
      rstBtn.disabled = true;
      try {
        await auth.sendPasswordResetEmail(email);
        authView(true, '', 'Password reset link sent.', email);
      } catch (ex) { authView(true, ex.message, '', email); }
    };
  }
  document.getElementById('go').onclick = async e => {
    e.target.disabled = true;
    const email = document.getElementById('em').value.trim();
    const pw = document.getElementById('pw').value;
    if (!email || !pw) return authView(isLogin, 'Enter email and password', '', email);
    if (isLogin) {
      try { await auth.signInWithEmailAndPassword(email, pw); }
      catch (ex) { authView(true, ex.message, '', email); }
      return;
    }
    const name = document.getElementById('nm').value.trim();
    if (!name) return authView(false, 'Enter your name', '', email);
    signingUp = true;
    try {
      const c = await auth.createUserWithEmailAndPassword(email, pw);
      me = c.user;
      await c.user.updateProfile({ displayName: name });
      await c.user.sendEmailVerification();
      verifyView('Verification email sent.', true);
    } catch (ex) { authView(false, ex.message, '', email); }
    finally { signingUp = false; }
  };
}

  document.getElementById('bk').onclick = () => home('chats', false);

    localStorage.setItem('amar_chat_lang', nextLang);

  };
  document.getElementById('pav').onclick = () => document.getElementById('pfi').click();
  document.getElementById('pfi').onchange = async e => {
    const f = e.target.files[0]; if (!f) return;
    try {
      const small = await shrink(f, 220, 0.45);
      newPhoto = small.dataUrl;
      document.getElementById('pav').innerHTML = avHtml(newPhoto, myName());
    } catch (ex) { toast('Photo error'); }
    e.target.value = '';
  };

  document.getElementById('psv').onclick = async e => {
    const name = document.getElementById('pnm').value.trim();
    const about = document.getElementById('pab').value.trim();
    const lang = document.getElementById('plang').value;
    const soundEnabled = document.getElementById('psound').checked;
    const darkMode = document.getElementById('pdark').checked;
    const lastSeen = document.getElementById('plseen').checked;
    const readReceipts = document.getElementById('preceipt').checked;
    const pinCode = document.getElementById('ppin').value.trim();
    if (!name) return toast('Name required');
    if (pinCode && !/^\d{4,6}$/.test(pinCode)) return toast('PIN must be 4-6 digits');
    e.target.disabled = true;
    try {
      await me.updateProfile({ displayName: name });
      const privacy = { lastSeen, readReceipts };
      const batch = db.batch();
      batch.set(db.collection('users').doc(me.uid), { name, about, photo: newPhoto, lang, soundEnabled, privacy, darkMode }, { merge: true });
      batch.set(db.collection('usernames').doc(profile.username), { name }, { merge: true });
      await batch.commit();
      Object.assign(profile, { name, about, photo: newPhoto, lang, soundEnabled, privacy, pinCode, darkMode });
      if (pinCode) localStorage.setItem('amar_chat_pin', pinCode);
      else localStorage.removeItem('amar_chat_pin');
      localStorage.setItem('amar_chat_lang', lang);
      applyTheme();
      appUnlocked = true;
      toast(tr('saveBtn'));
      home('chats', false);
    } catch (ex) {
      toast('Save error: ' + ex.message);
      e.target.disabled = false;
    }
  };

  document.getElementById('unbtn').onclick = async () => {
    const nextUn = normUn(document.getElementById('newun').value);
    if (!UN_RE.test(nextUn)) return toast(UN_HELP);
    const oldUn = profile.username;
    if (nextUn === oldUn) return;
    try {
      const snap = await db.collection('usernames').doc(nextUn).get();
      if (snap.exists && snap.data().uid !== me.uid) return toast('Username taken');
      const batch = db.batch();
      batch.set(db.collection('usernames').doc(nextUn), { uid: me.uid, name: myName() });
      if (oldUn) batch.delete(db.collection('usernames').doc(oldUn));
      batch.set(db.collection('users').doc(me.uid), { username: nextUn }, { merge: true });
      await batch.commit();
      profile.username = nextUn;
      toast(`@${nextUn}`);
      profileView();
    } catch (ex) { toast(ex.message); }
  };

  document.getElementById('embtn').onclick = async () => {
    const nextEm = document.getElementById('newem').value.trim();
    const curPw = document.getElementById('emcurpw').value;
    if (!nextEm || !nextEm.includes('@') || !curPw) return toast('Enter email and current password');
    try {
      const cred = firebase.auth.EmailAuthProvider.credential(me.email, curPw);
      await me.reauthenticateWithCredential(cred);
      await me.verifyBeforeUpdateEmail(nextEm);
      document.getElementById('emcurpw').value = '';
      toast('Verification link sent');
    } catch (ex) { toast(ex.message); }
  };

  async function renderBlockList() {
    const box = document.getElementById('blklist');
    const ids = myBlocked();
    if (!ids.length) { box.innerHTML = `<div class="hint" style="margin:0">${esc(tr('noBlk'))}</div>`; return; }
    box.innerHTML = ids.map(uid => `
      <div class="mrow">
        <span>${esc(userProfilesCache[uid]?.name || uid)}</span>
        <button class="btn sm sec unblkrow" data-u="${esc(uid)}" style="padding:5px 10px;font-size:12px">${esc(tr('unblkBtn'))}</button>
      </div>`).join('');
    box.querySelectorAll('.unblkrow').forEach(btn => {
      btn.onclick = async () => {
        const uid = btn.dataset.u;
        await db.collection('users').doc(me.uid).set({ blocked: firebase.firestore.FieldValue.arrayRemove(uid) }, { merge: true });
        profile.blocked = myBlocked().filter(x => x !== uid);
        renderBlockList();
      };
    });
  }
  renderBlockList();

  document.getElementById('pwbtn').onclick = async () => {
    const np = document.getElementById('newpw').value;
    if (!np || np.length < 6) return toast('Min 6 characters');
    try {
      await me.updatePassword(np);
      document.getElementById('newpw').value = '';
      toast('Password updated');
    } catch (ex) { toast(ex.message); }
  };

  document.getElementById('delacc').onclick = async () => {
    if (!confirm(tr('delHint'))) return;
    try {
      await db.collection('users').doc(me.uid).delete().catch(() => {});
      await db.collection('usernames').doc(profile.username).delete().catch(() => {});
      await me.delete();
    } catch (ex) { toast(ex.message); }
  };
}

async function lookup(raw) {
  const u = normUn(raw);
  if (!UN_RE.test(u)) throw new Error(UN_HELP);
  const d = await db.collection('usernames').doc(u).get();
  if (!d.exists) throw new Error('User not found');
  const x = d.data();
  if (x.uid === me.uid) throw new Error('Cannot chat with yourself');
  return { uid: x.uid, name: x.name, username: u };
}

async function openStatusModal() {
  const modal = document.createElement('div');
  modal.className = 'modal';
  modal.innerHTML = `
    <div class="mbox">
      <div class="mhead"><span>${esc(tr('postStatusMenu'))}</span><button id="scl">✕</button></div>
      <div class="mbody">
        <input type="text" id="stinp" placeholder="Status (24h)...">
        <select id="stpriv">
          <option value="all">Share with All</option>
          <option value="selected">Selected Friends Only</option>
        </select>
        <div id="stpick" style="display:none;max-height:170px;overflow:auto;border:1px solid var(--bd);border-radius:8px;padding:8px;margin-bottom:12px"></div>
        <button class="btn" id="stpost">Post</button>
      </div>
    </div>`;
  document.body.appendChild(modal);
  modal.querySelector('#scl').onclick = () => modal.remove();
  modal.onclick = e => { if (e.target === modal) modal.remove(); };

  const privSel = modal.querySelector('#stpriv');
  const pickBox = modal.querySelector('#stpick');
  let contactsLoaded = false;

  privSel.onchange = async () => {
    const show = privSel.value === 'selected';
    pickBox.style.display = show ? 'block' : 'none';
    if (show && !contactsLoaded) {
      contactsLoaded = true;
      try {
        const cSnap = await db.collection('chats').where('members', 'array-contains', me.uid).limit(20).get();
        const peers = {};
        cSnap.docs.forEach(d => {
          const cd = d.data();
          (cd.members || []).forEach(uid => { if (uid !== me.uid) peers[uid] = cd.memberNames?.[uid] || 'User'; });
        });
        const entries = Object.entries(peers);
        pickBox.innerHTML = entries.length
          ? entries.map(([uid, nm]) => `<label class="togrow" style="padding:4px 0"><span>${esc(nm)}</span><input type="checkbox" class="stchk" value="${esc(uid)}"></label>`).join('')
          : '<div class="hint" style="margin:0">No contacts</div>';
      } catch (e) {}
    }
  };

  modal.querySelector('#stpost').onclick = async () => {
    const clean = modal.querySelector('#stinp').value.trim();
    if (!clean) return;
    const privacy = privSel.value;
    const allowedUids = privacy === 'selected' ? [...modal.querySelectorAll('.stchk:checked')].map(x => x.value) : [];
    if (privacy === 'selected' && !allowedUids.length) return toast('Select at least 1 friend');
    const now = Date.now();
    try {
      await db.collection('statuses').add({
        uid: me.uid, userName: myName(), photo: '', text: clean,
        privacy, allowedUids, viewedBy: [], createdAt: now, expiresAt: now + 24 * 60 * 60 * 1000
      });
      modal.remove();
      home('status', false);
    } catch (e) { toast(e.message); }
  };
}

async function sendStatusReply(statusObj, replyText) {
  const clean = String(replyText || '').trim();
  if (!clean || !statusObj?.uid || statusObj.uid === me.uid) return;
  const ids = [me.uid, statusObj.uid].sort();
  const cid = ids.join('_');
  const FV = firebase.firestore.FieldValue;
  await db.collection('chats').doc(cid).set({
    isGroup: false, members: ids,
    memberNames: { [me.uid]: myName(), [statusObj.uid]: statusObj.userName || 'User' },
    lastMessage: `Status reply: ${clean}`,
    updatedAt: FV.serverTimestamp()
  }, { merge: true });
  await db.collection('chats').doc(cid).collection('messages').add({
    senderId: me.uid, senderName: myName(), text: clean,
    replyTo: { id: statusObj.id, senderName: statusObj.userName || 'Status', preview: `Status: ${statusObj.text}` },
    reactions: {}, hiddenFor: [], edited: false, deleted: false,
    deliveredTo: [me.uid], seenBy: [me.uid], createdAt: FV.serverTimestamp()
  });
  toast('Reply sent');
}

function chatTitle(c) {
  if (c.isGroup) return c.name || 'Group';
  const oid = otherUid(c);
  if (oid && userProfilesCache[oid]?.name) return userProfilesCache[oid].name;
  const names = c.memberNames || {};
  for (const k in names) if (k !== me.uid) return names[k];
  return 'Chat';
}

function otherUid(c) {
  if (c.isGroup) return null;
  return (c.members || []).find(id => id !== me.uid) || null;
}

function home(activeTab = 'chats', showArchived = false) {
  stop();
  currentScreenName = 'home';
  ensureRootHistoryAnchor();
  applyTheme();
  let allChats = [];
  let statusDocs = [];
  let callLogs = [];
  let searchTerm = '';

  $app.innerHTML = `
    <header>
      <div class="hav" id="myav" title="${esc(tr('settingsTitle'))}" style="cursor:pointer">${avHtml(profile.photo, myName())}</div>
      <span>${esc(tr('appName'))}</span>
      <span class="sp"></span>
      <span class="un">@${esc(profile.username)}</span>
      <button id="darkquick" title="Dark Mode">${isDarkMode() ? '☀️' : '🌙'}</button>
      <button id="lo" title="${esc(tr('logout'))}">${esc(tr('logout'))}</button>
    </header>
    <div class="tabs">
      <button id="t_chats" class="${activeTab === 'chats' ? 'on' : ''}">${esc(tr('chatsTab'))}</button>
      <button id="t_status" class="${activeTab === 'status' ? 'on' : ''}">${esc(tr('statusTab'))}</button>
      <button id="t_calls" class="${activeTab === 'calls' ? 'on' : ''}">${esc(tr('callsTab'))}</button>
    </div>
    <div id="topslot"></div>
    <div class="list" id="ls"><div class="empty">Loading...</div></div>
    <button class="fab" id="fab">+</button>
    <div class="menu" id="mn" style="display:none">
      <div id="m1">${esc(tr('newChat'))}</div>
      <div id="m2">${esc(tr('newGroup'))}</div>
      <div id="m5">${esc(tr('postStatusMenu'))}</div>
      <div id="m4">${esc(tr('starredMenu'))}</div>
      <div id="m3">${esc(tr('settingsTitle'))}</div>
    </div>`;

  document.getElementById('myav').onclick = profileView;
  document.getElementById('darkquick').onclick = async () => {
    const nextDark = !isDarkMode();
    profile.darkMode = nextDark;
    applyTheme();
    try { await db.collection('users').doc(me.uid).set({ darkMode: nextDark }, { merge: true }); } catch (e) {}
    home(activeTab, showArchived);
  };
  document.getElementById('lo').onclick = async () => { await setOnline(false); auth.signOut(); };
  document.getElementById('t_chats').onclick = () => home('chats', false);
  document.getElementById('t_status').onclick = () => home('status', false);
  document.getElementById('t_calls').onclick = () => home('calls', false);

  const mn = document.getElementById('mn');
  document.getElementById('fab').onclick = () => mn.style.display = mn.style.display === 'none' ? 'block' : 'none';
  document.getElementById('m1').onclick = newChat;
  document.getElementById('m2').onclick = newGroup;
  document.getElementById('m5').onclick = () => { mn.style.display = 'none'; openStatusModal(); };
  document.getElementById('m4').onclick = starredView;
  document.getElementById('m3').onclick = profileView;

  const renderBody = () => {
    const ls = document.getElementById('ls');
    const topslot = document.getElementById('topslot');
    if (!ls || !topslot) return;

    if (activeTab === 'status') {
      topslot.innerHTML = `<div class="archbar" id="newstbar"><span>${esc(tr('newStatusBar'))}</span><span>24h</span></div>`;
      document.getElementById('newstbar').onclick = openStatusModal;
      const now = Date.now();
      const valid = statusDocs.filter(s => {
        if ((s.expiresAt || 0) <= now) return false;
        if (s.uid === me.uid) return true;
        if (s.privacy === 'selected') return Array.isArray(s.allowedUids) && s.allowedUids.includes(me.uid);
        return true;
      });
      if (!valid.length) { ls.innerHTML = `<div class="empty">${esc(tr('noStatus'))}</div>`; return; }
      ls.innerHTML = valid.map(s => {
        const viewers = Array.isArray(s.viewedBy) ? s.viewedBy : [];
        return `<div class="row strow" data-id="${s.id}">
          <div class="av ring">${avHtml(s.photo, s.userName)}</div>
          <div class="mid"><div class="t">${esc(s.userName || 'User')}</div><div class="s">${esc(s.text || '')}</div></div>
          ${s.uid === me.uid ? `<span class="hint" style="margin:0">👁 ${viewers.length}</span>` : ''}
        </div>`;
      }).join('');
      ls.querySelectorAll('.strow').forEach(r => {
        const st = valid.find(x => x.id === r.dataset.id);
        if (!st) return;
        r.onclick = async () => {
          const viewers = Array.isArray(st.viewedBy) ? [...st.viewedBy] : [];
          if (st.uid !== me.uid && !viewers.some(v => v.uid === me.uid)) {
            const entry = { uid: me.uid, name: myName() };
            viewers.push(entry);
            try {
              await db.collection('statuses').doc(st.id).update({ viewedBy: firebase.firestore.FieldValue.arrayUnion(entry) });
              st.viewedBy = viewers;
            } catch (e) {}
          }
          const viewerHtml = st.uid === me.uid
            ? `<div class="viewers"><b>👁 ${esc(tr('seenBy'))} (${viewers.length}):</b><br>${viewers.length ? viewers.map(v => esc(v.name || 'User')).join(', ') : '-'}</div>`
            : `<div class="streply" onclick="event.stopPropagation()">
                <input type="text" id="strinp" placeholder="${esc(tr('replyBtn'))}...">
                <button type="button" id="strbtn">➤</button>
              </div>`;
          openLightbox(st.text, `${st.userName} • Status`, true, viewerHtml);
          const strbtn = document.getElementById('strbtn');
          const strinp = document.getElementById('strinp');
          if (strbtn && strinp) {
            const doRep = async () => {
              const v = strinp.value.trim();
              if (!v) return;
              await sendStatusReply(st, v);
              const lb = document.querySelector('.lbox');
              if (lb) lb.remove();
            };
            strbtn.onclick = doRep;
            strinp.onkeydown = e => { if (e.key === 'Enter') doRep(); };
          }
        };
      });
      return;
    }

    if (activeTab === 'calls') {
      topslot.innerHTML = '';
      if (!callLogs.length) { ls.innerHTML = `<div class="empty">${esc(tr('noCalls'))}</div>`; return; }
      ls.innerHTML = callLogs.map(c => {
        const dt = c.createdAt?.toDate?.();
        const tm = dt ? `${String(dt.getHours()).padStart(2, '0')}:${String(dt.getMinutes()).padStart(2, '0')}` : '';
        const icon = c.direction === 'incoming' ? '↙' : '↗';
        const mode = c.isVideo ? '📹 Video' : '📞 Audio';
        const isMissed = c.outcome === 'missed';
        return `<div class="row callrow" data-uid="${esc(c.peerUid)}" data-name="${esc(c.peerName)}" data-vid="${c.isVideo ? '1' : '0'}">
          <div class="av">${esc((c.peerName || '?')[0]?.toUpperCase() || '?')}</div>
          <div class="mid">
            <div class="t" style="color:${isMissed ? '#e53935' : 'inherit'}">${esc(c.peerName || 'User')}</div>
            <div class="s" style="color:${isMissed ? '#e53935' : 'var(--sub)'}">${icon} ${mode} • ${esc(c.outcome || '')} ${tm ? '• ' + tm : ''}</div>
          </div>
          <span class="hint" style="margin:0">Call</span>
        </div>`;
      }).join('');
      ls.querySelectorAll('.callrow').forEach(r => {
        r.onclick = () => startCall(r.dataset.uid, r.dataset.name, r.dataset.vid === '1');
      });
      return;
    }

    topslot.innerHTML = `<div class="searchbox"><input type="text" id="srch" placeholder="${esc(tr('searchChats'))}" value="${esc(searchTerm)}"></div><div id="archslot"></div>`;
    const srchEl = document.getElementById('srch');
    srchEl.addEventListener('input', e => { searchTerm = e.target.value; renderBody(); });

    const visibleChats = allChats.filter(c => {
      const delTs = tsMs(c.deletedAt?.[me.uid]);
      const updTs = tsMs(c.updatedAt);
      return !(delTs && updTs && updTs <= delTs);
    });

    const archivedCount = visibleChats.filter(c => !!c.archivedBy?.[me.uid]).length;
    const archslot = document.getElementById('archslot');
    if (archslot) {
      if (showArchived) archslot.innerHTML = `<div class="archbar" id="archtog"><span>${esc(tr('backAllChats'))}</span><span>${archivedCount}</span></div>`;
      else if (archivedCount > 0) archslot.innerHTML = `<div class="archbar" id="archtog"><span>${esc(tr('archChats'))}</span><span>${archivedCount}</span></div>`;
      else archslot.innerHTML = '';
      const tog = document.getElementById('archtog');
      if (tog) tog.onclick = () => home('chats', !showArchived);
    }

    const q = searchTerm.trim().toLowerCase();
    const filtered = visibleChats.filter(c => {
      const isArch = !!c.archivedBy?.[me.uid];
      if (showArchived !== isArch) return false;
      if (!q) return true;
      const t = chatTitle(c).toLowerCase();
      const lm = (c.lastMessage || '').toLowerCase();
      const oid = otherUid(c);
      const un = (oid && c.memberUsernames?.[oid]) ? c.memberUsernames[oid].toLowerCase() : '';
      return t.includes(q) || lm.includes(q) || un.includes(q);
    });

    if (!filtered.length) {
      ls.innerHTML = q ? `<div class="empty">${esc(tr('noSearch'))}</div>` : showArchived ? `<div class="empty">${esc(tr('noArch'))}</div>` : `<div class="empty">${esc(tr('noChats'))}</div>`;
      return;
    }

    ls.innerHTML = filtered.map(c => {
      const t = chatTitle(c);
      const oid = otherUid(c);
      const photo = c.isGroup ? (c.groupIcon || '') : (userProfilesCache[oid]?.photo || '');
      const isMuted = !!c.mutedBy?.[me.uid];
      const draftTxt = getDraft(c.id).trim();
      const subHtml = draftTxt ? `<span class="draftlbl">Draft:</span> ${esc(draftTxt)}` : esc(c.lastMessage || '');
      return `<div class="row" data-id="${c.id}" data-t="${esc(t)}" data-oid="${oid || ''}">
        <div class="av">${avHtml(photo, t, c.isGroup)}</div>
        <div class="mid">
          <div class="t">${esc(t)} ${isMuted ? '<span title="Muted" style="font-size:12px">🔇</span>' : ''}</div>
          <div class="s">${subHtml}</div>
        </div>
      </div>`;
    }).join('');

    ls.querySelectorAll('.row').forEach(r => {
      r.onclick = () => chatView(r.dataset.id, r.dataset.t, r.dataset.oid || null);
    });
  };

  if (activeTab === 'status') {
    addSub(db.collection('statuses').where('privacy', '==', 'all').limit(25).onSnapshot(snap => {
      statusDocs = snap.docs.map(d => ({ id: d.id, ...d.data() }))
        .filter(s => (s.expiresAt || 0) > Date.now())
        .sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
      renderBody();
    }, () => renderBody()));
    return;
  }

  if (activeTab === 'calls') {
    addSub(db.collection('users').doc(me.uid).collection('callLogs').orderBy('createdAt', 'desc').limit(20).onSnapshot(snap => {
      callLogs = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      renderBody();
    }, () => renderBody()));
    return;
  }

  addSub(db.collection('chats').where('members', 'array-contains', me.uid).limit(25).onSnapshot(snap => {
    allChats = snap.docs.map(d => ({ id: d.id, ...d.data() }))
      .sort((a, b) => (b.updatedAt?.seconds || 9e12) - (a.updatedAt?.seconds || 9e12));
    renderBody();
  }, err => {
    const l = document.getElementById('ls');
    if (l) l.innerHTML = `<div class="empty">Error: ${esc(err.message)}</div>`;
  }));
}

async function openCameraModal(onCaptured) {
  let stream = null;
  let facing = 'user';
  const modal = document.createElement('div');
  modal.className = 'modal';
  modal.innerHTML = `
    <div class="mbox">
      <div class="mhead"><span>📸 Camera</span><button id="camcl">✕</button></div>
      <div class="mbody">
        <div class="cambox"><video id="camvid" autoplay playsinline muted></video></div>
        <div style="display:flex;gap:8px;margin-top:12px">
          <button class="btn sm sec" id="camflip">🔄</button>
          <button class="btn" id="camsnap" style="flex:1">📷 Capture</button>
        </div>
      </div>
    </div>`;
  document.body.appendChild(modal);
  const stopCam = () => { if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; } };
  const closeCam = () => { stopCam(); modal.remove(); };
  modal.querySelector('#camcl').onclick = closeCam;
  modal.onclick = e => { if (e.target === modal) closeCam(); };

  const startCam = async () => {
    stopCam();
    try {
      stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: facing }, width: { ideal: 320 }, height: { ideal: 240 } }, audio: false });
      const v = modal.querySelector('#camvid');
      v.srcObject = stream;
      v.play().catch(() => {});
    } catch (e) { toast('Camera error'); closeCam(); }
  };
  modal.querySelector('#camflip').onclick = () => { facing = facing === 'user' ? 'environment' : 'user'; startCam(); };
  modal.querySelector('#camsnap').onclick = async () => {
    const v = modal.querySelector('#camvid');
    if (!v || !v.videoWidth) return;
    const c = document.createElement('canvas');
    const s = Math.min(1, 300 / Math.max(v.videoWidth, v.videoHeight));
    c.width = Math.round(v.videoWidth * s);
    c.height = Math.round(v.videoHeight * s);
    c.getContext('2d').drawImage(v, 0, 0, c.width, c.height);
    const dataUrl = c.toDataURL('image/jpeg', 0.4);
    closeCam();
    await onCaptured(dataUrl);
  };
  await startCam();
}

function blobToDataURL(blob) {
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onload = () => res(fr.result);
    fr.onerror = () => rej(new Error('File read failed'));
    fr.readAsDataURL(blob);
  });
}

/* ---------- FREE-PLAN MEDIA HELPER (NO STORAGE BUCKET NEEDED) ---------- */
async function prepareFreeMedia(blobOrDataUrl, kind) {
  const dataUrl = typeof blobOrDataUrl === 'string' ? blobOrDataUrl : await blobToDataURL(blobOrDataUrl);
  if (!dataUrl || dataUrl.length > MAX_FREE_MEDIA_CHARS) {
    throw new Error(kind === 'voice'
      ? `Voice clip beshi boro (max ${MAX_FREE_VOICE_SEC}s rakhun).`
      : 'Chobi beshi boro. Chhoto chobi din.');
  }
  return dataUrl;
}

      <button id="csbtn">🔍</button>
      ${peerUid ? '<button id="acall">📞</button><button id="vcall">📹</button>' : ''}
      <button id="cmore">⋮</button>
      <div class="menu top" id="cmenu" style="display:none"></div>`;
    bindChatHeaderEvents();
    updateHeaderSub();
  }

  function setReply(id, senderName, preview) {
    replyTarget = { id, senderName, preview };
    rtxt.innerHTML = `<b>↩ ${esc(senderName)}:</b> ${esc(preview)}`;
    rbar.classList.add('on');
    tx.focus();
  }
  function clearReply() { replyTarget = null; rbar.classList.remove('on'); }
  document.getElementById('rcl').onclick = clearReply;
  document.getElementById('cscls').onclick = () => {
    document.getElementById('csbox').style.display = 'none';
    inChatQuery = ''; document.getElementById('csinp').value = ''; csresults.innerHTML = ''; renderMessages();
  };
  document.getElementById('csinp').addEventListener('input', e => { inChatQuery = e.target.value; renderMessages(); });

  const closeMenu = () => { const m = document.getElementById('cmenu'); if (m) m.style.display = 'none'; };
  document.addEventListener('click', closeMenu);
  addSub(() => document.removeEventListener('click', closeMenu));

  function updateBlockedUI() {
    const slot = document.getElementById('inputslot');
    if (!slot || !peerUid) return;
    if (myBlocked().includes(peerUid)) {
      slot.innerHTML = `<div class="blockedbar">🚫 Blocked <button class="btn sm" id="unblkbtn" style="margin-left:8px;padding:4px 10px">${esc(tr('unblkBtn'))}</button></div>`;
      document.getElementById('unblkbtn').onclick = async () => {
        await db.collection('users').doc(me.uid).set({ blocked: firebase.firestore.FieldValue.arrayRemove(peerUid) }, { merge: true });
        profile.blocked = myBlocked().filter(id => id !== peerUid);
        chatView(chatId, document.getElementById('htitle')?.textContent || title, peerUid);
      };
    }
  }

  ep.innerHTML = EMOJIS.map(em => `<button type="button">${em}</button>`).join('');
  ep.querySelectorAll('button').forEach(b => {
    b.onclick = () => {
      const start = tx.selectionStart ?? tx.value.length;
      const end = tx.selectionEnd ?? tx.value.length;
      tx.value = tx.value.slice(0, start) + b.textContent + tx.value.slice(end);
      setDraft(chatId, tx.value);
      tx.focus();
    };
  });
  document.getElementById('ebtn').onclick = () => ep.classList.toggle('on');
  tx.addEventListener('input', () => setDraft(chatId, tx.value));

  function applyChatWallpaper() {
    const wp = chatMeta.wallpaperBy?.[me.uid];
    if (wp?.color) { ms.style.backgroundImage = 'none'; ms.style.backgroundColor = wp.color; }
    else { ms.style.backgroundImage = 'none'; ms.style.backgroundColor = isDarkMode() ? '#0b141a' : '#efeae2'; }
  }

  if (peerUid) {
    addSub(db.collection('presence').doc(peerUid).onSnapshot(d => {
      peerPres = d.exists ? d.data() : null;
      updateHeaderSub();
    }, () => {}));
  }

  function renderPinBanner() {
    if (!pinslot) return;
    const pin = chatMeta.pinnedMessage;
    if (!pin || !pin.id) { pinslot.innerHTML = ''; return; }
    pinslot.innerHTML = `<div class="pinbar" id="pinjump">
      <span>📌</span><span class="ptxt"><b>${esc(pin.senderName || 'User')}:</b> ${esc(pin.preview || '')}</span>
      <button class="btn sm" id="pinun" style="padding:3px 8px;font-size:11px">${esc(tr('unpinBtn'))}</button>
    </div>`;
    document.getElementById('pinjump').onclick = e => { if (e.target.id !== 'pinun') jumpAndHighlightMsg(pin.id); };
    document.getElementById('pinun').onclick = async e => { e.stopPropagation(); await chat.set({ pinnedMessage: null }, { merge: true }); };
  }

  addSub(chat.onSnapshot(d => {
    if (!d.exists) return;
    chatMeta = d.data();
    const tEl = document.getElementById('htitle');
    if (!peerUid && chatMeta.name && tEl) tEl.textContent = chatMeta.name;
    applyChatWallpaper();
    updateHeaderSub();
    renderPinBanner();
    renderMessages();
  }));

  document.getElementById('reccncl').onclick = cancelRec;
  document.getElementById('recstop').onclick = () => { if (rec && rec.state !== 'inactive') { try { rec.stop(); } catch (e) {} } };
  bindChatHeaderEvents();

  function renderMessages() {
    const atBottom = ms.scrollHeight - ms.scrollTop - ms.clientHeight < 120;
    const delTs = tsMs(chatMeta.deletedAt?.[me.uid]);
    const q = inChatQuery.trim().toLowerCase();
    const starredIds = new Set(myStarred().map(x => x.id));
    msgCache = {};

    const visibleDocs = lastDocs.filter(d => {
      const m = d.data();
      if (Array.isArray(m.hiddenFor) && m.hiddenFor.includes(me.uid)) return false;
      const mTs = tsMs(m.createdAt);
      return !(delTs && mTs && mTs <= delTs);
    });

    if (q) {
      const matches = visibleDocs.filter(d => {
        const m = d.data();
        return !m.deleted && ((m.text || '').toLowerCase().includes(q) || (m.senderName || '').toLowerCase().includes(q));
      });
      csresults.innerHTML = matches.length
        ? `<div style="max-height:130px;overflow:auto;background:var(--card);border-bottom:1px solid var(--bd)">` +
          matches.slice(0, 10).map(d => {
            const m = d.data();
            return `<div class="row jhit" data-mid="${d.id}" style="padding:8px 12px"><div class="mid"><div class="t" style="font-size:12.5px">${esc(m.senderName || 'User')}</div><div class="s" style="font-size:12.5px">${esc(m.text || 'Message')}</div></div><span class="hint" style="margin:0">Jump</span></div>`;
          }).join('') + `</div>`
        : `<div class="pinbar"><span>${esc(tr('noSearch'))}</span></div>`;
      csresults.querySelectorAll('.jhit').forEach(row => { row.onclick = () => jumpAndHighlightMsg(row.dataset.mid); });
    } else {
      csresults.innerHTML = '';
    }

    ms.innerHTML = visibleDocs.map(d => {
      const m = d.data();
      msgCache[d.id] = m;
      const mine = m.senderId === me.uid;
      const dt = m.createdAt?.toDate();
      const tm = dt ? String(dt.getHours()).padStart(2, '0') + ':' + String(dt.getMinutes()).padStart(2, '0') : '';
      const isSel = selectedIds.has(d.id);

      if (m.deleted) {
        return `<div class="b ${mine ? 'me' : ''} ${isSel ? 'selected' : ''}" data-id="${d.id}">
          ${mine ? '' : `<div class="n">${esc(m.senderName)}</div>`}
          <span class="del">🚫 Deleted</span><span class="tm">${tm}</span></div>`;
      }

      const rxMap = m.reactions || {};
      const counts = {};
      Object.values(rxMap).forEach(em => { if (em) counts[em] = (counts[em] || 0) + 1; });
      const rxHtml = Object.keys(counts).length
        ? `<div class="reacts">${Object.entries(counts).map(([em, cnt]) => `<span class="rpill">${esc(em)}${cnt > 1 ? ' ' + cnt : ''}</span>`).join('')}</div>`
        : '';

      const isSt = starredIds.has(d.id);
      const isPinned = chatMeta.pinnedMessage?.id === d.id;
      const safeImg = safeMedia(m.image);
      const safeAud = safeMedia(m.audio);

      return `<div class="b ${mine ? 'me' : ''} ${isSel ? 'selected' : ''}" data-id="${d.id}">
        ${mine ? '' : `<div class="n">${esc(m.senderName)}</div>`}
        ${m.forwarded ? '<div class="fwd">↪ Forwarded</div>' : ''}
        ${m.replyTo ? `<div class="qbox"><b>${esc(m.replyTo.senderName || 'User')}</b>${esc(m.replyTo.preview || '')}</div>` : ''}
        ${safeImg ? `<img class="zoomimg" loading="lazy" src="${esc(safeImg)}" data-cap="${esc(m.text || '')}">` : ''}
        ${safeAud ? `<audio controls preload="metadata" src="${esc(safeAud)}"></audio><button type="button" class="spdbtn" data-spd="1">1x</button>` : ''}
        ${m.text ? `<span class="txt">${formatTextWithLinks(m.text)}</span>${buildLinkPreviewHtml(m.text)}` : ''}${m.edited ? '<span class="ed">(edited)</span>' : ''}
        <span class="tm">${tm}</span>
        ${rxHtml}
        <div class="act">
          ${REACTIONS.map(em => `<span class="rx" data-em="${em}">${em}</span>`).join('')}
          <span class="mcopy">📋 ${esc(tr('copyBtn'))}</span>
          <span class="msel">☑ ${esc(tr('selectBtn'))}</span>
          <span class="mrep">↩ ${esc(tr('replyBtn'))}</span>
          <span class="mstar">${isSt ? '★ ' + esc(tr('unstarBtn')) : '☆ ' + esc(tr('starBtn'))}</span>
          <span class="mpin">${isPinned ? esc(tr('unpinBtn')) : '📌 ' + esc(tr('pinBtn'))}</span>
          <span class="mfwd">↪ ${esc(tr('forwardBtn'))}</span>
          ${mine && m.text ? `<span class="medit">✎ ${esc(tr('editBtn'))}</span>` : ''}
          ${mine ? `<span class="mdel">🗑 ${esc(tr('deleteBtn'))}</span>` : ''}
        </div>
      </div>`;
    }).join('');

    ms.querySelectorAll('.spdbtn').forEach(btn => {
      btn.onclick = e => {
        e.stopPropagation();
        const aud = btn.previousElementSibling;
        const cur = parseFloat(btn.dataset.spd || '1');
        const next = cur === 1 ? 1.5 : cur === 1.5 ? 2 : 1;
        btn.dataset.spd = String(next);
        btn.textContent = `${next}x`;
        if (aud && aud.tagName === 'AUDIO') aud.playbackRate = next;
      };
    });

    ms.querySelectorAll('.zoomimg').forEach(img => {
      img.onclick = e => { e.stopPropagation(); openLightbox(img.src, img.dataset.cap || '', false); };
    });

    const toggleSelect = id => {
      if (selectedIds.has(id)) selectedIds.delete(id);
      else selectedIds.add(id);
      renderHeaderState();
      renderMessages();
    };

    ms.querySelectorAll('.b[data-id]').forEach(b => {
      b.onclick = e => {
        if (e.target.closest('.act') || e.target.closest('audio') || e.target.closest('a') || e.target.closest('.zoomimg') || e.target.closest('.spdbtn')) return;
        if (selectedIds.size > 0) { toggleSelect(b.dataset.id); return; }
        b.classList.toggle('open');
      };
    });

    ms.querySelectorAll('.mcopy').forEach(btn => {
      btn.onclick = async e => {
        e.stopPropagation();
        const txt = msgCache[btn.closest('.b').dataset.id]?.text || '';
        if (!txt) return;
        try { if (navigator.clipboard?.writeText) await navigator.clipboard.writeText(txt); } catch (err) {}
        toast(tr('copied'));
      };
    });
    ms.querySelectorAll('.msel').forEach(btn => { btn.onclick = e => { e.stopPropagation(); toggleSelect(btn.closest('.b').dataset.id); }; });
    ms.querySelectorAll('.rx').forEach(btn => {
      btn.onclick = async e => {
        e.stopPropagation();
        const id = btn.closest('.b').dataset.id;
        const em = btn.dataset.em;
        const cur = msgCache[id]?.reactions?.[me.uid];
        try { await chat.collection('messages').doc(id).update({ [`reactions.${me.uid}`]: cur === em ? firebase.firestore.FieldValue.delete() : em }); } catch (err) {}
      };
    });
    ms.querySelectorAll('.mrep').forEach(btn => {
      btn.onclick = e => {
        e.stopPropagation();
        const id = btn.closest('.b').dataset.id;
        const m = msgCache[id];
        if (!m) return;
        setReply(id, m.senderName || 'User', m.text || (m.audio ? '🎤 Voice message' : m.image ? '📷 Photo' : 'Message'));
      };
    });
    ms.querySelectorAll('.mstar').forEach(btn => {
      btn.onclick = async e => {
        e.stopPropagation();
        const id = btn.closest('.b').dataset.id;
        const m = msgCache[id];
        if (!m) return;
        const preview = m.text || (m.audio ? '🎤 Voice message' : m.image ? '📷 Photo' : 'Message');
        const existing = myStarred().find(x => x.id === id);
        if (existing) {
          await db.collection('users').doc(me.uid).set({ starred: firebase.firestore.FieldValue.arrayRemove(existing) }, { merge: true });
          profile.starred = myStarred().filter(x => x.id !== id);
        } else {
          const entry = { id, chatId, chatTitle: document.getElementById('htitle')?.textContent || title, senderName: m.senderName || 'User', preview };
          await db.collection('users').doc(me.uid).set({ starred: firebase.firestore.FieldValue.arrayUnion(entry) }, { merge: true });
          profile.starred = [...myStarred(), entry];
        }
        renderMessages();
      };
    });
    ms.querySelectorAll('.mpin').forEach(btn => {
      btn.onclick = async e => {
        e.stopPropagation();
        const id = btn.closest('.b').dataset.id;
        const m = msgCache[id];
        if (!m) return;
        if (chatMeta.pinnedMessage?.id === id) await chat.set({ pinnedMessage: null }, { merge: true });
        else await chat.set({ pinnedMessage: { id, senderName: m.senderName || 'User', preview: m.text || (m.audio ? '🎤 Voice message' : '📷 Photo') } }, { merge: true });
      };
    });
    ms.querySelectorAll('.mfwd').forEach(btn => {
      btn.onclick = e => { e.stopPropagation(); const m = msgCache[btn.closest('.b').dataset.id]; if (m) openForwardModal(m); };
    });
    ms.querySelectorAll('.medit').forEach(btn => {
      btn.onclick = async e => {
        e.stopPropagation();
        const id = btn.closest('.b').dataset.id;
        const cur = msgCache[id]?.text || '';
        const next = prompt('Edit message:', cur);
        if (next === null) return;
        const trimmed = next.trim();
        if (!trimmed || trimmed === cur) return;
        try { await chat.collection('messages').doc(id).update({ text: trimmed, edited: true }); } catch (err) {}
      };
    });
    ms.querySelectorAll('.mdel').forEach(btn => {
      btn.onclick = async e => {
        e.stopPropagation();
        const id = btn.closest('.b').dataset.id;
        try { await chat.collection('messages').doc(id).update({ hiddenFor: firebase.firestore.FieldValue.arrayUnion(me.uid) }); } catch (err) {}
      };
    });

    if (atBottom || ms.dataset.init !== '1') {
      ms.scrollTop = ms.scrollHeight;
      ms.dataset.init = '1';
    }
  }

  // Keep `limitToLast(40)` to stay light on free Firestore quota
  addSub(chat.collection('messages').orderBy('createdAt').limitToLast(40).onSnapshot(snap => {
    lastDocs = snap.docs;
    renderMessages();
  }));

  async function send(text, image, audio, audioMime) {
    if (peerUid && myBlocked().includes(peerUid)) throw new Error('User is blocked');
    const FV = firebase.firestore.FieldValue;
    const rep = replyTarget ? { ...replyTarget } : null;
    clearReply();
    await chat.collection('messages').add({
      senderId: me.uid, senderName: myName(),
      text: text || null, image: image || null,
      audio: audio || null, audioMime: audioMime || null,
      replyTo: rep, reactions: {}, hiddenFor: [],
      edited: false, deleted: false,
      deliveredTo: [me.uid], seenBy: [me.uid],
      createdAt: FV.serverTimestamp()
    });
    const last = audio ? '🎤 Voice message' : image ? '📷 Photo' : text;
    await chat.set({
      lastMessage: last,
      updatedAt: FV.serverTimestamp(),
      archivedBy: { [me.uid]: false }
    }, { merge: true });
  }

  function createRecorder(stream) {
    const candidates = ['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4', 'audio/ogg;codecs=opus'];
    const supported = candidates.find(t => typeof MediaRecorder.isTypeSupported === 'function' && MediaRecorder.isTypeSupported(t));
    try {
      return supported ? { recorder: new MediaRecorder(stream, { mimeType: supported }), mime: supported } : { recorder: new MediaRecorder(stream), mime: 'audio/webm' };
    } catch (e) {
      return { recorder: new MediaRecorder(stream), mime: 'audio/webm' };
    }
  }

  document.getElementById('mic').onclick = async () => {
    if (rec && rec.state !== 'inactive') {
      try { rec.stop(); } catch (e) { cleanupRec(); }
      return;
    }
    try {
      discardRec = false;
      if (!navigator.mediaDevices?.getUserMedia || typeof MediaRecorder === 'undefined') {
        throw new Error('Voice recording unavailable in this browser.');
      }
      recStream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } });
      const built = createRecorder(recStream);
      rec = built.recorder;
      activeAudioMime = built.mime || rec.mimeType || 'audio/webm';
      recChunks = [];

      rec.ondataavailable = e => { if (e.data && e.data.size > 0) recChunks.push(e.data); };
      rec.onerror = () => { toast('Recording error'); cancelRec(); };
      rec.onstop = async () => {
        const finalMime = rec?.mimeType || activeAudioMime || 'audio/webm';
        const blob = new Blob(recChunks, { type: finalMime });
        const wasDiscarded = discardRec;
        cleanupRec();
        if (wasDiscarded) return;
        if (!blob.size || blob.size < 200) { toast('Voice clip too short'); return; }
        try {
          const dataUrl = await prepareFreeMedia(blob, 'voice');
          await send(null, null, dataUrl, finalMime);
          toast(tr('voiceSent'));
        } catch (ex) {
          toast(ex.message || 'Voice send failed');
        }
      };

      rec.start(250);
      recbar.classList.add('on');
      secCounter = 0;
      rectm.textContent = '00:00';
      recTimer = setInterval(() => {
        secCounter += 1;
        rectm.textContent = fmtSec(secCounter);
        if (secCounter >= MAX_FREE_VOICE_SEC && rec && rec.state !== 'inactive') {
          try { rec.stop(); } catch (e) {}
        }
      }, 1000);
    } catch (ex) {
      cancelRec();
      toast(ex?.name === 'NotAllowedError' ? 'Microphone permission blocked.' : (ex?.message || 'Mic error'));
    }
  };

  const sendText = async () => {
    const t = tx.value.trim(); if (!t) return;
    tx.value = '';
    setDraft(chatId, '');
    ep.classList.remove('on');
    try { await send(t); } catch (e) { toast(e.message); }
  };
  document.getElementById('sd').onclick = sendText;
  tx.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendText(); } });

  document.getElementById('ph').onclick = () => document.getElementById('fi').click();
  document.getElementById('fi').onchange = async e => {
    const f = e.target.files[0]; if (!f) return;
    try {
      if (!f.type.startsWith('image/')) throw new Error('Select a valid image');
      const small = await shrink(f, 300, 0.4);
      const dataUrl = await prepareFreeMedia(small.dataUrl, 'image');
      await send(null, dataUrl, null, null);
      toast(tr('photoSent'));
    } catch (ex) {
      toast(ex.message || 'Photo send failed');
    }
    e.target.value = '';
  };

  document.getElementById('cambtn').onclick = () => {
    openCameraModal(async dataUrl => {
      try {
        const cleanUrl = await prepareFreeMedia(dataUrl, 'image');
        await send(null, cleanUrl, null, null);
        toast(tr('photoSent'));
      } catch (ex) {
        toast(ex.message || 'Camera send failed');
      }
    });
  };
}

function shrink(file, max = 300, quality = 0.4) {
  return new Promise((res, rej) => {
    const img = new Image();
    const objUrl = URL.createObjectURL(file);
    img.onload = () => {
      URL.revokeObjectURL(objUrl);
      const s = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * s);
      c.height = Math.round(img.height * s);
      const ctx = c.getContext('2d');
      if (!ctx) return rej(new Error('Image process failed'));
      ctx.drawImage(img, 0, 0, c.width, c.height);
      res({ dataUrl: c.toDataURL('image/jpeg', quality) });
    };
    img.onerror = () => { URL.revokeObjectURL(objUrl); rej(new Error('Image load failed')); };
    img.src = objUrl;
  });
}
</script>
