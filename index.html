async function openCameraModal(onCaptured) {
  let stream = null, facing = 'user';
  const modal = document.createElement('div'); modal.className = 'modal';
  modal.innerHTML = `<div class="mbox"><div class="mhead"><span>📸 HD Camera</span><button id="camcl">✕</button></div><div class="mbody"><div class="cambox"><video id="camvid" autoplay playsinline muted></video></div><div style="display:flex;gap:8px;margin-top:12px"><button class="btn sm sec" id="camflip">🔄</button><button class="btn" id="camsnap" style="flex:1">📷 Capture HD</button></div></div></div>`;
  document.body.appendChild(modal);
  const stopCam = () => { if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; } };
  const closeCam = () => { stopCam(); modal.remove(); };
  modal.querySelector('#camcl').onclick = closeCam; modal.onclick = e => { if (e.target === modal) closeCam(); };
  const startCam = async () => {
    stopCam();
    try {
      stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: facing }, width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false });
      if (!modal.isConnected) { stopCam(); return; }
      const v = modal.querySelector('#camvid'); v.srcObject = stream; v.play().catch(() => {});
    } catch (e) { toast('Camera error or permission denied'); closeCam(); }
  };
  modal.querySelector('#camflip').onclick = () => { facing = facing === 'user' ? 'environment' : 'user'; startCam(); };
  modal.querySelector('#camsnap').onclick = async () => {
    const v = modal.querySelector('#camvid'); if (!v || !v.videoWidth) return;
    const c = document.createElement('canvas');
    const s = Math.min(1, 1024 / Math.max(v.videoWidth, v.videoHeight));
    c.width = Math.max(1, Math.round(v.videoWidth * s));
    c.height = Math.max(1, Math.round(v.videoHeight * s));
    const ctx = c.getContext('2d');
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = 'high';
    ctx.drawImage(v, 0, 0, c.width, c.height);
    let dataUrl = c.toDataURL('image/jpeg', 0.76);
    if (dataUrl.length > MAX_FREE_MEDIA_CHARS) dataUrl = c.toDataURL('image/jpeg', 0.56);
    closeCam();
    await onCaptured(dataUrl);
  };
  await startCam();
}

function blobToDataURL(blob) {
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onload = () => res(fr.result);
    fr.onerror = () => rej(new Error('File read failed'));
    fr.readAsDataURL(blob);
  });
}

async function prepareFreeMedia(blobOrDataUrl, kind, mimeHint = 'audio/webm') {
  let dataUrl = typeof blobOrDataUrl === 'string' ? blobOrDataUrl : await blobToDataURL(blobOrDataUrl);
  if (kind === 'voice' && typeof dataUrl === 'string' && dataUrl.startsWith('data:')) {
    const cleanMime = /^audio\//i.test(mimeHint) ? mimeHint.split(';')[0] : 'audio/webm';
    if (!dataUrl.startsWith('data:audio/')) {
      dataUrl = dataUrl.replace(/^data:[^;]+/, `data:${cleanMime}`);
    }
  }
  if (!dataUrl || dataUrl.length > MAX_FREE_MEDIA_CHARS) {
    throw new Error(kind === 'voice' ? `Voice clip beshi boro (max ${MAX_FREE_VOICE_SEC}s).` : 'Chobi beshi boro.');
  }
  return dataUrl;
}

    const sig = JSON.stringify(aiMessages.map(m => [m.id, m.text, translations[m.id] || ''])) + '|sel:' + [...selectedIds].join(',');
    if (sig === lastSig) return; lastSig = sig;
    const atBottom = (ms.scrollHeight - ms.scrollTop - ms.clientHeight) < 120;
    ms.innerHTML = aiMessages.map(m => {
      const isMe = m.senderId === me.uid, isBot = m.senderId === AI_BOT_ID, isSel = selectedIds.has(m.id), isOpen = openId === m.id;
      const d = m.createdAtMs ? new Date(m.createdAtMs) : null;
      const tm = d ? `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}` : '';
      const trHtml = translations[m.id] ? `<div class="trbox">🌐 ${esc(translations[m.id])}</div>` : '';
      return `<div class="b ${isMe ? 'me' : ''} ${isBot ? 'botmsg' : ''} ${isSel ? 'selected' : ''} ${isOpen ? 'open' : ''}" data-id="${esc(m.id)}">
        ${!isMe ? `<div class="n">${esc(m.senderName || AI_BOT_NAME)}</div>` : ''}
        <div>${formatMessageBodyHtml(m.text || '', isBot)}</div>
        ${trHtml}
        <span class="tm">${tm}</span>
        <div class="act">
          <span class="act_tr">🌐 Translate</span>
          <span class="act_cp">${esc(tr('copyBtn'))}</span>
          <span class="act_sel">${esc(tr('selectBtn'))}</span>
          <span class="act_rm">${esc(tr('deleteBtn'))}</span>
        </div>
      </div>`;
    }).join('');
    ms.querySelectorAll('.b').forEach(b => {
      const id = b.dataset.id, m = aiMessages.find(x => x.id === id); if (!m) return;
      b.onclick = e => {
        if (e.target.tagName === 'A') return;
        if (selectedIds.size > 0) { toggleSelect(id); return; }
        openId = openId === id ? null : id; lastSig = ''; renderAiMessages();
      };
      const trBtn = b.querySelector('.act_tr');
      if (trBtn) trBtn.onclick = async e => {
        e.stopPropagation();
        const target = currentLang() === 'en' ? 'bn' : 'en';
        translations[id] = await translateTextSmart(m.text || '', target);
        lastSig = ''; renderAiMessages();
      };
      const cp = b.querySelector('.act_cp');
      if (cp) cp.onclick = async e => { e.stopPropagation(); try { if (navigator.clipboard?.writeText) await navigator.clipboard.writeText(m.text || ''); } catch (err) {} toast(tr('copied')); };
      const sl = b.querySelector('.act_sel');
      if (sl) sl.onclick = e => { e.stopPropagation(); enterSelectionMode(id); };
      const rm = b.querySelector('.act_rm');
      if (rm) rm.onclick = e => { e.stopPropagation(); aiMessages = aiMessages.filter(x => x.id !== id); saveAiHistory(me?.uid, aiMessages); if (openId === id) openId = null; lastSig = ''; renderAiMessages(); };
    });
    if (atBottom) ms.scrollTop = ms.scrollHeight;
  }

  function renderMessages(docs) {
    lastDocs = docs; renderQuickChips();
    const now = Date.now(), cl = tsMs(chatMeta.clearedAt?.[me.uid]), delAt = tsMs(chatMeta.deletedAt?.[me.uid]);
    const list = [];
    docs.forEach(d => {
      const m = { id: d.id, ...d.data() }; msgCache[m.id] = m;
      const msVal = tsMs(m.createdAt) || m.createdAtMs || 0;
      if (cl && msVal > 0 && msVal <= cl) return;
      if (delAt && msVal > 0 && msVal <= delAt) return;
      if (m.expiresAt && m.expiresAt <= now) { if (!purged.has(m.id)) { purged.add(m.id); d.ref.delete().catch(() => {}); } return; }
      if (Array.isArray(m.hiddenFor) && m.hiddenFor.includes(me.uid)) return;
      list.push(m);
    });
    renderPinnedBar();
    const sig = JSON.stringify(list.map(m => [m.id, m.text, m.image, m.audio, m.audioMime, m.poll, m.edited, m.deleted, m.reactions, m.seenBy, m.deliveredTo, translations[m.id] || ''])) + '|open:' + (openId || '') + '|sel:' + [...selectedIds].join(',') + '|more:' + hasMoreOlder;
    if (sig === lastSig) return; lastSig = sig;
    const prevScrollHeight = ms.scrollHeight, prevScrollTop = ms.scrollTop, atBottom = (ms.scrollHeight - ms.scrollTop - ms.clientHeight) < 120;
    let html = hasMoreOlder ? '<button type="button" class="loadoldbtn" id="loadold">⬆ Load older messages</button>' : '', prevDay = '';

    list.forEach(m => {
      const msVal = tsMs(m.createdAt) || m.createdAtMs || 0;
      if (msVal) { const dl = dayLabel(msVal); if (dl !== prevDay) { prevDay = dl; html += `<div class="daysep"><span>${esc(dl)}</span></div>`; } }
      const isMe = m.senderId === me.uid, isSel = selectedIds.has(m.id), isOpen = openId === m.id;
      const d = m.createdAt?.toDate?.() || (m.createdAtMs ? new Date(m.createdAtMs) : null);
      const tm = d ? `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}` : '';
      let tick = '';
      if (isMe && !m.deleted) {
        const seen = Array.isArray(m.seenBy) && m.seenBy.some(u => u !== me.uid);
        const deliv = seen || (Array.isArray(m.deliveredTo) && m.deliveredTo.some(u => u !== me.uid));
        tick = `<span class="tick ${seen ? 'seen' : ''}">${seen ? '✓✓' : deliv ? '✓✓' : '✓'}</span>`;
      }
      const rmap = {};
      if (m.reactions && typeof m.reactions === 'object') {
        Object.entries(m.reactions).forEach(([u, em]) => {
          if (!em) return;
          if (!rmap[em]) rmap[em] = [];
          rmap[em].push(u === me.uid ? 'You' : (chatMeta.memberNames?.[u] || 'User'));
        });
      }
      const rHtml = Object.keys(rmap).length ? `<div class="reacts">${Object.entries(rmap).map(([em, who]) => `<span class="rpill" title="${esc(who.join(', '))}">${em} ${who.length > 1 ? who.length : ''}</span>`).join('')}</div>` : '';
      const qHtml = m.replyTo ? `<div class="qbox"><b>${esc(m.replyTo.senderName || 'User')}</b>${esc(m.replyTo.preview || '')}</div>` : '';
      const fwdHtml = m.forwarded ? `<div class="fwd">↪ ${esc(tr('forwardBtn'))}</div>` : '';
      let body = '';
      if (m.deleted) { body = `<span class="del">🚫 Message deleted</span>`; }
      else {
        if (m.poll && m.poll.question && Array.isArray(m.poll.options)) {
          const votes = m.poll.votes || {};
          const totalV = Object.keys(votes).length;
          body += `<div class="pollbox"><b>📊 ${esc(m.poll.question)}</b>${m.poll.options.map(opt => {
            const cnt = Object.values(votes).filter(v => v === opt.id).length;
            const pct = totalV ? Math.round((cnt / totalV) * 100) : 0;
            const voted = votes[me.uid] === opt.id;
            return `<div class="pollopt ${voted ? 'voted' : ''}" data-oid="${esc(opt.id)}"><span>${esc(opt.label)}</span><span>${cnt} (${pct}%)</span></div>`;
          }).join('')}</div>`;
        }
        const safeImg = safeMedia(m.image);
        const safeAud = safeMedia(m.audio);
        if (safeImg) body += `<img class="zoomimg" src="${esc(safeImg)}" alt="">`;
        if (safeAud) {
          const audType = /^audio\//i.test(m.audioMime || '') ? ` type="${esc(m.audioMime)}"` : '';
          body += `<div class="mediarow"><audio controls preload="metadata"><source src="${esc(safeAud)}"${audType}></audio><button type="button" class="spdbtn" data-spd="1">1x</button></div>`;
        }
        if (m.text) body += `<div>${formatMessageBodyHtml(m.text, false)}</div>`;
        if (m.text && !safeImg && !safeAud) body += buildLinkPreviewHtml(m.text);
        if (translations[m.id]) body += `<div class="trbox">🌐 ${esc(translations[m.id])}</div>`;
        if (m.edited) body += `<span class="ed">(edited)</span>`;
      }
      const isPinned = chatMeta.pinnedMessageId === m.id, isStarred = myStarred().some(x => x.id === m.id);
      const actHtml = m.deleted ? `<div class="act"><span class="act_delme">Delete for me</span></div>`
        : `<div class="act">${REACTIONS.map(em => `<span class="rx" data-em="${em}">${em}</span>`).join('')}<span class="act_tr">🌐</span><span class="act_rep">${esc(tr('replyBtn'))}</span><span class="act_fwd">${esc(tr('forwardBtn'))}</span><span class="act_pin">${isPinned ? esc(tr('unpinBtn')) : esc(tr('pinBtn'))}</span><span class="act_star">${isStarred ? esc(tr('unstarBtn')) : esc(tr('starBtn'))}</span>${m.text ? `<span class="act_cp">${esc(tr('copyBtn'))}</span>` : ''}${isMe && m.text ? `<span class="act_ed">${esc(tr('editBtn'))}</span>` : ''}<span class="act_sel">${esc(tr('selectBtn'))}</span><span class="act_del">${esc(tr('deleteBtn'))}</span></div>`;
      html += `<div class="b ${isMe ? 'me' : ''} ${isSel ? 'selected' : ''} ${isOpen ? 'open' : ''}" data-id="${esc(m.id)}">${(!isMe && chatMeta.isGroup) ? `<div class="n">${esc(m.senderName || 'User')}</div>` : ''}${fwdHtml}${qHtml}${body}<span class="tm">${tm}${tick}</span>${rHtml}${actHtml}</div>`;
    });

    ms.innerHTML = html;
    const loBtn = document.getElementById('loadold');
    if (loBtn) loBtn.onclick = () => { msgLimit += 40; bindMessages(); };
    ms.querySelectorAll('.pollopt').forEach(po => {
      po.onclick = async e => {
        e.stopPropagation();
        const mid = po.closest('.b')?.dataset.id, m = msgCache[mid]; if (!m || m.deleted) return;
        await chat.collection('messages').doc(mid).update({ ['poll.votes.' + me.uid]: po.dataset.oid });
      };
    });
    ms.querySelectorAll('.spdbtn').forEach(sb => {
      sb.onclick = e => {
        e.stopPropagation();
        const aud = sb.parentElement?.querySelector('audio'); if (!aud) return;
        const rates = [1, 1.5, 2], cur = parseFloat(sb.dataset.spd || '1'), nxt = rates[(rates.indexOf(cur) + 1) % rates.length];
        aud.playbackRate = nxt; sb.dataset.spd = String(nxt); sb.textContent = nxt + 'x';
      };
    });
    ms.querySelectorAll('.b').forEach(b => {
      const id = b.dataset.id, m = msgCache[id]; if (!m) return;
      const imgEl = b.querySelector('img.zoomimg');
      if (imgEl && !m.deleted) imgEl.onclick = e => { e.stopPropagation(); openLightbox(imgEl.src, m.text || m.senderName || '', false); };
      b.onclick = e => {
        if (e.target.tagName === 'A' || e.target.tagName === 'AUDIO' || e.target.classList.contains('spdbtn') || e.target.classList.contains('pollopt')) return;
        if (selectedIds.size > 0) { toggleSelect(id); return; }
        openId = openId === id ? null : id; lastSig = ''; renderMessages(lastDocs);
      };
      const mref = chat.collection('messages').doc(id), FV = firebase.firestore.FieldValue;
      b.querySelectorAll('.rx').forEach(rx => rx.onclick = async e => {
        e.stopPropagation(); const em = rx.dataset.em, cur = m.reactions?.[me.uid];
        await mref.update({ ['reactions.' + me.uid]: cur === em ? FV.delete() : em });
        openId = null; lastSig = ''; renderMessages(lastDocs);
      });
      const trBtn = b.querySelector('.act_tr');
      if (trBtn) trBtn.onclick = async e => {
        e.stopPropagation();
        const targetLang = currentLang() === 'en' ? 'bn' : 'en';
        translations[id] = await translateTextSmart(m.text || '', targetLang);
        openId = null; lastSig = ''; renderMessages(lastDocs);
      };
      const rep = b.querySelector('.act_rep'); if (rep) rep.onclick = e => { e.stopPropagation(); openId = null; setReplyTo(m); };
      const fwd = b.querySelector('.act_fwd'); if (fwd) fwd.onclick = e => { e.stopPropagation(); openId = null; openForwardModal(m); };
      const pin = b.querySelector('.act_pin');
      if (pin) pin.onclick = async e => {
        e.stopPropagation(); const nextPin = chatMeta.pinnedMessageId === id ? null : id;
        await chat.set({ pinnedMessageId: nextPin }, { merge: true }); openId = null; toast(nextPin ? 'Message pinned' : 'Unpinned');
      };
      const star = b.querySelector('.act_star');
      if (star) star.onclick = async e => {
        e.stopPropagation();
        const exists = myStarred().find(x => x.id === id);
        if (exists) { await privRef().set({ starred: FV.arrayRemove(exists) }, { merge: true }); profile.starred = myStarred().filter(x => x.id !== id); toast('Unstarred'); }
        else {
          const entry = { id, chatId, chatTitle: getChatNick(chatId) || title, senderName: m.senderName || 'User', preview: m.audio ? '🎤 Voice message' : m.image ? '📷 Photo' : (m.text || '') };
          await privRef().set({ starred: FV.arrayUnion(entry) }, { merge: true }); profile.starred = [...myStarred(), entry]; toast('Starred');
        }
        openId = null; lastSig = ''; renderMessages(lastDocs);
      };
      const cp = b.querySelector('.act_cp');
      if (cp) cp.onclick = async e => { e.stopPropagation(); try { if (navigator.clipboard?.writeText) await navigator.clipboard.writeText(m.text || ''); } catch (err) {} toast(tr('copied')); openId = null; lastSig = ''; renderMessages(lastDocs); };
      const ed = b.querySelector('.act_ed');
      if (ed) ed.onclick = async e => {
        e.stopPropagation(); const nt = prompt('Edit message:', m.text || '');
        if (nt !== null && nt.trim() && nt.trim() !== m.text) await mref.update({ text: nt.trim(), edited: true });
        openId = null;
      };
      const sel = b.querySelector('.act_sel'); if (sel) sel.onclick = e => { e.stopPropagation(); openId = null; enterSelectionMode(id); };
      const del = b.querySelector('.act_del');
      if (del) del.onclick = async e => {
        e.stopPropagation();
        if (m.senderId === me.uid) { const ch = prompt('1 = Delete for everyone\n2 = Delete for me', '1'); if (ch === '1') await mref.update({ deleted: true, text: null, image: null, audio: null }); else if (ch === '2') await mref.update({ hiddenFor: FV.arrayUnion(me.uid) }); }
        else { if (confirm('Delete message for you?')) await mref.update({ hiddenFor: FV.arrayUnion(me.uid) }); }
        openId = null;
      };
      const delme = b.querySelector('.act_delme'); if (delme) delme.onclick = async e => { e.stopPropagation(); await mref.update({ hiddenFor: FV.arrayUnion(me.uid) }); openId = null; };
    });
    if (msgLimit > 40 && prevScrollHeight > 0) ms.scrollTop = Math.max(0, ms.scrollHeight - prevScrollHeight + prevScrollTop);
    else if (atBottom) ms.scrollTop = ms.scrollHeight;
  }

  let msgUnsub = null;
  function bindMessages() {
    if (msgUnsub) { msgUnsub(); msgUnsub = null; }
    msgUnsub = chat.collection('messages').orderBy('createdAt', 'desc').limit(msgLimit).onSnapshot(snap => {
      hasMoreOlder = snap.docs.length >= msgLimit;
      const ascDocs = [...snap.docs].reverse();
      if (sendReceiptsPref()) {
        const unseen = ascDocs.filter(d => { const x = d.data(); return x.senderId !== me.uid && (!Array.isArray(x.seenBy) || !x.seenBy.includes(me.uid)); });
        if (unseen.length) {
          const batch = db.batch();
          unseen.forEach(d => batch.update(d.ref, { seenBy: firebase.firestore.FieldValue.arrayUnion(me.uid) }));
          batch.commit().catch(() => {});
        }
      }
      renderMessages(ascDocs);
      if (inChatQuery) runInChatSearch();
    }, () => {});
  }

  if (isAiChat) { renderAiMessages(); return; }

  addSub(chat.onSnapshot(snap => {
    if (!snap.exists) { home('chats', false); return; }
    chatMeta = snap.data();
    const myPh = safeChatPhotoField(profilePhotoOf(profile));
    if (myPh && chatMeta.memberPhotos?.[me.uid] !== myPh) {
      chat.set({ memberPhotos: { [me.uid]: myPh } }, { merge: true }).catch(() => {});
    }
    if ((chatMeta.unread?.[me.uid] || 0) > 0) chat.set({ unread: { [me.uid]: 0 } }, { merge: true }).catch(() => {});
    if (chatMeta.lastSender && chatMeta.lastSender !== me.uid && !chatMeta.deliveredBy?.[me.uid]) {
      chat.set({ deliveredBy: { [me.uid]: Date.now() } }, { merge: true }).catch(() => {});
    }
    typingNames = Object.entries(chatMeta.typing || {}).filter(([u, v]) => u !== me.uid && isTyping(v)).map(([u]) => chatMeta.memberNames?.[u] || 'Someone');
    applyWallpaper(); renderSub(); renderPinnedBar(); refreshHeaderAvatar();
    if (lastDocs.length) { lastSig = ''; renderMessages(lastDocs); }
  }, () => {}));

  if (peerUid) {
    addSub(db.collection('users').doc(peerUid).onSnapshot(d => {
      if (d.exists) {
        peerUser = d.data();
        userProfilesCache[peerUid] = peerUser;
        userProfileFetchedAt[peerUid] = Date.now();
        renderSub();
        refreshHeaderAvatar();
      }
    }, () => {}));
    addSub(db.collection('presence').doc(peerUid).onSnapshot(d => { peerPres = d.exists ? d.data() : null; renderSub(); }, () => {}));
  }
  bindMessages();
  addSub(() => { if (msgUnsub) { msgUnsub(); msgUnsub = null; } });
}
</script>
</body>
</html>
