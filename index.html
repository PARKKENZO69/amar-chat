async function openOneToOne(u) {
  const ids = [me.uid, u.uid].sort(), id = ids.join('_');
  await db.collection('chats').doc(id).set({
    isGroup: false, members: ids, memberNames: { [me.uid]: myName(), [u.uid]: u.name },
    memberUsernames: { [me.uid]: profile.username, [u.uid]: u.username }, acceptedBy: { [me.uid]: true }
  }, { merge: true });
  chatView(id, u.name, u.uid);
}

function newGroup() {
  stop(); currentScreenName = 'newgroup'; pushSubScreenHistory('newgroup');
  const added = {}; let groupIcon = '';
  $app.innerHTML = `
    <header><button id="bk">←</button>${esc(tr('newGroup'))}</header>
    <div class="pad">
      <div class="pav" id="gpav">${avHtml('', 'G', true)}</div>
      <input type="file" id="gfi" accept="image/jpeg,image/png,image/webp" hidden>
      <input type="text" id="gn" placeholder="Group Name"><input type="text" id="gd" placeholder="Description (optional)">
      <div class="addrow"><input type="text" id="q" placeholder="username" autocapitalize="off" autocomplete="off"><button class="btn sm" id="ad">+</button></div>
      <p class="err" id="er" style="margin-top:10px"></p><div class="chips" id="ch"></div>
      <button class="btn" id="mk">${esc(tr('newGroup'))}</button>
    </div>`;
  document.getElementById('bk').onclick = () => home('chats', false);
  document.getElementById('gpav').onclick = () => document.getElementById('gfi').click();
  document.getElementById('gfi').onchange = async e => {
    const f = e.target.files[0]; if (!f) return;
    try { const small = await shrink(f, 200, 0.4); groupIcon = small.dataUrl; document.getElementById('gpav').innerHTML = avHtml(groupIcon, 'G', true); } catch (ex) {}
    e.target.value = '';
  };
  const draw = () => {
    const ch = document.getElementById('ch');
    ch.innerHTML = Object.entries(added).map(([uid, u]) => `<span class="chip" data-u="${esc(uid)}">${esc(u.name)} (@${esc(u.username)}) ✕</span>`).join('');
    ch.querySelectorAll('.chip').forEach(c => c.onclick = () => { delete added[c.dataset.u]; draw(); });
  };
  const add = async () => {
    const er = document.getElementById('er'), q = document.getElementById('q'); er.textContent = '';
    try { const u = await lookup(q.value); if (u.isBot) throw new Error('AI bot cannot be added to a group'); added[u.uid] = { name: u.name, username: u.username }; q.value = ''; draw(); }
    catch (ex) { er.textContent = ex.message; }
  };
  document.getElementById('ad').onclick = add;
  document.getElementById('q').addEventListener('keydown', e => { if (e.key === 'Enter') add(); });
  document.getElementById('mk').onclick = async ev => {
    const mkBtn = ev.currentTarget, name = document.getElementById('gn').value.trim(), description = document.getElementById('gd').value.trim();
    if (!name || Object.keys(added).length < 2) return toast('Enter group name and add at least 2 members');
    const memberNames = { [me.uid]: myName() }, memberUsernames = { [me.uid]: profile.username };
    Object.entries(added).forEach(([uid, u]) => { memberNames[uid] = u.name; memberUsernames[uid] = u.username; });
    mkBtn.disabled = true;
    try {
      const ref = await db.collection('chats').add({ isGroup: true, name, description, groupIcon, admins: [me.uid], members: Object.keys(memberNames), memberNames, memberUsernames, lastMessage: '', updatedAt: firebase.firestore.FieldValue.serverTimestamp() });
      chatView(ref.id, name, null);
    } catch (e) { mkBtn.disabled = false; toast('Could not create group: ' + e.message); }
  };
}

function groupInfoView(chatId) {
  stop(); currentScreenName = 'groupinfo'; pushSubScreenHistory('groupinfo');
  const FV = firebase.firestore.FieldValue, cref = db.collection('chats').doc(chatId);
  $app.innerHTML = `<header><button id="bk">←</button>Group Info</header><div class="list"><div class="pad" id="gbody"><div class="empty">Loading...</div></div></div>`;
  let curName = 'Group', lastSig = '';
  document.getElementById('bk').onclick = () => chatView(chatId, curName, null);
  addSub(cref.onSnapshot(snap => {
    if (!snap.exists) { home('chats', false); return; }
    const c = snap.data(), members = c.members || [];
    if (!members.includes(me.uid)) { home('chats', false); return; }
    const admins = c.admins || [], isAdmin = admins.includes(me.uid);
    curName = c.name || 'Group';
    const sig = JSON.stringify([c.name, c.description, members, admins, c.memberNames, c.memberUsernames]);
    if (sig === lastSig) return; lastSig = sig;
    const gbody = document.getElementById('gbody'); if (!gbody) return;
    gbody.innerHTML = `
      <div class="card">
        ${isAdmin ? `<input type="text" id="gname" value="${esc(c.name || '')}" maxlength="40"><input type="text" id="gdesc" value="${esc(c.description || '')}" maxlength="150"><button class="btn sm" id="gsave">Save</button>`
        : `<div style="font-size:17px;font-weight:700">${esc(c.name || 'Group')}</div>${c.description ? `<p class="hint" style="margin-top:4px">${esc(c.description)}</p>` : ''}`}
      </div>
      <div class="card"><div class="hint"><b>${members.length} members</b></div>${members.map(uid => `<div class="mrow"><span>${esc(c.memberNames?.[uid] || 'User')}${c.memberUsernames?.[uid] ? ` <span class="hint" style="margin:0">@${esc(c.memberUsernames[uid])}</span>` : ''} ${admins.includes(uid) ? '<b style="color:var(--g);font-size:12px">[Admin]</b>' : ''}</span>${isAdmin && uid !== me.uid ? `<span><button class="btn sm gadm" data-u="${esc(uid)}" style="padding:4px 9px;font-size:11px">${admins.includes(uid) ? 'Remove admin' : 'Make admin'}</button> <button class="btn sm danger grm" data-u="${esc(uid)}" style="padding:4px 9px;font-size:11px">Remove</button></span>` : ''}</div>`).join('')}</div>
      ${isAdmin ? `<div class="card"><div class="hint"><b>Add a member</b></div><div class="addrow"><input type="text" id="gq" placeholder="username" autocapitalize="off"><button class="btn sm" id="gad">Add</button></div><p class="err" id="ger" style="margin-top:8px"></p></div>` : ''}
      <button class="btn danger" id="gleave">Leave Group</button>`;
    const gs = document.getElementById('gsave');
    if (gs) gs.onclick = async () => { const name = document.getElementById('gname').value.trim(); if (!name) return toast('Group name cannot be empty'); await cref.update({ name, description: document.getElementById('gdesc').value.trim() }); toast('Group updated'); };
    const gad = document.getElementById('gad');
    if (gad) {
      const add = async () => {
        const er = document.getElementById('ger'), q = document.getElementById('gq'); er.textContent = '';
        try {
          const u = await lookup(q.value);
          if (u.isBot) throw new Error('AI bot cannot be added');
          if (members.includes(u.uid)) throw new Error('Already in group');
          await cref.update({ members: FV.arrayUnion(u.uid), ['memberNames.' + u.uid]: u.name, ['memberUsernames.' + u.uid]: u.username });
          q.value = ''; toast(u.name + ' added');
        } catch (ex) { er.textContent = ex.message; }
      };
      gad.onclick = add; document.getElementById('gq').addEventListener('keydown', e => { if (e.key === 'Enter') add(); });
    }
    gbody.querySelectorAll('.gadm').forEach(b => b.onclick = async () => { const u = b.dataset.u; await cref.update({ admins: admins.includes(u) ? FV.arrayRemove(u) : FV.arrayUnion(u) }); });
    gbody.querySelectorAll('.grm').forEach(b => b.onclick = async () => { const u = b.dataset.u; if (!confirm('Remove member?')) return; await cref.update({ members: FV.arrayRemove(u), admins: FV.arrayRemove(u), ['memberNames.' + u]: FV.delete(), ['memberUsernames.' + u]: FV.delete() }); toast('Removed'); });
    document.getElementById('gleave').onclick = async () => {
      if (!confirm('Leave this group?')) return;
      const rest = members.filter(x => x !== me.uid);
      let nextAdmins = admins.filter(x => x !== me.uid); if (!nextAdmins.length && rest.length) nextAdmins = [rest[0]];
      await cref.update({ members: rest, admins: nextAdmins }); home('chats', false);
    };
  }, () => home('chats', false)));
}

function openWallpaperModal(chatId, chatRef, currentWp) {

async function openCameraModal(onCaptured) {
  let stream = null, facing = 'user';
  const modal = document.createElement('div'); modal.className = 'modal';
  modal.innerHTML = `<div class="mbox"><div class="mhead"><span>📸 Camera</span><button id="camcl">✕</button></div><div class="mbody"><div class="cambox"><video id="camvid" autoplay playsinline muted></video></div><div style="display:flex;gap:8px;margin-top:12px"><button class="btn sm sec" id="camflip">🔄</button><button class="btn" id="camsnap" style="flex:1">📷 Capture</button></div></div></div>`;
  document.body.appendChild(modal);
  const stopCam = () => { if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; } };
  const closeCam = () => { stopCam(); modal.remove(); };
  modal.querySelector('#camcl').onclick = closeCam; modal.onclick = e => { if (e.target === modal) closeCam(); };
  const startCam = async () => {
    stopCam();
    try {
      stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: facing }, width: { ideal: 320 }, height: { ideal: 240 } }, audio: false });
      if (!modal.isConnected) { stopCam(); return; }
      const v = modal.querySelector('#camvid'); v.srcObject = stream; v.play().catch(() => {});
    } catch (e) { toast('Camera error'); closeCam(); }
  };
  modal.querySelector('#camflip').onclick = () => { facing = facing === 'user' ? 'environment' : 'user'; startCam(); };
  modal.querySelector('#camsnap').onclick = async () => {
    const v = modal.querySelector('#camvid'); if (!v || !v.videoWidth) return;
    const c = document.createElement('canvas'), s = Math.min(1, 300 / Math.max(v.videoWidth, v.videoHeight));
    c.width = Math.round(v.videoWidth * s); c.height = Math.round(v.videoHeight * s);
    c.getContext('2d').drawImage(v, 0, 0, c.width, c.height);
    const dataUrl = c.toDataURL('image/jpeg', 0.4); closeCam(); await onCaptured(dataUrl);
  };
  await startCam();
}

async function openForwardModal(msgList) {

    const snap = await db.collection('chats').where('members', 'array-contains', me.uid).limit(200).get();
    const fls = modal.querySelector('#fls');
    fls.innerHTML = snap.docs.map(d => { const c = { id: d.id, ...d.data() }, t = chatTitle(c); return `<div class="row" data-id="${esc(c.id)}" data-t="${esc(t)}" data-oid="${esc(otherUid(c) || '')}"><div class="av">${avHtml('', t, c.isGroup)}</div><div class="mid"><div class="t">${esc(t)}</div></div></div>`; }).join('');
    fls.querySelectorAll('.row').forEach(r => {

        const targetId = r.dataset.id, FV = firebase.firestore.FieldValue, target = snap.docs.find(x => x.id === targetId)?.data() || {}, hrs = target.disappearHours || 0;
        let lastPreview = '';
        try {

              forwarded: true, edited: false, deleted: false, replyTo: null, reactions: {}, hiddenFor: [],
              expiresAt: hrs > 0 ? Date.now() + hrs * 3600000 : null, deliveredTo: [me.uid], seenBy: [me.uid], createdAtMs: Date.now(), createdAt: FV.serverTimestamp()
            });
            lastPreview = msgObj.audio ? '🎤 Voice message' : msgObj.image ? '📷 Photo' : (msgObj.text || 'Message');

function blobToDataURL(blob) {
  return new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(fr.result); fr.onerror = () => rej(new Error('File read failed')); fr.readAsDataURL(blob); });
}
async function prepareFreeMedia(blobOrDataUrl, kind) {
  const dataUrl = typeof blobOrDataUrl === 'string' ? blobOrDataUrl : await blobToDataURL(blobOrDataUrl);
  if (!dataUrl || dataUrl.length > MAX_FREE_MEDIA_CHARS) throw new Error(kind === 'voice' ? `Voice clip beshi boro (max ${MAX_FREE_VOICE_SEC}s).` : 'Chobi beshi boro.');
  return dataUrl;
}

    if (!peerUid && !isAiChat) document.getElementById('hinfo').onclick = () => groupInfoView(chatId);
    if (peerUid && !isAiChat) {
      document.getElementById('acall').onclick = () => startCall(peerUid, newHtitle.textContent, false);
      document.getElementById('vcall').onclick = () => startCall(peerUid, newHtitle.textContent, true);
      ['chav', 'htitle'].forEach(i => { const el = document.getElementById(i); el.style.cursor = 'pointer'; el.onclick = () => showPublicProfile(peerUid, title); });
    }
    const csbox = document.getElementById('csbox'), csinp = document.getElementById('csinp');
    document.getElementById('csbtn').onclick = () => {
      const show = csbox.style.display === 'none'; csbox.style.display = show ? 'flex' : 'none';
      if (show) { csinp.focus(); renderMessages(); } else { inChatQuery = ''; csinp.value = ''; csresults.innerHTML = ''; renderMessages(); }
    };
    document.getElementById('cmore').onclick = e => { e.stopPropagation(); rebuildMenu(newCmenu); newCmenu.style.display = newCmenu.style.display === 'none' ? 'block' : 'none'; };
  }

  function renderHeaderState() {
    const curTitle = document.getElementById('htitle')?.textContent || title;
    if (selectedIds.size > 0) {
      const selMsgs = [...selectedIds].map(id => ({ id, m: msgCache[id] })).filter(x => x.m);
      const canCopy = selMsgs.some(x => !x.m.deleted && x.m.text);
      const canPin = !isAiChat && selMsgs.length === 1 && !selMsgs[0].m.deleted;
      const isCurrentlyPinned = canPin && chatMeta.pinnedMessage?.id === selMsgs[0].id;
      const canDelAll = !isAiChat && selMsgs.length > 0 && selMsgs.every(x => !x.m.deleted && x.m.senderId === me.uid);
      chdr.classList.add('selhdr');
      chdr.innerHTML = `
        <button id="selcls" title="Cancel">✕</button><span style="font-weight:700">${selectedIds.size}</span><span class="sp"></span>
        ${canCopy ? `<button id="selcopy" title="${esc(tr('copyBtn'))}">📋</button>` : ''}
        <button id="selstar" title="${esc(tr('starBtn'))}">⭐</button>
        ${canPin ? `<button id="selpin" title="${esc(tr('pinBtn'))}">${isCurrentlyPinned ? '📍' : '📌'}</button>` : ''}
        ${!isAiChat ? `<button id="selfwd" title="${esc(tr('forwardBtn'))}">↪</button>` : ''}
        <button id="seldel" title="Delete">🗑</button>
        ${canDelAll ? `<button id="seldelall" title="Delete for everyone" style="color:#ff8a80;font-size:12.5px;font-weight:700">All</button>` : ''}`;
      document.getElementById('selcls').onclick = () => { selectedIds.clear(); renderHeaderState(); renderMessages(); };
      const selcopy = document.getElementById('selcopy');
      if (selcopy) selcopy.onclick = async () => {
        const txt = selMsgs.map(x => x.m.text).filter(Boolean).join('\n'); if (!txt) return;
        try { if (navigator.clipboard?.writeText) await navigator.clipboard.writeText(txt); } catch (err) {}
        toast(tr('copied')); selectedIds.clear(); renderHeaderState(); renderMessages();
      };
      const selfwd = document.getElementById('selfwd');
      if (selfwd) selfwd.onclick = () => openForwardModal(selMsgs.map(x => x.m));
      document.getElementById('selstar').onclick = async () => {
        const FV = firebase.firestore.FieldValue;
        for (const { id, m } of selMsgs) {
          if (m.deleted) continue;
          const preview = m.text || (m.audio ? '🎤 Voice message' : m.image ? '📷 Photo' : 'Message');
          if (!myStarred().some(x => x.id === id)) {
            const entry = { id, chatId, chatTitle: curTitle, senderName: m.senderName || 'User', preview };
            await privRef().set({ starred: FV.arrayUnion(entry) }, { merge: true }); profile.starred = [...myStarred(), entry];
          }
        }
        toast('Starred'); selectedIds.clear(); renderHeaderState(); renderMessages();
      };
      const selpin = document.getElementById('selpin');
      if (selpin) selpin.onclick = async () => {
        const { id, m } = selMsgs[0];
        if (chatMeta.pinnedMessage?.id === id) { await chat.set({ pinnedMessage: null }, { merge: true }); toast('Unpinned'); }
        else { await chat.set({ pinnedMessage: { id, senderName: m.senderName || 'User', preview: m.text || (m.audio ? '🎤 Voice message' : m.image ? '📷 Photo' : 'Message') } }, { merge: true }); toast('Pinned'); }
        selectedIds.clear(); renderHeaderState(); renderMessages();
      };
      document.getElementById('seldel').onclick = async () => {
        const ids = [...selectedIds];
        if (isAiChat) { aiMessages = aiMessages.filter(x => !ids.includes(x.id)); saveAiHistory(me?.uid, aiMessages); }
        else { for (const id of ids) await chat.collection('messages').doc(id).update({ hiddenFor: firebase.firestore.FieldValue.arrayUnion(me.uid) }).catch(() => {}); }
        selectedIds.clear(); renderHeaderState(); renderMessages();
      };
      const seldelall = document.getElementById('seldelall');
      if (seldelall) seldelall.onclick = async () => {
        if (!confirm('Delete for everyone?')) return;
        for (const id of [...selectedIds]) await deleteForAll(id).catch(() => toast('Could not delete'));
        selectedIds.clear(); renderHeaderState(); renderMessages();
      };
      return;
    }

    chdr.classList.remove('selhdr');
    chdr.innerHTML = `
      <button id="bk">←</button>
      <div class="hav ${isAiChat ? 'botav' : ''}" id="chav">${avHtml(peerUser?.photo, curTitle, !peerUid && !isAiChat, isAiChat)}</div>
      <div class="hinfo" id="hinfo" style="cursor:${!peerUid && !isAiChat ? 'pointer' : 'default'}">
        <span id="htitle">${esc(curTitle)}</span>
        <span class="hsub" id="hsub"></span>
      </div>
      <button id="csbtn">🔍</button>
      ${(!peerUid || isAiChat) ? '' : '<button id="acall">📞</button><button id="vcall">📹</button>'}
      <button id="cmore">⋮</button>
      <div class="menu top" id="cmenu" style="display:none"></div>`;
    bindChatHeaderEvents(); updateHeaderSub();
  }

  async function deleteForAll(id) {
    const wasLast = lastDocs.length && lastDocs[lastDocs.length - 1].id === id;
    await chat.collection('messages').doc(id).update({ text: null, image: null, audio: null, poll: null, replyTo: null, deleted: true });
    const patch = {};
    if (chatMeta.pinnedMessage?.id === id) patch.pinnedMessage = null;
    if (wasLast) patch.lastMessage = '🚫 Message deleted';
    if (Object.keys(patch).length) await chat.set(patch, { merge: true }).catch(() => {});
  }

  function setReply(id, senderName, preview) { replyTarget = { id, senderName, preview }; rtxt.innerHTML = `<b>↩ ${esc(senderName)}:</b> ${esc(preview)}`; rbar.classList.add('on'); tx.focus(); }
  function clearReply() { replyTarget = null; rbar.classList.remove('on'); }
  document.getElementById('rcl').onclick = clearReply;
  document.getElementById('cscls').onclick = () => { document.getElementById('csbox').style.display = 'none'; inChatQuery = ''; document.getElementById('csinp').value = ''; csresults.innerHTML = ''; renderMessages(); };
  document.getElementById('csinp').addEventListener('input', e => { inChatQuery = e.target.value; renderMessages(); });

  const closeMenu = () => { const m = document.getElementById('cmenu'); if (m) m.style.display = 'none'; };
  document.addEventListener('click', closeMenu); addSub(() => document.removeEventListener('click', closeMenu));

  function updateBlockedUI() {
    const slot = document.getElementById('inputslot');
    if (!slot || !peerUid || isAiChat) return;
    if (myBlocked().includes(peerUid)) {
      slot.innerHTML = `<div class="blockedbar">🚫 Blocked <button class="btn sm" id="unblkbtn" style="margin-left:8px;padding:4px 10px">${esc(tr('unblkBtn'))}</button></div>`;
      document.getElementById('unblkbtn').onclick = async () => {
        await privRef().set({ blocked: firebase.firestore.FieldValue.arrayRemove(peerUid) }, { merge: true });
        profile.blocked = myBlocked().filter(id => id !== peerUid);
        chatView(chatId, document.getElementById('htitle')?.textContent || title, peerUid);
      };
    }
  }

  ep.innerHTML = EMOJIS.map(em => `<button type="button">${em}</button>`).join('');
  ep.querySelectorAll('button').forEach(b => {
    b.onclick = () => {
      const start = tx.selectionStart ?? tx.value.length, end = tx.selectionEnd ?? tx.value.length;
      tx.value = tx.value.slice(0, start) + b.textContent + tx.value.slice(end);
      setDraft(chatId, tx.value); tx.focus();
    };
  });
  document.getElementById('ebtn').onclick = () => ep.classList.toggle('on');

  const setTyping = async val => {
    if (isAiChat || !chat) return;
    const now = Date.now();
    if (val) { if (isTypingNow && now - lastTypingWrite < 3000) return; }
    else if (!isTypingNow) return;
    isTypingNow = val; lastTypingWrite = now;
    try { await chat.set({ typing: { [me.uid]: val ? now : 0 } }, { merge: true }); } catch (e) {}
  };

  function refreshMentionPopup() {
    if (!mentionpop || isAiChat || peerUid || !chatMeta.memberUsernames) { if (mentionpop) mentionpop.style.display = 'none'; return; }
    const m = tx.value.slice(0, tx.selectionStart ?? tx.value.length).match(/@([a-z0-9_]*)$/i);
    if (!m) { mentionpop.style.display = 'none'; return; }
    const needle = m[1].toLowerCase();
    const matches = Object.entries(chatMeta.memberUsernames).filter(([uid, un]) => uid !== me.uid && un && un.toLowerCase().includes(needle));
    if (!matches.length) { mentionpop.style.display = 'none'; return; }
    mentionpop.style.display = 'block';
    mentionpop.innerHTML = matches.map(([uid, un]) => `<div class="row mpick" data-un="${esc(un)}" style="padding:8px 12px"><div class="mid"><div class="t">@${esc(un)}</div><div class="s">${esc(chatMeta.memberNames?.[uid] || 'Member')}</div></div></div>`).join('');
    mentionpop.querySelectorAll('.mpick').forEach(row => {
      row.onclick = () => {
        const pos = tx.selectionStart ?? tx.value.length, before = tx.value.slice(0, pos), after = tx.value.slice(pos);
        const replaced = before.replace(/@([a-z0-9_]*)$/i, `@${row.dataset.un} `);
        tx.value = replaced + after; setDraft(chatId, tx.value); mentionpop.style.display = 'none'; tx.focus();
      };
    });
  }

  tx.addEventListener('input', () => {
    setDraft(chatId, tx.value); autosize(); refreshMentionPopup();
    if (!isAiChat) {
      if (tx.value.trim()) { setTyping(true); clearTimeout(typingTimeout); typingTimeout = setTimeout(() => setTyping(false), 2000); }
      else setTyping(false);
    }
  });

  function applyChatWallpaper() {
    if (isAiChat) {
      try { const localWp = JSON.parse(localStorage.getItem(`amar_wp_${chatId}`) || 'null'); if (localWp?.color) { ms.style.backgroundImage = 'none'; ms.style.backgroundColor = localWp.color; return; } } catch (e) {}
      ms.style.backgroundImage = 'none'; ms.style.backgroundColor = isDarkMode() ? '#0b141a' : '#efeae2'; return;
    }
    const wp = chatMeta.wallpaperBy?.[me.uid];
    ms.style.backgroundImage = 'none';
    ms.style.backgroundColor = wp?.color ? wp.color : (isDarkMode() ? '#0b141a' : '#efeae2');
  }
  applyChatWallpaper();

  function renderMessages() {
    const atBottom = ms.scrollHeight - ms.scrollTop - ms.clientHeight < 120;
    const q = inChatQuery.trim().toLowerCase(), starredIds = new Set(myStarred().map(x => x.id));
    msgCache = {};

    let items = [];
    if (isAiChat) {
      items = aiMessages.map(m => ({ id: m.id, data: () => m }));
    } else {
      const delTs = Math.max(tsMs(chatMeta.deletedAt?.[me.uid]), tsMs(chatMeta.clearedAt?.[me.uid]));
      items = lastDocs.filter(d => {
        const m = d.data();
        if (m.expiresAt && Date.now() > m.expiresAt) { if (m.senderId === me.uid && !purged.has(d.id)) { purged.add(d.id); d.ref.delete().catch(() => {}); } return false; }
        if (Array.isArray(m.hiddenFor) && m.hiddenFor.includes(me.uid)) return false;
        const mTs = tsMs(m.createdAt);
        return !(delTs && mTs && mTs <= delTs);
      });
    }

    if (q) {
      const matches = items.filter(d => { const m = d.data(); return !m.deleted && ((m.text || '').toLowerCase().includes(q) || (m.senderName || '').toLowerCase().includes(q)); });
      csresults.innerHTML = matches.length
        ? `<div style="max-height:130px;overflow:auto;background:var(--card);border-bottom:1px solid var(--bd)">` + matches.slice(0, 10).map(d => { const m = d.data(); return `<div class="row jhit" data-mid="${esc(d.id)}" style="padding:8px 12px"><div class="mid"><div class="t" style="font-size:12.5px">${esc(m.senderName || 'User')}</div><div class="s" style="font-size:12.5px">${esc(m.text || 'Message')}</div></div><span class="hint" style="margin:0">Jump</span></div>`; }).join('') + `</div>`
        : `<div class="pinbar"><span>${esc(tr('noSearch'))}</span></div>`;
      csresults.querySelectorAll('.jhit').forEach(row => { row.onclick = () => jumpAndHighlightMsg(row.dataset.mid); });
    } else csresults.innerHTML = '';

    const loadOldHtml = (!isAiChat && items.length >= msgLimit && hasMoreOlder)
      ? `<button type="button" class="loadoldbtn" id="loadoldbtn">📜 Load older messages</button>` : '';

    let lastDay = '';
    ms.innerHTML = loadOldHtml + items.map(d => {
      const m = d.data(); msgCache[d.id] = m;
      const mts = tsMs(m.createdAt) || m.createdAtMs || Date.now(), dl = dayLabel(mts);
      const sep = dl !== lastDay ? `<div class="daysep"><span>${esc(dl)}</span></div>` : ''; lastDay = dl;
      const mine = m.senderId === me.uid, isBotMsg = m.senderId === AI_BOT_ID;
      const dt = m.createdAt?.toDate ? m.createdAt.toDate() : (m.createdAtMs ? new Date(m.createdAtMs) : null);
      const tm = dt ? String(dt.getHours()).padStart(2, '0') + ':' + String(dt.getMinutes()).padStart(2, '0') : '';
      const isSel = selectedIds.has(d.id);

      if (m.deleted) return `${sep}<div class="b ${mine ? 'me' : ''} ${isSel ? 'selected' : ''}" data-id="${esc(d.id)}">${mine ? '' : `<div class="n">${esc(m.senderName)}</div>`}<span class="del">🚫 Deleted</span><span class="tm">${tm}</span></div>`;

      const rxMap = m.reactions || {}, counts = {};
      Object.values(rxMap).forEach(em => { if (em) counts[em] = (counts[em] || 0) + 1; });
      const rxHtml = Object.keys(counts).length ? `<div class="reacts">${Object.entries(counts).map(([em, cnt]) => `<span class="rpill">${esc(em)}${cnt > 1 ? ' ' + cnt : ''}</span>`).join('')}</div>` : '';

      const safeImg = safeMedia(m.image), safeAud = safeMedia(m.audio);
      let pollHtml = '';
      if (m.poll && Array.isArray(m.poll.options)) {
        const votesMap = m.poll.votes || {};
        pollHtml = `<div class="pollbox"><b>📊 ${esc(m.poll.question)}</b>` + m.poll.options.map(opt => {
          const voters = Object.entries(votesMap).filter(([, v]) => v === opt.id);
          const iVoted = voters.some(([u]) => u === me.uid);
          return `<div class="pollopt ${iVoted ? 'voted' : ''}" data-opt="${esc(opt.id)}"><span>${esc(opt.label)}</span><span>${voters.length}</span></div>`;
        }).join('') + `</div>`;
      }

      const trText = translations[d.id];
      const trHtml = trText ? `<div class="trbox">🌐 ${esc(trText)}</div>` : '';

      let tick = '', statusText = '';
      if (mine && !isAiChat) {
        const others = (chatMeta.members || []).filter(u => u !== me.uid);
        const has = (arr, u) => Array.isArray(arr) && arr.includes(u);
        const isSeen = others.length > 0 && others.every(u => has(m.seenBy, u));
        const isDelivered = isSeen || (others.length > 0 && others.every(u => has(m.deliveredTo, u) || tsMs(chatMeta.deliveredBy?.[u]) >= (m.createdAtMs || mts)));
        statusText = isSeen ? 'Seen' : isDelivered ? 'Delivered' : 'Sent';
        tick = isSeen ? '<span class="tick seen" title="Seen">✓✓</span>' : isDelivered ? '<span class="tick" title="Delivered">✓✓</span>' : '<span class="tick" title="Sent">✓</span>';
      } else if (mine && isAiChat) tick = '<span class="tick seen" title="Seen">✓✓</span>';

      return `${sep}<div class="b ${mine ? 'me' : ''} ${isBotMsg ? 'botmsg' : ''} ${isSel ? 'selected' : ''} ${openId === d.id ? 'open' : ''}" data-id="${esc(d.id)}">
        ${mine ? '' : `<div class="n">${esc(m.senderName)}</div>`}
        ${m.forwarded ? '<div class="fwd">↪ Forwarded</div>' : ''}
        ${m.replyTo ? `<div class="qbox"><b>${esc(m.replyTo.senderName || 'User')}</b>${esc(m.replyTo.preview || '')}</div>` : ''}
        ${safeImg ? `<img class="zoomimg" loading="lazy" src="${esc(safeImg)}" data-cap="${esc(m.text || '')}">` : ''}
        ${safeAud ? `<audio controls preload="metadata" src="${esc(safeAud)}"></audio><button type="button" class="spdbtn" data-spd="1">1x</button>` : ''}
        ${pollHtml}
        ${m.text ? `<span class="txt">${formatMessageBodyHtml(m.text, isBotMsg)}</span>${isBotMsg ? '' : buildLinkPreviewHtml(m.text)}` : ''}${m.edited ? '<span class="ed">(edited)</span>' : ''}
        ${trHtml}
        <span class="tm">${m.expiresAt ? '⏱ ' : ''}${tm} ${tick}</span>
        ${rxHtml}
        <div class="act">
          ${!isAiChat ? REACTIONS.map(em => `<span class="rx" data-em="${em}">${em}</span>`).join('') : ''}
          ${m.text ? `<span class="mcopy">📋 ${esc(tr('copyBtn'))}</span><span class="mtrans">🌐 Translate</span>` : ''}
          <span class="mrep">↩ ${esc(tr('replyBtn'))}</span>
          <span class="mstar">⭐ ${starredIds.has(d.id) ? esc(tr('unstarBtn')) : esc(tr('starBtn'))}</span>
          ${!isAiChat ? `<span class="mfwd">↪ ${esc(tr('forwardBtn'))}</span>` : ''}
          ${!isAiChat && mine && m.text ? `<span class="medit">✎ ${esc(tr('editBtn'))}</span>` : ''}
          <span class="mdel">🗑 ${esc(tr('deleteBtn'))}</span>
          ${!isAiChat && mine ? `<span class="mdela" style="color:#ef4444">All</span>` : ''}
          ${statusText ? `<span style="color:var(--sub);cursor:default">• ${statusText}</span>` : ''}
        </div>
      </div>`;
    }).join('');

    const lob = document.getElementById('loadoldbtn');
    if (lob) lob.onclick = () => {
      const prevCount = lastDocs.length;
      msgLimit += 40;
      attachMessagesSub(prevCount);
    };

    ms.querySelectorAll('.pollopt').forEach(po => {
      po.onclick = async e => {
        e.stopPropagation();
        if (isAiChat) return;
        const msgId = po.closest('.b').dataset.id, optId = po.dataset.opt;
        const curVote = msgCache[msgId]?.poll?.votes?.[me.uid];
        try {
          await chat.collection('messages').doc(msgId).update({
            [`poll.votes.${me.uid}`]: curVote === optId ? firebase.firestore.FieldValue.delete() : optId
          });
        } catch (err) { toast('Vote failed'); }
      };
    });

    ms.querySelectorAll('.mtrans').forEach(btn => {
      btn.onclick = async e => {
        e.stopPropagation();
        const id = btn.closest('.b').dataset.id, raw = msgCache[id]?.text || '';
        if (!raw) return;
        if (translations[id]) { delete translations[id]; renderMessages(); return; }
        const target = currentLang() === 'en' ? 'bn' : 'en';
        toast('Translating...');
        translations[id] = await translateTextSmart(raw, target);
        renderMessages();
      };
    });

    ms.querySelectorAll('.spdbtn').forEach(btn => {
      btn.onclick = e => {
        e.stopPropagation();
        const aud = btn.previousElementSibling, cur = parseFloat(btn.dataset.spd || '1'), next = cur === 1 ? 1.5 : cur === 1.5 ? 2 : 1;
        btn.dataset.spd = String(next); btn.textContent = `${next}x`;
        if (aud && aud.tagName === 'AUDIO') aud.playbackRate = next;
      };
    });

    ms.querySelectorAll('.zoomimg').forEach(img => { img.onclick = e => { e.stopPropagation(); openLightbox(img.src, img.dataset.cap || '', false); }; });

    const toggleSelect = id => {
      if (selectedIds.has(id)) selectedIds.delete(id); else selectedIds.add(id);
      renderHeaderState(); renderMessages();
    };

    ms.querySelectorAll('.b[data-id]').forEach(b => {
      let lpTimer = null, longPressed = false, startX = 0, startY = 0, swipedReply = false;
      b.style.touchAction = 'pan-y';
      const onDown = e => {
        if (e.target.closest('.act') || e.target.closest('audio') || e.target.closest('a') || e.target.closest('.zoomimg') || e.target.closest('.spdbtn') || e.target.closest('.pollopt')) return;
        longPressed = false; swipedReply = false; startX = e.clientX ?? (e.touches?.[0]?.clientX || 0); startY = e.clientY ?? (e.touches?.[0]?.clientY || 0);
        b.style.transition = 'none'; clearTimeout(lpTimer);
        lpTimer = setTimeout(() => { if (!swipedReply) { longPressed = true; openId = null; toggleSelect(b.dataset.id); } }, 420);
      };
      const onMove = e => {
        if (swipedReply || longPressed) return;
        const x = e.clientX ?? (e.touches?.[0]?.clientX || startX), y = e.clientY ?? (e.touches?.[0]?.clientY || startY);
        const dx = x - startX, dy = y - startY;
        if (Math.abs(dy) > 18) { clearTimeout(lpTimer); return; }
        if (Math.abs(dx) > 10) {
          clearTimeout(lpTimer); b.style.transform = `translateX(${Math.max(-65, Math.min(65, dx))}px)`;
          if (Math.abs(dx) >= 48) { swipedReply = true; b.style.transition = 'transform .18s ease'; b.style.transform = ''; const m = msgCache[b.dataset.id]; if (m && !m.deleted) setReply(b.dataset.id, m.senderName || 'User', m.text || (m.audio ? '🎤 Voice message' : m.image ? '📷 Photo' : 'Message')); }
        }
      };
      const onEnd = () => { clearTimeout(lpTimer); b.style.transition = 'transform .18s ease'; b.style.transform = ''; };
      b.addEventListener('pointerdown', onDown); b.addEventListener('pointermove', onMove); b.addEventListener('pointerup', onEnd); b.addEventListener('pointercancel', onEnd);
      b.onclick = e => {
        if (longPressed || swipedReply) { longPressed = false; swipedReply = false; return; }
        if (e.target.closest('.act') || e.target.closest('audio') || e.target.closest('a') || e.target.closest('.zoomimg') || e.target.closest('.spdbtn') || e.target.closest('.pollopt')) return;
        if (selectedIds.size > 0) { toggleSelect(b.dataset.id); return; }
        b.classList.toggle('open'); openId = b.classList.contains('open') ? b.dataset.id : null;
      };
    });

    ms.querySelectorAll('.mcopy').forEach(btn => { btn.onclick = async e => { e.stopPropagation(); const txt = msgCache[btn.closest('.b').dataset.id]?.text || ''; if (!txt) return; try { if (navigator.clipboard?.writeText) await navigator.clipboard.writeText(txt); } catch (err) {} toast(tr('copied')); }; });
    ms.querySelectorAll('.rx').forEach(btn => { btn.onclick = async e => { e.stopPropagation(); if (isAiChat) return; const id = btn.closest('.b').dataset.id, em = btn.dataset.em, cur = msgCache[id]?.reactions?.[me.uid]; try { await chat.collection('messages').doc(id).update({ [`reactions.${me.uid}`]: cur === em ? firebase.firestore.FieldValue.delete() : em }); } catch (err) { toast('Action failed'); } }; });
    ms.querySelectorAll('.mrep').forEach(btn => { btn.onclick = e => { e.stopPropagation(); const id = btn.closest('.b').dataset.id, m = msgCache[id]; if (m) setReply(id, m.senderName || 'User', m.text || (m.audio ? '🎤 Voice message' : m.image ? '📷 Photo' : 'Message')); }; });
    ms.querySelectorAll('.mstar').forEach(btn => {
      btn.onclick = async e => {
        e.stopPropagation(); const id = btn.closest('.b').dataset.id, m = msgCache[id]; if (!m) return;
        const preview = m.text || (m.audio ? '🎤 Voice message' : m.image ? '📷 Photo' : 'Message'), existing = myStarred().find(x => x.id === id);
        if (existing) { await privRef().set({ starred: firebase.firestore.FieldValue.arrayRemove(existing) }, { merge: true }); profile.starred = myStarred().filter(x => x.id !== id); }
        else { const entry = { id, chatId, chatTitle: document.getElementById('htitle')?.textContent || title, senderName: m.senderName || 'User', preview }; await privRef().set({ starred: firebase.firestore.FieldValue.arrayUnion(entry) }, { merge: true }); profile.starred = [...myStarred(), entry]; }
        renderMessages();
      };
    });
    ms.querySelectorAll('.mfwd').forEach(btn => { btn.onclick = e => { e.stopPropagation(); const m = msgCache[btn.closest('.b').dataset.id]; if (m) openForwardModal(m); }; });
    ms.querySelectorAll('.medit').forEach(btn => { btn.onclick = async e => { e.stopPropagation(); if (isAiChat) return; const id = btn.closest('.b').dataset.id, cur = msgCache[id]?.text || ''; const next = prompt('Edit message:', cur); if (next === null) return; const trimmed = next.trim(); if (!trimmed || trimmed === cur) return; try { await chat.collection('messages').doc(id).update({ text: trimmed, edited: true }); } catch (err) { toast('Could not edit'); } }; });
    ms.querySelectorAll('.mdel').forEach(btn => {
      btn.onclick = async e => {
        e.stopPropagation(); const id = btn.closest('.b').dataset.id;
        if (isAiChat) { aiMessages = aiMessages.filter(x => x.id !== id); saveAiHistory(me?.uid, aiMessages); renderMessages(); return; }
        try { await chat.collection('messages').doc(id).update({ hiddenFor: firebase.firestore.FieldValue.arrayUnion(me.uid) }); } catch (err) {}
      };
    });
    ms.querySelectorAll('.mdela').forEach(btn => { btn.onclick = async e => { e.stopPropagation(); if (!confirm('Delete this message for everyone?')) return; const id = btn.closest('.b').dataset.id; try { await deleteForAll(id); } catch (err) { toast('Could not delete'); } }; });

    if (atBottom || ms.dataset.init !== '1') { ms.scrollTop = ms.scrollHeight; ms.dataset.init = '1'; }
  }

  let msgUnsub = null;
  function attachMessagesSub(prevCountForScroll = 0) {
    if (msgUnsub) { try { msgUnsub(); } catch (e) {} msgUnsub = null; }
    msgUnsub = chat.collection('messages').orderBy('createdAt').limitToLast(msgLimit).onSnapshot(snap => {
      if (snap.docs.length < msgLimit) hasMoreOlder = false;
      lastDocs = snap.docs;
      renderMessages();
      renderQuickChips();
      markRead();
      if (prevCountForScroll > 0 && snap.docs.length > prevCountForScroll) {
        const extraEl = ms.querySelectorAll('.b')[snap.docs.length - prevCountForScroll];
        if (extraEl) extraEl.scrollIntoView({ block: 'start' });
      }
    });
    addSub(() => { if (msgUnsub) { try { msgUnsub(); } catch (e) {} msgUnsub = null; } });
  }

  if (isAiChat) {
    renderMessages();
  } else {
    let markedUpTo = 0;
    const markRead = () => {
      if (document.hidden) return;
      const seenOk = profile?.privacy?.readReceipts !== false, FVr = firebase.firestore.FieldValue, nowMs = Date.now();
      lastDocs.forEach(ds => {
        const m = ds.data(); if (m.senderId === me.uid || m.deleted) return;
        const u = {};
        if (!(m.deliveredTo || []).includes(me.uid)) u.deliveredTo = FVr.arrayUnion(me.uid);
        if (seenOk && !(m.seenBy || []).includes(me.uid)) u.seenBy = FVr.arrayUnion(me.uid);
        if (Object.keys(u).length) ds.ref.set(u, { merge: true }).catch(() => {});
      });
      const newest = lastDocs.reduce((mx, ds) => { const m = ds.data(); return m.senderId !== me.uid ? Math.max(mx, m.createdAtMs || tsMs(m.createdAt)) : mx; }, 0);
      if (!(chatMeta.unread?.[me.uid] > 0) && newest <= markedUpTo) return;
      markedUpTo = Math.max(markedUpTo, newest);
      const patch = { deliveredBy: { [me.uid]: nowMs }, unread: { [me.uid]: 0 } };
      if (seenOk) patch.seenBy = { [me.uid]: nowMs };
      chat.set(patch, { merge: true }).catch(() => {});
    };
    const onVis = () => { if (!document.hidden) markRead(); };
    document.addEventListener('visibilitychange', onVis); addSub(() => document.removeEventListener('visibilitychange', onVis));

    if (peerUid) {
      addSub(db.collection('users').doc(peerUid).onSnapshot(d => {
        if (d.exists) {
          peerUser = d.data(); userProfilesCache[peerUid] = peerUser;
          const chav = document.getElementById('chav'), tEl = document.getElementById('htitle');
          const curTitle = getChatNick(chatId) || peerUser.name || tEl?.textContent || title;
          if (tEl) tEl.textContent = curTitle;
          if (chav) chav.innerHTML = avHtml(peerUser.photo || '', curTitle, false);
          updateHeaderSub();
        }
      }, () => {}));
      addSub(db.collection('presence').doc(peerUid).onSnapshot(d => { peerPres = d.exists ? d.data() : null; updateHeaderSub(); }, () => {}));
      const presTick = setInterval(updateHeaderSub, 30000); addSub(() => clearInterval(presTick));
    }

    addSub(chat.onSnapshot(d => {
      if (!d.exists) return;
      chatMeta = d.data();
      const tEl = document.getElementById('htitle');
      if (!peerUid && tEl) tEl.textContent = getChatNick(chatId) || chatMeta.name || title;
      typingNames = Object.entries(chatMeta.typing || {}).filter(([u, v]) => u !== me.uid && isTyping(v)).map(([u]) => chatMeta.memberNames?.[u] || 'Someone');
      clearTimeout(typingClear);
      if (typingNames.length) typingClear = setTimeout(() => { typingNames = []; updateHeaderSub(); }, 6500);
      updateHeaderSub();
      if (!document.hidden && (chatMeta.unread?.[me.uid] || 0) > 0) markRead();
      const sig = JSON.stringify([tsMs(chatMeta.deletedAt?.[me.uid]), tsMs(chatMeta.clearedAt?.[me.uid]), chatMeta.wallpaperBy?.[me.uid] || null, chatMeta.pinnedMessage || null, chatMeta.name || '', chatMeta.disappearHours || 0, chatMeta.members || [], !!chatMeta.mutedBy?.[me.uid], !!chatMeta.archivedBy?.[me.uid], chatMeta.unread || {}, chatMeta.seenBy || {}, chatMeta.deliveredBy || {}]);
      if (sig === lastSig) return; lastSig = sig;
      applyChatWallpaper();
      if (pinslot) {
        const pin = chatMeta.pinnedMessage;
        pinslot.innerHTML = (!pin || !pin.id) ? '' : `<div class="pinbar" id="pinjump"><span>📌</span><span class="ptxt"><b>${esc(pin.senderName || 'User')}:</b> ${esc(pin.preview || '')}</span><button class="btn sm" id="pinun" style="padding:3px 8px;font-size:11px">${esc(tr('unpinBtn'))}</button></div>`;
        const pj = document.getElementById('pinjump'); if (pj) pj.onclick = e => { if (e.target.id !== 'pinun') jumpAndHighlightMsg(pin.id); };
        const pu = document.getElementById('pinun'); if (pu) pu.onclick = async e => { e.stopPropagation(); await chat.set({ pinnedMessage: null }, { merge: true }); };
      }
      renderMessages();
    }, () => { toast('You no longer have access to this chat'); home('chats', false); }));

    attachMessagesSub(0);
    const expTimer = setInterval(() => { if (lastDocs.some(d => { const x = d.data().expiresAt; return x && Date.now() > x; })) renderMessages(); }, 20000);
    addSub(() => clearInterval(expTimer));
  }

  async function send(text, image, audio, audioMime, poll = null) {
    if (isAiChat) {
      const rep = replyTarget ? { ...replyTarget } : null; clearReply();
      const userMsg = { id: 'u_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6), senderId: me.uid, senderName: myName(), text, replyTo: rep, createdAtMs: Date.now() };
      aiMessages.push(userMsg); saveAiHistory(me?.uid, aiMessages); renderMessages();
      typingNames = [AI_BOT_NAME]; updateHeaderSub();
      try {
        const answer = (typeof window.amarAiGenerate === 'function')
          ? await window.amarAiGenerate(aiMessages.filter(m => m.senderId === me.uid || m.senderId === AI_BOT_ID).slice(-17).map(m => ({ role: m.senderId === AI_BOT_ID ? 'model' : 'user', text: m.text || '' })), text, myName())
          : await superAiReply(text, myName());
        aiMessages.push({ id: 'b_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6), senderId: AI_BOT_ID, senderName: AI_BOT_NAME, text: answer || 'Could not generate reply.', createdAtMs: Date.now() });
        saveAiHistory(me?.uid, aiMessages);
      } catch (aiError) {
        aiMessages.push({ id: 'b_' + Date.now(), senderId: AI_BOT_ID, senderName: AI_BOT_NAME, text: await superAiReply(text, myName()), createdAtMs: Date.now() });
        saveAiHistory(me?.uid, aiMessages);
      } finally {
        typingNames = []; updateHeaderSub(); renderMessages();
        if (currentOpenChatId === chatId) playAlertBeep(780, 0.1);
      }
      return;
    }

    if (peerUid && myBlocked().includes(peerUid)) throw new Error('User is blocked');
    const rep = replyTarget ? { ...replyTarget } : null; clearReply();
    const payload = { text: text || null, image: image || null, audio: audio || null, audioMime: audioMime || null, poll, replyTo: rep };

    if (!navigator.onLine) {
      const q = getOutbox();
      q.push({ id: 'ob_' + Date.now(), chatId, payload, chatMetaSnapshot: { members: chatMeta.members || [me.uid, peerUid].filter(Boolean), disappearHours: chatMeta.disappearHours || 0 } });
      saveOutbox(q);
      toast('⏳ Offline — message queued & will send automatically when online');
      return;
    }

    const FV = firebase.firestore.FieldValue, sendBatch = db.batch();
    sendBatch.set(chat.collection('messages').doc(), {
      senderId: me.uid, senderName: myName(), ...payload, reactions: {}, hiddenFor: [],
      expiresAt: (chatMeta.disappearHours || 0) > 0 ? Date.now() + chatMeta.disappearHours * 3600000 : null,
      edited: false, deleted: false, deliveredTo: [me.uid], seenBy: [me.uid], createdAtMs: Date.now(), createdAt: FV.serverTimestamp()
    });
    const last = poll ? `📊 Poll: ${poll.question}` : (audio ? '🎤 Voice message' : image ? '📷 Photo' : text);
    const unread = {}; (chatMeta.members || []).forEach(u => { if (u !== me.uid) unread[u] = FV.increment(1); });
    isTypingNow = false;
    const patch = { lastMessage: last, lastSender: me.uid, updatedAt: FV.serverTimestamp(), typing: { [me.uid]: 0 }, deliveredBy: { [me.uid]: Date.now() }, archivedBy: { [me.uid]: false } };
    if (Object.keys(unread).length) patch.unread = unread;
    sendBatch.set(chat, patch, { merge: true });
    try { await sendBatch.commit(); }
    catch (e) { throw new Error(e.code === 'permission-denied' ? 'Message pathano gelo na (permission nei / block)' : e.message); }
  }

  // Voice-to-Text (Speech Recognition)
  const sttBtn = document.getElementById('sttbtn');
  if (sttBtn) {
    sttBtn.onclick = () => {
      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SR) return toast('Voice-to-Text supported na ei browser-e');
      try {
        const recSpeech = new SR();
        recSpeech.lang = currentLang() === 'bn' ? 'bn-BD' : 'en-US';
        recSpeech.interimResults = false;
        sttBtn.classList.add('listening');
        toast('🗣 Kotha bolun...');
        recSpeech.onresult = ev => {
          const spoken = ev.results?.[0]?.[0]?.transcript || '';
          if (spoken) { tx.value = (tx.value ? tx.value + ' ' : '') + spoken; setDraft(chatId, tx.value); autosize(); tx.focus(); }
        };
        recSpeech.onerror = () => toast('Speech recognition error');
        recSpeech.onend = () => sttBtn.classList.remove('listening');
        recSpeech.start();
      } catch (e) { sttBtn.classList.remove('listening'); toast('Could not start voice-to-text'); }
    };
  }

  // Schedule Message button
  const schedBtn = document.getElementById('schedbtn');
  if (schedBtn) {
    schedBtn.onclick = () => {
      openScheduleModal(tx.value.trim(), (schedTxt, sendAtMs) => {
        const list = getScheduled();
        list.push({ id: 'sc_' + Date.now(), chatId, text: schedTxt, sendAt: sendAtMs, chatMetaSnapshot: { members: chatMeta.members || [me.uid, peerUid].filter(Boolean), disappearHours: chatMeta.disappearHours || 0 } });
        saveScheduled(list);
        tx.value = ''; setDraft(chatId, ''); autosize();
        toast('⏰ Message scheduled!');
      });
    };
  }

  document.getElementById('reccncl').onclick = cancelRec;
  document.getElementById('recstop').onclick = () => { if (rec && rec.state !== 'inactive') { try { rec.stop(); } catch (e) {} } };
  bindChatHeaderEvents();

  function createRecorder(stream) {
    const bps = { audioBitsPerSecond: 32000 };
    const candidates = ['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4', 'audio/ogg;codecs=opus'];
    const supported = candidates.find(t => typeof MediaRecorder.isTypeSupported === 'function' && MediaRecorder.isTypeSupported(t));
    try { return supported ? { recorder: new MediaRecorder(stream, { mimeType: supported, ...bps }), mime: supported } : { recorder: new MediaRecorder(stream), mime: 'audio/webm' }; }
    catch (e) { return { recorder: new MediaRecorder(stream), mime: 'audio/webm' }; }
  }

  const micBtn = document.getElementById('mic');
  if (micBtn) {
    micBtn.onclick = async () => {
      if (rec && rec.state !== 'inactive') { try { rec.stop(); } catch (e) { cleanupRec(); } return; }
      try {
        discardRec = false;
        if (!navigator.mediaDevices?.getUserMedia || typeof MediaRecorder === 'undefined') throw new Error('Voice recording unavailable');
        recStream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } });
        const built = createRecorder(recStream); rec = built.recorder; activeAudioMime = built.mime || rec.mimeType || 'audio/webm'; recChunks = [];
        rec.ondataavailable = e => { if (e.data && e.data.size > 0) recChunks.push(e.data); };
        rec.onerror = () => { toast('Recording error'); cancelRec(); };
        rec.onstop = async () => {
          const finalMime = rec?.mimeType || activeAudioMime || 'audio/webm', blob = new Blob(recChunks, { type: finalMime }), wasDiscarded = discardRec;
          cleanupRec(); if (wasDiscarded) return;
          if (!blob.size || blob.size < 200) return toast('Voice clip too short');
          try { const dataUrl = await prepareFreeMedia(blob, 'voice'); await send(null, null, dataUrl, finalMime); toast(tr('voiceSent')); }
          catch (ex) { toast(ex.message || 'Voice send failed'); }
        };
        rec.start(250); recbar.classList.add('on'); secCounter = 0; rectm.textContent = '00:00';
        recTimer = setInterval(() => { secCounter += 1; rectm.textContent = fmtSec(secCounter); if (secCounter >= MAX_FREE_VOICE_SEC && rec && rec.state !== 'inactive') { try { rec.stop(); } catch (e) {} } }, 1000);
      } catch (ex) { cancelRec(); toast(ex?.name === 'NotAllowedError' ? 'Microphone permission blocked.' : (ex?.message || 'Mic error')); }
    };
  }

  const sendText = async () => {
    const t = tx.value.trim(); if (!t) return;
    if (mentionpop) mentionpop.style.display = 'none';
    tx.value = ''; autosize(); setDraft(chatId, ''); ep.classList.remove('on');
    try { await send(t); } catch (e) { toast(e.message); if (!tx.value) { tx.value = t; setDraft(chatId, t); autosize(); } }
  };
  document.getElementById('sd').onclick = sendText;
  tx.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendText(); } });

  const phBtn = document.getElementById('ph'), fiEl = document.getElementById('fi');
  if (phBtn && fiEl) {
    phBtn.onclick = () => fiEl.click();
    fiEl.onchange = async e => {
      const f = e.target.files[0]; if (!f) return;
      try {
        if (!f.type.startsWith('image/')) throw new Error('Select a valid image');
        const small = await shrink(f, 300, 0.4), dataUrl = await prepareFreeMedia(small.dataUrl, 'image');
        await send(null, dataUrl, null, null); toast(tr('photoSent'));
      } catch (ex) { toast(ex.message || 'Photo send failed'); }
      e.target.value = '';
    };
  }

  const camBtn = document.getElementById('cambtn');
  if (camBtn) camBtn.onclick = () => openCameraModal(async dataUrl => {
    try { const cleanUrl = await prepareFreeMedia(dataUrl, 'image'); await send(null, cleanUrl, null, null); toast(tr('photoSent')); }
    catch (ex) { toast(ex.message || 'Camera send failed'); }
  });
}

function shrink(file, max = 300, quality = 0.4) {
  return new Promise((res, rej) => {
    const img = new Image(), objUrl = URL.createObjectURL(file);
    img.onload = () => {
      URL.revokeObjectURL(objUrl);
      const s = Math.min(1, max / Math.max(img.width, img.height)), c = document.createElement('canvas');
      c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      const ctx = c.getContext('2d'); if (!ctx) return rej(new Error('Image process failed'));
      ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height); ctx.drawImage(img, 0, 0, c.width, c.height);
      res({ dataUrl: c.toDataURL('image/jpeg', quality) });
    };
    img.onerror = () => { URL.revokeObjectURL(objUrl); rej(new Error('Image load failed')); };
    img.src = objUrl;
  });
}
